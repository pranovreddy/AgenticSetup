<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentic Setup Pixels</title>
<style>
:root{
  --deep:#0b37c9; --ink:#ffffff; --navy:#0a2a8f; --muted:rgba(10,42,143,.55); --amber:#ffd27a;
  --s-ink:#0f1b3d; --s-ink2:#35466a; --s-muted:#5b6b8c; --s-line:#e6ebf3; --s-blue:#2563eb; --s-soft:#eef3ff;
  --s-green:#0f8a5f; --s-gsoft:#e5f6ee; --s-amber:#a55a05; --s-asoft:#fff4e0;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
canvas#px{position:fixed;inset:0;width:100%;height:100%;display:block}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.brand{position:fixed;top:20px;left:20px;z-index:9;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(4,20,100,.18)}
.brand .bl{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.brand .bl img{width:22px;height:auto}
.brand .me{width:44px;height:44px;border-radius:50%;background:#3b5ce0;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;
  box-shadow:0 0 0 3px rgba(255,255,255,.28);border:0;cursor:pointer;font-family:inherit}
body.appon > .brand{opacity:0;pointer-events:none}
.status{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:9;transition:top .55s cubic-bezier(.2,.8,.2,1),opacity .3s;display:flex;align-items:center;gap:8px;
  font-size:13px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.status i{width:7px;height:7px;border-radius:50%;background:#fff;animation:ping 1.6s infinite}
.status.still i{animation:none}
.status.done i{animation:none;background:#7cf0b4}
.status.attn i{animation:none;background:var(--amber)}
.status.hid{opacity:0;pointer-events:none}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--p1,rgba(255,255,255,.6))}100%{box-shadow:0 0 0 9px var(--p0,rgba(255,255,255,0))}}

/* the agent speaks in the middle of the field */
.stage{position:fixed;left:50%;top:47%;transform:translate(-50%,-50%);z-index:2;
  width:min(940px,90vw);text-align:center;pointer-events:none;
  text-shadow:0 2px 28px rgba(4,24,120,.55)}
.kick{font-size:14px;opacity:.8;letter-spacing:.01em;margin-bottom:14px;min-height:1.2em}
.kick .att{display:inline-flex;align-items:center;gap:6px;margin-left:10px;color:var(--amber);opacity:1;font-weight:600}
.kick .att:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.line{font-size:clamp(28px,3.4vw,50px);font-weight:600;letter-spacing:-.035em;line-height:1.06;min-height:1.06em}
.sub{font-size:clamp(15px,1.4vw,19px);opacity:.9;margin:16px auto 0;line-height:1.45;min-height:1.4em;max-width:720px}
.sub .ok,.ok{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--deep);
  align-items:center;justify-content:center;vertical-align:-3px;margin-right:8px}
.ok svg{width:11px;height:11px}

.w{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(.35em);
  transition:opacity .55s ease var(--d),filter .55s ease var(--d),transform .7s cubic-bezier(.2,.8,.2,1) var(--d)}
.in .w{opacity:1;filter:blur(0);transform:none}
.out .w{opacity:0;filter:blur(8px);transform:translateY(-.25em);transition-duration:.22s;transition-delay:0s}

/* summary details under the headline: plain text on the field, no boxes */
.extra{opacity:0;transform:translateY(10px);transition:opacity .5s ease .2s,transform .6s cubic-bezier(.2,.8,.2,1) .2s;
  pointer-events:auto;text-shadow:none;width:fit-content;max-width:100%;margin:0 auto}
.extra.in{opacity:1;transform:none}
.extra.out{opacity:0;transition-delay:0s;transition-duration:.2s}
.facts{display:grid;gap:9px;margin:26px auto 0;text-align:left;font-size:15px;width:fit-content;min-width:min(440px,86vw)}
.facts>div{display:grid;grid-template-columns:150px auto auto;gap:16px;align-items:baseline}
.facts span{opacity:.68}
.facts b{font-weight:600}
.facts em{font-style:normal;font-size:11.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.14);opacity:.85;justify-self:start}
.more{font-size:14px;opacity:.7;margin-top:12px}
.pts{list-style:none;counter-reset:p;margin:24px auto 0;padding:0;text-align:left;max-width:600px;font-size:16px;line-height:1.5;display:grid;gap:12px}
.pts li{counter-increment:p;display:grid;grid-template-columns:28px 1fr;gap:6px}
.pts li:before{content:counter(p);font-size:12px;font-weight:700;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.16);margin-top:2px}
.note{font-size:13.5px;opacity:.72;margin-top:18px}
.need{font-size:14.5px;margin-top:22px;opacity:.95}
.need b{font-weight:600;margin-right:6px}
.need.amb b{color:var(--amber)}
.three{display:flex;gap:28px;justify-content:center;margin-top:26px;font-size:15px;flex-wrap:wrap}
.three span{display:flex;align-items:center;gap:8px;opacity:.9}
.avs{display:flex;justify-content:center;gap:8px;margin-top:26px}
.avs span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.95);color:var(--deep);transition:opacity .3s}
.avs span.off{opacity:.3}
.acts{display:flex;gap:10px;justify-content:center;align-items:center;margin:28px auto 0;width:fit-content;flex-wrap:wrap}
.btn{font:600 14px/1 Inter,"Helvetica Neue",Arial,sans-serif;height:36px;padding:0 16px;border-radius:8px;border:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--deep);box-shadow:0 10px 26px rgba(4,20,100,.28);
  transition:transform .15s,box-shadow .15s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:none}
.btn.link{background:none;box-shadow:none;color:#fff;opacity:.8;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.auth{display:flex;gap:12px;align-items:flex-start;text-align:left;margin:22px auto 0;max-width:520px;cursor:pointer;font-size:14.5px}
.auth small{display:block;opacity:.7;font-size:13px;margin-top:3px}
.cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(255,255,255,.75);display:grid;place-items:center;flex:none;margin-top:1px}
.cbx.on{background:#fff;color:var(--deep);border-color:#fff}
.cbx svg{width:13px;height:13px;stroke-width:3}
.clock{display:flex;gap:10px;justify-content:center;margin-top:12px}
.clock div{min-width:76px;padding:10px 0 8px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24)}
.clock b{display:block;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock span{font-size:12px;opacity:.75}
.cl-lbl{font-size:13px;opacity:.75;margin-top:24px}

/* progress: a frosted stepper at the bottom, shown for the agreements and the step reviews */
.prog{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:12px;
  padding:7px 16px 7px 7px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(4,20,100,.18);
  font-size:13px;color:rgba(255,255,255,.7);white-space:nowrap;transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.prog.off{opacity:0;pointer-events:none;transform:translate(-50%,14px)}
.prog em{font-style:normal;font-weight:600;font-size:12px;color:var(--deep);background:#fff;padding:6px 11px;border-radius:999px;letter-spacing:.01em}
.prog ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:8px}
.prog li{display:flex;align-items:center;gap:8px;transition:color .4s}
.prog li i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;
  border:1.5px solid rgba(255,255,255,.4);color:rgba(255,255,255,.75);box-sizing:border-box;transition:all .4s;flex:none}
.prog li i svg{width:11px;height:11px;stroke-width:3}
.prog li.on{color:#fff;font-weight:600}
.prog li.on i{background:#fff;border-color:#fff;color:var(--deep);animation:pring 1.8s infinite}
.prog li.dn{color:rgba(255,255,255,.92)}
.prog li.dn i{background:#fff;border-color:#fff;color:var(--deep)}
.prog b{display:block;width:22px;height:2px;border-radius:2px;background:rgba(255,255,255,.25);position:relative;overflow:hidden}
.prog b:after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.prog b.dn:after{transform:none}
@keyframes pring{0%{box-shadow:0 0 0 0 var(--r1,rgba(255,255,255,.45))}100%{box-shadow:0 0 0 8px var(--r0,rgba(255,255,255,0))}}
@media (max-width:1199px){.prog li:not(.on) .lbl{display:none}.prog b{width:14px}}

.toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,12px);z-index:20;background:#0a2a8f;color:#fff;
  font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(4,20,100,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* prototype menu */
.proto{position:fixed;right:20px;bottom:24px;z-index:30}
/* migration window countdown, bottom left */
.closes{position:fixed;left:20px;bottom:22px;z-index:8;display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(4,20,100,.18);color:#fff;transition:opacity .3s}
.closes .ci{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.closes .ci svg{width:15px;height:15px}
.closes small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:500}
.closes b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:1px}
.closes.inapp{position:static;margin:0 0 10px;box-shadow:none;background:#fff;backdrop-filter:none;padding:6px 18px 6px 6px;color:var(--s-ink);border-color:var(--s-line)}
.closes.inapp .ci{background:#eef1f7;color:#5b6b8c}.closes.inapp small{color:#7a88a6}
.closes.inapp .ci{width:30px;height:30px}.closes.inapp b{font-size:14px}
body.appon > .closes{opacity:0;pointer-events:none}
body.appon .proto>button{color:var(--navy);background:#fff;border-color:rgba(10,42,143,.15)}

.proto>button{font:500 13px Inter,sans-serif;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);
  border-radius:8px;height:32px;padding:0 12px;cursor:pointer}
.pm{position:absolute;right:0;bottom:40px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(4,20,100,.3);padding:6px;
  display:none;min-width:230px}
.pm.on{display:block}
.pm button{display:block;width:100%;text-align:left;font:14px Inter,sans-serif;color:var(--s-ink);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.pm button:hover{background:var(--s-soft)}
.pm hr{border:0;border-top:1px solid var(--s-line);margin:6px 4px}

/* details: a light sheet slides in over the field */
.scrim{position:fixed;inset:0;background:rgba(4,20,100,.32);opacity:0;pointer-events:none;transition:opacity .4s;z-index:9}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(780px,94vw);background:#fff;color:var(--s-ink);z-index:10;
  transform:translateX(104%);transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  box-shadow:-30px 0 80px rgba(4,20,100,.35);border-radius:20px 0 0 20px}
.sheet.on{transform:none}
.sh-hd{padding:22px 28px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--s-line)}
.sh-hd small{color:var(--s-muted);font-size:13px;display:flex;align-items:center;gap:8px}
.sh-hd h3{margin:6px 0 0;font-size:22px;letter-spacing:-.02em;font-weight:650}
.sh-x{width:36px;height:36px;border-radius:8px;border:1px solid #dfe5ef;background:#fff;cursor:pointer;color:var(--s-ink);display:grid;place-items:center}
.sh-bd{flex:1;overflow:auto;padding:6px 28px 28px}
.sh-ft{padding:14px 28px;border-top:1px solid var(--s-line);display:flex;justify-content:space-between;align-items:center;gap:14px}
.sheet .btn:disabled{opacity:.4}
.sheet .ls{color:var(--s-muted);font-size:13.5px}
.sheet .cbx{border-color:#b8c3d6}
.sheet .cbx.on{background:var(--s-blue);border-color:var(--s-blue);color:#fff}
.sheet .auth{margin:0;max-width:420px;font-size:13.5px}
.sheet .auth small{color:var(--s-muted);opacity:1}
.chipmini{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--s-soft);color:var(--s-blue)}
.chipmini.amb{background:var(--s-asoft);color:var(--s-amber)}
.chipmini.gr{background:var(--s-gsoft);color:var(--s-green)}
.sh-sum{background:var(--s-soft);border-radius:12px;padding:14px 16px;margin:18px 0 6px;font-size:14px;line-height:1.55;color:var(--s-ink2)}
.sh-sum b{color:var(--s-ink)}
.doc h4{font-size:15px;margin:24px 0 8px;letter-spacing:-.01em}
.doc p{font-size:13.5px;line-height:1.7;color:var(--s-ink2);margin:0 0 10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:20px}
.fd label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--s-muted);margin-bottom:6px}
.fd label em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--s-soft);color:var(--s-blue)}
.fd.w2{grid-column:1/-1}
.inp{width:100%;box-sizing:border-box;height:40px;border:1px solid #d9e0ec;border-radius:8px;padding:0 12px;font:14.5px Inter,sans-serif;color:var(--s-ink);background:#fff}
select.inp{height:36px;padding:0 8px}
.lslot{display:flex;gap:14px;align-items:center;margin-top:20px}
.lbox{width:64px;height:64px;border-radius:12px;border:1px solid var(--s-line);display:grid;place-items:center;font-weight:800;color:#004c8f;letter-spacing:-.02em}
.row{display:grid;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--s-line);font-size:14.5px}
.row.hd{color:var(--s-muted);font-size:12.5px;font-weight:600;padding:12px 0 8px}
.av{width:34px;height:34px;border-radius:50%;background:var(--s-soft);color:var(--s-blue);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none}
.rn{font-weight:600}.rm{color:var(--s-muted);font-size:13px}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #b8c3d6;display:grid;place-items:center;cursor:pointer}
.ck.on{background:var(--s-blue);border-color:var(--s-blue);color:#fff}
.ck svg{width:13px;height:13px;stroke-width:3}
.tree{list-style:none;margin:16px 0 0;padding:0}
.root{display:flex;align-items:center;gap:12px;margin-top:20px}
.tile{width:40px;height:40px;border-radius:10px;background:var(--s-soft);color:var(--s-blue);display:grid;place-items:center}
.tile svg{width:19px;height:19px}
.tree>li{position:relative;margin-left:19px;padding:12px 0 6px 28px;border-left:1.5px solid #d7e0f0}
.tree>li:last-child{border-left-color:transparent}
.tree>li:last-child:before{content:"";position:absolute;left:-1.5px;top:0;height:31px;border-left:1.5px solid #d7e0f0}
.tree>li:after{content:"";position:absolute;left:0;top:30px;width:22px;border-top:1.5px solid #d7e0f0}
.bn{display:flex;align-items:center;gap:10px}
.bn small{display:block;font-size:11.5px;color:var(--s-muted)}
.mono{font:600 12px ui-monospace,Menlo,monospace;color:var(--s-muted);background:#f3f6fb;padding:3px 8px;border-radius:6px;margin-left:6px}
.lobs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px 54px}
.lbox img{width:72%;height:auto;display:block}
.lbox.ent{width:48px;height:48px;border-radius:12px;font-size:13px;flex:none}
.blogo{width:44px;height:44px;border-radius:11px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none;box-shadow:0 4px 10px rgba(15,27,61,.12)}
.blogo b{font-size:11px;font-weight:800;letter-spacing:-.01em}.blogo i{font-style:normal;font-size:7.5px;font-weight:700;letter-spacing:.08em;margin-top:2px;opacity:.9}
.tree>li{margin-left:23px}.tree>li:after{top:32px}.tree>li:last-child:before{height:33px}
.lob{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 6px 6px 12px;border-radius:999px;background:#f3f6fb;border:1px solid var(--s-line)}
.lob button{width:22px;height:22px;border-radius:50%;border:0;background:none;cursor:pointer;color:var(--s-muted);display:grid;place-items:center}
.lob button:hover{background:#e3e9f4;color:var(--s-ink)}
.lob button svg{width:12px;height:12px}
.spl{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#eef2f8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.fc{font:13px Inter,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid #d9e0ec;background:#fff;color:var(--s-ink2);cursor:pointer}
.fc.on{background:var(--s-ink);color:#fff;border-color:var(--s-ink)}
.cf{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;justify-self:start}
.cf.h{background:var(--s-gsoft);color:var(--s-green)}.cf.m{background:var(--s-soft);color:var(--s-blue)}.cf.u{background:var(--s-asoft);color:var(--s-amber)}
.stat{display:flex;gap:34px;margin-top:20px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}.stat span{font-size:13px;color:var(--s-muted)}

.sheet .btn,.card .btn{background:var(--s-blue);color:#fff;box-shadow:none}
.sheet .btn.ghost,.card .btn.ghost{background:#fff;color:var(--s-ink);border:1px solid #d9e0ec}
.card .btn:disabled{opacity:.4}
.card .ls{color:var(--s-muted);font-size:13.5px}
.card .cbx{border-color:#b8c3d6}
.card .cbx.on{background:var(--s-blue);border-color:var(--s-blue);color:#fff}
.card .auth{margin:16px 0 0;max-width:none;font-size:13.5px}
.card .cd-ft .auth{margin:0;max-width:440px}
.card .auth small{color:var(--s-muted);opacity:1}

/* review: one white card in the middle of the field; it grows to full page for details */
.card{position:fixed;left:50%;top:50%;width:0;height:0;z-index:8;background:#fff;color:var(--s-ink);border-radius:20px;overflow:hidden;
  box-shadow:0 30px 90px rgba(4,20,100,.38);opacity:0;transform:translateY(26px) scale(.97);pointer-events:none;
  transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1),left .6s cubic-bezier(.2,.8,.2,1),top .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),border-radius .6s}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card.big{border-radius:0}
.card.noanim{transition:none!important}
#cardM{position:fixed;left:-9999px;top:0;height:auto!important;visibility:hidden;opacity:1;transform:none;transition:none}
.cd-in{display:flex;flex-direction:column;height:100%;transition:opacity .18s ease}
.card.swap .cd-in{opacity:0}
.cd-hd{padding:30px 36px 6px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex:none}
.cd-hd small{color:var(--s-muted);font-size:14px;display:flex;align-items:center;gap:8px}
.cd-hd h2{margin:8px 0 0;font-size:28px;line-height:1.2;letter-spacing:-.025em;font-weight:650}
.card.big .cd-hd{border-bottom:1px solid var(--s-line);padding-bottom:16px}
.cd-bd{flex:1;min-height:0;overflow:auto;padding:6px 36px 28px}
.cd-ft{flex:none;padding:16px 36px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--s-line)}
.card.big .cd-hd,.card.big .cd-bd,.card.big .cd-ft{padding-left:max(28px,calc((100% - 960px)/2));padding-right:max(28px,calc((100% - 960px)/2))}
.cd-tog{flex:none}
.asum{position:fixed;z-index:7;border-radius:18px 18px 0 0;padding:11px 18px 35px;box-sizing:border-box;opacity:0;pointer-events:none;
  background:radial-gradient(90% 180% at 0% 0%,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 60%),
    linear-gradient(100deg,#bcd6ff 0%,#d9e8ff 45%,#e9e2ff 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.7),0 -8px 40px rgba(120,170,255,.45);overflow:hidden;transform:translateY(10px);
  transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1),top .6s cubic-bezier(.2,.8,.2,1),left .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1)}
.asum.on{opacity:1;transform:none;pointer-events:auto}
.asum:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);
  background-size:250% 100%;animation:asheen 7s ease-in-out infinite}
@keyframes asheen{0%{background-position:120% 0}55%,100%{background-position:-60% 0}}
.asum>*{position:relative;z-index:1}
@media (prefers-reduced-motion: reduce){.asum:after{animation:none;display:none}}

.ahd{display:flex;align-items:center;gap:7px;color:#2a47c9;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
.ahd img{width:13px;height:auto}
.abd{padding:0}
.ast{position:relative;margin:0;font-size:15px;line-height:1.5;color:#0f1b3d;font-weight:500}
.cd-agent{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--s-blue);background:var(--s-soft);padding:5px 10px 5px 8px;border-radius:999px;margin-top:10px}
.cd-agent img{width:13px;height:auto}
.cd-sum{font-size:16px;line-height:1.6;color:var(--s-ink2);margin:10px 0 0}
.lfacts{margin-top:16px;border-top:1px solid var(--s-line)}
.lfacts>div{display:grid;grid-template-columns:170px 1fr auto;gap:16px;padding:13px 0;border-bottom:1px solid var(--s-line);font-size:15px;align-items:baseline}
.lfacts span{color:var(--s-muted)}
.lfacts b{font-weight:600}
.lfacts em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--s-soft);color:var(--s-blue)}
.lmore{font-size:14px;color:var(--s-muted);margin-top:8px}
.lneed{display:flex;gap:10px;margin-top:18px;font-size:15px;line-height:1.5;color:var(--s-ink2)}
.lneed:before{content:"";width:3px;border-radius:3px;background:var(--s-blue);flex:none}
.lneed.amb:before{background:#e9a23b}
.lneed b{color:var(--s-ink);margin-right:4px}
.lneed.amb b{color:var(--s-amber)}
.dgrid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;height:100%;min-height:0}
.dsum{padding:4px 30px 24px 0;border-right:1px solid var(--s-line);overflow:auto}
.dtext{overflow:auto;padding:0 6px 24px 32px;min-height:0}
.dtext .doc h4:first-child{margin-top:4px}
.card.isdoc .cd-bd{overflow:hidden;padding-bottom:0}
.card.big .dgrid{max-width:1100px;margin:0 auto}
@media (max-width:820px){.dgrid{grid-template-columns:1fr;grid-template-rows:auto 1fr}.dsum{border-right:0;border-bottom:1px solid var(--s-line);max-height:38vh;padding-right:0}.dtext{padding-left:0}}
.tbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0 4px}
.tbar .srch{margin-left:auto}
.srch{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid #d9e0ec;border-radius:8px;color:var(--s-muted);flex:0 1 260px}
.srch input{border:0;outline:0;font:14px Inter,sans-serif;color:var(--s-ink);width:100%;background:none}
.srch:focus-within{border-color:var(--s-blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.empty{padding:28px 0;color:var(--s-muted);font-size:14px;display:flex;gap:12px;align-items:center}
.thero{margin-top:16px;padding:16px 18px;border:1px solid var(--s-line);border-radius:14px;background:#fbfcff}
.thead{display:flex;gap:14px;align-items:center}
.thead b{display:block;font-size:15.5px}.thead span{display:block;font-size:13.5px;color:var(--s-muted);margin-top:2px}
.tring{position:relative;width:52px;height:52px;flex:none}
.tring svg{width:52px;height:52px;transform:rotate(-90deg)}
.tring circle{fill:none;stroke:#e6ecf7;stroke-width:3.5}
.tring circle.on{stroke:var(--s-blue);stroke-linecap:round}
.tring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px}
.tbar2{display:flex;gap:3px;height:8px;margin:14px 0 10px}
.tbar2 i{border-radius:4px}
.hi{--c:#2563eb}.rv{--c:#e9a23b}.un{--c:#cfd6e4}
.tbar2 i,.tmeter i{background:var(--c)}
.tkey{display:flex;gap:18px;font-size:13px;color:var(--s-muted)}
.tkey span{display:flex;align-items:center;gap:6px}.tkey i{width:8px;height:8px;border-radius:50%;background:var(--c)}.tkey b{color:var(--s-ink)}
.tlh{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px;font-weight:600;font-size:14.5px}
.tlh em{font-style:normal;font-weight:400;font-size:12.5px;color:var(--s-muted)}
.trow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(80px,1fr) auto;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--s-line)}
.twho{display:flex;gap:10px;align-items:center}.twho b{display:block;font-size:14px}.twho small{font-size:12px;color:var(--s-muted)}
.tmeter{display:flex;gap:2px;height:6px}.tmeter i{border-radius:3px}
.tnums{display:flex;gap:14px;font-size:12.5px;color:var(--s-muted);white-space:nowrap}.tnums b{color:var(--s-ink);font-size:13.5px}.tnums .rv b{color:var(--s-amber)}
.lpts{list-style:none;counter-reset:p;margin:16px 0 0;padding:0;display:grid;gap:12px;font-size:15px;line-height:1.5;color:var(--s-ink)}
.lpts li{counter-increment:p;display:grid;grid-template-columns:28px 1fr;gap:4px}
.lpts li:before{content:counter(p);font-size:12px;font-weight:700;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--s-soft);color:var(--s-blue);margin-top:1px}
.lavs{display:flex;gap:8px;margin-top:18px}
.lavs span{width:42px;height:42px;border-radius:50%;background:var(--s-soft);color:var(--s-blue);display:grid;place-items:center;font-size:12.5px;font-weight:600;transition:opacity .3s}
.lavs span.off{opacity:.3}

/* the product after setup: Consent Migration page with the first-visit walkthrough */
.app{position:fixed;inset:0;z-index:15;background:#f6f8fc;color:var(--s-ink);display:grid;grid-template-columns:248px 1fr;
  opacity:0;transform:scale(1.02);pointer-events:none;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.app.on{opacity:1;transform:none;pointer-events:auto}
.nav{background:#fff;border-right:1px solid var(--s-line);padding:18px 12px 70px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav .lg{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;padding:4px 10px 16px}
.nav .lg img{width:20px}
.nsec{padding:6px 4px 8px;border-radius:12px;position:relative;transition:box-shadow .4s,background .4s}
.nsec h6{margin:6px 8px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a96ad;font-weight:600}
.nit{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;font:14px Inter,sans-serif;color:var(--s-ink2);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nit svg{width:17px;height:17px;color:#7c89a3}
.nit.on{background:var(--s-soft);color:var(--s-blue);font-weight:600}
.nit.on svg{color:var(--s-blue)}
.nav .closes.inapp{margin-top:auto}
.nav .me{display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--s-line);font-size:13.5px}
.main{overflow:auto;display:flex;flex-direction:column}
.topb{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--s-line);background:#fff;font-size:13.5px;color:var(--s-muted)}
.topb .cl{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--s-soft);color:var(--s-blue);font-weight:600}
.pg{padding:30px 32px 40px;max-width:1080px;width:100%;box-sizing:border-box}
.pg h2{margin:0;font-size:26px;letter-spacing:-.02em}
.pg>p{color:var(--s-muted);margin:6px 0 0;font-size:14.5px}
.stages{display:flex;align-items:center;gap:12px;margin:24px 0;padding:16px 18px;background:#fff;border:1px solid var(--s-line);border-radius:14px}
.stg{display:flex;align-items:center;gap:12px;flex:1}
.stg i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:#eef2f8;color:#7c89a3;flex:none}
.stg.on i{background:var(--s-blue);color:#fff}
.stg b{display:block;font-size:14px}.stg span{font:12.5px ui-monospace,Menlo,monospace;color:var(--s-muted)}
.stages .sep{color:#b6c0d2}
.mempty{background:#fff;border:1px solid var(--s-line);border-radius:14px;padding:40px 24px;text-align:center}
.mempty .ic{width:60px;height:60px;border-radius:16px;background:var(--s-soft);color:var(--s-blue);display:grid;place-items:center;margin:0 auto 14px}
.mempty h3{margin:0 0 6px;font-size:18px}.mempty p{margin:0 auto 18px;max-width:460px;color:var(--s-muted);font-size:14px;line-height:1.55}
.app .btn{background:var(--s-blue);color:#fff;box-shadow:none}
.app .btn.ghost{background:#fff;color:var(--s-ink);border:1px solid #d9e0ec}
.csv{margin-top:20px;background:#fff;border:1px solid var(--s-line);border-radius:14px;padding:18px 22px}
.csv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.csv-h b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--s-muted)}
.csv-h button{border:0;background:none;color:var(--s-blue);font:600 13.5px Inter,sans-serif;cursor:pointer;display:flex;gap:6px;align-items:center}
.csv-c{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.csv-r{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--s-line);font-size:14px}
.csv-r em{color:#d14343;font-style:normal}.csv-r span{margin-left:auto;font:12.5px ui-monospace,Menlo,monospace;color:var(--s-muted)}
.csv-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:4px}
.csv-t i{font-style:normal;padding:2px 8px;border-radius:999px;background:#fdecec;color:#c03a3a}.csv-t i.o{background:#eef2f8;color:#5b6b8c}
/* walkthrough */
.tscrim{position:fixed;inset:0;z-index:16;background:rgba(9,20,52,.55);opacity:0;pointer-events:none;transition:opacity .4s}
.tscrim.on{opacity:1;pointer-events:auto}
.app.touring .nsec.hit{z-index:17;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.35),0 18px 50px rgba(4,20,100,.35)}
.app.touring .upl.hit{position:relative;z-index:17;box-shadow:0 0 0 5px rgba(37,99,235,.35),0 0 30px rgba(255,255,255,.6)}
.tcard{position:fixed;z-index:18;width:384px;box-sizing:border-box;background:#fff;color:var(--s-ink);border-radius:16px;padding:20px 20px 16px;box-shadow:0 30px 80px rgba(4,20,100,.4);
  opacity:0;pointer-events:none;transition:top .55s cubic-bezier(.2,.8,.2,1),left .55s cubic-bezier(.2,.8,.2,1),opacity .35s}
.tcard.on{opacity:1;pointer-events:auto}
.tcard .tb{width:36px;height:36px;border-radius:10px;background:var(--s-soft);color:var(--s-blue);display:grid;place-items:center}
.tcard h3{margin:12px 0 6px;font-size:18px;letter-spacing:-.01em}
.tcard p{margin:0;font-size:14px;line-height:1.55;color:var(--s-ink2)}
.tcard .tp{height:4px;border-radius:4px;background:#eef2f8;margin:16px 0 14px;overflow:hidden}
.tcard .tp i{display:block;height:100%;background:var(--s-blue);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tcard .ta{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.tcard .ta small{white-space:nowrap;margin-right:auto;color:var(--s-muted);font-size:12.5px}
.tcard .btn{white-space:nowrap}
.tcard .btn{background:var(--s-blue);color:#fff;box-shadow:none}.tcard .btn.ghost{background:#fff;color:var(--s-ink);border:1px solid #d9e0ec}
.tcard:before{content:"";position:absolute;width:14px;height:14px;background:#fff;transform:rotate(45deg);left:-7px;top:var(--ay,28px)}
.tcard.up:before{left:var(--ax,40px);top:auto;bottom:-7px}
.tcard.left:before{left:auto;right:-7px}
@media (max-width:820px){.app{grid-template-columns:1fr}.nav{display:none}.csv-c{grid-template-columns:1fr}}

@media (max-width:820px){.lfacts>div{grid-template-columns:110px 1fr}.lfacts em{display:none}.facts>div{grid-template-columns:110px auto}.facts em{display:none}.fgrid{grid-template-columns:1fr}}
@media (max-height:760px){.stage{top:45%}.pts{font-size:15px;gap:8px}.facts{gap:6px;margin-top:18px}.acts{margin-top:20px}}

html[data-theme=light] .status{background:rgba(255,255,255,.78);border-color:rgba(10,42,143,.14);color:var(--s-ink);box-shadow:0 6px 20px rgba(30,70,170,.12)}
html[data-theme=light] .status i{background:var(--s-blue)}

html[data-theme=light] .brand .bl{background:#fff}
html[data-theme=light] .brand .me{box-shadow:0 0 0 3px rgba(37,99,235,.18)}
html[data-theme=light] .prog{background:rgba(255,255,255,.78);border-color:rgba(10,42,143,.14);color:rgba(10,42,143,.55);box-shadow:0 10px 30px rgba(30,70,170,.14)}
html[data-theme=light] .prog em{background:var(--deep);color:#fff}
html[data-theme=light] .prog li i{border-color:rgba(10,42,143,.25);color:rgba(10,42,143,.55);background:transparent}
html[data-theme=light] .prog li.on{color:var(--navy)}
html[data-theme=light] .prog li.dn{color:var(--navy)}
html[data-theme=light] .prog li.on i,html[data-theme=light] .prog li.dn i{background:var(--deep);border-color:var(--deep);color:#fff}
html[data-theme=light] .prog b{background:rgba(10,42,143,.14)}
html[data-theme=light] .prog b:after{background:var(--deep)}
html[data-theme=light] .closes:not(.inapp){background:rgba(255,255,255,.78);border-color:rgba(10,42,143,.14);color:var(--s-ink);box-shadow:0 10px 30px rgba(30,70,170,.14)}
html[data-theme=light] .closes:not(.inapp) .ci{background:#eef1f7;color:#5b6b8c}
html[data-theme=light] .closes:not(.inapp) small{color:#7a88a6}
html[data-theme=light] .proto>button{color:var(--navy);background:rgba(255,255,255,.78);border-color:rgba(10,42,143,.15)}
html[data-theme=light] .card{box-shadow:0 26px 64px rgba(30,70,170,.24),0 0 0 1px rgba(10,42,143,.07)}
/* the Agent summary stays a deeper blue so it stands out on the light field */
html[data-theme=light] .asum{background:radial-gradient(90% 180% at 100% 0%,rgba(150,200,255,.5) 0%,rgba(150,200,255,0) 60%),linear-gradient(105deg,#1a3fc4 0%,#2f63e8 55%,#4d93f7 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.35),0 -8px 36px rgba(37,99,235,.35)}
html[data-theme=light] .ahd{color:#fff}
html[data-theme=light] .ahd img{filter:brightness(0) invert(1)}
html[data-theme=light] .ast{color:#fff}
html[data-theme=light] .asum:after{background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.25) 45%,transparent 60%);background-size:250% 100%}

i) the Terms and Conditions are subject to revision at any time, as determined by the Company, and all changes are effective immediately upon being posted on the Platform, and (ii) it is your responsibility to review these Terms and Conditions periodically for any updates or changes; the Company shall make commercially reasonable efforts to periodically inform you of the Terms and Conditions, Privacy Notice and other relevant terms that you are bound by, and update you of any change in such terms (if any). To the extent the Company is required to obtain your consent for any changes to the Terms and Conditions or Privacy Notice under applicable laws, the Company will seek your consent for the same.<br><br>1.7. You agree and accept that your registration on the Platform will be subject to risk assessments carried out by the Company based on data provided by you or data received from third party sources, using inter alia Artificial Intelligence (AI) or Machine Learning (ML) systems. The Company is under no obligation to provide you with access to the Platform, and may reject your registration on its Platform, in its sole discretion.<br><br>1.8. You agree to not use the Platform for any purpose that is prohibited by these Terms and Conditions or applicable law."],["2. Information and Data Integrity","2.1. You warrant the accuracy, completeness, consistency, and truthfulness of all information, including Subscriber Consent and preference records and any ‘Know Your Customer’ (“KYC”) documents, that you submit on the Platform.<br><br>2.2. If you provide any information which is inaccurate, incomplete, inconsistent, or untrue, or if there are reasonable grounds to suspect the same, the Company reserves the right to suspend or terminate your access to the Platform.<br><br>2.3. Any Personal Data uploaded to, or provided on, the Platform will be processed in accordance with the applicable data protection laws including the Information Technology (Reasonable Security Practices and Procedures and Sensitive Personal Data or Information) Rules, 2011 (“Privacy Rules”) and the Digital Personal Data Protection Act, 2023 (“DPDP Act”). Unless the context otherwise requires, in these Terms and Conditions the phrase ‘Personal Data’ will have the meaning ascribed to it under the DPDP Act.<br><br>2.4. You permit us to contact your authorized personnel on their phone number or e-mail ID (as required) provided, for administrative and compliance purposes, and in relation to your access to and use of the Platform.<br><br>2.5. You shall remain solely responsible for maintaining the confidentiality and data security of your username, access tokens, password, API credentials, cryptographic keys and any other information required to register for, or access, the Platform. The right to use the Platform is not transferable to any other person or entity. The Company shall not be liable for any loss or damage arising from your failure to maintain the secrecy and confidentiality of your access credentials to the Platform. You agree to immediately notify the Company of any unauthorized use of your account or any other security breach via dpo@tanla.com, as soon as you become are aware of such unauthorized use or security breach. Such notification will include a description of the breach, including the nature, timing, and extent of occurrence, and the datasets believed to be affected. You hereby agree to cooperate with all efforts made by the Company to investigate into, remedy, and report this breach to relevant regulatory authorities, as may be required, and provide information to the Company as may be requested from time to time in relation to the same.<br><br>2.6. You represent and warrant that all Consent data uploaded to the Platform has been explicitly, lawfully, and verifiably obtained directly from the Subscriber in strict compliance with applicable laws, including but not limited to, the Privacy Rules, the TCCCPR, and the DPDP Act (collectively “Data Protection Laws”), and these Terms and Conditions.<br><br>2.7. You shall not submit Consent records that are fabricated, synthetically generated, mechanically duplicated, or otherwise non-compliant with requirements under Data Protection Laws.<br><br>2.8. You acknowledge that the provision or attempted provision of any fraudulent data, including mechanically duplicated or legally defective consent records, constitutes a material breach of these Terms and Conditions.<br><br>2.9. The obligation to ensure the authenticity, validity, and scope of any data provided by the you, including Subscriber Consent data, lies solely with you, and you shall cooperate with any and all requests submitted by the Company in this regard .<br><br>2.10. You will upload or provide data to the Platform only per formats or specifications prescribed by the Company, and you agree and accept that the Company may reject any data uploaded to the Platform that does not conform to these formats or specifications.<br><br>2.11. You agree and accept that the Company’s processing of uploaded Consent data is subject to applicable laws, particularly the TCCCPR. For this reason, the Company’s processing of this data may be subject to limits such volume based limits, or limitations on Subscribers for whom the Company may register Consents.<br><br>2.12. You shall:<br><br>2.12.1. secure all facilities and services (including terminals, software, modem, telecommunications facilities and internet connectivity and browsers, and any third-party keys) necessary for utilizing the Platform;<br>2.12.2. provide the Company with access to the relevant data required to enable it to provide the Platform and associated services to you; and<br>2.12.3. comply with the Company’s instructions and guidelines, in connection with the Platform and its use thereof.<br><br>2.13. You shall not attempt to gain access to the software, data, systems or controls underlying the Platform otherwise than as expressly permitted by the Company in writing."],["3. AI Validation","3.1. You acknowledge that the Platform utilizes proprietary AI and ML models to conduct pre-ingestion validation and continuous risk assessment of Users, Consent records, and ingestion behaviour. The automated assessments may impact the services made available to you on the Platform or your ability to access the Platform, further discussed under this clause 3.<br><br>3.2. The Company reserves the absolute right to unilaterally block, reject, throttle, or route for manual audit your Platform registration request, Consent records, or batch uploads that the system identifies as anomalous, statistically invalid, or high-risk.<br><br>3.3. The Company explicitly disclaims all liability for AI or ML driven operational errors, including false positives or negatives, and any other results of AI or ML driven operations.<br><br>3.4. For clarity, as the processing of Consent records is subject to requirements under applicable laws (particularly the TCCCPR), the successful upload of a Consent record on the Platform (a) does not constitute a validation of its authenticity; (b) does not absolve you of regulatory or contractual liability if the Consent is later found to be non- compliant with Data Protection Laws; and (c) does not guarantee that your Promotional Messages or Promotional Voice Calls will be delivered to Subscribers."],["4. Technical and Data Security","4.1. The Platform utilizes cryptographic tokenization and encryption standards to secure Consent records stored within its underlying ledgers and databases.<br><br>4.2. You must secure your API keys, callback endpoints, administrative credentials, and all other data and systems utilised to access and use the Platform.<br><br>4.3. You acknowledge and agree that you are solely liable for any unauthorized access, data exfiltration, or rogue/malicious data uploads resulting from compromised credentials originating from you or any RTM appointed by you."],["5. Consent and Preference Management Limitations","5.1. You acknowledge and agrees that the Platform executes validation against Subscriber Consent and Preference data exclusively for commercial communications categorized as Promotional Messages and Promotional Voice Calls.<br><br>5.2. You are solely responsible for, and will ensure, the accurate classification of your communications as Promotional Messages / Promotional Voice Calls, and any other form communications recognised under the TCCCPR.<br><br>5.3. You acknowledge that the Company may use behavioural signals to detect and flag traffic misclassification as part of its dynamic trust evaluation and risk scoring processes. You further acknowledge that the Company may incorporate additional measures to ensure regulatory compliance and safeguard Subscriber Consents and preferences."],["6. Consequences of Wrong Classification of Commercial Communication","6.1. If you misclassify, disguise or attempt to disguise Promotional Messages or Promotional Voice Calls as Service Messages, Service Voice Calls, Transactional Messages, Transactional Voice Calls to bypass automated validation, you shall solely be responsible and liable for the same, and the Company will bear no liability or responsibility for the same.<br><br>6.2. Further, any such actions will constitute a material breach of these Terms and Conditions."],["7. Exclusions","7.1. The Platform is provided to you on \"as is\" and \"as available\" basis without warranty of any kind either express or implied. The Company does not warrant that the Platform will be uninterrupted or error free or that the Platform or its hosting server are free from viruses or other harmful components. Further, you acknowledge that on occasion the Platform may be temporarily down due to periodic maintenance, technical issues, or for any security reasons beyond the Company's control. In such instances of downtime, the Company shall not be held liable for any losses which you may incur.<br><br>7.2. The Terms and Conditions do not govern pricing or commercial arrangements. Such functions are managed under separate commercial agreements between you and the Company."],["8. Intellectual Property","8.1. You acknowledge that you acquire no rights under these Terms and Conditions to the Company’s intellectual property (including the Platform), other than as specifically granted under these Terms and Conditions.<br><br>8.2. By accepting, and subject to your compliance with these Terms and Conditions, the Company provides you a limited, non-transferable, royalty-free, revocable, non- sublicensable, non-exclusive right to use the Platform solely for the use of the Services. You are strictly prohibited from:<br><br>8.2.1. using or allowing a third-party to use the Platform except as set out in these Terms and Conditions;<br>8.2.2. license, sublicense, sell, resell, lease, transfer, assign, distribute, or commercially exploit the Platform, or make it available to third parties other than authorised users, and then only as permitted under these Terms and Conditions;<br>8.2.3. create derivative works of the Platform or its components, or of any proprietary software used in the Platform;<br>8.2.4. access the source code or attempt to reverse engineer, decompile, transform, disassemble, modify, copy, distribute, transmit, or reproduce the Platform or its components;<br>8.2.5. use the Platform to build a competing product or service, copy features, functions, or graphics, or perform/disclose any benchmarks, security, or performance testing;<br>8.2.6. rent, share, lend, or operate the Platform on a time-share, service bureau, or marketplace basis, or permit a single Platform account owned by you to be used by other third parties (except as expressly permitted); or<br>8.2.7. use the Platform account for testing, development, or training purposes unless specifically allowed.<br><br>8.3. By accepting these Terms and Conditions, you hereby grant the Company:<br><br>8.3.1. A limited, non-exclusive, revocable, worldwide, royalty-free, fully-paid up license for the duration of the subsistence of the Terms and Conditions to use your intellectual property (such as trademarks, trade names etc.) to enable the Services.<br>8.3.2. An unlimited, exclusive, irrevocable, worldwide, perpetual, royalty-free, fully-paid up, license (with rights to sublicense through one or more tiers of sublicensees) to use, exploit and commercialize in any manner now known or in the future discovered and for whatever purpose, the rights in and to all feedback, comments, suggestions, ideas, observations, modifications, insights, improvements, enhancements and/or any other inputs obtained from you in any manner in relation to access to and use of the Platform. Further, you understand and agree that any rights licensed under this Clause 8.3 shall not revert to you solely due to non-use by the Company."],["9. Indemnification and Limitation of Liability","9.1. In no event shall the Company, including their affiliates, directors, or employees, be liable for any direct, indirect, punitive, or consequential damages resulting from the use or inability to use the Platform.<br><br>9.2. You agree to release, indemnify, and hold the Company and its affiliates and its officers, employees, directors and agents harmless from any and all losses, damages, expenses, regulatory penalties (including financial disincentives imposed by the Telecom Regulatory Authority of India or the Department of Telecommunications), including reasonable attorneys' fees, rights, claims, actions of any kind and injury arising out of or relating to (a) a breach of these Terms and Conditions; (b) any breach of applicable laws including the Data Protection Laws; (c) your use of the Platform; or (d) the submission of invalid, fraudulent, or unverified Consent data.<br><br>9.3. In no event shall the Company’s total cumulative liability to you, for the entire duration of the Terms and Conditions, including any extensions thereof, for any and all losses, liabilities, damages, deficiencies, demands, claims (including third party claims), actions, judgments or causes of action, assessments, interest, penalties and other costs or expenses (including, without limitation, reasonable attorneys' fees and expenses), whether in contract or tort, exceed three (3) calendar months from the date on which a claim is made by you.<br><br>9.4. These indemnity obligations will survive the termination these Terms and Conditions or the termination of your access to the Platform."],["10. Suspension and Termination","10.1. The Company reserves the right to modify, suspend, or withdraw access to the Platform at its sole discretion, in view of business exigencies or guidelines issued by Telecom Regulatory Authority of India, the Department of Telecommunications, regulatory agencies or legal orders from a court of competent jurisdiction.<br><br>10.2. You agree that the Company may, in its sole discretion, suspend or terminate these Terms and Conditions (including your access to the Platform) if the Company believes that (a) you have violated or acted inconsistently with the letter or spirit of these Terms and Conditions; or (b) you are in breach of any requirements under applicable laws (including the Privacy Rules, the TCCCPR, and the DPDP Act).<br><br>10.3. You agree that the Company will not be liable to you or any third party for the suspension of your access to the Platform or the termination of these Terms and Conditions."],["11. General Provisions","11.1. These Terms and Conditions are governed in accordance with the laws of India. Any dispute shall be subject to the exclusive jurisdiction of courts in Hyderabad, Telangana, India.<br><br>11.2. You shall not host, display, upload, modify, publish, transmit, store, update or share any information (including synthetically generated information) on or over the Platform that, among other things:<br><br>11.2.1. belongs to another person and to which you do not have any right;<br>11.2.2. is defamatory, obscene, pornographic, paedophilic, invasive of another’s privacy (including bodily privacy), insulting or harassing on the basis of gender, racially or ethnically objectionable;<br>11.2.3. encourages money laundering or gambling or an online game that causes user harm;<br>11.2.4. promotes enmity between different groups on the grounds of religion or caste with the intent to incite violence;<br>11.2.5. is harmful to children;<br>11.2.6. infringes intellectual property rights;<br>11.2.7. deceives or misleads the addressee about the origin of the message or communicates misinformation or patently false and untrue information;<br>11.2.8. is regarding the Central Government’s business that is identified as fake or false or misleading by such authorised fact check unit;<br>11.2.9. impersonates another person;<br>11.2.10. threatens unity, sovereignty, integrity, defence, security of India, public order or friendly relations with foreign states;<br>11.2.11. is insulting to another nation;<br>11.2.12. contains viruses or malicious code;<br>11.2.13. causes incitement to the commission of any cognizable offence, or prevents investigation of any offence;<br>11.2.14. in the nature of an online game that is not verified as a permissible online game, or is in the nature of an advertisement or surrogate advertisement or promotion of such a game or any platform/entity offering such game; and/or<br>11.2.15. violates any law in force."],["12. No Waiver and Severability","You agree that no action of the Company, other than an express written waiver or amendment, may be interpreted as a waiver or amendment of any of these Terms and Conditions. In the event any clause of these Terms is found to be unenforceable, then whenever possible, this will not affect any other clause, and each shall remain in full force and effect."],["13. Grievance Redressal","In relation to any queries, support requests, complaints, or grievances in relation to access to and/or use of the Platform, please contact our Grievance Officer: <br><br>Designation: Grievance Officer, Wisely Consent <br>Corporate Address: Tanla Platforms Limited, Tanla Technology Centre, Hitech City Road, Madhapur, Hyderabad, Telangana, India - 500081 <br>Contact email: dpo@tanla.com <br><br>By clicking on the \"Accept Terms of Use\" box, I confirm that I have read, understood, and agree to the Platform Terms and Conditions. I confirm I am authorized to bind my organization to these regulatory and technical obligations. If I do not agree to the terms of these Terms and Conditions, the Company may not be able to provide access to the Platform."]]},{"id":"privacy","name":"Privacy Policy","summary":["We process your identity, KYC, consent, log and grievance data to run the platform.","We share it with telecom providers, hosting and security vendors, and authorities where required.","You can access, correct or delete your data, or complain to us or the Data Protection Board."],"sections":[["0. About this notice","This Privacy Notice (“Privacy Notice”) is issued by Tanla Platforms Limited (“Tanla”, “Company”, “we”, “us”, or “our”). This document describes how Tanla collects, records, evaluates, secures, and handles the Personal Data of individuals acting as authorized administrators, operational managers, technical personnel, or corporate representatives (“Platform Users”, “Corporate Users”, or “you”) on behalf of Senders (Enterprises), Telecom Service Providers (Access Providers / TSPs), Partners, Registered Telemarketers (RTMs) who access, integrate with, or operate our proprietary Wisely Consent Platform and its associated APIs and administrative interfaces (collectively, the “Platform”). This notice does not govern the underlying end-subscriber consumer communications data, for which your organization acts as the primary Data Fiduciary. You agree that these terms shall apply in conjunction with, and are additional to, the general Terms of Use, or any other agreement/terms governing your use of Wisely Consent Platform."],["1. Personal data we process","The table below sets out the categories of personal data processed, why each is processed, and the services it enables.<br><br><b>Name, mobile number, email id, subscriber ID, user account ID or other platform identifier<\/b><br>Purpose: To identify you as the user and tie consent and communication preference records to the right profile, and to support account queries and grievances.<br>Enables: Account access, consent management, preference updates, retrieval of consent history, support.<br><br><b>Personal data in corporate KYC documents (directors' government IDs, authorised signatories, power of attorney, registration certificates)<\/b><br>Purpose: To run legal and technical risk assessments, verify corporate legitimacy, prevent identity fraud and validate the registering user's authority.<br>Enables: Completing onboarding, authorising high-volume consent migrations.<br><br><b>Consent status records: given, denied, modified, updated or withdrawn<\/b><br>Purpose: To keep a verifiable record of your consent choices.<br>Enables: Activation, denial, modification or revocation of promotional message and voice call preferences, per sender.<br><br><b>Communication preference settings (category, channel, other preferences)<\/b><br>Purpose: To record your preferences for promotional messages and voice calls.<br>Enables: Preference-based delivery of particular categories or channels.<br><br><b>Date, time and method of consent capture or withdrawal<\/b><br>Purpose: To create an auditable record of when and how a consent choice was made or changed.<br>Enables: Compliance validation, dispute resolution, audit trail, proof of consent lifecycle.<br><br><b>Platform logs: access and transaction logs, device or browser metadata, API access keys, IP address, session information<\/b><br>Purpose: To secure the Platform, detect misuse, troubleshoot issues and maintain integrity and auditability.<br>Enables: Secure access, fraud detection, monitoring, incident investigation, service continuity.<br><br><b>Grievance, complaint or support request details and correspondence<\/b><br>Purpose: To respond to your queries, requests, grievances and complaints.<br>Enables: Grievance redressal, support resolution, exercise of data principal rights.<br><br><b>Records of sharing consent instructions or preference updates with relevant Principal Entities, Senders or ecosystem participants<\/b><br>Purpose: To put your consent and preference choices into effect and pass updates to the parties who rely on them.<br>Enables: Applying updated consents and preferences; sender-side compliance."],["2. Who we share it with","In order to make the Platform and its services available to you, we will need to share your personal data with certain third parties, such as authorised telecom service providers, technology service providers such as cloud hosting providers, database administrators and security log management vendors, government authorities, and third parties in case we undergo any mergers / acquisitions / investments / sale.<br><br>In such cases, to the extent permitted under applicable laws, we will ensure that the recipients of your personal data adopt appropriate security measures which are commensurate with the kind of personal data that they are accessing."],["3. Your rights","As an individual acting as a Platform User, you may have the following rights in respect of the processing of your personal data under this Privacy Notice to the extent provided under applicable laws:<br><br>(a) the right to access, correct, and update your personal data;<br>(b) the right to request deletion of your personal information;<br>(c) the right to seek redressal of your grievances by us or the relevant authority;<br>and (d) the right to nominate one or more individuals to be able to exercise your rights in the event of your death or incapacity.<br><br>To enable exercise of the above rights, please reach out to dpo@tanla.com. When reaching out to exercise your rights, please ensure you provide your name and phone number to help us identify you and support the exercise of your rights. You also have the right to lodge a complaint with the Data Protection Board of India if you believe we have processed your personal information in violation of applicable data protection law. However, we encourage you to raise any complaint with us first so we can do our best to resolve it."],["4. Security measures","We have implemented security policies, rules and technical measures, as required under applicable law including firewalls, transport layer security and other physical and electronic security measures to protect your personal data from inter alia unauthorised access, improper use or disclosure, unauthorised modification and unlawful destruction or accidental loss."],["5. Consent","By clicking \"Accept Privacy Policy\", you acknowledge that:<br>a) You have read and understood how your personal data will be processed as per this Privacy Notice.<br>b) You hereby provide your consent to our processing of your personal information in accordance with this Privacy Notice. You have the right to withdraw your consent to processing of your personal information you have provided to us."]]}];

/* scenes for the rest of the journey */
Object.assign(DRAW,{
  blank:function(){},
  sources:function(c,t){
    // three sources above the text, three below; each is lit and scanned in turn
    var n=6, step=.75, xs=[.26,.5,.74], ys=[Math.round(L.rows*.17),Math.round(L.rows*.8)];
    function glyph(k,x,y,a){A(c,a); c.lineWidth=1;
      if(k===0){c.strokeRect(x-3.5,y-5.5,8,11); for(var q=0;q<3;q++) c.fillRect(x-2,y-2+q*2.5,5,1)}                 // DLT record
      if(k===1){for(var q2=0;q2<6;q2++) c.fillRect(x-5+q2*2,y-5,q2%2?1:1+(q2%3>0?1:0),10)}                              // GSTIN barcode
      if(k===2){c.beginPath(); c.moveTo(x-6,y); c.lineTo(x-2,y); c.lineTo(x-.5,y-5); c.lineTo(x+1.5,y+4); c.lineTo(x+3,y); c.lineTo(x+6,y); c.stroke()} // MCA pulse
      if(k===3){c.beginPath(); c.arc(x,y,5,0,7); c.stroke(); c.beginPath(); c.ellipse(x,y,2,5,0,0,7); c.stroke(); c.fillRect(x-5,y,10,1)}   // website globe
      if(k===4){c.beginPath(); c.arc(x,y,5,0,7); c.stroke(); c.fillRect(x-2,y-2,5,1); c.fillRect(x,y-2,1,5)}              // trademark
      if(k===5){c.strokeRect(x-6.5,y-4.5,13,9); c.fillRect(x-4,y-2,4,1); c.fillRect(x+1,y+1,4,2)}                         // rate card
    }
    for(var k=0;k<n;k++){var top=k<3, x=L.cols*xs[k%3], y=ys[top?0:1], s0=.15+k*step, p=clamp((t-s0)/.7,0,1), on=t>=s0&&t<s0+.75, done=t>=s0+.7;
      var a=done?.9:on?1:.32*ease(t/.4+.2);
      glyph(k,x,y,a);
      if(on){A(c,.95); c.fillRect(Math.round(x-8+p*16),y-8,1,16); A(c,.5); c.strokeRect(x-9.5,y-9.5,19,19)}
      if(done){var ty2=top?y+10:y-11; A(c,1); c.beginPath(); c.moveTo(x-2,ty2); c.lineTo(x-.5,ty2+1.5); c.lineTo(x+2.5,ty2-1.5); c.stroke()}
      var f=ease((t-4.7-k*.06)/.9), y1=top?y+13:y-13, ty=top?L.cy-L.th/2-1:L.cy+L.th/2+1;
      if(f>0){A(c,.6); c.beginPath(); c.moveTo(x,y1); c.lineTo(x+(L.cx-x)*f,y1+(ty-y1)*f); c.stroke()}}
  },
  agree:function(c,t){ // two agreements, left and right; the one being read is lit, key clauses marked
    var w=Math.round(L.cols*.19), h=Math.round(L.rows*.64), y0=Math.round(L.rows*.15), xs=[Math.round(L.cols*.05),Math.round(L.cols*.95-w)];
    for(var d=0;d<2;d++){var x0=xs[d], act=F.doc===d&&!F.accepted[d], acc=F.accepted[d], base=act?1:acc?.75:.35;
      c.lineWidth=1; A(c,.9*base); c.strokeRect(x0+.5,y0+.5,w,h);
      A(c,base); c.fillRect(x0+3,y0+3,Math.round(w*.45),2);
      var sy=y0+((t*.22+d*.4)%1)*h, n=0, key=[1,4,7];
      for(var y=y0+8;y<y0+h-2;y+=3){var len=Math.round((w-6)*(.45+.5*hash(n+d*31))), k=key.indexOf(n)>=0;
        A(c,(k&&(act||acc)?1:act&&y<sy?.55:.25)*base); c.fillRect(x0+3,y,len,1);
        if(k&&(act||acc)){A(c,base); c.fillRect(x0+w-4,y-1,2,2)}
        n++}
      if(act&&!REDUCE){A(c,.9); c.fillRect(x0-1,Math.round(sy),w+3,1)}
      if(acc){A(c,1); c.lineWidth=1.2; var tx=x0+w/2, ty=y0-4; c.beginPath(); c.moveTo(tx-3,ty); c.lineTo(tx-1,ty+2); c.lineTo(tx+3,ty-2); c.stroke()}}
  },
  plan:function(c,t){ // five steps joined in a line that ends in migration
    var y=Math.round(L.rows*.17), x0=L.cols*.12, x1=L.cols*.88, p=ease(t/1.8);
    c.lineWidth=1; A(c,.55); c.beginPath(); c.moveTo(x0,y+.5); c.lineTo(x0+(x1-x0)*p,y+.5); c.stroke();
    for(var k=0;k<6;k++){var x=x0+(x1-x0)*k/5; if(p<k/5-.001) continue; var s=k===5?5:3; A(c,k===5?1:.95);
      c.fillRect(Math.round(x-s/2),Math.round(y-s/2+.5),s,s)}
    if(t>1.8&&!REDUCE){var q=((t-1.8)*.25)%1, px=x0+(x1-x0)*q; for(var j=0;j<8;j++){A(c,1-j*.12); c.fillRect(Math.round(px-j*.8),y,1,1)}}
    var yb=Math.round(L.rows*.8);
    for(var m=0;m<3;m++){var g=ease((t-.4-m*.25)/.6); if(g<=0) continue; var cx=L.cx+(m-1)*L.cols*.2;
      A(c,.35*g); c.beginPath(); c.arc(cx,yb,2.5,0,7); c.stroke()}
  },
  verify:function(c,t){ // the profile goes out to four operators and comes back approved
    var P=[[.12,.2],[.88,.2],[.12,.8],[.88,.8]], cx=L.cx, cy=L.cy;
    for(var k=0;k<4;k++){var nx=P[k][0]*L.cols, ny=P[k][1]*L.rows, ln=ease((t-k*.1)/.7), ok=t>3+k*.3;
      c.lineWidth=1; A(c,ok?.75:.3); c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+(nx-cx)*ln,cy+(ny-cy)*ln); c.stroke();

  pass:function(c,t){ // a ring closes around the result
    var R=Math.min(L.rows*.42,Math.max(L.tw*.55+2,L.rows*.3)), p=ease(t/.9);
    c.lineWidth=1.2; A(c,1); c.beginPath(); c.arc(L.cx,L.cy,R,-Math.PI/2,-Math.PI/2+p*Math.PI*2); c.stroke();
    if(t>.9&&!REDUCE){var e=t-.9, r=R+e*22; A(c,.8*(1-e/1.4)); c.beginPath(); c.arc(L.cx,L.cy,r,0,7); c.stroke()}
  },

    var R=Math.min(L.rows*.47,Math.max(L.tw*.55+2,L.rows*.36)), p=ease(t/1.3);

    for(var k=0;k<5;k++){var a=-Math.PI/2+k*Math.PI*2/5+(REDUCE?0:t*.05); A(c,p>=(k+.5)/5?1:.3);

    for(var j=0;j<60;j++){var sp=.06+hash(j)*.08, x=((hash(j+3)+t*sp)%1)*L.cols, y=L.rows*(.12+hash(j+9)*.76);

  }
});

function paint(ctx2,id,t){
  ctx2.globalAlpha=1; ctx2.fillStyle="#000"; ctx2.fillRect(0,0,cols,rows);
  if(REDUCE) t=Math.max(t,30);
  DRAW[id](ctx2,t);
  return ctx2.getImageData(0,0,cols,rows).data;
}

/* scene player: show(id, at) switches the picture; the change spreads out from the text */
var clock=0,last=performance.now(),paused=false;
var SC={id:"blank",t0:0}, PREV=null, changeAt=-9, GAIN=1;
function show(id,at){if(SC.id===id&&at==null) return; PREV={id:SC.id,t0:SC.t0}; SC={id:id,t0:clock-(at||0)}; changeAt=clock}

function background(){
  var g=ctx.createLinearGradient(0,0,0,H);
  if(LIGHT){g.addColorStop(0,"#cfe0ff"); g.addColorStop(.55,"#e6efff"); g.addColorStop(1,"#f6f9ff")}
  else{g.addColorStop(0,"#0a33c2"); g.addColorStop(.5,"#2459e3"); g.addColorStop(1,"#2d63e8")}
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  var cx=L.cx*cell, cy=L.cy*cell, r=Math.max(W,H)*.34, rg=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  if(LIGHT){rg.addColorStop(0,"rgba(255,255,255,.85)"); rg.addColorStop(1,"rgba(255,255,255,0)")}
  else{rg.addColorStop(0,"rgba(8,38,170,.55)"); rg.addColorStop(1,"rgba(8,38,170,0)")}
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
}

function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  if(!paused) clock+=dt;
  if(F.mode==="proc") procTick();
  GAIN+=((CARD.on?.6:1)-GAIN)*Math.min(1,dt*3);

  var dNew=paint(oA,SC.id,clock-SC.t0), dOld=null, el=clock-changeAt, TW=REDUCE?0:.9;
  if(PREV&&el<TW+.2) dOld=paint(oB,PREV.id,clock-PREV.t0);

  ctx.setTransform(dpr,0,0,dpr,0,0); background();
  ctx.setTransform(1,0,0,1,0,0);
  var ps=Math.ceil(cell*dpr), gs=glow.width, k=Math.min(1,dt), wave=REDUCE?0:1, tt=clock;
  for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
    var j=y*cols+x, delay=dist[j]/maxDist*TW, v4=j*4, target, front=0;
    if(dOld&&el<delay) target=dOld[v4]/255;
    else{target=dNew[v4]/255; if(dOld){var e=(el-delay)/.08; front=Math.exp(-e*e)*.55}}
    target=target*hole[j]*GAIN+front;
    val[j]+=(target-val[j])*Math.min(1,k*spd[j]);
    var v=clamp(val[j],0,1);
    var amb=(.13+.11*ambR[j]+wave*(.08*Math.sin((x-y)*.21-tt*1.5)+.05*Math.sin(x*.06+y*.04+tt*.4)))*hole[j];
    var a=amb*(1-v)+v*(.58+.1*hash(j+Math.floor(tt*6)));
    if(a<.025) continue;
    ctx.globalAlpha=a;
    ctx.drawImage(sprites[tint[j]][Math.min(SIZES-1,Math.floor(v*SIZES))][(x+y)&1],Math.round(x*cell*dpr),Math.round(y*cell*dpr));
  }
  ctx.globalCompositeOperation="lighter";
  for(var j2=0;j2<N;j2++){var vv=val[j2]; if(LIGHT||vv<.45||tint[j2]>2) continue;
    ctx.globalAlpha=(vv-.45)*.1; ctx.drawImage(glow,(j2%cols)*cell*dpr+ps/2-gs/2,Math.floor(j2/cols)*cell*dpr+ps/2-gs/2)}
  ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

/* ======================= words in the middle ======================= */
var said={kick:null,line:null,sub:null,extra:null};
function setWords(el,html,words){
  var go=function(){
    el.classList.remove("out","in");
    if(words){var n=0; el.innerHTML=html.split(" ").map(function(w){return '<span class="w" style="--d:'+(n++*45)+'ms">'+w+'</span>'}).join(" ")}
    else el.innerHTML=html?'<span class="w" style="--d:0ms">'+html+'</span>':"";
    void el.offsetWidth; el.classList.add("in"); measure();
  };
  if(el.innerHTML&&!REDUCE){el.classList.add("out"); later(go,220,true)} else go();
}
function setExtra(html,quiet){
  var el=$("extra");
  if(quiet){el.innerHTML=html; measure(); return}
  el.classList.remove("in"); el.classList.add("out");
  later(function(){el.innerHTML=html; el.classList.remove("out"); void el.offsetWidth; el.classList.add("in"); measure()},html&&el.innerHTML?230:(REDUCE?0:120),true);
}
/* o: {kick, line, sub, extra, status:[text, cls], prog:{label, items, states}} ; only what changed animates */
function say(o,quiet){
  if(o.kick!=null&&o.kick!==said.kick){said.kick=o.kick; $("kick").innerHTML=o.kick}
  if(o.line!=null&&o.line!==said.line){said.line=o.line; setWords($("line"),o.line,true)}
  if(o.sub!=null&&o.sub!==said.sub){said.sub=o.sub; setWords($("sub"),o.sub,false)}
  if(o.extra!=null&&o.extra!==said.extra){said.extra=o.extra; setExtra(o.extra,quiet)}
  if(o.status){$("statusTxt").textContent=o.status[0]; $("status").className="status "+(o.status[1]||"")}
  if(o.prog) drawProg(o.prog);
  $("prog").classList.toggle("off",["gate","review","verify","pass"].indexOf(F.mode)<0);
  measure();
}
function drawProg(p){
  var st=p.states||[];
  $("prog").innerHTML=(p.label?'<em>'+p.label+'</em>':'')+'<ol>'+p.items.map(function(l,i){var c=st[i]||"";
    return (i?'<b class="'+(c==="dn"||c==="on"?"dn":"")+'"></b>':'')+'<li class="'+c+'"><i>'+(c==="dn"?I("check"):i+1)+'</i><span class="lbl">'+esc(l)+'</span></li>'}).join("")+'</ol>';
}
function states(n,cur,doneUpTo){var a=[];for(var i=0;i<n;i++)a.push(i<doneUpTo?"dn":i===cur?"on":"");return a}

/* timers that die when the user jumps */
var timers=[];
function later(f,ms,keep){var id=setTimeout(f,ms); if(!keep) timers.push(id); return id}
function clearLater(){timers.forEach(clearTimeout); timers=[]}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},2600)}

/* ======================= flow ======================= */
var F={mode:"gate",doc:0,accepted:[false,false],readEnd:false,status:["review","locked","locked","locked","locked"],
  active:0,auth:false,teamLater:false,lobf:"all",tq:"",tf:-1,procT0:0,procI:-1,subState:""};

/* 1 · agreements: summary first, the full text is in the sheet; accept only after reading to the end */
function gate(d){
  F.mode="gate"; F.doc=d; F.readEnd=false; show("blank");
  say({kick:"", line:"", sub:"", extra:"",
    status:[d?"One agreement left":"Two agreements to accept","still"],
    prog:{label:"Agreements",items:DOCS.map(function(x){return x.name}),states:DOCS.map(function(x,i){return F.accepted[i]?"dn":i===d?"on":""})}});
  later(function(){showCard()},REDUCE?0:260);
}

/* 2 · the setup plan */
function plan(){
  F.mode="plan"; show("blank");
  say({kick:"What happens next", line:"Leave the paperwork to me", sub:"I'll look up your company's records, fill in the details and get your account ready to move your consents. Then I'll show you what I found, and you just tell me if it looks right.",
    extra:'<div class="three"><span>'+I("spark")+'I do the work</span><span>'+I("user")+'You check it</span><span>'+I("lock")+'Nothing is sent without your OK</span></div>'+
      '<div class="acts"><button class="btn" data-a="start">Let\'s begin'+I("arrow")+'</button></div>',
    status:["Ready to start","still"], prog:{label:"Steps",items:STEPN,states:[]}});
}

/* 3 · processing (timeline) */
var STARTS=[];(function(){var s=0;SCENES.forEach(function(x){STARTS.push(s);s+=x.dur})})();
function sceneAt(t){for(var i=SCENES.length-1;i>=0;i--)if(t>=STARTS[i])return i;return 0}
function proc(at){F.mode="proc"; F.procT0=clock-(at||0); F.procI=-1; procTick()}
function procTick(){
  var pt=clock-F.procT0, i=sceneAt(pt), s=SCENES[i], lt=pt-STARTS[i];
  if(i!==F.procI){F.procI=i;
    if(s.id==="done"){ready(); return}
    show(s.id,lt); F.subState=s.subs?"s0":"";
    say({kick:s.kick,line:s.line,sub:s.sub||((s.subPre||"")+s.subs[0]),extra:"",status:["Onboarding Agent is working"],
      prog:{label:s.grp==="src"?"Sources":"Steps",items:s.grp==="src"?SRC:STEPN,states:states(5,s.prog,s.prog)}});
    return}
  if(s.subs){var span=s.dur*.75,n=s.subs.length;
    if(lt<span){var k0=Math.min(n-1,Math.floor(lt/(span/n))); if(F.subState!=="s"+k0){F.subState="s"+k0; say({sub:(s.subPre||"")+s.subs[k0]});
      if(s.progSubs) drawProg({label:"Sources",items:SRC,states:states(SRC.length,k0,k0)})}}}
  if(s.done&&lt>s.dur*(s.subs?.75:.72)&&F.subState!=="done"){F.subState="done"; say({sub:OK+s.done}); if(s.progSubs) drawProg({label:"Sources",items:SRC,states:states(SRC.length,-1,SRC.length)})}
  if(s.id==="form"){var c=0; for(var k=0;k<7;k++) if(lt>=FILL_T0+k*FILL_STEP+FILL_DUR) c++;
    var txt=c===7?OK+"7 of 7 fields filled":c+" of 7 fields filled";
    if(F.subState!==txt){F.subState=txt; said.sub=txt; $("sub").innerHTML='<span class="w" style="--d:0ms">'+txt+'</span>'; $("sub").classList.add("in")}}
}
function ready(){
  F.mode="ready"; show("done");
  say({kick:"Onboarding Agent", line:"All done. Have a look?", sub:"I've filled everything in. Go through it one part at a time and confirm what looks right.",
    extra:'<div class="three"><span>'+OK+'3 ready to accept</span><span><span class="ok" style="background:var(--amber)"></span>2 need a quick look</span></div>'+
      '<div class="acts"><button class="btn" data-a="go0">Review your business profile'+I("arrow")+'</button></div>',
    status:["Ready for your review","done"], prog:{label:"Steps",items:STEPN,states:states(5,-1,5)}});
}

/* 4 · review: a white card in the middle of the field holds the summary and the decision;
   See details grows it to full page, Show summary or finishing the step brings it back */
function review(i){
  F.mode="review"; F.active=i; var st=STEPS[i];
  show("blank");
  say({kick:"",line:"",sub:"",extra:"",status:["Needs you",st.attn?"attn":"still"], prog:{label:"Steps",items:STEPN,states:states(5,i,i)}});
  later(function(){showCard()},REDUCE?0:260);

function heading(i){var k=STEPS[i].k;
  if(k==="brands") return BRANDS.length+" brands and "+lobCount()+" lines of business";
  if(k==="templates") return (100-unmapped())+" of 100 templates have a line of business";
  return STEPS[i].rh}
