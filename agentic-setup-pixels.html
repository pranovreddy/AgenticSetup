    (rows.length?rows.map(function(r){var x=r[0],k=r[1];return '<div class="row" style="grid-template-columns:'+TCOLS+';opacity:'+(x.on?1:.55)+'"><span class="ck'+(x.on?' on':'')+'" data-a="ptog" data-i="'+k+'">'+(x.on?I("check"):'')+'</span><div style="display:flex;gap:12px;align-items:center;min-width:0"><div class="av">'+x.i+'</div><div style="min-width:0"><div class="rn">'+esc(x.name)+'</div><div class="rm" style="overflow:hidden;text-overflow:ellipsis">'+esc(x.email)+'</div></div></div><span class="rm" style="font-size:13.5px">'+esc(x.mob)+'</span><select class="inp" data-c="dept" data-i="'+k+'">'+DEPTS.map(function(d){return '<option'+(d===x.dept?' selected':'')+'>'+d+'</option>'}).join("")+'</select><select class="inp" data-c="role" data-i="'+k+'">'+ROLES.map(function(o,qq){return '<option value="'+qq+'"'+(qq===x.role?' selected':'')+'>'+o+'</option>'}).join("")+'</select></div>'}).join("")
     :'<div class="empty">No people match your search. <button class="btn ghost" data-a="tclear">Clear search</button></div>');
}
function detailParts(i){
  var st=STEPS[i], h="", ft=["",""]; function foot(l,r){ft=[l,r]}
  if(st.k==="profile"){h='<div class="lslot"><div class="lbox"><img src="'+HDFC_LOGO+'" alt="HDFC Bank logo"></div><div><div class="rn">Enterprise logo</div><div class="rm">Found on your website</div></div></div><div class="fgrid">'+PROFILE.map(function(x,k){return fd(x[0],x[1],x[2],k===2,k)}).join("")+'</div>';
    foot(authRow(),primary(i))}
  if(st.k==="team"){
    h='<div class="tbar"><div class="chips" style="margin:0">'+
      [[-1,"All"]].concat(ROLES.map(function(r,q){return [q,r]})).map(function(r){var n=r[0]<0?PEOPLE.length:PEOPLE.filter(function(x){return x.role===r[0]}).length;
        return '<button class="fc'+(F.tf===r[0]?' on':'')+'" data-a="tf" data-v="'+r[0]+'">'+r[1]+' · '+n+'</button>'}).join("")+'</div><label class="srch">'+I("search")+'<input data-c="tq" placeholder="Search by name or email" value="'+esc(F.tq)+'"></label></div><div id="teamRows">'+teamRows()+'</div>';
    foot('<button class="btn ghost" data-a="later">Do it later</button><span class="ls">'+onPeople().length+' of '+PEOPLE.length+' selected</span>',primary(i))}
  if(st.k==="brands"){h='<div class="root"><div class="lbox ent"><img src="'+HDFC_LOGO+'" alt="HDFC Bank logo"></div><div><small class="rm">Enterprise</small><div class="rn" style="font-size:16px">HDFC Bank Limited</div><div class="rm">'+BRANDS.length+' brands · '+lobCount()+' lines of business</div></div></div><ul class="tree">'+BRANDS.map(function(br,bi){return '<li><div class="bn"><span class="blogo" style="--c:'+br.logo[2]+'"><b>'+br.logo[0]+'</b><i>'+br.logo[1]+'</i></span><div><small>Brand · logo from website</small><b>'+esc(br.name)+'</b></div><span class="mono">'+br.hdr+'</span></div><div class="lobs">'+br.lobs.map(function(l,li){return '<span class="lob">'+esc(l)+'<button data-a="rmlob" data-b="'+bi+'" data-l="'+li+'" aria-label="Remove '+esc(l)+'">'+I("x")+'</button></span>'}).join("")+'</div></li>'}).join("")+'</ul>';
    foot('<span class="ls">'+BRANDS.length+' brands · '+lobCount()+' lines of business</span>',primary(i))}
  if(st.k==="gtm"){var pk=picked(), c2="30px 1.1fr repeat(3,74px) 1.5fr";
    h='<div class="row hd" style="grid-template-columns:'+c2+'"><span></span><span>Partner</span>'+PH.map(function(x){return '<span>'+x+'</span>'}).join("")+'<span>Why</span></div>'+PARTNERS.map(function(x,k){return '<div class="row" style="grid-template-columns:'+c2+';opacity:'+(x.pick?1:.7)+'"><span class="ck'+(x.pick?' on':'')+'" data-a="ptn" data-i="'+k+'">'+(x.pick?I("check"):'')+'</span><b>'+esc(x.name)+'</b>'+x.r.map(function(r){return '<span>₹'+r.toFixed(2)+'</span>'}).join("")+'<span class="rm">'+esc(x.why)+'</span></div>'}).join("")+
      '<div class="rn" style="margin-top:26px">Volume split by phase</div>'+(pk.length===2?PH.map(function(x,k){return '<div class="row" style="grid-template-columns:110px 1fr 200px"><span>'+x+'</span><div class="spl"><i style="width:'+ALLOC[k]+'%;background:#2563eb"></i><i style="width:'+(100-ALLOC[k])+'%;background:#9bb8ff"></i></div><span class="rm">'+esc(pk[0].name)+' '+ALLOC[k]+'% · '+esc(pk[1].name)+' '+(100-ALLOC[k])+'%</span></div>'}).join(""):'<div class="sh-sum">Choose exactly two partners to see the split.</div>');
    foot('<span class="ls">'+pk.length+' of 2 partners chosen</span>',primary(i))}
  if(st.k==="templates"){var u=unmapped(), rows=TPLS.map(function(t,k){return [t,k]}).filter(function(x){var t=x[0];return F.lobf==="all"||(F.lobf==="un"?t[3]==="u":t[2]===F.lobf)}), c3="170px 1fr 160px 80px";
    h='<div class="stat"><div><b>100</b><span>Scanned</span></div><div><b>'+(100-u)+'</b><span>With a line of business</span></div><div><b style="color:var(--s-amber)">'+u+'</b><span>Unmapped</span></div></div>'+
      '<div class="chips"><button class="fc'+(F.lobf==="all"?' on':'')+'" data-a="lobf" data-v="all">All</button>'+TLOBS.map(function(l){return '<button class="fc'+(F.lobf===l[0]?' on':'')+'" data-a="lobf" data-v="'+l[0]+'">'+l[0]+' · '+l[1]+'</button>'}).join("")+'<button class="fc'+(F.lobf==="un"?' on':'')+'" data-a="lobf" data-v="un">Needed a look · 2</button></div>'+
      rows.map(function(x){var t=x[0],k=x[1];return '<div class="row" style="grid-template-columns:'+c3+'"><b style="font:600 12.5px/1.3 ui-monospace,Menlo,monospace">'+t[0]+'</b><span style="color:var(--s-ink2);font-size:14px">'+esc(t[1])+'</span>'+(t[3]==="u"?'<select class="inp" data-c="tlob" data-i="'+k+'"><option value="">Choose a line</option>'+TLOBS.map(function(l){return '<option'+(l[0]===t[2]?' selected':'')+'>'+l[0]+'</option>'}).join("")+'</select>':'<span>'+esc(t[2])+'</span>')+'<span class="cf '+(t[3]==="u"&&t[2]?'m':t[3])+'">'+(t[3]==="u"?(t[2]?'Set by you':'Unmapped'):({h:'High',m:'Check'})[t[3]])+'</span></div>'}).join("");
    foot('<span class="ls">Showing '+rows.length+' of 9 sample templates</span>',primary(i))}
  return {h:h,l:ft[0],r:ft[1]};
}
function checkEnd(){var b=$("shBody"); if(SHEET==="doc"&&!F.readEnd&&b.scrollTop+b.clientHeight>=b.scrollHeight-24){F.readEnd=true; renderSheet()}}
$("shBody").addEventListener("scroll",checkEnd);
function checkCardEnd(){var bd=$("card").querySelector(".dtext"); if(F.mode==="gate"&&!F.readEnd&&bd&&bd.scrollTop+bd.clientHeight>=bd.scrollHeight-24){F.readEnd=true; renderCard()}}
$("card").addEventListener("scroll",checkCardEnd,true);

/* ======================= events ======================= */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]"); if(!el){if(!e.target.closest(".proto")) $("pm").classList.remove("on"); return}
  var a=el.dataset.a, i=+el.dataset.i;
  if(a==="close") closeSheet();
  else if(a==="read") openSheet("doc");
  else if(a==="accdoc"){if(!F.readEnd) return; F.accepted[F.doc]=true;
    finishStep(function(){
    if(F.doc===0) gate(1);
    else{F.mode="pass"; show("blank"); say({kick:"Before we begin",line:"Both agreements accepted",sub:OK+"Next: what happens now",extra:"",status:["Agreements accepted","done"],prog:{label:"Agreements",items:DOCS.map(function(x){return x.name}),states:["dn","dn"]}}); later(plan,2200)}})}
  else if(a==="start") proc(0);
  else if(a==="go0") review(0);
  else if(a==="details") expandCard();
  else if(a==="collapse") collapseCard();
  else if(a==="auth"){F.auth=!F.auth; refresh()}
  else if(a==="submit"){if(F.auth) finishStep(verify)}
  else if(a==="ptog"){PEOPLE[i].on=!PEOPLE[i].on; refresh()}
  else if(a==="invites"){F.teamLater=false; finishStep(function(){complete(1,"Invites sent")})}
  else if(a==="later"){F.teamLater=true; finishStep(function(){complete(1,"Team saved for later")})}
  else if(a==="rmlob"){BRANDS[+el.dataset.b].lobs.splice(+el.dataset.l,1); refresh()}
  else if(a==="brands") finishStep(function(){complete(2,"Brands and LOBs set up")});
  else if(a==="ptn"){var n=picked().length; if(PARTNERS[i].pick||n<2){PARTNERS[i].pick=!PARTNERS[i].pick} else toast("Untick one partner first"); refresh()}
  else if(a==="gtm") finishStep(function(){complete(3,"Partners confirmed")});
  else if(a==="tf"){F.tf=+el.dataset.v; refresh()}
  else if(a==="tclear"){F.tq=""; F.tf=-1; refresh()}
  else if(a==="lobf"){F.lobf=el.dataset.v; refresh()}
  else if(a==="tpl") finishStep(function(){complete(4,"Templates mapped")});
  else if(a==="mig"){F.mode="pass"; show("pass"); hideCard(); later(function(){openApp(true)},REDUCE?0:500)}
  else if(a==="tnext") tourGo(TS+1);
  else if(a==="tback") tourGo(TS-1);
  else if(a==="tskip") tourEnd();
  else if(a==="upload"){tourEnd(); toast("New Upload: choose a CSV file to start an assisted migration")}
  else if(a==="csvtpl") toast("Template downloaded");
});
document.addEventListener("input",function(e){var el=e.target; // search filters the rows only, so the box keeps focus
  if(el.dataset.c==="tq"){F.tq=el.value; var r=$("teamRows"); if(r) r.innerHTML=teamRows()}});
document.addEventListener("change",function(e){var el=e.target, i=+el.dataset.i;
  if(el.dataset.c==="role"){PEOPLE[i].role=+el.value; refresh()}
  if(el.dataset.c==="dept"){PEOPLE[i].dept=el.value}
  if(el.dataset.c==="tlob"){TPLS[i][2]=el.value; refresh()}
  if(el.dataset.f!=null){PROFILE[+el.dataset.f][1]=el.value} // saved quietly: a redraw here would swallow the next click
});
addEventListener("keydown",function(e){
  if(e.key==="Escape"&&TS>=0){tourEnd(); return}
  if(e.key==="Escape"){if(CARD.big) collapseCard(); else closeSheet()}
  if(e.code==="Space"&&!/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault(); paused=!paused}
});
addEventListener("resize",function(){resize(); if(CARD.on) placeCard(); if(TS>=0) tourGo(TS)});

/* ======================= prototype jumps ======================= */
function resetData(){var b=JSON.parse(BASE); PROFILE=b.P; PEOPLE=b.E; BRANDS=b.B; PARTNERS=b.G; TPLS=b.T}
function jump(w){
  clearLater(); closeSheet(); hideCard(); closeApp(); CARD.big=false; $("card").classList.remove("big","swap"); resetData(); F.auth=false; F.teamLater=false; F.lobf="all"; F.tq=""; F.tf=-1;
  F.accepted=w==="gate"?[false,false]:[true,true];
  if(w==="gate") gate(0);
  else if(w==="plan") plan();
  else if(w==="proc") proc(0);
  else if(w==="ready") ready();
  else if(w==="final"){F.status=["done","done","done","done","done"]; final()}
  else if(w==="app"){F.status=["done","done","done","done","done"]; final(); openApp(true)}
  else{var n=+w.slice(1); F.status=STEPS.map(function(_,k){return k<n?"done":k===n?"review":"locked"}); review(n)}
}
(function(){var pm=$("pm");
  pm.innerHTML=[["gate","Agreements"],["plan","Setup plan"],["proc","AI processing"],["ready","Ready for review"],["r0","Review: Business profile"],["r1","Review: Team"],["r2","Review: Brands and LOBs"],["r3","Review: GTM partners"],["r4","Review: Templates"],["final","Finished"],["app","Migration + walkthrough"]].map(function(x){return '<button data-j="'+x[0]+'">'+x[1]+'</button>'}).join("")+
    '<hr><button data-j="glyph">Pixels: use arrows</button><button data-j="pause">Pause motion</button>';
  $("pmb").onclick=function(e){e.stopPropagation(); pm.classList.toggle("on")};
  pm.onclick=function(e){var b=e.target.closest("[data-j]"); if(!b) return; var j=b.dataset.j;
    if(j==="glyph"){GLYPH=GLYPH==="tri"?"arrow":"tri"; b.textContent=GLYPH==="tri"?"Pixels: use arrows":"Pixels: use triangles"; makeSprites(); return}
    if(j==="pause"){paused=!paused; b.textContent=paused?"Play motion":"Pause motion"; return}
    pm.classList.remove("on"); jump(j)};
})();

var CLOSE_AT=Date.now()+30*864e5;
(function cd(){var s=Math.max(0,Math.floor((CLOSE_AT-Date.now())/1000)), t=Math.floor(s/86400)+"d "+String(Math.floor(s/3600)%24).padStart(2,"0")+"h "+String(Math.floor(s/60)%60).padStart(2,"0")+"m";
  document.querySelectorAll(".cdv").forEach(function(e){e.textContent=t}); setTimeout(cd,1000)})();
resize();
var h=(location.hash||"").replace("#","").split("&")[0];
if(/^(gate|plan|proc|ready|final|app|r[0-4])$/.test(h)) jump(h); else gate(0);
var m=/t=([\d.]+)/.exec(location.hash); if(m&&F.mode==="proc") F.procT0=clock-parseFloat(m[1]);
requestAnimationFrame(function(n){last=n; frame(n)});
})();
</script>
