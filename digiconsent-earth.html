<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>DigiConsent Earth Layers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a half earth cut open in the centre, its five layers as rings around the user. Frosted glass HUD on the edges. */
:root{
  --acc:#2563eb; --acc-soft:rgba(37,99,235,.12);
  --ink:#0f1b3d; --ink2:#44537a; --mute:#7483a3;
  --glass:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.8); --line:rgba(15,27,61,.09);
  --chip:rgba(15,27,61,.055); --sky:#e9eef5;
  --ok:#0f8a5f; --warn:#b06a07; --bad:#c0392b;
  --shadow:0 10px 34px rgba(20,35,80,.13);
  --f-d:'Space Grotesk','Inter',system-ui,sans-serif; --f-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
:root.night{
  --ink:#eef2ff; --ink2:#b9c4e2; --mute:#8794b8;
  --glass:rgba(16,23,42,.62); --glass-b:rgba(255,255,255,.1); --line:rgba(255,255,255,.1);
  --chip:rgba(255,255,255,.08); --sky:#0d1424; --acc:#6c9bff; --acc-soft:rgba(108,155,255,.16);
  --ok:#4fd1a1; --warn:#f0b35a; --bad:#ff8577;
  --shadow:0 10px 34px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font:13px/1.4 var(--f-b);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--shadow);border-radius:16px;transition:background .6s,border-color .6s,color .6s}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* top bar */
#top{position:absolute;top:12px;left:var(--gl);right:var(--gr);height:52px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;z-index:30}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo svg{width:26px;height:26px}
.logo b{font:700 16px/1 var(--f-d);letter-spacing:-.01em;display:block}
.logo span{font-size:10.5px;color:var(--mute);display:block;margin-top:3px;white-space:nowrap}
.search{position:relative;flex:1 1 150px;max-width:230px;min-width:0}
.search input{width:100%;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:0 10px 0 30px;outline-offset:0}
.search input::placeholder{color:var(--mute)}
.search svg{position:absolute;left:9px;top:9px;width:16px;height:16px;stroke:var(--mute)}
.drop{position:absolute;top:calc(100% + 8px);left:0;min-width:240px;padding:6px;z-index:40;max-height:60vh;overflow:auto}
.drop.right{left:auto;right:0}
.drop button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;padding:7px 9px;border-radius:9px}
.drop button:hover,.drop button.on{background:var(--acc-soft)}
.drop button small{color:var(--mute);margin-left:auto;white-space:nowrap}
.drop .empty{padding:9px;color:var(--mute)}
.areas{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--chip);flex:none}
.areas button{height:28px;padding:0 10px;border-radius:8px;color:var(--ink2);font-weight:500;white-space:nowrap}
.areas button:hover{color:var(--ink)}
.areas button.on{background:var(--acc);color:#fff}
.sp{flex:1 1 0}
.tb{position:relative;flex:none}
.ib{height:34px;min-width:34px;padding:0 9px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;justify-content:center;background:var(--chip);font-weight:500;white-space:nowrap}
.ib:hover{background:var(--acc-soft)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.clock{font:600 14px/1 var(--f-d);padding:0 4px;flex:none;text-align:right}
.clock small{display:block;font:500 10px/1 var(--f-b);color:var(--mute);margin-top:3px}
.user{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;font:600 12px/34px var(--f-d);text-align:center;flex:none}
.alert{display:block;padding:8px 9px;border-radius:9px;border-bottom:1px solid var(--line);width:300px;max-width:76vw}
.alert:last-child{border:0}
.alert time{color:var(--mute);font-size:11px;display:block}
.alert i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px}
.alert i.warn{background:var(--warn)} .alert i.ok{background:var(--ok)}

/* KPI cards */
#kpis{position:absolute;top:76px;left:var(--gl);display:flex;gap:10px;z-index:20}
.kpi{padding:12px 14px;width:196px}
.kpi .v{font:700 25px/1.1 var(--f-d);letter-spacing:-.02em;margin:5px 0 3px}
.kpi .d{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.kpi .d b{color:var(--acc);font-weight:600}
#kpis{cursor:pointer}
#kpis.col .kpi{width:auto;padding:8px 13px;display:flex;align-items:baseline;gap:9px;border-radius:12px;flex:none}
#kpis.col .kpi .v{font-size:15px;margin:0}
#kpis.col .kpi .d,#kpis.col .kpi .bar{display:none}
.bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .6s}

/* detail panel */
#detail{position:absolute;top:76px;right:var(--gr);width:296px;padding:14px;z-index:25;max-height:calc(100% - 76px - 282px);overflow:auto}
#detail h2{font:700 18px/1.2 var(--f-d);margin:4px 0 2px;letter-spacing:-.01em;padding-right:26px;text-wrap:balance}
#detail .sub{color:var(--ink2);margin-bottom:10px}
#detail .x{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:8px;background:var(--chip);font-size:15px;line-height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:11.5px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.idle{background:var(--chip);color:var(--ink2)} .pill.ok{background:rgba(15,138,95,.13);color:var(--ok)} .pill.warn{background:rgba(176,106,7,.13);color:var(--warn)}
.rows{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px}
.rows dt{color:var(--mute)} .rows dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.intro p{margin:6px 0 0;color:var(--ink2)}
.legend{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.legend li{display:flex;gap:8px;align-items:center;color:var(--ink2)}
.legend kbd{font:600 10.5px var(--f-b);background:var(--chip);border-radius:6px;padding:2px 6px;color:var(--ink);white-space:nowrap}

/* tracker */
#tracker{position:absolute;left:var(--gl);bottom:14px;width:296px;padding:14px;z-index:20}
#tracker h3{font:600 14px/1.2 var(--f-d);margin:3px 0 1px}
#tracker .f{color:var(--ink2);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{list-style:none;margin:10px 0 0;padding:0}
.steps li{display:flex;align-items:center;gap:9px;padding:4px 0;position:relative;color:var(--mute)}
.steps li::before{content:"";width:11px;height:11px;border-radius:50%;border:2px solid var(--line);flex:none;background:transparent;z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;left:5px;top:18px;width:1.5px;height:14px;background:var(--line)}
.steps li.done{color:var(--ink2)} .steps li.done::before{background:var(--acc);border-color:var(--acc)}
.steps li.now{color:var(--ink);font-weight:600} .steps li.now::before{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft);animation:pulse 1.4s infinite}
.steps time{margin-left:auto;font-weight:500}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}

/* table */
#table{position:absolute;left:calc(var(--gl) + 308px);right:var(--gr);bottom:14px;height:252px;padding:10px 6px 6px;z-index:20;display:flex;flex-direction:column;max-width:780px}
.tabs{display:flex;gap:4px;padding:0 8px 8px;align-items:center}
.tabs button{padding:5px 11px;border-radius:8px;color:var(--ink2);font-weight:500}
.tabs button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.tabs .live{margin-left:auto;font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px}
.tabs .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.tw{overflow:auto;flex:1;min-height:0}
#table.col{height:auto;padding-bottom:2px} #table.col .tw{display:none}
.tabs .tg{margin-left:8px;background:var(--chip);color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:5px 10px;background:transparent;white-space:nowrap}
td{padding:5px 10px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer} tbody tr:hover td,tbody tr.sel td{background:var(--acc-soft)}
td .pill{font-size:11px;padding:2px 8px}
td:first-child{font-weight:600}

#label{position:absolute;left:0;top:0;z-index:15;pointer-events:none;padding:5px 10px;border-radius:10px;font-weight:600;white-space:nowrap;transform:translate(-50%,-100%);will-change:transform}
#label small{font-weight:500;color:var(--ink2);margin-left:6px}
#hint{position:absolute;right:var(--gr);bottom:250px;z-index:10;padding:6px 11px;border-radius:99px;font-size:11.5px;color:var(--ink2);pointer-events:none}
#mbar{display:none}
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--sky);z-index:99;font:600 15px var(--f-d);color:var(--ink2);transition:opacity .5s}

@media (max-width:1180px){ .logo span{display:none} .clock small{display:none} .areas button{padding:0 8px} .user{display:none} }
@media (max-width:1020px){
  #top{height:auto;flex-wrap:wrap;padding:9px 10px;row-gap:8px}
  .areas{order:9;flex:1 1 100%;overflow-x:auto;scrollbar-width:none} .areas::-webkit-scrollbar{display:none}
  #kpis{top:118px} #detail{top:118px;max-height:calc(100% - 118px - 282px)}
}
@media (max-width:760px){
  #top{top:8px}
  .logo b{font-size:15px} .search{flex:1 1 60px} .search:focus-within{position:absolute;left:10px;right:10px;top:9px;max-width:none;z-index:5} .search:focus-within input{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)} .clock{display:none} .ib span{display:none}
  #kpis{top:112px;right:0;left:0;padding:0 var(--gr) 4px var(--gl);overflow-x:auto;scrollbar-width:none} #kpis::-webkit-scrollbar{display:none}
  .kpi{flex:none;width:158px;padding:10px 12px} .kpi .v{font-size:20px}
  #hint{display:none}
  #mbar{display:flex;position:absolute;left:var(--gl);right:var(--gr);bottom:max(10px, env(safe-area-inset-bottom, 0px));z-index:35;padding:4px;gap:4px}
  #mbar button{flex:1;height:36px;border-radius:11px;font-weight:600;color:var(--ink2)}
  #mbar button.on{background:var(--acc);color:#fff}
  #tracker,#table,#detail{left:var(--gl);right:var(--gr);width:auto;max-width:none;top:auto;bottom:calc(max(10px, env(safe-area-inset-bottom, 0px)) + 54px);max-height:46%;transform:translateY(calc(100% + 80px));transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:32}
  #table,#table.col{height:46%;padding-bottom:6px} #table.col .tw{display:block} .tabs .tg{display:none}
  #detail::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 8px}
  .show{transform:none !important}
}
@media (prefers-reduced-motion:reduce){ .steps li.now::before,.tabs .live::before{animation:none} }

/* earth-layer additions */
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
#ltags{position:absolute;inset:0;z-index:12;pointer-events:none;transition:opacity .3s}
.ltag{position:absolute;left:0;top:0;pointer-events:auto;padding:5px 11px 5px 9px;border-radius:99px;font:600 12.5px var(--f-d);white-space:nowrap;display:flex;align-items:center;gap:7px;will-change:transform}
.ltag i{width:10px;height:10px;border-radius:50%}
.ltag small{font:500 10.5px var(--f-b);color:var(--mute)}
.ltag:hover{background:var(--glass-b)}
.legend .lrow{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border-radius:9px;text-align:left}
.legend .lrow:hover,.arow:hover{background:var(--acc-soft)}
.legend .lrow i{width:11px;height:11px;border-radius:50%;flex:none}
.legend .lrow span{margin-left:auto;color:var(--mute);font-size:11.5px}
.eyebrow.sec{margin:14px 0 5px}
.arow{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:9px;margin:0 -8px;width:calc(100% + 16px)}
.arow b{display:block;font-weight:600}
.arow span{display:block;color:var(--ink2);font-size:12px}
.arow.back{margin-top:10px;border-top:1px solid var(--line);border-radius:0 0 9px 9px}
.jobs{margin:0;padding:0 0 0 16px;color:var(--ink2);display:grid;gap:4px}
.jobs li.now{color:var(--acc);font-weight:600}
#detail{max-height:calc(100% - 76px - 290px)}
@media (max-width:1020px){#detail{max-height:calc(100% - 118px - 290px)}}
@media (max-width:760px){#detail{max-height:52%} .ltag small{display:none}}

/* stack + worlds */
#fade{position:absolute;inset:0;z-index:14;opacity:0;pointer-events:none;transition:opacity .42s}
#fade.on{opacity:1}
.ltag{border-radius:14px;padding:7px 10px 7px 10px;gap:9px;text-align:left}
.ltag span{display:block} .ltag b{display:block;font:600 13px var(--f-d)} .ltag small{display:block;margin-top:1px}
.ltag em{font:600 11px var(--f-b);font-style:normal;color:var(--acc);background:var(--acc-soft);padding:3px 8px;border-radius:99px;margin-left:4px}
.seq{list-style:none;margin:0;padding:0;counter-reset:s}
.seq li{counter-increment:s;position:relative}
.seq li button{display:block;width:100%;text-align:left;padding:5px 8px 5px 34px;border-radius:9px}
.seq li button:hover{background:var(--acc-soft)}
.seq li::before{content:counter(s);position:absolute;left:4px;top:6px;width:21px;height:21px;border-radius:50%;background:var(--chip);font:600 11px/21px var(--f-d);text-align:center;color:var(--ink2);pointer-events:none}
.seq li:not(:last-child)::after{content:"";position:absolute;left:14px;top:28px;bottom:-5px;width:1.5px;background:var(--line)}
.seq li.now::before{background:var(--acc);color:#fff}
.seq b{display:block;font-weight:600} .seq span{display:block;color:var(--ink2);font-size:12px}
.arow.gate{margin:12px -8px 0;border:1px solid var(--line);border-radius:11px;padding:8px}
.arow em{font-style:normal;font-weight:600} em.ok{color:var(--ok)} em.bad{color:var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.nav button{padding:6px 10px;border-radius:9px;background:var(--chip);font-weight:500}
.nav button:hover{background:var(--acc-soft);color:var(--acc)}
.steps li[style]::before{background:var(--dot);border-color:var(--dot)}
#tracker{max-height:calc(100% - 150px);overflow:auto}
@media (max-width:760px){.ltag em,.ltag small{display:none} .ltag{padding:4px 9px;border-radius:99px} .ltag b{font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Live 3D view of the consent access layers"></canvas>
  <div id="fade"></div>
  <div id="ltags"></div>
  <div id="label" class="glass" hidden></div>

  <header id="top" class="glass">
    <div class="logo">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2.5 4.5 6v7.6c0 5.6 3.9 9.9 9.5 11.9 5.6-2 9.5-6.3 9.5-11.9V6L14 2.5Z" fill="#2563eb"/><path d="m9.6 14.2 3.1 3.1 5.9-6.2" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>DigiConsent</b><span>Access layers · who protects the user</span></div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search layers, agents, stations" autocomplete="off" aria-label="Search any object">
      <div id="qres" class="drop glass" hidden></div>
    </div>
    <nav class="areas" id="areas" aria-label="Layers"></nav>
    <div class="sp"></div>
    <div class="tb">
      <button class="ib" id="seasonBtn" aria-haspopup="true"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v6c0 4.6 3.2 7.8 7.5 9 4.3-1.2 7.5-4.4 7.5-9V6L12 3Z"/></svg><span id="seasonLbl">Normal day</span></button>
      <div id="seasonMenu" class="drop right glass" hidden></div>
    </div>
    <div class="clock num"><span id="clk">--:--:--</span><small id="dte"></small></div>
    <div class="tb">
      <button class="ib" id="alertBtn" aria-label="Alerts"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9ZM10 20a2.2 2.2 0 0 0 4 0"/></svg><b class="badge" id="alertN" hidden>0</b></button>
      <div id="alertMenu" class="drop right glass" hidden></div>
    </div>
    <button class="ib" id="dn" aria-label="Switch day and night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
    <div class="user" title="Ananya Rao, Onboarding RM">AR</div>
  </header>

  <div id="kpis" class="col" role="button" tabindex="0" aria-expanded="false" title="Show or hide KPI details">
    <div class="kpi glass"><div class="eyebrow">Spam blocked today</div><div class="v num" id="k1">0</div><div class="d num"><b id="k1d">0</b> stopped before the user</div></div>
    <div class="kpi glass"><div class="eyebrow">Consented delivered</div><div class="v num" id="k2">0</div><div class="d num"><b id="k2d">0%</b> of traffic had consent</div></div>
    <div class="kpi glass"><div class="eyebrow">Active consents</div><div class="v num" id="k3">0</div><div class="d num"><b id="k3d">0</b> revoked today</div></div>
  </div>

  <aside id="detail" class="glass" aria-live="off"></aside>

  <section id="tracker" class="glass">
    <div class="eyebrow">Access chain</div>
    <h3 id="trT">Chain</h3><div class="f num" id="trF"></div>
    <ol class="steps" id="trS"></ol>
  </section>

  <section id="table" class="glass col">
    <div class="tabs" id="tabs"></div>
    <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  </section>

  <nav id="mbar" class="glass"><button data-m="tracker">Sequence</button><button data-m="table">Live table</button><button data-m="detail">Details</button></nav>
  <div id="load">Building the layers…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
let seed = 7741;
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1)), pick = a => a[Math.floor(rnd() * a.length)];

canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; idle = 0; closeMenus();
  if (ptrs.size === 1) dragMode = (view < 0 || e.button === 2 || e.ctrlKey || e.shiftKey) ? 'rot' : 'pan'; else if (ptrs.size === 2) { dragMode = 'pinch'; pinch = pinchState(); } });
function pinchState() { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), a: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
function panBy(dx, dy) { if (view < 0) return; const s = 2 * cam.dist * Math.tan(camera.fov * Math.PI / 360) / app.clientHeight, rx = Math.cos(cam.az), rz = -Math.sin(cam.az), fx = -Math.sin(cam.az), fz = -Math.cos(cam.az), v = dy * s / Math.max(.3, Math.cos(cam.pol));
  goal.tx = clamp(goal.tx - dx * s * rx + v * fx, -60, 60); goal.tz = clamp(goal.tz - dx * s * rz + v * fz, -60, 60); cam.tx = goal.tx; cam.tz = goal.tz; follow = false; }
canvas.addEventListener('pointermove', e => { const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy); idle = 0;
  if (moved < 5) return; canvas.classList.add('drag');
  if (dragMode === 'pan') panBy(dx, dy);
  else if (dragMode === 'rot') { goal.az -= dx * .006; goal.pol = clamp(goal.pol - dy * .005, .25, view < 0 ? 1.75 : 1.42); }
  else if (dragMode === 'pinch' && ptrs.size === 2) { const n = pinchState(); goal.dist = clamp(goal.dist * pinch.d / Math.max(20, n.d), 40, 600); let da = n.a - pinch.a; da = Math.atan2(Math.sin(da), Math.cos(da)); goal.az -= da; panBy(n.mx - pinch.mx, n.my - pinch.my); pinch = n; } });
const ray = new T3.Raycaster(), ndc = new T3.Vector2();
function endPtr(e) { const had = ptrs.delete(e.pointerId); canvas.classList.remove('drag'); if (!had) return;
  if (moved < 6 && dragMode !== 'pinch' && e.type === 'pointerup') { const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(pickables, true).filter(h => !h.object.userData.nopick);
    if (view < 0) { const h = hits.find(h => h.object.userData.layer != null); if (h) setView(h.object.userData.layer); }
    else { const h = hits.find(h => h.object.userData.ent); if (h && !(hits[0].object.userData.ground && hits[0].distance < h.distance - 14)) select(h.object.userData.ent); else select(null); } }
  if (ptrs.size === 1) { dragMode = view < 0 ? 'rot' : 'pan'; moved = 99; } if (!ptrs.size) dragMode = null; }
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); idle = 0; goal.dist = clamp(goal.dist * Math.exp(e.deltaY * .0011), 40, 600); }, { passive: false });
addEventListener('keydown', e => { if (e.key === 'Escape') { if (sel) select(null); else setView(-1); closeMenus(); } });

const ring = new T3.Mesh(new T3.RingGeometry(.86, 1, 48), new T3.MeshBasicMaterial({ color: 0x2563EB, transparent: true, opacity: .95, depthWrite: false, side: T3.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.visible = false; ring.renderOrder = 6; scene.add(ring);
const ring2 = ring.clone(); ring2.material = ring.material.clone(); scene.add(ring2);
const labelEl = $('#label');
function select(e, refresh) {
  sel = e; follow = !!e; ring.visible = ring2.visible = !!e; labelEl.hidden = !e;
  if (e) { goal.dist = clamp(Math.min(goal.dist, 70 + e.rad * 5), 50, 600); labelEl.innerHTML = `${esc(e.name)}<small>${esc(e.type)}</small>`; if (isMobile()) showSheet('detail'); }
  if (refresh !== false) { uiDetail(true); uiTable(); }
}
function selUpdate(t) {
  if (!sel) return; const p = sel.wp(), x0 = p.x, z0 = p.z;
  ring.position.set(x0, .5, z0); ring.scale.setScalar(sel.rad * (1 + .06 * Math.sin(t * 4))); const w = (t * .8) % 1; ring2.position.set(x0, .5, z0); ring2.scale.setScalar(sel.rad * (1 + w * .7)); ring2.material.opacity = .7 * (1 - w);
  _v.set(x0, sel.hgt, z0).project(camera); labelEl.style.transform = `translate(${((_v.x * .5 + .5) * app.clientWidth).toFixed(1)}px,${((-_v.y * .5 + .5) * app.clientHeight).toFixed(1)}px) translate(-50%,-100%)`;
}
/* callouts beside each layer of the stack, like the labels on the model */
const ltags = $('#ltags'); const tagEls = LAYERS.map((L, i) => { const b = document.createElement('button'); b.className = 'ltag glass'; b.innerHTML = `<i style="background:${L.hex}"></i><span><b>${L.name}</b><small>${L.geo} · ${L.who}</small></span><em>Enter</em>`; b.onclick = () => setView(i); ltags.append(b); return b; });
function tagsUpdate() { const show = view < 0; ltags.style.opacity = show ? 1 : 0; ltags.style.pointerEvents = show ? '' : 'none'; if (!show) return; const mob = isMobile(), rx = Math.cos(cam.az), rz = -Math.sin(cam.az);
  LAYERS.forEach((L, i) => { const r = -(i === 4 ? 19 : R + 3) * (mob ? .2 : 1); _v.set(rx * r, L.y + (i === 0 ? 12 : 0), rz * r).project(camera); tagEls[i].style.transform = `translate(${((_v.x * .5 + .5) * app.clientWidth).toFixed(1)}px,${((-_v.y * .5 + .5) * app.clientHeight).toFixed(1)}px) translate(${mob ? '-50%' : 'calc(-100% - 14px)'},-50%)`; }); }

/* ───────── dashboard ───────── */
const areasEl = $('#areas'); [['Earth', -1], ...LAYERS.map((L, i) => [L.name, i])].forEach(([n, i]) => { const b = document.createElement('button'); b.textContent = n; b.dataset.a = i; b.onclick = () => setView(i); areasEl.append(b); });
function closeMenus(except) { ['#seasonMenu', '#alertMenu', '#qres'].forEach(s => { if (s !== except) $(s).hidden = true; }); }
const seasonMenu = $('#seasonMenu');
Object.entries(MODES).forEach(([k, s]) => { const b = document.createElement('button'); b.innerHTML = `${s.label}<small>${s.note}</small>`; b.dataset.s = k; b.onclick = () => setMode(k); seasonMenu.append(b); });
function setMode(k, quiet) { env.mode = k; $('#seasonLbl').textContent = MODES[k].label; seasonMenu.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === k)); seasonMenu.hidden = true; if (k === 'storm' && !quiet) alertPush('Spam storm: bulk senders and fake enterprises are hitting every layer. All five are holding', 'warn'); }
$('#seasonBtn').onclick = e => { e.stopPropagation(); closeMenus('#seasonMenu'); seasonMenu.hidden = !seasonMenu.hidden; };
function setNight(n) { env.nightGoal = n ? 1 : 0; document.documentElement.classList.toggle('night', !!n); $('#dn').setAttribute('aria-pressed', !!n); }
$('#dn').onclick = () => setNight(!env.nightGoal);
const alertMenu = $('#alertMenu');
function uiAlerts() { const b = $('#alertN'); b.hidden = !unread; b.textContent = unread; alertMenu.innerHTML = alerts.length ? alerts.map(a => `<div class="alert"><i class="${a.tone}"></i>${esc(a.text)}<time>${hms(a.t)}</time></div>`).join('') : '<div class="empty">No alerts yet.</div>'; }
$('#alertBtn').onclick = e => { e.stopPropagation(); closeMenus('#alertMenu'); alertMenu.hidden = !alertMenu.hidden; unread = 0; uiAlerts(); };
const q = $('#q'), qres = $('#qres');
function doSearch() { const s = q.value.trim().toLowerCase(); if (!s) { qres.hidden = true; return; } closeMenus('#qres');
  const r = ents.filter(e => !e.dead && e.kind !== 'actor' && (e.name + ' ' + e.type + ' ' + (e.agent || '')).toLowerCase().includes(s)).sort((a, b) => b.name.toLowerCase().includes(s) - a.name.toLowerCase().includes(s)).slice(0, 8);
  qres.innerHTML = r.length ? r.map(e => `<button data-id="${e.id}">${esc(e.name)}<small>${esc(e.type)}</small></button>`).join('') : '<div class="empty">Nothing matches. Try "onboarding", "scrub" or "rate card".</div>'; qres.hidden = false; }
q.addEventListener('input', doSearch); q.addEventListener('focus', doSearch);
q.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = qres.querySelector('button'); b && b.click(); } });
function pickId(id) { const e = ents[+id]; if (!e || e.dead) return; if (e.kind === 'layer') return setView(e.L.i); if (view !== e.L.i) { setView(e.L.i, true); } select(e); }
qres.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; pickId(b.dataset.id); qres.hidden = true; q.blur(); });
document.addEventListener('click', e => { if (!e.target.closest('.tb,.search')) closeMenus(); });

const detail = $('#detail');
const navRow = i => `<div class="nav">${i > 0 ? `<button data-v="${i - 1}">↑ ${LAYERS[i - 1].name}</button>` : ''}${i < 4 ? `<button data-v="${i + 1}">↓ ${LAYERS[i + 1].name}</button>` : ''}<button data-v="-1">Whole earth</button></div>`;
function uiDetail(force) {
  if (!sel && view < 0) { if (force || !detail.dataset.intro) { detail.dataset.intro = 1; detail.innerHTML = `<div class="intro"><div class="eyebrow">Access layers</div><h2>Five layers stand between spam and the user</h2><p>The ecosystem is built like the earth. The user is the core. Every layer above lets the right ones in, keeps the wrong ones out, and has its own world of work.</p><ul class="legend">${LAYERS.map((L, i) => `<li><button class="lrow" data-v="${i}"><i style="background:${L.hex}"></i><b>${L.name}</b><span>${L.geo}</span></button></li>`).join('')}</ul><ul class="legend"><li><kbd>Click a layer</kbd> to go inside its world</li><li><kbd>Drag</kbd> to spin the earth, scroll to zoom</li><li><kbd>Red</kbd> spam, stopped at a layer</li><li><kbd>Blue</kbd> consented, reaches the user</li></ul></div>`; } return; }
  delete detail.dataset.intro;
  if (!sel) { const L = LAYERS[view], W = L.W;
    detail.innerHTML = `<div class="eyebrow"><i class="sw" style="background:${L.hex}"></i>${L.geo} · layer ${view + 1} of 5</div><h2>${L.name}</h2><div class="sub">${L.role}</div><dl class="rows num"><dt>Who</dt><dd>${L.who}</dd><dt>Keeps out</dt><dd>${L.stops}</dd></dl>
    <button class="arow gate" data-id="${W.gate.id}"><b>Gate · ${L.gate[0]}</b><span>${L.gate[1]}</span><span class="num"><em class="ok">${IN(W.admitted)} let in</em> · <em class="bad">${IN(W.rejected)} turned away</em></span></button>
    <div class="eyebrow sec">What happens here, in order</div><ol class="seq">${W.steps.map(s => `<li class="${s.cur ? 'now' : ''}"><button data-id="${s.id}"><b>${esc(s.name)}</b><span>${esc(s.agent)}${s.cur ? ' · working on ' + esc(s.cur.name) : ''}</span></button></li>`).join('')}</ol>${navRow(view)}`; return; }
  const i = sel.info(), st = i.status;
  detail.innerHTML = `<button class="x" aria-label="Close details">×</button><div class="eyebrow"><i class="sw" style="background:${sel.L.hex}"></i>${esc(sel.type)}</div><h2>${esc(sel.name)}</h2><div class="sub">${esc(i.sub)}</div><span class="pill ${st[1]}">${esc(st[0])}</span><dl class="rows num">${i.rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>${i.list ? `<div class="eyebrow sec">${i.list[0]}</div><ul class="jobs">${i.list[1].map(j => `<li class="${j[1] ? 'now' : ''}">${esc(j[0])}</li>`).join('')}</ul>` : ''}`;
}
detail.addEventListener('pointerdown', e => { const x = e.target.closest('.x'), a = e.target.closest('[data-id]'), v = e.target.closest('[data-v]'); if (x) select(null); else if (a) pickId(a.dataset.id); else if (v) setView(+v.dataset.v); });

function uiTracker(now) {
  if (view < 0) { $('#tracker .eyebrow').textContent = 'Protection today'; $('#trT').textContent = 'Stopped at each layer'; $('#trF').textContent = 'From the outside in';
    $('#trS').innerHTML = LAYERS.map(L => `<li class="done" style="--dot:${L.hex}">${L.name}<time class="num">${LK(L.blocked)}</time></li>`).join(''); return; }
  const L = LAYERS[view], W = L.W, lead = sel && sel.kind === 'actor' && !sel.dead ? sel : W.actors.filter(a => !a.state && !a.bad).sort((a, b) => b.s - a.s)[0];
  $('#tracker .eyebrow').textContent = 'Sequence'; $('#trT').textContent = lead ? lead.name : 'Waiting for the next ' + L.actor.toLowerCase(); $('#trF').textContent = lead ? (lead.s > 2 ? 'Step ' + (lead.s - 2) + ' of ' + L.steps.length : 'At the gate') + ' · ' + L.name : L.gate[0];
  const cur = lead ? lead.s - 3 : -2;
  $('#trS').innerHTML = [`<li class="${cur >= 0 ? 'done' : cur === -1 ? 'now' : ''}">${L.gate[0]}<time>Gate</time></li>`].concat(L.steps.map((s, k) => `<li class="${k < cur ? 'done' : k === cur ? 'now' : ''}">${s[0]}<time class="num">${k + 1}</time></li>`)).join('');
}
const TABS = { layers: ['Layers', ['Layer', 'Earth layer', 'Who', 'Keeps out', 'Stopped today']], steps: ['Steps', ['#', 'Step', 'Layer', 'Agent', 'Working on', 'Handled']], feed: ['Activity', ['Time', 'Layer', 'Event']] };
let tab = 'layers';
const tabsEl = $('#tabs'); tabsEl.innerHTML = Object.entries(TABS).map(([k, t]) => `<button data-t="${k}">${t[0]}</button>`).join('') + '<span class="live">Live</span><button class="tg" data-tg="1" aria-expanded="false">Expand</button>';
tabsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const tbl = $('#table'); if (b.dataset.tg) tbl.classList.toggle('col'); else { tab = b.dataset.t; tbl.classList.remove('col'); uiTable(); } const c = tbl.classList.contains('col'), tg = tabsEl.querySelector('.tg'); tg.textContent = c ? 'Expand' : 'Collapse'; tg.setAttribute('aria-expanded', !c); });
function uiTable() {
  tabsEl.querySelectorAll('button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#th').innerHTML = '<tr>' + TABS[tab][1].map(h => `<th>${h}</th>`).join('') + '</tr>'; let rows; const dot = L => `<i class="sw" style="background:${L.hex}"></i>`;
  if (tab === 'layers') rows = LAYERS.map(L => [L.ent, dot(L) + L.name, L.geo, L.who, L.stops, LK(L.blocked)]);
  else if (tab === 'steps') rows = (view < 0 ? worlds : [worlds[view]]).flatMap(W => W.steps.map(s => [s, s.k + 1, esc(s.name), dot(s.L) + s.L.name, s.agent, s.cur ? `<span class="pill">${esc(s.cur.name)}</span>` : '<span class="pill idle">Idle</span>', IN(s.done)]));
  else rows = feed.slice(0, 16).map(f => [LAYERS[f.li].ent, hms(f.t), dot(LAYERS[f.li]) + LAYERS[f.li].name, esc(f.text)]);
  $('#tb').innerHTML = rows.map(r => `<tr data-id="${r[0].id}" class="${sel === r[0] ? 'sel' : ''}" tabindex="0">${r.slice(1).map(c => `<td class="num">${c}</td>`).join('')}</tr>`).join('');
}
$('#tb').addEventListener('pointerdown', e => { const r = e.target.closest('tr'); if (r) pickId(r.dataset.id); });
$('#tb').addEventListener('keydown', e => { if (e.key === 'Enter') { const r = e.target.closest('tr'); if (r) pickId(r.dataset.id); } });
function uiKpi() { $('#k1').textContent = CR(K.blocked); $('#k1d').textContent = IN(worlds.reduce((a, W) => a + W.rejected, 0)) + ' bad actors'; $('#k2').textContent = CR(K.delivered); $('#k2d').textContent = (K.delivered / (K.delivered + K.blocked) * 100).toFixed(1) + '%'; $('#k3').textContent = CR(K.active); $('#k3d').textContent = IN(K.revoked); }
function uiClock(now) { const d = new Date(now); $('#clk').textContent = d.toLocaleTimeString('en-GB'); $('#dte').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · Mumbai'; }
const kpisEl = $('#kpis'), kpiToggle = () => kpisEl.setAttribute('aria-expanded', !kpisEl.classList.toggle('col'));
kpisEl.addEventListener('click', kpiToggle); kpisEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); kpiToggle(); } });
function showSheet(k) { sheet = k; ['tracker', 'table', 'detail'].forEach(id => $('#' + id).classList.toggle('show', id === k)); document.querySelectorAll('#mbar button').forEach(b => b.classList.toggle('on', b.dataset.m === k)); fit(); }
$('#mbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showSheet(sheet === b.dataset.m ? null : b.dataset.m); });

/* ───────── loop ───────── */
let last = performance.now(), uiA = 0, uiB = 0, time = 0;
function step(dt) { time += dt; simStack(dt); for (const W of worlds) simWorld(W, dt); }
function frame(nowP) {
  const dt = Math.min(.05, (nowP - last) / 1000); last = nowP; const now = Date.now();
  step(dt); simEnv(dt); camUpdate(dt); selUpdate(time); tagsUpdate();
  renderer.render(scene, camera);
  uiA += dt; uiB += dt;
  if (uiA > .3) { uiA = 0; uiDetail(); uiKpi(); }
  if (uiB > 1) { uiB = 0; uiClock(now); uiTracker(now); uiTable(); }
  requestAnimationFrame(frame);
}
addEventListener('resize', fit); fit();
for (let i = 0; i < 500; i++) step(.05);
alerts.length = 0; unread = 0; feed.length = Math.min(feed.length, 12);
alertPush('Jio: rate card for migration, acquisition and scrubbing assigned to Karix', 'ok');
alertPush('Onboarding stopped QuickLoan 247: No DLT registration found', 'warn');
setMode('normal', true); setView(-1, true); view = -2; setView(-1, true); uiAlerts(); uiKpi(); uiClock(Date.now());
window.__dc = { env, step, ents, LAYERS, worlds, select, setView, setMode, setNight, cam, goal, get view() { return view; } };
requestAnimationFrame(t => { last = t; frame(t); $('#load').style.opacity = 0; setTimeout(() => $('#load').remove(), 600); });
}
const go = () => { try { start(); } catch (e) { console.error(e); $('#load').textContent = 'Something went wrong while building the world: ' + e.message; } };
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(go, go);
})();
</script>
