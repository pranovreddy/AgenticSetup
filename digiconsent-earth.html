<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>DigiConsent Access Layers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one 3D stage. Logo top left, layer switch top centre, state switch along the bottom, one caption card. Single light look by design. */
:root{
  --bg:#eef2f8; --ink:#0b1b3f; --ink2:#4a5a7e; --mute:#8391ae; --acc:#2563eb; --acc-soft:rgba(37,99,235,.1);
  --glass:rgba(255,255,255,.72); --glass-b:rgba(255,255,255,.9); --line:rgba(11,27,63,.09); --chip:rgba(11,27,63,.05);
  --ok:#0f8a5f; --bad:#d23c3c; --shadow:0 12px 36px rgba(20,40,90,.12);
  --f-d:'Space Grotesk','Inter',system-ui,sans-serif; --f-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.45 var(--f-b);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;background:radial-gradient(1100px 720px at 50% 42%,#ffffff 0%,#eef2f8 58%,#dfe6f1 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow)}
.num{font-variant-numeric:tabular-nums}
#fade{position:absolute;inset:0;z-index:14;opacity:0;pointer-events:none;transition:opacity .4s;background:#f4f7fb}
#fade.on{opacity:1}
.logo{position:absolute;top:16px;left:var(--gl);z-index:30;display:flex;align-items:center;gap:9px;padding:8px 14px 8px 10px;border-radius:14px}
.logo svg{width:26px;height:26px}
.logo b{font:700 16px/1 var(--f-d);letter-spacing:-.01em}
/* switch 1: access layers */
#layers{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:4px;border-radius:14px;max-width:calc(100% - 2*var(--gl))}
#layers button{height:34px;padding:0 13px;border-radius:10px;font-weight:500;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .25s,color .25s}
#layers button i{width:9px;height:9px;border-radius:50%;flex:none}
#layers button:hover{color:var(--ink)}
#layers button.on{background:var(--ink);color:#fff}
/* switch 2: states */
#states{position:absolute;left:50%;transform:translateX(-50%);bottom:max(16px, env(safe-area-inset-bottom, 0px));z-index:30;display:flex;align-items:center;gap:6px;padding:6px;border-radius:18px;max-width:calc(100% - 2*var(--gl))}
#states .nb{width:34px;height:34px;border-radius:11px;background:var(--chip);flex:none;display:grid;place-items:center}
#states .nb:hover{background:var(--acc-soft);color:var(--acc)}
#states .nb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;min-width:0}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:12px;text-align:left;transition:background .25s,color .25s}
#chips button:hover{background:var(--chip)}
#chips em{font:600 11px/22px var(--f-d);font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--chip);text-align:center;flex:none;color:var(--ink2)}
#chips small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;line-height:1.2}
#chips b{display:block;font-weight:600;white-space:nowrap;line-height:1.25}
#chips button.done em{background:var(--acc-soft);color:var(--acc)}
#chips button.on{background:var(--acc);color:#fff}
#chips button.on small{color:rgba(255,255,255,.75)} #chips button.on em{background:rgba(255,255,255,.22);color:#fff}
/* caption */
#cap{position:absolute;left:var(--gl);bottom:calc(max(16px, env(safe-area-inset-bottom, 0px)) + 66px);z-index:25;width:340px;max-width:calc(100% - 2*var(--gl));padding:16px 18px;border-radius:18px;transition:opacity .3s,transform .3s}
#cap.swap{opacity:0;transform:translateY(8px)}
#cap .day{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--acc)}
#cap h2{font:700 21px/1.2 var(--f-d);letter-spacing:-.01em;margin:5px 0 6px;text-wrap:balance}
#cap p{margin:0;color:var(--ink2);font-size:13.5px}
#cap .meta{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:12px}
#cap .meta b{color:var(--ink);font-weight:600} #cap .meta .ok{color:var(--ok)} #cap .meta .bad{color:var(--bad)}
#cap .go{margin-top:12px;height:34px;padding:0 14px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600}
#cap .go:hover{background:var(--acc)}
/* callouts beside the layers */
#ltags{position:absolute;inset:0;z-index:12;pointer-events:none;transition:opacity .4s}
.ltag{position:absolute;left:0;top:0;pointer-events:auto;padding:6px 12px 6px 10px;border-radius:12px;display:flex;align-items:center;gap:8px;white-space:nowrap;will-change:transform;transition:opacity .4s}
.ltag i{width:10px;height:10px;border-radius:50%}
.ltag b{font:600 13px var(--f-d)} .ltag small{color:var(--mute);font-size:11.5px}
.ltag.dim{opacity:.5}
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:99;font:600 15px var(--f-d);color:var(--ink2);transition:opacity .5s}
@media (max-width:900px){
  #layers{top:66px;overflow-x:auto;scrollbar-width:none;justify-content:flex-start} #layers::-webkit-scrollbar{display:none}
  #layers button{padding:0 11px}
  #cap{width:auto;right:var(--gr);padding:13px 15px} #cap h2{font-size:18px}
  .ltag small{display:none} .ltag{padding:4px 10px 4px 8px}
}
@media (prefers-reduced-motion:reduce){ #fade,#cap{transition:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="3D view of the consent access layers"></canvas>
  <div id="fade"></div>
  <div id="ltags"></div>
  <div class="logo glass">
    <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2.5 4.5 6v7.6c0 5.6 3.9 9.9 9.5 11.9 5.6-2 9.5-6.3 9.5-11.9V6L14 2.5Z" fill="#2563eb"/><path d="m9.6 14.2 3.1 3.1 5.9-6.2" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b>DigiConsent</b>
  </div>
  <nav id="layers" class="glass" aria-label="Access layers"></nav>
  <aside id="cap" class="glass" aria-live="polite"></aside>
  <nav id="states" class="glass" aria-label="States">
    <button class="nb" id="prev" aria-label="Previous state"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <div id="chips"></div>
    <button class="nb" id="next" aria-label="Next state"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    <button class="nb" id="play" aria-label="Play or pause"></button>
  </nav>
  <div id="load">Building the layers…</div>
</div>

/* ───────── views, states, camera ───────── */
const AZ0 = -2.2; const cam = { tx: 0, ty: 6, tz: 0, dist: 200, az: AZ0, pol: 1.25 }, goal = Object.assign({}, cam);

const nearAz = a => { let d = a - cam.az; d = Math.atan2(Math.sin(d), Math.cos(d)); return cam.az + d; };
function aim() {

const cap = $('#cap'); let capT = 0;

    if (ws === 0) h = `<div class="day">${L.gate[1]} · Gate</div><h2>${L.gate[0]}</h2><p>${L.gate[2]}</p><div class="meta num"><span class="ok"><b class="ok">${IN(W.admitted)}</b> let in</span><span class="bad"><b class="bad">${IN(W.rejected)}</b> stopped</span>${W.lastBad ? `<span>Last: <b>${esc(W.lastBad[0])}</b>, ${esc(W.lastBad[1].toLowerCase())}</span>` : ''}</div>`;
    else { const s = L.steps[ws - 1], st = W.steps[ws - 1]; h = `<div class="day">${s[1]} · Step ${ws} of ${L.steps.length}</div><h2>${s[0]}</h2><p>${s[2]}</p><div class="meta"><span><b>${s[3]}</b></span><span>${st.cur ? 'Working on <b>' + esc(st.cur.name) + '</b>' : 'Waiting for the next ' + L.actor}</span></div>`; } }

cap.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) setView(+b.dataset.go); });
const chips = $('#chips');

  chips.innerHTML = list.map((c, k) => `<button data-s="${k}"><em>${view < 0 ? (k || '•') : (k || '⛨')}</em><span><small>${c[0]}</small><b>${c[1]}</b></span></button>`).join(''); markChips(); }
function markChips() { const cur = view < 0 ? os : ws; chips.querySelectorAll('button').forEach((b, k) => { b.classList.toggle('on', k === cur); b.classList.toggle('done', k < cur); if (k === cur) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); }); }
const nStates = () => view < 0 ? OV.length : LAYERS[view].steps.length + 1;
function setState(k, auto) { const n = nStates(); k = ((k % n) + n) % n; if (!auto) setPlay(false); playT = 0;
  if (view < 0) { const prev = os; os = k; const hi = OV[k][3]; if (hi >= 0) { const y1 = hi === 4 ? 9 : LAYERS[hi].ey + LAYERS[hi].R * .5, y0 = prev > 0 && OV[prev][3] < hi ? (OV[prev][3] === 4 ? 9 : LAYERS[OV[prev][3]].ey + 6) : y1 + 60; tok = { u: prev === 0 ? -.9 : 0, y0, y1, to: hi }; } else tok = null; }
  else ws = k;

chips.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setState(+b.dataset.s); });
$('#prev').onclick = () => setState((view < 0 ? os : ws) - 1); $('#next').onclick = () => setState((view < 0 ? os : ws) + 1);
const playB = $('#play');
function setPlay(p) { playing = p; playT = 0; playB.innerHTML = p ? '<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; playB.setAttribute('aria-pressed', p); }
playB.onclick = () => setPlay(!playing);
const layersEl = $('#layers'); [['Overview', -1, '#8391ae'], ...LAYERS.map((L, i) => [L.name, i, L.hex])].forEach(([n, i, c]) => { const b = document.createElement('button'); b.innerHTML = `<i style="background:${c}"></i>${n}`; b.dataset.a = i; b.onclick = () => setView(i); layersEl.append(b); });
const fade = $('#fade');
function setView(i, instant) {
  if (i === view) { if (i >= 0) setState(0); return; }
  const go = () => { view = i; ovG.visible = i < 0; worlds.forEach((W, k) => W.g.visible = k === i); ws = 0;
    layersEl.querySelectorAll('button').forEach(b => { const on = +b.dataset.a === i; b.classList.toggle('on', on); if (on) b.scrollIntoView({ block: 'nearest', inline: 'center' }); });
    if (i < 0) { explode = os > 0 ? 1 : 0; aim(); goal.az = AZ0; Object.assign(cam, goal, { dist: goal.dist * .75 }); } else { setPlay(false); aim(); Object.assign(cam, goal, { tx: 0, tz: 0, dist: 230 * asp(), pol: .7 }); }
    buildChips(); caption(); };
  if (instant) return go();
  if (view < 0 && i >= 0) { goal.ty = i === 4 ? 9 : LAYERS[i].y + 8; goal.dist = 90; }
  fade.classList.add('on'); setTimeout(() => { go(); fade.classList.remove('on'); }, 400);

function camUpdate(dt) {
  idle += dt; if (view < 0 && idle > 2.5 && !ptrs.size) goal.az = lerp(goal.az, nearAz(AZ0 + Math.sin(time * .22) * .5), dt * 1.5);
  const k = 1 - Math.exp(-dt * 3.2); for (const f of ['tx', 'ty', 'tz', 'dist', 'pol', 'az']) cam[f] = lerp(cam[f], goal[f], k);

  if (view >= 0) { const ss = clamp(cam.dist / 95, .75, 1.9); worlds[view].g.traverse(o => { if (o.userData.label) o.scale.copy(o.userData.b).multiplyScalar(ss / (o.parent.scale.x || 1)); }); }
  for (const b of burstS) { if (b.age > .6) { b.s.visible = false; continue; } b.age += dt; const u = b.age / .6; b.s.scale.setScalar(b.size * (.4 + u)); b.s.material.opacity = (1 - u) * .8; }

const ptrs = new Map(); let moved = 0, pinch = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());

    if (view < 0) { const h = ray.intersectObjects(ovPick, false).sort((a, b) => (LAYERS[b.object.userData.layer].op > .5) - (LAYERS[a.object.userData.layer].op > .5) || a.distance - b.distance)[0]; if (h) { if (os === 0) setState(h.object.userData.layer + 1); else setView(h.object.userData.layer); } }
    else { const h = ray.intersectObjects(worlds[view].pick, false)[0]; if (h) setState(h.object.userData.state); } } }
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);

addEventListener('keydown', e => { if (e.key === 'ArrowRight') setState((view < 0 ? os : ws) + 1); else if (e.key === 'ArrowLeft') setState((view < 0 ? os : ws) - 1); else if (e.key === 'Escape') setView(-1); });

const ltags = $('#ltags'); const tagEls = LAYERS.map((L, i) => { const b = document.createElement('button'); b.className = 'ltag glass'; b.innerHTML = `<i style="background:${L.hex}"></i><b>${L.name}</b><small>${L.who}</small>`; b.onclick = () => setView(i); ltags.append(b); return b; });
const _v = new T3.Vector3();
function tagsUpdate() { const show = view < 0 && explode > .6; ltags.style.opacity = show ? 1 : 0; ltags.style.pointerEvents = show ? '' : 'none'; if (!show) return; const mob = innerWidth <= 900, rx = Math.cos(cam.az), rz = -Math.sin(cam.az), hi = OV[os][3];
  LAYERS.forEach((L, i) => { const r = -(L.R + 4) * (mob ? 0 : 1); _v.set(rx * r, i === 4 ? 9 : L.y + L.R * .45, rz * r).project(camera); tagEls[i].classList.toggle('dim', hi !== i); tagEls[i].style.transform = `translate(${((_v.x * .5 + .5) * app.clientWidth).toFixed(1)}px,${((-_v.y * .5 + .5) * app.clientHeight).toFixed(1)}px) translate(${mob ? '-50%' : 'calc(-100% - 12px)'},-50%)`; }); }

/* ───────── loop ───────── */
let last = performance.now(), uiA = 0;

addEventListener('resize', () => { fit(); aim(); }); fit();
for (let i = 0; i < 500; i++) step(.05);
setPlay(true); setView(0, true); view = -2; setView(-1, true); capFill(true);
window.__dc = { step, LAYERS, worlds, setView, setState, setPlay, cam, goal, get view() { return view; }, get os() { return os; }, get ws() { return ws; } };
