<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ConsentOS Graph Intelligence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* Layout: a slim blue-washed top bar (name and three numbers), one open canvas for the graph, and one panel on
   the right that shows the key findings and turns into the node's profile when a node is selected.
   Colour is reserved for risk; node types are told apart by icon and size, never by hue. */
:root{
  color-scheme:light;
  --s-ink:#0f1b3d; --s-ink2:#35466a; --s-muted:#5b6b8c; --s-faint:#8a96ad;
  --s-line:#e6ebf3; --s-line2:#d9e0ec; --s-blue:#2563eb; --s-soft:#eef3ff;
  --s-canvas:#f6f8fc; --s-white:#fff;
  --tint-1:#dfe9ff; --tint-2:#ecf2ff; --tint-3:#f5f8ff; --tint-line:#d5e0f8;
  --r-low:#0f8a5f;  --r-low-soft:#e5f6ee;  --r-low-ring:#1aa772;
  --r-med:#a55a05;  --r-med-soft:#fff4e0;  --r-med-ring:#e0a020;
  --r-high:#c2410c; --r-high-soft:#fff1e6; --r-high-ring:#e8662a;
  --r-crit:#b42318; --r-crit-soft:#fdecec; --r-crit-ring:#d92d20;
  --r-black:#0f1b3d; --r-black-soft:#e9edf5;
  --node-line:#c3cde0; --link:#c9d2e3;
  --shadow:0 18px 40px -22px rgba(15,27,61,.35);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --font:Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--s-canvas);color:var(--s-ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--s-blue);outline-offset:2px;border-radius:8px}
h6{margin:0 0 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--s-faint);font-weight:600}

.shell{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 348px;grid-template-rows:auto minmax(0,1fr)}

/* top bar: blue wash */
.topb{grid-column:1/-1;display:flex;align-items:center;gap:16px;min-height:56px;padding:10px 20px;
  background:linear-gradient(90deg,var(--tint-1) 0,var(--tint-2) 45%,var(--tint-3) 100%);border-bottom:1px solid var(--tint-line)}
.lg{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;white-space:nowrap}
.lg svg{width:20px;height:20px;color:var(--s-blue)}
.topb h1{margin:0;padding-left:16px;border-left:1px solid var(--tint-line);font-size:15px;font-weight:600;letter-spacing:-.01em}
.stats{margin-left:auto;display:flex;gap:22px}
.stat{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.stat b{font-size:18px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--s-muted)}
.stat.crit b{color:var(--r-crit)}

/* key findings (default content of the right panel) */
.dtitle{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:-.015em}
.dlead{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--s-muted)}
.frow{display:flex;align-items:flex-start;gap:10px;border:0;background:none;text-align:left;cursor:pointer;
  padding:10px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:10px;font-size:13.5px;font-weight:500;transition:background .15s}
.frow:hover{background:rgba(37,99,235,.06)}
.frow.on{background:var(--s-soft);box-shadow:inset 0 0 0 1px #cfdcfb}
.frow small{display:block;font-size:12.5px;font-weight:400;color:var(--s-muted);margin-top:1px}
.frow .sev{width:8px;height:8px;border-radius:50%;flex:none;margin:6px 2px 0}

/* graph canvas */
.graph{position:relative;min-width:0;min-height:0;overflow:hidden}
#gsvg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#gsvg:active{cursor:grabbing}
.lnk{stroke:var(--link);stroke-width:1.3;transition:opacity .2s,stroke .2s}
.lnk.lit{stroke:var(--s-blue);stroke-width:1.8}
.lnk.dim{opacity:.18}
.nd{cursor:pointer;transition:opacity .2s;outline:none}
.nd.dim{opacity:.2}
.nd .ring{fill:none;stroke:var(--s-blue);stroke-opacity:0;stroke-width:4;transition:stroke-opacity .2s}
.nd.sel .ring,.nd:focus-visible .ring{stroke-opacity:.35}
.nd .halo{fill:none;stroke-width:6;stroke-opacity:.14}
.nd .disc{fill:var(--s-white);stroke:var(--node-line);stroke-width:1.5}
.nd .ic{fill:none;stroke:var(--s-ink2);stroke-linecap:round;stroke-linejoin:round}
.nd text{font:11px var(--font);fill:var(--s-muted);text-anchor:middle;paint-order:stroke;stroke:var(--s-canvas);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.nd text .l1{fill:var(--s-ink2);font-weight:500}
.nd text .l2{display:none}
.nd.ent text .l2,.nd.foc text .l2,.nd:hover text .l2{display:inline}
.nd.ent text .l1{fill:var(--s-ink);font-weight:600}
.nd.ent text{font-size:11.5px}
.nd.t-low.ent .disc{fill:var(--r-low-soft);stroke:var(--r-low-ring)}       .nd.t-low.ent .ic{stroke:var(--r-low)}
.nd.t-medium .disc{fill:var(--r-med-soft);stroke:var(--r-med-ring)}         .nd.t-medium .ic{stroke:var(--r-med)}
.nd.t-high .disc{fill:var(--r-high-soft);stroke:var(--r-high-ring)}         .nd.t-high .ic{stroke:var(--r-high)}
.nd.t-critical .disc{fill:var(--r-crit-soft);stroke:var(--r-crit-ring);stroke-width:2} .nd.t-critical .ic{stroke:var(--r-crit)}
.nd.t-critical .halo{stroke:var(--r-crit-ring)}
.nd.t-blacklisted .disc{fill:var(--r-black);stroke:var(--r-black)}          .nd.t-blacklisted .ic{stroke:#fff}
.nd.t-blacklisted.ent .halo{stroke:var(--r-black)}

/* canvas controls */
.tools{position:absolute;left:16px;top:16px;display:flex;gap:8px;z-index:3}
.tbtn,.zg{background:var(--s-white);border:1px solid var(--s-line2);border-radius:10px;box-shadow:0 6px 18px -12px rgba(15,27,61,.3)}
.tbtn{height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--s-ink2);cursor:pointer}
.tbtn:hover,.tbtn[aria-expanded="true"]{color:var(--s-blue);border-color:#b9cdfa}
.tbtn .cnt{font-weight:500;color:var(--s-faint);font-variant-numeric:tabular-nums}
.tbtn.part .cnt{color:var(--s-blue);font-weight:600}
.zg{display:flex;overflow:hidden}
.zg button{width:36px;height:34px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--s-ink2)}
.zg button+button{border-left:1px solid var(--s-line)}
.zg button:hover{background:var(--s-soft);color:var(--s-blue)}
.pop{position:absolute;left:0;top:44px;width:312px;max-width:calc(100vw - 32px);background:var(--s-white);border:1px solid var(--s-line2);
  border-radius:14px;box-shadow:var(--shadow);padding:12px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px}
.pop-h h6{margin:0}
.pop-h button{border:0;background:none;padding:0;color:var(--s-blue);font-size:12.5px;font-weight:600;cursor:pointer}
.pop-g{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.ty{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;cursor:pointer;padding:7px 8px;border-radius:8px;font-size:13px;color:var(--s-ink)}
.ty:hover{background:var(--s-canvas)}
.ty svg.i{color:var(--s-blue)}
.ty .n{margin-left:auto;font-size:12px;color:var(--s-faint);font-variant-numeric:tabular-nums}
.ty[aria-pressed="false"]{color:var(--s-faint)}
.ty[aria-pressed="false"] svg.i{color:#b6c0d2}
.ty[aria-pressed="false"] span:first-of-type{text-decoration:line-through}

.risk{position:absolute;left:16px;bottom:16px;right:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;z-index:2;pointer-events:none}
.risk>*{pointer-events:auto}
.risk .lab{font-size:12px;color:var(--s-muted);margin-right:4px}
.rp{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--s-line2);
  background:var(--s-white);font-size:12.5px;color:var(--s-ink2);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.rp i{width:9px;height:9px;border-radius:50%;flex:none}
.rp .n{color:var(--s-faint);font-variant-numeric:tabular-nums}
.rp:hover{border-color:#b9cdfa}
.rp.on{background:var(--s-soft);border-color:var(--s-blue);color:var(--s-blue);font-weight:600}
.rp.on .n{color:inherit}

#tip{position:absolute;z-index:5;pointer-events:none;opacity:0;transition:opacity .12s;max-width:220px;
  background:var(--s-white);border:1px solid var(--s-line2);border-radius:10px;padding:9px 11px;font-size:12.5px;box-shadow:var(--shadow)}
#tip.on{opacity:1}
#tip b{display:block;font-weight:600;margin-bottom:5px}
#tip small{color:var(--s-muted);font-size:12px;margin-left:6px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.3;padding:3px 10px;
  border-radius:999px;white-space:nowrap;background:var(--r-black-soft);color:var(--s-ink2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.t-low{background:var(--r-low-soft);color:var(--r-low)}
.chip.t-medium{background:var(--r-med-soft);color:var(--r-med)}
.chip.t-high{background:var(--r-high-soft);color:var(--r-high)}
.chip.t-critical{background:var(--r-crit-soft);color:var(--r-crit)}
.chip.t-blacklisted{background:var(--r-black);color:#fff}

/* right panel: findings, or the selected node */
.detail{min-height:0;overflow:auto;padding:20px 20px 16px;border-left:1px solid var(--s-line);
  background:linear-gradient(180deg,var(--tint-2) 0,var(--s-white) 150px) var(--s-white)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;margin:0 0 14px -4px;
  color:var(--s-blue);font-weight:600;font-size:13px;cursor:pointer}
.dh{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px}
.dh .tile{width:40px;height:40px;border-radius:12px;background:var(--s-soft);color:var(--s-blue);display:grid;place-items:center;flex:none}
.dh .tile svg.i{width:19px;height:19px}
.dh .tx{flex:1;min-width:0}
.dh h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.dh .sub{font-size:12.5px;color:var(--s-muted);margin:2px 0 8px}
.sec{border-top:1px solid var(--s-line);padding:14px 0}
.sec p{margin:0;font-size:13.5px;line-height:1.6;color:var(--s-ink2)}
.sec p.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;padding:0;margin-top:6px;color:var(--s-blue);font-size:13px;font-weight:600;cursor:pointer}
.met{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 12px}
.met+.met{margin-top:14px}
.met .k{font-size:13px;color:var(--s-muted)}
.met .v{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.met .v small{font-size:12px;font-weight:500;color:var(--s-faint);letter-spacing:0}
.met .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--s-line);overflow:hidden;margin-top:4px}
.met .bar i{display:block;height:100%;border-radius:2px}
.met .note{grid-column:1/-1;font-size:12.5px;color:var(--s-muted);margin-top:4px}
.row{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;cursor:pointer;
  padding:9px 8px;margin:0 -8px;width:calc(100% + 16px);font-size:13.5px;color:var(--s-ink)}
.row+.row{border-top:1px solid var(--s-line)}
.row:hover{background:var(--s-canvas)}
.row svg.i{color:#7c89a3}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:900px){
  body{overflow:auto}
  .shell{display:block;height:auto}
  .topb{flex-wrap:wrap;gap:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stats{margin-left:0;width:100%;gap:18px}
  .graph{height:64vh;min-height:400px;border-bottom:1px solid var(--s-line)}
  .detail{border-left:0;padding:18px 16px 28px}
  .risk .lab{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">
  <header class="topb">
    <div class="lg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5 20.2 7.2v9.6L12 21.5 3.8 16.8V7.2z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>
      ConsentOS

      </div>
    </div>
    <div class="risk" id="riskList"></div>
    <div id="tip"></div>

  <aside class="detail" id="det" aria-live="polite"></aside>
</div>

  { sev:"critical", t:"Coordinated shell network", s:"3 enterprises share one director", ids:["d1","e2","e3","e4"] },
  { sev:"critical", t:"Address farm", s:"3 entities registered at a single address", ids:["a1","e2","e3","e4"] },
  { sev:"critical", t:"Blacklisted CTA domains", s:"3 domains in active DLT templates", ids:["cta1","cta2","cta3","e3","e4","e5"] },
  { sev:"medium",   t:"Director Rajesh Kumar", s:"Spans high and critical entities", ids:["d1","e3","e4"] },
  { sev:"medium",   t:"Brand impersonation confirmed", s:"YONO and Lotus365", ids:["b1","b2","cta2","e3","e5"] },
  { sev:"medium",   t:"Template similarity", s:"Across 3 nominally independent entities", ids:["t1","e2","e3","e4"] },
];

// ───────────────────────────── CONFIG ─────────────────────────────
const TYPES = {
  enterprise:{ label:"Enterprise",  r:26, d:"M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7.5h4M8 11.5h4M8 15.5h4" },
  director:  { label:"Director",    r:17, d:"M20 21a8 8 0 0 0-16 0M16 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0z" },
  address:   { label:"Address",     r:17, d:"M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM14.5 10a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z" },
  pan:       { label:"PAN",         r:17, d:"M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM6.5 15.5c.6-1.3 1.6-2 2.5-2s1.9.7 2.5 2M10.5 10a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM15 10h3M15 14h3" },
  cta:       { label:"CTA domain",  r:17, d:"M10 13a5 5 0 0 0 7.1 0l3-3A5 5 0 0 0 13 2.9l-1.2 1.2M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1.2-1.2" },
  header:    { label:"DLT header",  r:17, d:"M12 13v8M12 11h.01M8.5 14.5a5 5 0 0 1 0-7M15.5 7.5a5 5 0 0 1 0 7M5.6 17.4a9 9 0 0 1 0-12.8M18.4 4.6a9 9 0 0 1 0 12.8" },
  template:  { label:"Template",    r:17, d:"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6" },
  brand:     { label:"Brand",       r:17, d:"M3 11.5V4a1 1 0 0 1 1-1h7.5l9 9-8.5 8.5zM7.5 7.5h.01" },
  complaint: { label:"Complaints",  r:17, d:"M12 4 2.5 20h19zM12 10v4M12 17h.01" },
  traffic:   { label:"DLT traffic", r:17, d:"M4 20V11M10 20V4M16 20v-7M21 20H3" },
};
const TIER_OF = { blacklisted:"blacklisted", critical:"critical", high:"high", flagged:"high", farm:"high",
                  medium:"medium", suspicious:"medium", low:"low", clean:"low" };
const STATUS = { blacklisted:"Blacklisted", critical:"Critical", high:"High risk", medium:"Medium", low:"Low",
                 clean:"Clean", suspicious:"Suspicious", flagged:"Flagged", farm:"Address farm" };
const TIERS = [
  { k:"blacklisted", label:"Blacklisted", c:"var(--r-black)" },
  { k:"critical",    label:"Critical",    c:"var(--r-crit-ring)" },
  { k:"high",        label:"High risk",   c:"var(--r-high-ring)" },
  { k:"medium",      label:"Medium",      c:"var(--r-med-ring)" },
  { k:"low",         label:"Low or clean",c:"var(--r-low-ring)" },
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const icon = t => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${TYPES[t].d}"/></svg>`;
const tier = d => TIER_OF[d.risk] || "low";
const chip = d => `<span class="chip t-${tier(d)}">${STATUS[d.risk] || d.risk}</span>`;
const flat = d => d.name.replace(/\n/g, " · ");
const R = d => TYPES[d.type].r;

const nodes = NODES.map(n => ({ ...n }));
const byId = new Map(nodes.map(n => [n.id, n]));
const links = LINKS.map(([s, t]) => ({ source:s, target:t }));
const adj = new Map(nodes.map(n => [n.id, []]));
LINKS.forEach(([s, t]) => { adj.get(s).push(t); adj.get(t).push(s); });

// ───────────────────────────── CHROME ─────────────────────────────
const ents = nodes.filter(n => n.type === "enterprise");
$("stats").innerHTML = [
  [ents.length, "Enterprises", ""],
  [ents.filter(n => n.risk === "blacklisted").length, "Blacklisted", ""],
  [ents.filter(n => n.risk === "critical").length, "Critical", "crit"],
].map(([v, l, c]) => `<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join("");

$("typeList").innerHTML = Object.entries(TYPES).map(([k, t]) =>
  `<button class="ty" data-type="${k}" aria-pressed="true">${icon(k)}<span>${t.label}</span><span class="n">${nodes.filter(n => n.type === k).length}</span></button>`).join("");
$("riskList").innerHTML = `<span class="lab">Highlight</span>` + TIERS.map(t =>
  `<button class="rp" data-tier="${t.k}" aria-pressed="false"><i style="background:${t.c}"></i>${t.label}<span class="n">${nodes.filter(n => tier(n) === t.k).length}</span></button>`).join("");

// ───────────────────────────── GRAPH ─────────────────────────────
const wrap = $("gwrap"), svg = d3.select("#gsvg"), tip = $("tip"), det = $("det");
const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([.3, 3]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id)
    .distance(l => l.target.type === "director" || l.target.type === "address" ? 140 : 105).strength(.4))
  .force("charge", d3.forceManyBody().strength(-680))
  .force("collide", d3.forceCollide().radius(d => R(d) + 30))
  .force("x", d3.forceX(0).strength(.075))
  .force("y", d3.forceY(0).strength(.05))
  .stop();
for (let i = 0; i < 320; i++) sim.tick();

const linkSel = g.append("g").selectAll("line").data(links).join("line").attr("class", "lnk");

const nodeSel = g.append("g").selectAll("g").data(nodes).join("g")
  .attr("class", d => `nd t-${tier(d)}${d.type === "enterprise" ? " ent" : ""}`)
  .attr("tabindex", 0).attr("role", "button")
  .attr("aria-label", d => `${TYPES[d.type].label}: ${flat(d)}, ${STATUS[d.risk]}`)
  .on("click", (e, d) => { e.stopPropagation(); selectNode(d.id); })
  .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectNode(d.id); } })
  .on("pointerenter", (e, d) => { if (e.pointerType === "mouse") showTip(e, d); })
  .on("pointermove", (e) => { if (e.pointerType === "mouse") moveTip(e); })
  .on("pointerleave", () => tip.classList.remove("on"))
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(.25).restart(); d.fx = d.x; d.fy = d.y; tip.classList.remove("on"); })
    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end",   (e)    => { if (!e.active) sim.alphaTarget(0); }));

nodeSel.filter(d => d.type === "enterprise" && ["critical", "blacklisted"].includes(tier(d)))
  .append("circle").attr("class", "halo").attr("r", d => R(d) + 5);
nodeSel.append("circle").attr("class", "ring").attr("r", d => R(d) + 5);
nodeSel.append("circle").attr("class", "disc").attr("r", R);
nodeSel.append("path").attr("class", "ic").attr("d", d => TYPES[d.type].d)
  .attr("stroke-width", d => 1.6 / (R(d) * 1.02 / 24))
  .attr("transform", d => { const s = R(d) * 1.02 / 24; return `translate(${-12 * s},${-12 * s}) scale(${s})`; });
nodeSel.append("text").attr("y", d => R(d) + 15).each(function (d) {
  d.name.split("\n").forEach((line, i) =>
    d3.select(this).append("tspan").attr("class", i ? "l2" : "l1").attr("x", 0).attr("dy", i ? "1.25em" : 0).text(line));
});

function draw() {
  linkSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
}
sim.on("tick", draw); draw();

// ───────────────────────────── STATE ─────────────────────────────
const hidden = new Set();          // hidden node types
let mode = null;                   // null | {kind:"node",id} | {kind:"tier",k} | {kind:"finding",i}

function apply() {
  let ids = null, lit = () => false;
  if (mode?.kind === "node") {
    ids = new Set([mode.id, ...adj.get(mode.id)]);
    lit = l => l.source.id === mode.id || l.target.id === mode.id;
  } else if (mode?.kind === "tier") {
    ids = new Set(nodes.filter(n => tier(n) === mode.k).map(n => n.id));
    lit = l => ids.has(l.source.id) && ids.has(l.target.id);
  } else if (mode?.kind === "finding") {
    ids = new Set(FINDINGS[mode.i].ids);
    lit = l => ids.has(l.source.id) && ids.has(l.target.id);
  }
  const vis = d => !hidden.has(d.type);
  nodeSel.style("display", d => vis(d) ? null : "none")
    .classed("dim", d => ids && !ids.has(d.id))
    .classed("foc", d => ids && ids.has(d.id))
    .classed("sel", d => mode?.kind === "node" && mode.id === d.id);
  linkSel.style("display", l => vis(l.source) && vis(l.target) ? null : "none")
    .classed("lit", l => ids && lit(l))
    .classed("dim", l => ids && !lit(l));
  document.querySelectorAll(".rp").forEach(b => {
    const on = mode?.kind === "tier" && mode.k === b.dataset.tier;
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
  });
  const shown = Object.keys(TYPES).length - hidden.size;
  $("tyCnt").textContent = hidden.size ? `${shown} of ${Object.keys(TYPES).length}` : "";
  $("tyBtn").classList.toggle("part", hidden.size > 0);
  $("tyAll").hidden = !hidden.size;
  renderDetail();
}

function selectNode(id) { mode = { kind:"node", id }; apply(); }
function clearMode() { mode = null; apply(); }

svg.on("click", () => { if (mode) clearMode(); });
$("typeList").addEventListener("click", e => {
  const b = e.target.closest(".ty"); if (!b) return;
  const t = b.dataset.type;
  hidden.has(t) ? hidden.delete(t) : hidden.add(t);
  b.setAttribute("aria-pressed", !hidden.has(t));
  if (mode?.kind === "node" && hidden.has(byId.get(mode.id).type)) mode = null;
  apply();
});
$("tyAll").onclick = () => { hidden.clear(); document.querySelectorAll(".ty").forEach(b => b.setAttribute("aria-pressed", true)); apply(); };
function pop(open) { $("tyPop").hidden = !open; $("tyBtn").setAttribute("aria-expanded", open); }
$("tyBtn").onclick = e => { e.stopPropagation(); pop($("tyPop").hidden); };
$("tyPop").addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => pop(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("tyPop").hidden) pop(false); else if (mode) clearMode(); } });
$("riskList").addEventListener("click", e => {
  const b = e.target.closest(".rp"); if (!b) return;
  mode = mode?.kind === "tier" && mode.k === b.dataset.tier ? null : { kind:"tier", k:b.dataset.tier };
  apply();
});
det.addEventListener("click", e => {
  const b = e.target.closest("[data-node],[data-close],[data-more],[data-finding]"); if (!b) return;
  if (b.dataset.node) selectNode(b.dataset.node);
  else if (b.dataset.finding !== undefined) {
    const i = +b.dataset.finding;
    mode = mode?.kind === "finding" && mode.i === i ? null : { kind:"finding", i };
    apply();
  }
  else if (b.dataset.more) { const p = b.previousElementSibling, c = p.classList.toggle("clamp"); b.textContent = c ? "Read more" : "Show less"; }
  else clearMode();
});

// ───────────────────────────── DETAIL PANEL ─────────────────────────────
function metric(label, v, color, note) {
  return `<div class="met"><span class="k">${label}</span><span class="v" style="color:${color}">${v}<small> / 100</small></span>
    <div class="bar"><i style="width:${v}%;background:${color}"></i></div><span class="note">${note}</span></div>`;
}
// the status chip already says it, so drop the shouted status the notes open with
const tidy = s => { const t = s.replace(/^(critical|blacklisted|high|suspicious|anomaly|address farm|high-risk director)[:.]\s*/i, ""); return t[0].toUpperCase() + t.slice(1); };

function renderDetail() {
  if (mode?.kind !== "node") {
    det.innerHTML = `<h2 class="dtitle">Key findings</h2><p class="dlead">Select a finding to see it on the graph.</p>` +
      FINDINGS.map((f, i) => { const on = mode?.kind === "finding" && mode.i === i; return `<button class="frow${on ? " on" : ""}" data-finding="${i}" aria-pressed="${on}"><i class="sev" style="background:var(--r-${f.sev === "critical" ? "crit" : "med"}-ring)"></i><span>${esc(f.t)}<small>${esc(f.s)}</small></span></button>`; }).join("");
    return;
  }
  const d = byId.get(mode.id), [l1, ...rest] = d.name.split("\n"), ent = d.type === "enterprise";
  let h = `<button class="back" data-close="1"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Key findings</button>
    <div class="dh"><div class="tile">${icon(d.type)}</div>
      <div class="tx"><h2>${esc(l1)}${rest.length && ent ? " " + esc(rest.join(" ")) : ""}</h2>
      <div class="sub">${TYPES[d.type].label}${rest.length && !ent ? " · " + esc(rest.join(" ")) : ""}${d.peId ? " · " + d.peId : ""}</div>${chip(d)}</div></div>`;

  if (ent) {
    const sc = d.shell >= 75 ? "var(--r-crit)" : d.shell >= 50 ? "var(--r-high)" : d.shell >= 30 ? "var(--r-med)" : "var(--r-low)";
    const tc = d.trust >= 70 ? "var(--r-low)" : d.trust >= 50 ? "var(--r-med)" : d.trust >= 30 ? "var(--r-high)" : "var(--r-crit)";
    const st = d.shell >= 75 ? "Block and escalate" : d.shell >= 50 ? "Manual review" : d.shell >= 30 ? "Enhanced due diligence" : "Standard onboarding";
    const tt = d.trust >= 70 ? "Trusted" : d.trust >= 50 ? "Moderate trust" : d.trust >= 30 ? "Low trust" : "Very low trust";
    h += `<div class="sec">${metric("Shell risk score", d.shell, sc, st)}${metric("Enterprise trust score", d.trust, tc, tt)}</div>`;
  }
  if (d.type === "address" && d.cluster) {
    const pts = d.cluster >= 10 ? "+15 risk points" : d.cluster >= 5 ? "+10 risk points" : d.cluster >= 3 ? "+5 risk points" : "No risk points";
    h += `<div class="sec"><div class="met"><span class="k">Entities at this address</span><span class="v">${d.cluster}</span><span class="note">${pts} · signal F8</span></div></div>`;
  }
  if (d.type === "pan" && d.entityCount) {
    h += `<div class="sec"><div class="met"><span class="k">Entities under this PAN</span><span class="v">${d.entityCount}</span><span class="note">${d.entityCount >= 3 ? "+10" : "+5"} risk points · signal F9</span></div></div>`;
  }
  const text = tidy(d.desc), long = text.length > 170;
  h += `<div class="sec"><h6>Analysis</h6><p class="${long ? "clamp" : ""}">${esc(text)}</p>${long ? `<button class="more" data-more="1">Read more</button>` : ""}</div>`;

  const conns = adj.get(d.id).map(id => byId.get(id));
  h += `<div class="sec"><h6>Connected to ${conns.length}</h6><div>${conns.map(n =>
    `<button class="row" data-node="${n.id}" title="${TYPES[n.type].label}">${icon(n.type)}<span class="nm">${esc(n.name.split("\n")[0])}</span>${chip(n)}</button>`).join("")}</div></div>`;
  det.innerHTML = h;
  det.scrollTop = 0;
}

// ───────────────────────────── TOOLTIP ─────────────────────────────
function showTip(e, d) {
  tip.innerHTML = `<b>${esc(flat(d))}</b>${chip(d)}<small>${TYPES[d.type].label}</small>`;
  tip.classList.add("on"); moveTip(e);
}
function moveTip(e) {
  const r = wrap.getBoundingClientRect();
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 8) x = e.clientX - r.left - tip.offsetWidth - 14;
  if (y + tip.offsetHeight > r.height - 8) y = e.clientY - r.top - tip.offsetHeight - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}

// ───────────────────────────── ZOOM ─────────────────────────────
function fit(animate) {
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const vis = nodes.filter(n => !hidden.has(n.type)); if (!vis.length || !W || !H) return;
  // keep clear of the controls (top) and the risk pills (bottom)
  const L = 20, T = 64, B = 60, Rt = 20;
  const x0 = d3.min(vis, d => d.x - 60), x1 = d3.max(vis, d => d.x + 60);
  const y0 = d3.min(vis, d => d.y - R(d) - 8), y1 = d3.max(vis, d => d.y + R(d) + 36);
  const k = Math.min(1.25, (W - L - Rt) / (x1 - x0), (H - T - B) / (y1 - y0));
  const t = d3.zoomIdentity.translate(L + (W - L - Rt) / 2, T + (H - T - B) / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  (animate ? svg.transition().duration(450) : svg).call(zoom.transform, t);
}
$("zin").onclick  = () => svg.transition().duration(200).call(zoom.scaleBy, 1.35);
$("zout").onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1 / 1.35);
$("zfit").onclick = () => fit(true);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => fit(false), 120); });

apply();
fit(false);
</script>
</body>
</html>
