/* the blob's spotlight: a wedge of light from the blob whose far end lands
   exactly on the two corners of the card's nearest edge */
function kvBeam(c) {
  const svg = c.$('#vCone'), poly = c.$('#vConeP'), grad = c.$('#vConeG'), blob = c.$('#core');
  let cur = null, lit = [];
  const clearLit = () => { lit.forEach(n => n.classList.remove('beamed')); lit = []; };
  const corners = (a, r) => {
    const dx = r.x + r.w / 2 - a.x, dy = r.y + r.h / 2 - a.y;
    if (Math.abs(dx) * r.h > Math.abs(dy) * r.w) {          /* facing edge is vertical */
      const x = dx > 0 ? r.x : r.x + r.w;
      return [{ x, y: r.y }, { x, y: r.y + r.h }];
    }
    const y = dy > 0 ? r.y : r.y + r.h;                       /* facing edge is horizontal */
    return [{ x: r.x, y }, { x: r.x + r.w, y }];
  };
  /* widest fan from apex that covers one or more target rects */
  const fan = (a, rects) => {
    if (rects.length === 1) return corners(a, rects[0]);
    const pts = rects.flatMap(r => [
      { x: r.x, y: r.y }, { x: r.x + r.w, y: r.y },
      { x: r.x, y: r.y + r.h }, { x: r.x + r.w, y: r.y + r.h },
    ]);
    const ang = p => Math.atan2(p.y - a.y, p.x - a.x);
    let best = -1, p1 = pts[0], p2 = pts[1];
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        let d = Math.abs(ang(pts[i]) - ang(pts[j]));
        if (d > Math.PI) d = 2 * Math.PI - d;
        if (d > best) { best = d; p1 = pts[i]; p2 = pts[j]; }
      }
    }
    if ((p1.x - a.x) * (p2.y - a.y) - (p1.y - a.y) * (p2.x - a.x) < 0) [p1, p2] = [p2, p1];
    return [p1, p2];
  };
  const paint = (p) => {
    poly.setAttribute('points', p.map(q => `${q.x},${q.y}`).join(' '));
    const m = { x: (p[1].x + p[2].x) / 2, y: (p[1].y + p[2].y) / 2 };
    grad.setAttribute('x1', p[0].x); grad.setAttribute('y1', p[0].y);
    grad.setAttribute('x2', m.x); grad.setAttribute('y2', m.y);
  };
  return {
    async to(target, ms = 560) {
      const targets = Array.isArray(target) ? target : [target];
      const a = center(rectIn(blob));
      const next = [a, ...fan(a, targets.map(rectIn))];
      clearLit();
      svg.classList.add('on');
      c.kick();
      if (!cur) { cur = next; paint(cur); await c.wait(160); }
      else {
        const from = cur.map(q => ({ ...q }));
        await c.tween(Math.min(520, ms), e => {
          cur = from.map((q, i) => ({ x: q.x + (next[i].x - q.x) * e, y: q.y + (next[i].y - q.y) * e }));
          paint(cur);
        }, ease.io);
      }
      cur = next; paint(cur);
      lit = targets; targets.forEach(n => n.classList.add('beamed'));
      await c.wait(Math.max(0, ms - 520));
    },
    off() { svg.classList.remove('on'); clearLit(); },
  };
}

async function kvRunChecks(c, say) {
  const doc = c.$('#vDoc'), beam = c.$('#vBeam'), blob = c.$('#core'), rows = c.$$('.chk-row');
  const light = kvBeam(c);
  const reveal = () => {};
  say(KV_CHK[0].status); c.state('think');
  await light.to(doc, 300);
  c.focus(doc, 6);
  doc.classList.add('lit');
  beam.classList.add('on');
  for (let k = 0; k < 3; k++) {
    await c.wait(360);
    c.fly(doc, blob, { html: '<span class="kfrag-f" style="--c:var(--blue)"></span>', ms: 460, scaleFrom: .6, scaleTo: .5, arc: 14 }).then(() => c.kick()).catch(() => {});
  }
  await c.wait(700);
  beam.classList.remove('on');
  doc.classList.remove('lit'); doc.classList.add('read');
  c.ripple(blob, 'var(--blue)', { scaleTo: 1.3 });

  c.state('tool');
  for (const [i, r] of rows.entries()) {
    say(KV_CHK[i].status);
    reveal(r);
    await light.to(r);
    c.focus(r, 4);
    r.dataset.s = 'run'; r.classList.add('scanning');
    r.querySelector('.st').innerHTML = SPIN;
    await c.wait(820);
    r.classList.remove('scanning');
    r.dataset.s = 'ok';
    r.querySelector('.st').innerHTML = OK;
    c.anim(r.querySelector('.st'), [{ transform: 'scale(.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 280, fill: 'none' }).catch(() => {});
    c.ripple(r, 'var(--blue)', { scaleTo: 1.06 });
    await c.wait(160);
  }
  light.off();
  c.focus(blob, 4);
  c.ripple(blob, 'var(--blue)', { scaleTo: 1.4 });
  await c.wait(500);
}

async function kvRunApprovals(c, say) {
  const blob = c.$('#core'), cards = c.$$('.telco'), row = c.$('#tRow');
  const light = kvBeam(c);
  const frag = '<span class="kfrag-f" style="--c:var(--blue)"></span>';

  /* one request fans out to every operator at once */
  say('Connecting to operators'); c.state('tool');
  c.focus(blob, 4);
  c.ripple(blob, 'var(--blue)', { scaleTo: 1.5 });
  await c.wait(260);
  await light.to(row, 300);
  await Promise.all(cards.map(async (t, i) => {
    await c.wait(i * 90);
    await c.fly(blob, t, { html: `<span class="env">${ic('send')}</span>`, ms: 620, arc: 22 });
    t.dataset.s = 'live';
    c.ripple(t, 'var(--blue)', { scaleTo: 1.08 });
  }));

  /* all four are analysed together; their records stream back into the blob */
  say('Analysing with all operators'); c.state('think');
  c.focus(row, 10);
  cards.forEach(t => t.classList.add('analysing'));
  const t0 = performance.now();
  let last = -1;
  while (performance.now() - t0 < 3200) {
    let k; do { k = Math.floor(rnd(0, cards.length)); } while (k === last);
    last = k;
    c.fly(cards[k], blob, { html: frag, ms: 540, scaleFrom: .7, scaleTo: .5, arc: 12 }).then(() => c.kick()).catch(() => {});
    await c.wait(rnd(300, 440));
  }

  /* everything gathered — compile, then surface each operator's decision in-scene (blue, not a green "done") */
  say('Compiling operator results');
  cards.forEach(t => t.classList.remove('analysing'));
  await Promise.all(cards.map((t, i) => c.wait(i * 70).then(() => c.fly(t, blob, { html: frag, ms: 560, scaleFrom: .7, scaleTo: .5, arc: 14 }))));
  c.focus(blob, 4);
  c.kick();
  c.ripple(blob, 'var(--blue)', { scaleTo: 1.4 });
  await c.wait(360);

  say('Showing operator results'); c.state('verify');
  await Promise.all(cards.map(async (t, i) => {
    await c.wait(i * 110);
    await c.fly(blob, t, { html: frag, ms: 480, scaleFrom: .5, scaleTo: .65, arc: 14 });
    t.dataset.s = 'result';
    const bar = t.querySelector('.tres .tb i');
    if (bar) {
      bar.offsetWidth;
      bar.style.width = `${Math.round(58 + i * 8 + rnd(0, 12))}%`;
    }
    c.ripple(t, 'var(--blue)', { scaleTo: 1.08 });
  }));
  light.off();
  c.focus(row, 10);
  await c.wait(700);
}

/* scene swap between stages inside one run */
async function kvSwap(c, html) {
  c.unfocus();
  await c.anim(el.scene, [{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'scale(.985)', filter: 'blur(3px)' }], { duration: 300, easing: EASE_IN, fill: 'forwards' });
  c.clearFx();
  el.scene.innerHTML = html;
  Blobs.mount(el.scene);
  await c.anim(el.scene, [{ opacity: 0, transform: 'translateY(6px) scale(.985)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 480, fill: 'none' });
  el.scene.getAnimations().forEach(a => a.cancel());
}

/* 6 · Brand Map — the agent first analyses its sources in the centre, then
   rises to the top with the sources in a row and builds brand boards live:
   brand headers resolve out of placeholders, lines of business drop into each
   brand's column. Hierarchy without trees, circles, or counts. */
addScene((() => {
  const BX = 300, BY = 52, CX = 300, CY = 180;   /* final (top) and opening (centre) blob */
  const SRC = [
    { icon: 'globe', label: 'Official websites', x: 70 },
    { icon: 'file', label: 'Investor relations', x: 128 },
    { icon: 'grid', label: 'Product ecosystems', x: 186 },
    { icon: 'chart', label: 'Company filings', x: 414 },
    { icon: 'bag', label: 'Commerce offerings', x: 472 },
    { icon: 'signal', label: 'Telecom / DLT', x: 530 },
  ];
  const ringPos = k => { const a = (210 + k * 60) * Math.PI / 180; return { x: CX + Math.cos(a) * 126, y: CY + Math.sin(a) * 126 }; };
  const chipPos = k => {
    const a = (210 + k * 60) * Math.PI / 180;
    /* sit outside the node so labels stay clear of rings / corners; clamp to stage */
    let x = CX + Math.cos(a) * 198, y = CY + Math.sin(a) * 198;
    x = Math.min(558, Math.max(42, x));
    y = Math.min(342, Math.max(16, y));
    return { x, y };
  };
  const BR = [
    { c: 'var(--blue-3)', icon: 'layers', lobs: [62, 48, 70] },
    { c: 'var(--blue)', icon: 'bag', lobs: [56, 72, 44, 60] },
    { c: 'var(--blue-2)', icon: 'shield', lobs: [66, 52, 58] },
  ];
  const COLX = [24, 218, 412], COLW = 164, COLY = 100;
  return {
    id: 'brand', tab: 'Brand Map', dock: 'ring',
    title: 'Building your enterprise map', doneTitle: 'Enterprise map ready', doneStep: 'Brands and lines of business are ready',
    steps: ['Scanning public sources', 'Identifying brands', 'Mapping lines of business', 'Refining suggestions'],
    html: () => `
      <svg class="bring" id="bRing" viewBox="0 0 720 360" aria-hidden="true">
        <circle class="glow" cx="${CX}" cy="${CY}" r="118"/>
        <circle class="trk" cx="${CX}" cy="${CY}" r="126"/>
        <circle class="hl" id="bArc" cx="${CX}" cy="${CY}" r="126" pathLength="100"/>
      </svg>
      <svg class="cone" id="vCone" viewBox="0 0 720 360" aria-hidden="true"><defs><linearGradient id="vConeG" gradientUnits="userSpaceOnUse"><stop offset="0" class="s0"/><stop offset=".3" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><polygon id="vConeP" points="0,0 0,0 0,0" fill="url(#vConeG)"/></svg>
      ${SRC.map((s, k) => {
        const p = ringPos(k), q = chipPos(k);
        return `${nd(s.icon, p.x, p.y, { s: 40, k: `s${k}`, ring: true, cls: 'bsrc' })}
          <span class="bsrc-chip" data-i="${k}" style="left:${q.x}px;top:${q.y}px">${s.label}</span>`;
      }).join('')}
      ${core(CX, CY, 96)}
      ${BR.map((b, i) => `
        <div class="bcol" data-b="${i}" style="left:${COLX[i]}px;top:${COLY}px;width:${COLW}px;--c:${b.c}">
          <div class="bhead">
            <span class="blogo">${ic(b.icon)}</span>
            <span class="ls">${sk(70, 't')}${sk(42)}</span>
            <span class="bai">${ic('spark')}</span>
          </div>
          <div class="blobs-list"></div>
          <span class="bsweep"></span>
        </div>`).join('')}`,
    async run(c) {
      const t0 = performance.now(), END = 11000;   /* slower scan so labels stay readable */
      const blob = c.$('#core'), srcs = c.$$('.bsrc'), chips = c.$$('.bsrc-chip'), cols = c.$$('.bcol');
      const chip = (cVar, sm = false) => `<span class="bdrop${sm ? ' sm' : ''}" style="--c:${cVar}"></span>`;
      const showChips = (...ks) => {
        const on = new Set(ks);
        chips.forEach((n, i) => n.classList.toggle('on', on.has(i)));
      };

      /* 1 · scan sources in pairs so two labels stay readable at once */
      c.step(0); c.state('think');
      el.loader.dataset.dock = 'ring';
      dockStatus();
      c.focus(blob, 4);
      await c.wait(280);
      const light = kvBeam(c), arc = c.$('#bArc');
      c.$('#bRing').classList.add('on');
      for (let p = 0; p < SRC.length; p += 2) {
        const a = p, b = p + 1;
        const sa = srcs[a], sb = srcs[b];
        if (p === 0) arc.style.transition = 'none';
        arc.style.strokeDashoffset = -((210 + (a + .5) * 60) / 3.6 - 5);
        if (p === 0) { arc.getBoundingClientRect(); arc.style.transition = ''; }
        arc.classList.add('on');
        showChips(a, b);
        roll(el.step, `Checking ${SRC[a].label} · ${SRC[b].label}`);
        await light.to([sa, sb], 320);
        sa.dataset.s = 'run'; sb.dataset.s = 'run';
        /* cone + rings mark both sources — skip the shared reticle so its
           blue corners don't land on the name chips */
        const pa = center(rectIn(sa)), pb = center(rectIn(sb));
        c.unfocus();
        c.glance({ x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 });
        c.ring(sa, 560).catch(() => {});
        c.ring(sb, 560).catch(() => {});
        await c.wait(520);   /* hold so both chips can be read */
        await Promise.all([
          c.fly(sa, blob, { html: chip('var(--blue)', true), ms: 480, scaleFrom: .7, scaleTo: .45, arc: 12 }),
          c.fly(sb, blob, { html: chip('var(--blue)', true), ms: 480, scaleFrom: .7, scaleTo: .45, arc: -10 }),
        ]);
        c.kick();
        c.ripple(blob, 'var(--blue)', { scaleTo: 1.12 });
        await c.wait(320);
        sa.dataset.s = 'done'; sb.dataset.s = 'done';
        await c.wait(180);
      }
      chips.forEach(n => n.classList.remove('on'));
      light.off();
      c.$('#bRing').classList.remove('on');
      c.focus(blob, 4);
      c.ripple(blob, 'var(--blue)', { scaleTo: 1.5 });
      await c.wait(320);

      /* the blob rises to the top and the sources settle into a row */
      c.state('tool'); c.unfocus();
      const glide = (n, x, y, w) => {
        const s0 = parseFloat(n.style.width), x0 = parseFloat(n.style.left) + s0 / 2, y0 = parseFloat(n.style.top) + s0 / 2;
        n.style.transition = 'translate 820ms var(--ease-io), scale 820ms var(--ease-io), opacity 600ms var(--ease), transform 600ms var(--ease), color var(--t2) var(--ease), filter 600ms var(--ease)';
        n.style.translate = `${x - x0}px ${y - y0}px`;
        n.style.scale = w / s0;
      };
      glide(blob, BX, BY, 76);
      srcs.forEach((s, k) => setTimeout(() => !c.signal.aborted && glide(s, SRC[k].x, BY, 34), k * 45));
      chips.forEach(n => { n.style.transition = 'opacity 280ms var(--ease)'; n.style.opacity = '0'; });
      cols.forEach((col, i) => setTimeout(() => !c.signal.aborted && col.classList.add('ghost'), 380 + i * 90));
      await c.wait(880);
      Blobs.mount(el.scene);
      el.loader.dataset.dock = 'above';
      dockStatus();
      srcs.forEach(s => s.classList.add('dim'));
      c.focus(blob, 4);

      /* 2 · the brand placeholders resolve one after another */
      c.step(1); c.state('think');
      await c.wait(140);
      for (const [i, col] of cols.entries()) {
        const head = col.querySelector('.bhead');
        c.focus(head, 4);
        const arcH = i === 1 ? 6 : (i === 0 ? 16 : -14);
        await c.fly(blob, head, { html: chip(col.style.getPropertyValue('--c')), ms: 440, scaleFrom: .55, scaleTo: 1.35, arc: arcH });
        col.classList.remove('ghost'); col.classList.add('found');
        c.ripple(head, col.style.getPropertyValue('--c') || 'var(--blue)', { scaleTo: 1.08 });
        c.kick();
        await c.wait(70);
      }

      /* 3 · lines of business rain into all three brands together */
      c.step(2); c.state('tool');
      c.unfocus(); c.glance(center(rectIn(cols[1])));
      const drops = [];
      let di = 0;
      for (let j = 0; j < Math.max(...BR.map(b => b.lobs.length)); j++) {
        for (const [i, b] of BR.entries()) {
          if (j >= b.lobs.length) continue;
          const list = cols[i].querySelector('.blobs-list');
          list.insertAdjacentHTML('beforeend', `<div class="blob-pill pre">${sk(b.lobs[j])}<span class="bai sm">${ic('spark')}</span></div>`);
          const pill = list.lastElementChild;
          const arcD = ((di % 3) - 1) * 10 + (i - 1) * 4;
          drops.push(c.fly(blob, pill, { html: chip(b.c, true), ms: 460, scaleFrom: .5, scaleTo: 1.15, arc: arcD })
            .then(() => {
              pill.classList.remove('pre');
              pill.classList.add('in');
              c.kick();
            }));
          di++;
          await c.wait(95);
        }
      }
      await Promise.all(drops);
      await c.wait(140);

      /* 4 · refine: one pass across the boards, one suggestion reorders itself */
      c.step(3); c.state('verify');
      for (const [i, col] of cols.entries()) {
        setTimeout(() => { if (c.signal.aborted) return; col.classList.add('sweep'); setTimeout(() => col.classList.remove('sweep'), 560); }, i * 120);
      }
      c.focus(cols[1], 4);
      await c.wait(720);
      const list = cols[1].querySelector('.blobs-list'), pills = $$('.blob-pill', list);
      const mover = pills[2], above = pills[1];
      c.focus(mover, 4);
      const r0 = rectIn(mover), r1 = rectIn(above);
      mover.classList.add('lift');
      await c.wait(180);
      list.insertBefore(mover, above);
      const n0 = rectIn(mover), n1 = rectIn(above);
      c.anim(mover, [
        { transform: `translateY(${r0.y - n0.y}px) scale(1.04)`, boxShadow: '0 14px 28px -12px rgba(11,18,32,.38)' },
        { transform: 'scale(1.04)' },
        { transform: 'none' },
      ], { duration: 420, easing: EASE_IO, fill: 'none' }).catch(() => {});
      await c.anim(above, [{ transform: `translateY(${r1.y - n1.y}px)` }, { transform: 'none' }], { duration: 420, easing: EASE_IO, fill: 'none' });
      mover.classList.remove('lift');
      c.ripple(mover, 'var(--blue)', { scaleTo: 1.06 });
      await c.wait(Math.max(260, END - (performance.now() - t0)));
    },
  };
})());




/* ==========================================================================
   7 · Migration — the full run, plus one loader per backend step.
   Step loaders loop until the backend reports the next step.
   ========================================================================== */
const MIG_STEPS = ['Validating data integrity', 'Checking for duplicates', 'Categorising detected errors', 'Generating AI suggestions'];
const cellsHTML = (widths) => widths.map((w, j) => `<span class="cl" data-c="${j}"><span class="o" style="width:${w}px"></span><span class="n" style="width:${Math.round(w * .9)}px"></span><span class="spk" style="left:${w + 4}px">${ic('spark')}</span></span>`).join('');

const migAll = (() => {
  const ROWS = [[48, 62, 34, 28], [58, 52, 38, 34], [44, 68, 32, 26], [52, 58, 40, 30], [60, 50, 34, 36], [44, 68, 32, 26], [50, 60, 38, 32]];
  const FLAGS = [{ r: 1, c: 0, b: 1 }, { r: 3, c: 2, b: 1 }, { r: 6, c: 3, b: 1 }];
  const DUP = [2, 5];
  const BINS = [{ icon: 'layers', c: 'var(--blue)' }, { icon: 'grid', c: 'var(--blue-3)' }, { icon: 'spark', c: 'var(--blue-2)' }];
  const RH = 40, BX = 360, BY = 120, TX = 22, TY = 28, TW = 220, TH = 252, K = .78;
  return {
    id: 'migval', sub: 'All steps', endless: true, hideCount: true, showPct: true,
    title: 'Validating your data',
    steps: MIG_STEPS,
    html: () => `
      <svg class="cone" id="vCone" viewBox="0 0 720 360" aria-hidden="true"><defs><linearGradient id="vConeG" gradientUnits="userSpaceOnUse"><stop offset="0" class="s0"/><stop offset=".3" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><polygon id="vConeP" points="0,0 0,0 0,0" fill="url(#vConeG)"/></svg>
      <div class="card tbl" id="cT" style="left:${TX}px;top:${TY}px;width:${TW}px;height:${TH}px">
        <div class="tscan" id="cScan"></div>
        <div class="tbody" style="top:${RH}px"><div class="tflow" id="cFlow">
          ${ROWS.map((r, i) => `<div class="trow" data-r="${i}" style="top:${i * RH}px"><span class="num">${ic('user')}</span>${cellsHTML(r.map(w => Math.round(w * K)))}</div>`).join('')}
        </div></div>
        <div class="trow head" style="top:0;z-index:1"><span class="num" style="opacity:0"></span>${[44, 50, 38, 32].map(w => sk(Math.round(w * K))).join('')}</div>
        <span class="gloss" id="cGloss"></span>
      </div>
      ${core(BX, BY, 84)}
      ${BINS.map((b, i) => `<div class="lane mlane in" data-b="${i}" style="left:458px;top:${72 + i * 56}px;--c:${b.c}"><span class="li">${ic(b.icon)}</span><span class="act">${'<i></i>'.repeat(5)}</span></div>`).join('')}`,
    async run(c) {
      const T = c.$('#cT'), scan = c.$('#cScan'), blob = c.$('#core');
      const row = r => c.$(`.trow[data-r="${r}"]`), cell = (r, k) => c.$(`.trow[data-r="${r}"] .cl[data-c="${k}"]`);
      /* the blob's light follows the scan line: a wedge from the blob to the table edge */
      const cone = c.$('#vCone'), poly = c.$('#vConeP'), grad = c.$('#vConeG'), RX = TX + TW;
      const beam = ly => {
        poly.setAttribute('points', `${BX},${BY} ${RX},${ly - 15} ${RX},${ly + 15}`);
        grad.setAttribute('x1', BX); grad.setAttribute('y1', BY); grad.setAttribute('x2', RX); grad.setAttribute('y2', ly);
      };
      /* the dataset is live: rows drift up slowly, new records arrive at the bottom.
         Between batches `push` glides the processed rows up and out. */
      const flow = c.$('#cFlow'), BODY = TH - RH, SPEED = RM ? 0 : 4.5;
      let off = 0, push = 0, last = performance.now();
      const filler = () => `<div class="trow"><span class="num">${ic('user')}</span>${cellsHTML([0, 1, 2, 3].map(j => Math.round(rnd(.7, 1.2) * [50, 58, 36, 30][j] * K)))}</div>`;
      const layout = () => { const kids = [...flow.children], base = parseFloat(kids[0].style.top); kids.forEach((r, k) => { r.style.top = `${base + k * RH}px`; }); };
      const drift = now => {
        if (c.signal.aborted || !flow.isConnected) return;
        const dt = Math.min(64, now - last) / 1000; last = now;
        const p = RM ? push : push * Math.min(1, dt * 2.4);
        push -= p;
        off += dt * SPEED + p;
        flow.style.transform = `translateY(${-off}px)`;
        let lastRow = flow.lastElementChild;
        while (parseFloat(lastRow.style.top) < off + BODY + RH) {
          flow.insertAdjacentHTML('beforeend', filler());
          flow.lastElementChild.style.top = `${parseFloat(lastRow.style.top) + RH}px`;
          lastRow = flow.lastElementChild;
        }
        const first = flow.firstElementChild;
        if (!first.classList.contains('hold') && parseFloat(first.style.top) + RH < off - 4) first.remove();
        raf(drift);
      };
      raf(drift);
      const visTop = r => parseFloat(r.style.top) - off;
      /* activity bars: a short burst on hit — same as Consent Verify lanes */
      const pulseBin = lane => {
        $$('.act i', lane).forEach((b, j) => { b.style.transform = `scaleY(${rnd(.35, 1)})`; setTimeout(() => { b.style.transform = ''; }, 380 + j * 40); });
      };

      c.step(0); c.state('tool');
      c.focus(T, 6);
      beam(TY + RH);
      scan.style.opacity = 1; cone.classList.add('on');
      await c.tween(3200, e => {
        c.pct(e * 25);
        const y = e * RH * ROWS.length + RH - 40;
        scan.style.transform = `translateY(${y}px)`;
        beam(TY + y + 40);
        /* a row counts as read once the line passes its middle, wherever the drift has carried it */
        for (const r of flow.children) {
          if (r.classList.contains('read') || RH + parseFloat(r.style.top) - off + RH / 2 > y + 40) continue;
          r.classList.add('read');
          if (!RM) r.animate([{ backgroundColor: 'color-mix(in srgb, var(--blue) 9%, var(--surface))' }, { backgroundColor: 'var(--surface)' }], { duration: 700, easing: EASE });
          const i = r.dataset.r == null ? -1 : +r.dataset.r;
          FLAGS.filter(f => f.r === i).forEach(f => { cell(f.r, f.c).classList.add('flag'); c.ripple(cell(f.r, f.c), 'var(--blue)', { scaleTo: 1.6, round: '4px' }); c.kick(); });
          if (i === DUP[1]) DUP.forEach(d => row(d).classList.add('dup'));
        }
      }, t => -(Math.cos(Math.PI * t) - 1) / 2);
      cone.classList.remove('on');
      await c.anim(scan, [{ opacity: 1 }, { opacity: 0 }], { duration: 260 });
      scan.style.opacity = 0;

      c.step(1); c.state('think');
      c.pct(32);
      c.focus(row(DUP[0]), 2);
      await c.fly(row(DUP[0]), row(DUP[1]), { html: `<span class="dotc" style="--c:var(--blue)"></span>`, ms: 480, scaleTo: .55, arc: -18 });
      c.focus(row(DUP[1]), 2);
      await c.wait(300);
      await c.anim(row(DUP[1]), [{ transform: 'none', opacity: 1 }, { transform: `translateY(${-(DUP[1] - DUP[0]) * RH}px)`, opacity: 0 }], { duration: 600, easing: EASE_IO });
      const below = [];
      for (let n = row(DUP[1]).nextElementSibling; n; n = n.nextElementSibling) below.push(n);
      row(DUP[1]).remove();
      layout();
      if (!RM) below.forEach(r => r.animate([{ transform: `translateY(${RH}px)` }, { transform: 'none' }], { duration: 460, easing: EASE }));
      row(DUP[0]).classList.remove('dup'); row(DUP[0]).classList.add('merged');
      c.focus(row(DUP[0]), 2);
      c.pct(48);
      await c.wait(700);

      /* categorise: every finding passes through the blob into its lanes */
      c.step(2); c.state('tool');
      c.focus(blob, 4);
      const routes = [[0, row(DUP[0]).querySelector('.num')], ...FLAGS.map(f => [f.b, cell(f.r, f.c)])];
      const route = async (b, srcEl) => {
        const lane = c.$(`.mlane[data-b="${b}"]`);
        await c.fly(srcEl, blob, { html: `<span class="dotc" style="--c:var(--blue-4)"></span>`, ms: 460 });
        c.kick();
        await c.fly(blob, lane, { html: `<span class="dotc" style="--c:${BINS[b].c}"></span>`, ms: 420 });
        pulseBin(lane);
        c.ripple(lane, BINS[b].c, { scaleTo: 1.06 });
        c.flash(lane);
      };
      for (let ri = 0; ri < routes.length; ri++) {
        await route(routes[ri][0], routes[ri][1]);
        c.pct(50 + ((ri + 1) / routes.length) * 25);
      }
      await c.wait(300);

      /* suggest: the blob drafts each fix and sends it back to the cell (no connector lines) */
      c.step(3);
      for (let fi = 0; fi < FLAGS.length; fi++) {
        const f = FLAGS[fi], ce = cell(f.r, f.c);
        c.focus(ce, 8);
        c.kick();

/* 7.1 · integrity — the blob casts a scan ray across every row */
const migIntegrity = {
  id: 'mig1', sub: 'Integrity', single: true, stepIndex: 0,
  title: 'Validating data integrity', msgs: ['Validating data integrity', 'Checking required fields', 'Verifying formats'],
  html: () => {
    const RH = 40, cols = 'grid-template-columns:22px 1.1fr 1.3fr .9fr .8fr 18px';

    return `
      <div class="card tbl" id="iT" style="left:24px;top:36px;width:360px;height:288px">
        <div class="tscan" id="iScan"></div>
        <div class="trow head" style="top:0;${cols}"><span class="num" style="opacity:0"></span>${[46, 54, 40, 34].map((w, j) => `<span class="sk hcol" data-j="${j}" style="width:${w}px;transition:background .3s"></span>`).join('')}<span></span></div>
        ${[0, 1, 2, 3, 4, 5].map(i => `<div class="trow" data-r="${i}" style="top:${RH + i * RH}px;${cols}"><span class="num">${ic('user')}</span>${[0, 1, 2, 3].map(j => `<span class="cl" data-c="${j}"><span class="o" style="width:${Math.round(rnd(26, 64))}px"></span></span>`).join('')}<span class="rs" style="opacity:0;transition:opacity .3s"></span></div>`).join('')}

      c.state('tool'); c.focus(T, 6);
      const seen = new Set();

      await c.tween(3000, e => {
        const y = e * RH * rows.length + RH - 40;
        scan.style.transform = `translateY(${y}px)`;
        const idx = Math.floor(e * rows.length);
        for (let i = 0; i <= Math.min(idx, rows.length - 1); i++) {

      for (const h of c.$$('.hcol')) { h.style.background = 'var(--blue-line)'; await c.wait(120); }
      await c.wait(1100);
      rows.forEach(r => { r.querySelector('.rs').style.opacity = 0; $$('.cl', r).forEach(ce => { ce.classList.remove('flag'); ce.querySelector('.o').style.width = `${Math.round(rnd(26, 64))}px`; }); });
      c.$$('.hcol').forEach(h => { h.style.background = ''; });

};

/* ==========================================================================

const CON_STEPS = ['Preparing validated records', 'Checking consent signals', 'Verifying each record'];
const tokenCard = () => `<span class="av">${ic('user')}</span><span class="ls">${sk(rnd(50, 76))}${sk(rnd(28, 48))}</span>`;
const gateHTML = (x, y, w, h) => `
  <div class="card" id="vGate" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;padding:10px;display:flex;flex-direction:column;gap:5px">
    <div class="gate-cur" id="vCur"><span class="av">${ic('user')}</span><span class="ls">${sk(40)}${sk(26)}</span><span class="vchip" id="vChip"></span></div>
    ${['fileCheck', 'clock', 'target'].map((g, i) => `<div class="gchk" data-g="${i}"><span class="gi">${ic(g)}</span><span class="ls">${sk([44, 52, 40][i])}</span><span class="st"></span></div>`).join('')}
    <div class="batch" id="vBatch"><div class="workers" id="vW">${'<i></i>'.repeat(40)}</div>${sk(80)}</div>
  </div>`;
const VC = { ok: ['var(--blue-3)', 'check'], exp: ['var(--blue)', 'clock'], rev: ['var(--blue-2)', 'x'] };
/* a record leaves the stream, is read by the blob, then passes the gates */
async function gatePass(c, stream, place, r, pal = VC) {
  const cur = c.$('#vCur'), chip = c.$('#vChip'), blob = c.$('#core');
  const card = pickRecord(stream);
  cur.classList.add('out'); chip.classList.remove('on');
  c.$$('.gchk').forEach(g => { delete g.dataset.s; g.querySelector('.st').innerHTML = ''; });
  card.classList.add('picked'); setTimeout(() => card.classList.remove('picked'), 600);
  await c.fly(card, blob, { ms: r.fast ? 380 : 480, scaleTo: .3, arc: 6 });
  c.kick();
  cur.classList.remove('out'); cur.classList.add('pre'); cur.offsetWidth; cur.classList.remove('pre');
  for (let g = 0; g < r.res.length; g++) {
    const row = c.$(`.gchk[data-g="${g}"]`);
    row.dataset.s = 'run'; row.querySelector('.st').innerHTML = SPIN;
    c.glance(center(rectIn(row)));
    await c.wait(r.fast ? 220 : 380);
    row.dataset.s = r.res[g];
    row.querySelector('.st').innerHTML = r.res[g] === 'ok' ? OK : r.res[g] === 'warn' ? WARN : FAIL;
    if (r.res[g] !== 'ok') c.ripple(row, r.res[g] === 'warn' ? 'var(--blue)' : 'var(--blue-3)', { scaleTo: 1.05 });
  }
  chip.style.background = pal[r.v][0]; chip.innerHTML = ic(pal[r.v][1]);
  chip.offsetWidth; chip.classList.add('on');
  c.ripple(cur, pal[r.v][0], { scaleTo: 1.05 });
  await c.wait(r.fast ? 260 : 420);
  return chip;
}
/* verify-stage buckets: calm blues, the icon tells them apart */
const TRAY = { ok: ['var(--blue-3)', 'check'], exp: ['var(--blue)', 'clock'], rev: ['var(--blue-2)', 'x'] };
const RECS = [{ v: 'ok', res: ['ok', 'ok', 'ok'] }, { v: 'exp', res: ['ok', 'warn'] }, { v: 'rev', res: ['fail'] }];
const rcard = () => `<div class="tcard rcard"><span class="qi">${ic('user')}</span><span class="ls">${sk(rnd(44, 70))}${sk(rnd(24, 46))}</span></div>`;
const streamHTML = () => { const list = Array.from({ length: 8 }, rcard).join(''); return `<div class="tstream flow" id="vStream" style="left:22px;top:40px;width:128px;height:268px"><div class="ttrack">${list}${list}</div></div>`; };
/* any record currently visible in the scrolling stream */
const pickRecord = (stream) => { const sr = rectIn(stream); const vis = $$('.tcard', stream).filter(n => { const r = rectIn(n); return r.y > sr.y + 24 && r.y + r.h < sr.y + sr.h - 24; }); return vis.length ? pick(vis) : $('.tcard', stream); };

const conAll = {
  id: 'consent', sub: 'All steps', endless: true, hideCount: true,
  title: 'Verifying consent records',
  steps: CON_STEPS,
  html: () => `
    ${streamHTML()}
    ${core(300, 120, 80)}
    ${gateHTML(418, 86, 164, 148)}`,
  async run(c) {
    const stream = c.$('#vStream'), blob = c.$('#core');
    const place = () => {};
    const softClear = async () => {
      c.$('#vBatch').classList.remove('on');
      c.$$('#vW i').forEach(w => { w.className = ''; });
      c.$$('.gchk').forEach(g => { delete g.dataset.s; g.querySelector('.st').innerHTML = ''; });

/* 8.1 · records — records flow source → blob → assembled deck → onward */

      /* seal the pack, then hand off to the destination */
      src.dataset.s = 'idle';
      light.off();
      c.state('verify');
      c.focus(deck, 10);
      if (!deck.querySelector('.tick')) deck.insertAdjacentHTML('beforeend', `<span class="tick">${ic('check')}</span>`);
      deck.classList.add('ok');
      c.kick();
      c.ripple(deck, 'var(--blue)', { scaleTo: 1.22, round: '12px' });
      await c.wait(520);

      dst.dataset.s = 'run';
      await light.to(dst, 260);
      c.focus(dst, 8);
      deck.classList.add('ship');
      await Promise.all([
        c.fly(deck, dst, { html: `<span class="dotc" style="--c:var(--blue)"></span>`, ms: 560, scaleTo: .55, arc: 12 }),
        c.anim(deck, [
          { transform: 'none', opacity: 1 },
          { transform: 'translateX(90px) scale(.92)', opacity: 1, offset: .45 },
          { transform: 'translateX(200px) scale(.4)', opacity: 0 },
        ], { duration: 640, easing: EASE_IO }),
      ]);
      deck.getAnimations().forEach(a => a.cancel());
      deck.style.opacity = 0; deck.style.transform = '';
      deck.classList.remove('ship');
      light.off();
      dst.dataset.s = 'done';
      c.ripple(dst, 'var(--blue)', { scaleTo: 1.35 });
      c.focus(dst, 8);
      await c.wait(780);
      dst.dataset.s = 'idle';
      c.unfocus();
      await c.wait(220);
    }
  },
};

/* 8.2 · signals — the blob reads a record and polls four signal sources */
const conSignals = {
  id: 'con2', sub: 'Signals', single: true, stepIndex: 1,
  title: 'Checking consent signals', msgs: ['Checking consent signals', 'Querying opt-in history', 'Matching purpose'],
  html: () => `
    ${core(300, 156, 104)}
    <div class="gate-cur" id="gRec" style="position:absolute;left:226px;top:262px;width:148px;background:var(--surface);box-shadow:var(--shadow-2);z-index:3"><span class="av">${ic('user')}</span><span class="ls">${sk(56)}${sk(36)}</span><span class="vchip" id="gChip"></span></div>
    ${[['fileCheck', 110, 72], ['clock', 490, 72], ['target', 110, 260], ['shield', 490, 260]].map(([i, x, y], k) => nd(i, x, y, { s: 50, k, ring: true })).join('')}`,
  async run(c) {
    const rec = c.$('#gRec'), chip = c.$('#gChip'), nodes = c.$$('.nd'), blob = c.$('#core');
    while (true) {
      c.cycle();
      c.state('think'); c.focus(rec, 6);
      await c.fly(rec, blob, { html: `<span class="dotc" style="--c:var(--blue)"></span>`, ms: 420, scaleTo: .55, arc: -10 });
      c.ripple(blob, 'var(--blue)', { scaleTo: 1.4 });
      c.state('tool'); c.focus(blob, 4);
      const warnAt = Math.random() < .5 ? Math.floor(rnd(0, 4)) : -1;
      await Promise.all(nodes.map(async (n, k) => {
        await c.wait(k * 120);
        await c.fly(blob, n, { html: `<span class="dotc" style="--c:var(--blue)"></span>`, ms: 420, scaleTo: .5, arc: k % 2 ? 12 : -12 });
        n.dataset.s = 'run';
        await c.ring(n, rnd(700, 1300));
        const warn = k === warnAt;
        n.dataset.s = 'done';
        c.ripple(n, warn ? 'var(--blue-2)' : 'var(--blue)');
        await c.fly(n, blob, { html: `<span class="dotc" style="--c:${warn ? 'var(--blue-2)' : 'var(--blue)'}"></span>`, ms: 400, scaleTo: .5, arc: k % 2 ? -10 : 10 });
        c.kick();
      }));
      c.state('verify');
      const v = warnAt >= 0 ? 'exp' : 'ok';
      await c.fly(blob, rec, { html: `<span class="dotc" style="--c:${VC[v][0]}"></span>`, ms: 400, scaleTo: .55, arc: 8 });
      chip.style.background = VC[v][0]; chip.innerHTML = ic(VC[v][1]);
      chip.offsetWidth; chip.classList.add('on');
      c.ripple(rec, VC[v][0], { scaleTo: 1.12 });
      await c.wait(1100);
      chip.classList.remove('on');
      nodes.forEach(n => { n.dataset.s = 'idle'; n.querySelector('.nd-ring .p').style.strokeDashoffset = 100; n.querySelector('.badge').innerHTML = ic('check'); });
      await c.anim(rec, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(8px)', opacity: 0 }], { duration: 220, easing: EASE_IN });
      await c.anim(rec, [{ transform: 'translateY(-8px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320 });
    }
  },
};

/* 8.3 · verify — records stream through the blob and the gates into LOB-style lanes */
const conVerify = {
  id: 'con3', sub: 'Verify', single: true, endless: true, stepIndex: 2,
  title: 'Verifying each record', msgs: ['Verifying each record', 'Checking retention windows', 'Confirming purpose'],
  html: () => `
    ${streamHTML()}
    ${core(300, 120, 80)}
    ${gateHTML(458, 24, 130, 140)}
    ${Object.entries(TRAY).map(([k, [col, i]], j) => `<div class="lane mlane in" data-k="${k}" style="left:458px;top:${180 + j * 52}px;--c:${col}"><span class="li">${ic(i)}</span><span class="act">${'<i></i>'.repeat(5)}</span></div>`).join('')}`,
  async run(c) {
    const stream = c.$('#vStream'), place = () => {};
    await c.wait(600);
    c.state('verify'); c.focus(c.$('#vGate'), 4);
    let n = 0;
    while (true) {
      c.cycle();
      const roll = Math.random();
      const r = roll < .7 ? { v: 'ok', res: ['ok', 'ok', 'ok'] } : roll < .85 ? { v: 'exp', res: ['ok', 'warn'] } : { v: 'rev', res: ['fail'] };
      r.fast = n++ > 1;
      const chip = await gatePass(c, stream, place, r, TRAY);
      const lane = c.$(`.mlane[data-k="${r.v}"]`);
      await c.fly(chip, lane, { ms: 520, scaleTo: .6 });
      /* activity burst — no accumulating dots */
      $$('.act i', lane).forEach((b, j) => { b.style.transform = `scaleY(${rnd(.35, 1)})`; setTimeout(() => { b.style.transform = ''; }, 380 + j * 40); });
      c.ripple(lane, TRAY[r.v][0], { scaleTo: 1.06 });
      c.flash(lane);
    }
  },
};

addGroup('consent', 'Consent', [conAll, conRecords, conSignals, conVerify]);

/* ==========================================================================
   9 · Agreements — the agent pulls the two platform agreements, reads each
   one clause by clause (a reading line walks the page, key clauses light up),
   then condenses the marked clauses into three points per agreement.
   ========================================================================== */
Object.assign(ICON, {
  scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/><path d="M7 21h10M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  shieldLock: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><rect x="9" y="10.5" width="6" height="5" rx="1"/><path d="M10.5 10.5V9a1.5 1.5 0 0 1 3 0v1.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
});
addScene((() => {
  const BX = 300, BY = 224;
  /* clause widths per page; `k` marks the key terms the agent picks out */
  const DOCS = [
    { id: 'agT', sid: 'agST', icon: 'scale', y: 12, cl: [{ w: 84 }, { w: 70, k: 1 }, { w: 90 }, { w: 62 }, { w: 80, k: 1 }, { w: 74, k: 1 }] },
    { id: 'agP', sid: 'agSP', icon: 'shieldLock', y: 150, cl: [{ w: 76, k: 1 }, { w: 88 }, { w: 66 }, { w: 82, k: 1 }, { w: 58 }, { w: 78, k: 1 }] },
  ];
  const PTS = [[70, 52, 62], [64, 72, 48]];
  return {
    id: 'agreements', tab: 'Agreements',
    title: 'Reading your agreements', doneTitle: 'Agreements summarised', doneStep: 'Key terms ready for your review',
    steps: ['Pulling the latest agreements', 'Reading terms and conditions', 'Reading privacy policy', 'Summarising key terms'],
    html: () => `
      <svg class="cone" id="vCone" viewBox="0 0 720 360" aria-hidden="true"><defs><linearGradient id="vConeG" gradientUnits="userSpaceOnUse"><stop offset="0" class="s0"/><stop offset=".3" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><polygon id="vConeP" points="0,0 0,0 0,0" fill="url(#vConeG)"/></svg>
      ${DOCS.map((d, i) => `
        <div class="card kdoc ag-doc" id="${d.id}" style="left:24px;top:${d.y}px">
          <span class="ag-read"></span>
          <div class="card-h"><span class="hic">${ic(d.icon)}</span><span class="lines">${sk(i ? 46 : 58, 't')}${sk(i ? 30 : 36)}</span></div>
          <div class="ag-body">${d.cl.map(c => `<div class="ag-cl"${c.k ? ' data-k="1"' : ''}><i class="ag-sec"></i>${sk(c.w)}${c.k ? `<span class="ag-spk">${ic('spark')}</span>` : ''}</div>`).join('')}</div>
        </div>
        <div class="ag-sum" id="${d.sid}" style="left:440px;top:${d.y}px">
          <div class="ag-sh"><span class="ag-si">${ic(d.icon)}</span><span class="ls">${sk(i ? 50 : 58, 't')}${sk(i ? 28 : 34)}</span><span class="bai">${ic('spark')}</span></div>
          <div class="ag-pts">${PTS[i].map(w => `<div class="ag-pt"><span class="ag-pb">${ic('check')}</span>${sk(w)}</div>`).join('')}</div>
          <span class="ag-ok">${ic('check')}</span>
        </div>`).join('')}
      ${core(BX, BY, 84)}`,
    async run(c) {
      const t0 = performance.now(), END = 10000;   /* + the 420ms lead-in ≈ 10.4s */
      const blob = c.$('#core'), docs = DOCS.map(d => c.$(`#${d.id}`)), sums = DOCS.map(d => c.$(`#${d.sid}`));
      const light = kvBeam(c);
      const frag = '<span class="kfrag-f" style="--c:var(--blue)"></span>';

      /* 1 · the agent fans its light over the left edge and both agreements land */
      c.step(0); c.state('tool');
      c.focus(blob, 4);
      await c.wait(160);
      for (const d of docs) {
        d.classList.add('in');
        c.kick();
        await c.wait(170);
      }
      await light.to(docs, 360);
      c.focus(docs, 8);
      sums.forEach((s, i) => setTimeout(() => !c.signal.aborted && s.classList.add('ghost'), i * 110));
      /* each agreement is linked through the agent to the summary that will sit beside it */
      const tr = docs.flatMap((d, k) => [
        c.curve(d, blob, { from: 'r', to: 'l', pad: 13, cls: 'trace' }),
        c.curve(blob, sums[k], { from: 'r', to: 'l', pad: 13, cls: 'trace' }),
      ]);
      tr.forEach((p, i) => c.anim(p, [{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 120 + i * 70, fill: 'both' }).catch(() => {}));
      await c.wait(420);
      docs.forEach(d => c.ripple(d, 'var(--blue)', { scaleTo: 1.05 }));
      await c.wait(240);

      /* 2 · 3 · each page is read top to bottom; key clauses are marked as the line passes */
      const read = async k => {
        const d = docs[k], bar = d.querySelector('.ag-read'), cls = $$('.ag-cl', d);
        c.step(1 + k); c.state('think');
        await light.to(d, 380);
        c.focus(d, 8);
        bar.style.transition = 'none';
        bar.style.transform = `translateY(${cls[0].offsetTop - 4}px)`;
        bar.getBoundingClientRect(); bar.style.transition = '';
        d.classList.add('reading');
        await c.wait(160);
        for (const cl of cls) {
          bar.style.transform = `translateY(${cl.offsetTop - 4}px)`;
          await c.wait(170);
          cl.classList.add('read');
          if (cl.dataset.k) {
            cl.classList.add('ag-key');
            c.ripple(cl, 'var(--blue)', { scaleTo: 1.25, round: '5px' });
            c.kick();
            await c.wait(160);
          }
          await c.wait(70);
        }
        d.classList.remove('reading'); d.classList.add('read');
        c.ripple(d, 'var(--blue)', { scaleTo: 1.06 });
        await c.wait(220);
      };
      await read(0);
      await read(1);

      /* 4 · the marked clauses condense through the agent into three points beside each page */
      c.step(3); c.state('tool');
      light.off();
      for (const [k, d] of docs.entries()) {
        const s = sums[k], keys = $$('.ag-cl.ag-key', d), pts = $$('.ag-pt', s);
        c.focus(d, 8);
        s.classList.add('live');
        await Promise.all(keys.map((cl, i) => c.wait(i * 90).then(() =>
          c.fly(cl, blob, { html: frag, ms: 460, scaleFrom: .9, scaleTo: .5, arc: k ? -10 : 12 }))));
        keys.forEach(cl => { cl.classList.remove('ag-key'); cl.classList.add('taken'); });
        c.kick();
        c.ripple(blob, 'var(--blue)', { scaleTo: 1.25 });
        c.focus(s, 6);
        await Promise.all(pts.map((p, i) => c.wait(i * 150).then(async () => {
          await c.fly(blob, p, { html: '<span class="bdrop" style="--c:var(--blue)"></span>', ms: 420, scaleFrom: .5, scaleTo: 1, arc: k ? -8 : 10 });
          p.classList.add('in');
          c.kick();
        })));
        s.classList.add('ready');
        c.ripple(s, 'var(--blue)', { scaleTo: 1.06 });
        await c.wait(160);
      }
      c.focus(blob, 4);
      await c.wait(Math.max(260, END - (performance.now() - t0)));
      tr.forEach(p => p.classList.add('ok'));
    },
  };
})());

/* ==========================================================================
   10 · Team — the agent looks up the DLT registration, reads the people on
   record, checks each person's role and permissions, then suggests who to
   invite: those cards settle into an invite list and are approved one by one.
   ========================================================================== */
addScene((() => {
  const BX = 300, BY = 206, CX = 20, CY = 66, CH = 50;
  const PEOPLE = [
    { role: 'shieldCheck', perm: 'key', c: 'var(--blue-3)', ok: true, w: [56, 34] },
    { role: 'id', perm: 'shieldLock', c: 'var(--blue)', ok: true, w: [48, 30] },
    { role: 'eye', perm: 'lock', c: 'var(--blue-2)', ok: false, w: [58, 36] },
    { role: 'key', perm: 'key', c: 'var(--blue-5)', ok: true, w: [44, 38] },
  ];
  const INV = PEOPLE.filter(p => p.ok);
  return {
    id: 'team', tab: 'Team',
    title: 'Finding your team', doneTitle: 'Team suggestions ready', doneStep: 'People and roles suggested',
    steps: ['Looking up your DLT registration', 'Finding people on record', 'Matching roles and permissions', 'Suggesting people to invite'],
    html: () => `
      <svg class="cone" id="vCone" viewBox="0 0 720 360" aria-hidden="true"><defs><linearGradient id="vConeG" gradientUnits="userSpaceOnUse"><stop offset="0" class="s0"/><stop offset=".3" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><polygon id="vConeP" points="0,0 0,0 0,0" fill="url(#vConeG)"/></svg>
      ${nd('database', CX + 78, 32, { s: 42, k: 'reg', cls: 'tm-reg' })}
      ${PEOPLE.map((p, i) => `
        <div class="tm-card" data-i="${i}" style="left:${CX}px;top:${CY + i * CH}px">
          <span class="tm-av">${ic('user')}<span class="tm-perm">${ic(p.perm)}</span></span>
          <span class="ls">${sk(p.w[0])}${sk(p.w[1])}</span>
          <span class="tm-role" style="--c:${p.c}">${ic(p.role)}</span>
        </div>`).join('')}
      ${core(BX, BY, 84)}
      <div class="tm-list" id="tmList" style="left:420px;top:52px">
        <div class="tm-lh"><span class="tm-li">${ic('users')}</span><span class="ls">${sk(54, 't')}${sk(30)}</span><span class="tm-send">${ic('send')}</span></div>
        <div class="tm-rows">${INV.map(p => `
          <div class="tm-row"><span class="tm-av">${ic('user')}</span><span class="ls">${sk(Math.round(p.w[0] * .7))}${sk(Math.round(p.w[1] * .7))}</span>
            <span class="tm-mini" style="--c:${p.c}">${ic(p.role)}</span><span class="tm-add">${ic('plus', 'tm-pl')}${ic('check', 'tm-ck')}</span></div>`).join('')}
        </div>
      </div>`,
    async run(c) {
      const t0 = performance.now(), END = 9800;   /* + the 420ms lead-in ≈ 10.2s */
      const blob = c.$('#core'), reg = c.$('.nd[data-k="reg"]'), cards = c.$$('.tm-card'), list = c.$('#tmList'), rows = c.$$('.tm-row');
      const light = kvBeam(c);
      const frag = '<span class="kfrag-f" style="--c:var(--blue)"></span>';

      /* 1 · the registration is looked up: the agent lights the registry and pulls its record */
      c.step(0); c.state('think');
      c.focus(blob, 4);
      await c.wait(160);
      await light.to(reg, 360);
      reg.dataset.s = 'run';
      c.focus(reg, 8);
      for (let k = 0; k < 3; k++) {
        c.fly(reg, blob, { html: frag, ms: 480, scaleFrom: .7, scaleTo: .5, arc: 14 - k * 8 }).then(() => c.kick()).catch(() => {});
        await c.wait(240);
      }
      await c.wait(300);
      reg.dataset.s = 'done';
      c.ripple(reg);
      list.classList.add('ghost');
      await c.wait(200);

      /* 2 · the people on record emerge from the registry into a column */
      c.step(1); c.state('tool');
      light.off();
      const rc = center(rectIn(reg));
      for (const card of cards) {
        const r = center(rectIn(card));
        card.classList.add('in');
        c.anim(card, [
          { opacity: 0, transform: `translate(${rc.x - r.x}px, ${rc.y - r.y}px) scale(.4)`, filter: 'blur(4px)' },
          { opacity: 1, transform: 'none', filter: 'blur(0)' },
        ], { duration: 620, easing: EASE, fill: 'none' }).catch(() => {});
        await c.wait(130);
      }
      c.focus(cards, 6);
      await c.wait(620);

      /* 3 · each person is checked: the role and its permissions come back from the agent */
      c.step(2); c.state('think');
      for (const [i, card] of cards.entries()) {
        const p = PEOPLE[i], chip = card.querySelector('.tm-role');
        await light.to(card, 300);
        c.focus(card, 5);
        card.classList.add('scan');
        c.kick();
        await c.wait(240);
        await c.fly(blob, chip, { html: `<span class="tchip typed" style="--c:${p.c}">${ic(p.role)}</span>`, ms: 400, scaleFrom: .6, scaleTo: .8, arc: 8 });
        card.classList.remove('scan'); card.classList.add('typed');
        c.ripple(chip, 'var(--blue)', { scaleTo: 1.3, round: '7px' });
        await c.wait(140);
      }
      light.off();

      /* 4 · suggested people settle into the invite list and are approved one by one */
      c.step(3); c.state('tool');
      list.classList.add('live');
      c.focus(list, 6);
      const ok = cards.filter((_, i) => PEOPLE[i].ok);
      cards.forEach((card, i) => { if (!PEOPLE[i].ok) card.classList.add('skip'); });
      /* each suggestion passes through the agent on its way into the list */
      await Promise.all(ok.map(async (card, j) => {
        await c.wait(j * 200);
        const html = card.outerHTML;
        await c.fly(card, blob, { ms: 440, scaleTo: .3, arc: 10 - j * 6 });
        card.classList.add('moved');
        c.kick();
        await c.fly(blob, rows[j], { html, ms: 480, scaleFrom: .3, scaleTo: .86, arc: 10 - j * 8 });
        rows[j].classList.add('in');
      }));
      await c.wait(160);
      c.state('verify');
      for (const row of rows) {
        const add = row.querySelector('.tm-add');
        add.classList.add('press');
        await c.wait(120);
        add.classList.remove('press');
        row.classList.add('ok');
        c.ripple(add, 'var(--blue)', { scaleTo: 1.6, round: '7px' });
        await c.wait(160);
      }
      list.classList.add('ready');
      c.ripple(list, 'var(--blue)', { scaleTo: 1.05 });
      await c.wait(Math.max(260, END - (performance.now() - t0)));
    },
  };
})());

bindEl();
bindProg();
bindRT();
boot();
</script>

<script>
/* ==========================================================================
   Vue export — copy a drop-in SFC for the active loader
   ========================================================================== */
function pascalName(parts) {
  return parts.filter(Boolean).join(' ')
    .replace(/[^a-zA-Z0-9]+/g, ' ').trim().split(/\s+/)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join('');
}
function vueFileName() {
  const s = cur();
  const sub = grp.variants.length > 1 ? (s.sub || '') : '';
  return `${pascalName([grp.tab, sub])}AgentLoader.vue`;
}
function buildEmbedHtml(id, vIndex) {
  const css = [...document.querySelectorAll('style')].map(n => n.textContent).join('\n');
  const scripts = [...document.querySelectorAll('script:not([src])')].map(n => n.textContent);
  const mono = scripts.find(s => s.includes('function makeCtx') && s.includes('addScene') && !s.includes('buildVueSfc'));
  const engine = (mono || scripts.find(s => s.includes('function makeCtx') && !s.includes('buildVueSfc')) || '')
    .replace(/\nboot\(\);\s*$/,'\n');
  let scenes = '';
  if (!mono) {
    scenes = scripts
      .filter(s => !s.includes('buildVueSfc') && !s.includes('Vue export — copy a drop-in SFC'))
      .filter(s => s.includes('addScene') || s.includes('addGroup') || s.includes('MIG_STEPS') || s.includes('boot();'))
      .filter(s => !s.includes('function makeCtx'))
      .join('\n\n')
      .replace(/\nboot\(\);\s*/g, '\n')
      .trimEnd() + '\n';
  }
  const embedBoot = `

/* embed mode — lock to one loader, hide preview chrome */
(function bootEmbed() {
  const EMBED_ID = ${JSON.stringify(id)};
  const EMBED_VI = ${vIndex | 0};
  document.documentElement.classList.add('embed');
  const hide = document.createElement('style');
  hide.textContent = '.embed .topwrap,.embed .runtime{display:none!important}body{min-height:0;background:transparent}.embed main{padding:8px 12px 16px}';
  document.head.appendChild(hide);
  bindEl(); bindProg(); bindRT();
  boot();
  grp = GROUPS.find(g => g.id === EMBED_ID) || GROUPS[0];
  vi = Math.max(0, Math.min(grp.variants.length - 1, EMBED_VI));
  go(grp.id, vi, true);
})();
`;
  scenes = (scenes + embedBoot).trim() + '\n';
  const shell = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>${css}</style>
</head>

function buildVueSfc() {
  const s = cur();
  const file = vueFileName();
  const comp = file.replace(/\.vue$/, '');
  const label = grp.variants.length > 1 ? `${grp.tab} · ${s.sub || 'All steps'}` : grp.tab;
  const srcdoc = buildEmbedHtml(grp.id, vi);
  const openScript = '<' + 'script setup lang="ts">';
  const closeScript = '</' + 'script>';
  const closeTemplate = '</' + 'template>';
  const closeStyle = '</' + 'style>';
  return { file, code: `<!--
  ${comp}.vue
  Drop-in Consent OS agent loader (${label}).

  Usage:
    <${comp} />

  Optional props:
    height  — CSS min-height for the stage (default: 420px)
-->
${openScript}
import { onMounted, onBeforeUnmount, ref, watch } from 'vue'

const props = withDefaults(defineProps<{ height?: string }>(), {
  height: '420px',
})

const root = ref<HTMLElement | null>(null)
let iframe: HTMLIFrameElement | null = null

const SRCDOC = ${JSON.stringify(srcdoc)}

function mount() {
  if (!root.value) return
  iframe?.remove()
  iframe = document.createElement('iframe')
  iframe.title = ${JSON.stringify(label + ' agent loader')}
  iframe.setAttribute('aria-label', ${JSON.stringify(label + ' agent loader')})
  iframe.style.cssText = 'width:100%;height:100%;min-height:inherit;border:0;display:block;background:transparent'
  iframe.srcdoc = SRCDOC
  root.value.appendChild(iframe)
}

onMounted(mount)
watch(() => props.height, () => { /* layout only — iframe scales via CSS */ })
onBeforeUnmount(() => { iframe?.remove(); iframe = null })
${closeScript}

<template>
  <div
    ref="root"
    class="cos-agent-loader"
    :style="{ minHeight: height }"
    role="status"
    aria-busy="true"
    aria-live="polite"
  />
${closeTemplate}

<style scoped>
.cos-agent-loader {
  width: 100%;
  position: relative;
  overflow: hidden;
}
${closeStyle}
` };
}
function downloadVueSfc() {
  const btn = $('#copyVue'), label = $('#copyVueLabel');
  const { file, code } = buildVueSfc();
  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = file;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  btn.classList.add('ok');
  label.textContent = 'Downloaded';
  btn.title = `Saved ${file} — drop it into your Vue project`;
  setTimeout(() => { btn.classList.remove('ok'); label.textContent = 'Download Vue'; btn.title = 'Download a drop-in Vue SFC for the active loader'; }, 2200);
}

document.getElementById('copyVue').addEventListener('click', () => {
  try { downloadVueSfc(); } catch (e) { console.error(e); }
});
</script>
