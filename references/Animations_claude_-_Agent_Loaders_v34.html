<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consent OS — Agent Loaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ==========================================================================
   Consent OS — Agent Loaders (generic)
   Loaders shown while work is processing. They carry no data: workflow and
   intelligence are told with icons, skeleton shapes and motion.

   Motion system
     personality  Premium / Corporate — no overshoot, no bounce
     --ease       cubic-bezier(.16,1,.3,1)   arrivals
     --ease-io    cubic-bezier(.65,0,.35,1)  travel between two points
     durations    160 feedback · 320 state · 560 focal travel
     colour law   blue working · green done · amber waiting / review · rose issue
   The agent core is the one recurring character: its ring is a state machine
   (think · act · verify · wait · done), with status copy in the pill below.
   ========================================================================== */
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --surface-3: #EEF1F5;
  --ink: #0B1220;
  --ink-2: #273041;
  --muted: #5B6474;
  --faint: #98A1B0;
  --line: rgba(11, 18, 32, .08);
  --line-2: rgba(11, 18, 32, .14);
  --sk: #E6EAF0;
  --blue: #3366F0;   --blue-soft: rgba(51,102,240,.10);  --blue-line: rgba(51,102,240,.32);
  --green: #0E9F6E;  --green-soft: rgba(14,159,110,.10); --green-line: rgba(14,159,110,.34);
  --amber: #C47F0E;  --amber-soft: rgba(214,140,18,.12); --amber-line: rgba(214,140,18,.40);
  --rose: #D23F4D;   --rose-soft: rgba(210,63,77,.10);   --rose-line: rgba(210,63,77,.34);
  --violet: #6B57D2; --violet-soft: rgba(107,87,210,.10);
  --shadow-1: 0 1px 2px rgba(11,18,32,.05);
  --shadow-2: 0 1px 2px rgba(11,18,32,.04), 0 8px 20px -10px rgba(11,18,32,.16);
  --shadow-3: 0 1px 3px rgba(11,18,32,.04), 0 34px 80px -34px rgba(11,18,32,.24);
  --ease: cubic-bezier(.16,1,.3,1);
  --ease-io: cubic-bezier(.65,0,.35,1);
  --t1: 160ms; --t2: 320ms; --t3: 560ms;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0D13; --surface: #11151D; --surface-2: #151A23; --surface-3: #1C2230;
    --ink: #EDF0F5; --ink-2: #C9D0DB; --muted: #8C96A6; --faint: #5E6878;
    --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.13); --sk: #232A37;
    --blue: #6E95FF; --blue-soft: rgba(110,149,255,.13); --blue-line: rgba(110,149,255,.38);
    --green: #3CCB97; --green-soft: rgba(60,203,151,.13); --green-line: rgba(60,203,151,.38);
    --amber: #E6A63A; --amber-soft: rgba(230,166,58,.14); --amber-line: rgba(230,166,58,.42);
    --rose: #F06B77; --rose-soft: rgba(240,107,119,.13); --rose-line: rgba(240,107,119,.38);
    --violet: #9C8CF0; --violet-soft: rgba(156,140,240,.14);
    --shadow-1: 0 1px 2px rgba(0,0,0,.3);
    --shadow-2: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.6);
    --shadow-3: 0 1px 3px rgba(0,0,0,.3), 0 34px 80px -34px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0D13; --surface: #11151D; --surface-2: #151A23; --surface-3: #1C2230;
  --ink: #EDF0F5; --ink-2: #C9D0DB; --muted: #8C96A6; --faint: #5E6878;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.13); --sk: #232A37;
  --blue: #6E95FF; --blue-soft: rgba(110,149,255,.13); --blue-line: rgba(110,149,255,.38);
  --green: #3CCB97; --green-soft: rgba(60,203,151,.13); --green-line: rgba(60,203,151,.38);
  --amber: #E6A63A; --amber-soft: rgba(230,166,58,.14); --amber-line: rgba(230,166,58,.42);
  --rose: #F06B77; --rose-soft: rgba(240,107,119,.13); --rose-line: rgba(240,107,119,.38);
  --violet: #9C8CF0; --violet-soft: rgba(156,140,240,.14);
  --shadow-1: 0 1px 2px rgba(0,0,0,.3);
  --shadow-2: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.6);
  --shadow-3: 0 1px 3px rgba(0,0,0,.3), 0 34px 80px -34px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: stretch;
  overflow-x: hidden;
}
/* iframe embed — transparent chrome-less stage for host apps */
html.embed .topwrap,
html.embed .runtime,
html.embed .copy-vue { display: none !important; }
html.embed body { min-height: 0; background: transparent; overflow: hidden; }
html.embed main { padding: 0; align-items: stretch; }
html.embed .loader { width: 100%; gap: 8px; }
html.embed .stage-wrap { max-height: none; min-height: 0; }
html.embed .copy { width: 100%; gap: 10px; }
html.embed .title { font-size: 15px; }
html.embed .status { box-shadow: none; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---------- Switcher ---------- */
.bar { width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 22px 16px 0; }
.tabs { position: relative; display: flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-1); overflow-x: auto; scrollbar-width: none; max-width: calc(100vw - 88px); }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; z-index: 1; appearance: none; border: 0; background: transparent; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--muted); padding: 7px 13px; border-radius: 999px; white-space: nowrap; transition: color var(--t1) var(--ease), transform var(--t1) var(--ease); }
.tab:active { transform: scale(.97); }
.tab:hover, .tab[aria-selected="true"] { color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.tab-ind { position: absolute; z-index: 0; top: 4px; left: 0; height: calc(100% - 8px); width: 0; background: var(--surface-3); border-radius: 999px; transition: transform var(--t2) var(--ease), width var(--t2) var(--ease); }
.replay { appearance: none; border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); cursor: pointer; box-shadow: var(--shadow-1); flex: none; transition: color var(--t1) var(--ease); }
.replay:hover { color: var(--ink); }
.replay:active { transform: scale(.96); }
.replay:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.replay svg { width: 15px; height: 15px; }
.copy-vue {
  appearance: none; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 14px;
  border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer;
  box-shadow: var(--shadow-1); flex: none; font-size: 12px; font-weight: 550; white-space: nowrap;
  transition: color var(--t1) var(--ease), background var(--t1) var(--ease), border-color var(--t1) var(--ease), transform var(--t1) var(--ease);
}
.copy-vue:hover { color: var(--ink); }
.copy-vue:active { transform: scale(.97); }
.copy-vue:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.copy-vue svg { width: 14px; height: 14px; flex: none; }
.copy-vue.ok { color: var(--blue); border-color: var(--blue-line); background: var(--blue-soft); }
.copy-vue.ok span { min-width: 7.5em; }

/* ---------- Loader ---------- */
main { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 24px 44px; }
.loader { width: min(980px, 100%); display: flex; flex-direction: column; align-items: center; gap: 0; }
.stage-wrap { position: relative; width: 100%; aspect-ratio: 720 / 360; max-height: calc(100vh - 300px); min-height: 180px; }
.stage {
  position: absolute; left: 50%; top: 50%; width: 720px; height: 360px;
  transform: translate(-50%, -50%) scale(var(--fit, 1)); transform-origin: center;
}
.stage-bg { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; }
.wires, .fx { position: absolute; inset: 0; pointer-events: none; }
.wires { width: 720px; height: 360px; overflow: visible; }
.fx { z-index: 8; }
.clip { position: absolute; inset: 0; pointer-events: none; }
.spot { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent, var(--blue)) 12%, transparent), transparent);
  transition: transform 800ms var(--ease), opacity 600ms var(--ease); }
.spot.on { opacity: 1; }
.reticle { position: absolute; inset: 0; z-index: 9; pointer-events: none; opacity: 0; transition: opacity var(--t2) var(--ease); }
.reticle.on { opacity: 1; }
.rc { position: absolute; left: 0; top: 0; width: 8px; height: 8px; border: 0 solid var(--accent, var(--blue)); transition: transform var(--t3) var(--ease); }
.rc.tl { border-top-width: 1.75px; border-left-width: 1.75px; border-top-left-radius: 4px; }
.rc.tr { border-top-width: 1.75px; border-right-width: 1.75px; border-top-right-radius: 4px; }
.rc.bl { border-bottom-width: 1.75px; border-left-width: 1.75px; border-bottom-left-radius: 4px; }
.rc.br { border-bottom-width: 1.75px; border-right-width: 1.75px; border-bottom-right-radius: 4px; }

.loader { --accent: var(--blue); }
.loader[data-state="wait"] { --accent: var(--amber); }
.loader[data-state="done"] { --accent: var(--green); }

/* ---------- Text + progress ---------- */
.copy { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(480px, 100%); }
.title { font-size: 19px; font-weight: 600; letter-spacing: -.015em; text-align: center; display: grid; }
.title > span { grid-area: 1 / 1; }
.status { display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); font-size: 12.5px; font-weight: 500; color: var(--ink-2); transition: border-color var(--t2) var(--ease); }
.loader[data-state="wait"] .status { border-color: var(--amber-line); }
.loader[data-state="done"] .status { border-color: var(--green-line); }
.mini { width: 22px; height: 22px; flex: none; }
.roll { display: grid; overflow: hidden; height: 18px; }
.roll > span { grid-area: 1 / 1; white-space: nowrap; line-height: 18px; }
.segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
.seg { height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.seg i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: inherit; transform-origin: left; transform: scaleX(0); transition: transform 600ms var(--ease), background var(--t3) var(--ease); }
.seg.run i { transform: scaleX(.88); transition: transform 7s cubic-bezier(.1,.6,.2,1); }
.seg.done i { transform: scaleX(1); }

/* ---------- Agent core (also the mini core) ---------- */
.av-track { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.av-arc { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; transform-box: fill-box; transform-origin: center;
  transition: stroke-dasharray var(--t3) var(--ease), stroke var(--t2) var(--ease), opacity var(--t2) var(--ease); }
.av-a1 { stroke-dasharray: 22 78; }
.av-a2 { stroke-dasharray: 10 90; opacity: .5; }
.av-core { fill: var(--accent); transform-box: fill-box; transform-origin: center; transition: transform var(--t2) var(--ease), fill var(--t2) var(--ease); }
.av-check { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 420ms var(--ease) 160ms; }
[data-state="think"] .av-a1 { animation: spin 1.6s linear infinite; }
[data-state="think"] .av-a2 { animation: spin 2.6s linear infinite reverse; }
[data-state="tool"] .av-a1 { stroke-dasharray: 34 66; animation: spin .9s linear infinite; }
[data-state="tool"] .av-a2 { opacity: 0; }
[data-state="tool"] .av-core { transform: scale(.82); }
[data-state="verify"] .av-a1 { stroke-dasharray: 14 36; animation: spin 1.3s linear infinite; }
[data-state="verify"] .av-a2 { stroke-dasharray: 14 36; opacity: .9; animation: spin 1.3s linear infinite; animation-delay: -.65s; }
[data-state="wait"] .av-a1 { stroke-dasharray: 3 9.5; animation: spin 6s linear infinite; }
[data-state="wait"] .av-a2 { opacity: 0; }
[data-state="wait"] .av-core { transform: scale(.7); }
[data-state="done"] .av-a1 { stroke-dasharray: 100 0; }
[data-state="done"] .av-a2 { opacity: 0; }
[data-state="done"] .av-core { transform: scale(1.9); }
[data-state="done"] .av-check { stroke-dashoffset: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* stage-sized core: a tile with the ring around it and a spark inside */
.core { position: absolute; z-index: 3; display: grid; place-items: center; }
.core svg.ring { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); overflow: visible; }
.core .face { width: 100%; height: 100%; border-radius: 30%; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2); display: grid; place-items: center; color: var(--accent); transition: color var(--t2) var(--ease), border-color var(--t2) var(--ease); position: relative; overflow: hidden; }
.core .face::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); transition: background var(--t2) var(--ease); }
.core .face svg { position: relative; width: 44%; height: 44%; }
.core .face .spark { transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease); transform-origin: center; transform-box: fill-box; }
.core .face .done-ic { position: absolute; opacity: 0; transform: scale(.7); transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease); }
[data-state="done"] .core .face { border-color: var(--green-line); }
[data-state="done"] .core .face .spark { opacity: 0; transform: scale(.7); }
[data-state="done"] .core .face .done-ic { opacity: 1; transform: none; }
.core .ring .av-track { stroke-width: .5; }
.core .ring .av-arc { stroke-width: .8; }

/* ---------- Icon node ---------- */
.nd { position: absolute; z-index: 2; border-radius: 28%; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); color: var(--faint); display: grid; place-items: center;
  transition: color var(--t2) var(--ease), border-color var(--t2) var(--ease), box-shadow var(--t2) var(--ease), background var(--t2) var(--ease), opacity var(--t2) var(--ease), transform var(--t3) var(--ease); }
.nd > .ic { width: 44%; height: 44%; }
.nd[data-s="run"] { color: var(--blue); border-color: var(--blue-line); box-shadow: 0 0 0 4px var(--blue-soft), var(--shadow-1); }
.nd[data-s="done"] { color: var(--green); }
.nd[data-s="wait"] { color: var(--amber); border-color: var(--amber-line); box-shadow: 0 0 0 4px var(--amber-soft), var(--shadow-1); }
.nd[data-s="warn"] { color: var(--amber); border-color: var(--amber-line); }
.nd[data-s="ghost"] { opacity: 0; transform: scale(.9); }
.nd.dashed { border-style: dashed; border-color: var(--amber-line); background: var(--amber-soft); color: var(--amber); }
.badge { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 2px solid var(--surface); opacity: 0; transform: scale(.5); transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease), background var(--t2) var(--ease); }
.badge svg { width: 8px; height: 8px; stroke-width: 3.4; }
[data-s="done"] > .badge { opacity: 1; transform: none; background: var(--green); }
[data-s="warn"] > .badge { opacity: 1; transform: none; background: var(--amber); }
.nd-ring { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); overflow: visible; pointer-events: none; }
.nd-ring circle { fill: none; stroke-width: 1.3; stroke-linecap: round; }
.nd-ring .p { stroke: var(--blue); stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke var(--t2) var(--ease); }
[data-s="done"] .nd-ring .p { stroke: var(--green-line); }
[data-s="wait"] .nd-ring .p { stroke: var(--amber); }

/* ---------- Skeleton + cards ---------- */
.card { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-2); }
.sk { display: block; height: 7px; border-radius: 4px; background: var(--sk); }
.sk.t { height: 9px; }
.fill { display: block; height: 7px; border-radius: 4px; background: var(--blue); transform-origin: left; transform: scaleX(0); }
.wire { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.wire.hot { stroke: var(--blue); stroke-opacity: .55; }
.wire.ok { stroke: var(--green-line); }
.wire.warn { stroke: var(--amber-line); stroke-dasharray: 3 4; }
.orbit { fill: none; stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 5; }
.pk-core { fill: var(--blue); }
.pk-halo { fill: var(--blue); opacity: .16; }
.spin { width: 16px; height: 16px; flex: none; }
.spin circle { fill: none; stroke-width: 2; }
.spin .t { stroke: var(--line-2); }
.spin .a { stroke: var(--blue); stroke-linecap: round; stroke-dasharray: 14 86; transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
.okdot, .warndot, .rosedot { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.okdot { background: var(--green); } .warndot { background: var(--amber); } .rosedot { background: var(--rose); }
.okdot svg, .warndot svg, .rosedot svg { width: 9px; height: 9px; stroke-width: 3.2; }
.cap { position: absolute; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--blue); color: #fff; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 4px 12px -2px color-mix(in srgb, var(--blue) 45%, transparent); }
.cap svg { width: 11px; height: 11px; }
.dotc { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--blue)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--blue)) 20%, transparent); }

/* ==========================================================================
   Scene specifics
   ========================================================================== */
/* Secure */
.sec-rows { display: flex; flex-direction: column; gap: 9px; }
.sec-row { display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 8px; border-radius: 7px; background: var(--surface-2); }
.sec-row .dot { width: 6px; height: 6px; border-radius: 2px; background: var(--sk); flex: none; transition: background var(--t2) var(--ease); }
.sec-row .sk, .sec-row .ciph { flex: none; }
.ciph { display: flex; gap: 3px; }
.ciph i { width: 6px; height: 6px; border-radius: 1.5px; background: var(--blue); opacity: .25; }
.sec-row.enc .dot { background: var(--blue); }
.sec-row.ok .dot { background: var(--green); }
.sec-row .chk { margin-left: auto; opacity: 0; transform: scale(.5); transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease); }
.sec-row.ok .chk { opacity: 1; transform: none; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h .hic { width: 32px; height: 32px; border-radius: 9px; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; transition: background var(--t3) var(--ease), color var(--t3) var(--ease); }
.card-h .hic svg { width: 16px; height: 16px; }
.card-h .lines { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card.secured { border-color: var(--green-line); box-shadow: 0 0 0 5px var(--green-soft), var(--shadow-2); transition: border-color var(--t3) var(--ease), box-shadow var(--t3) var(--ease); }
.card.secured .card-h .hic { background: var(--green-soft); color: var(--green); }
.pipe { position: absolute; height: 1.5px; background: var(--line-2); transform-origin: left; transform: scaleX(0); }
.pipe-glow { position: absolute; background: linear-gradient(90deg, transparent, var(--blue-soft) 25%, var(--blue-soft) 75%, transparent); opacity: 0; transition: opacity var(--t3) var(--ease); }
.pipe-glow.on { opacity: 1; }
.key { position: absolute; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 1px solid var(--blue-line); color: var(--blue); display: grid; place-items: center; box-shadow: var(--shadow-2); opacity: 0; }
.key svg { width: 15px; height: 15px; }
.lockchip { position: absolute; width: 40px; height: 40px; border-radius: 12px; background: var(--surface); border: 1px solid var(--blue-line); color: var(--blue); display: grid; place-items: center; box-shadow: 0 0 0 5px var(--blue-soft), var(--shadow-2); opacity: 0; transform: scale(.9); transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease), color var(--t3) var(--ease), border-color var(--t3) var(--ease), box-shadow var(--t3) var(--ease); }
.lockchip.on { opacity: 1; transform: none; }
.lockchip svg { width: 18px; height: 18px; overflow: visible; }
.lockchip .shackle { transition: transform 420ms var(--ease); transform: translateY(-3px); }
.lockchip.latched .shackle { transform: none; }
.lockchip.latched { color: var(--green); border-color: var(--green-line); box-shadow: 0 0 0 5px var(--green-soft), var(--shadow-2); }

/* Route */
.qcard { position: absolute; left: 0; top: 0; width: 132px; height: 50px; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: transform 460ms var(--ease), opacity 320ms var(--ease); }
.qcard .qi { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-3); color: var(--faint); display: grid; place-items: center; flex: none; }
.qcard .qi svg { width: 13px; height: 13px; }
.qcard .ls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.lens-body { display: flex; flex-direction: column; gap: 11px; transition: opacity 220ms var(--ease), transform 220ms var(--ease); }
.lens-body.out { opacity: 0; transform: translateY(-6px); }
.lens-body.pre { opacity: 0; transform: translateY(8px); transition: none; }
.tok { display: flex; gap: 6px; }
.tok .sk { position: relative; overflow: hidden; height: 8px; }
.tok .sk::after { content: ""; position: absolute; inset: 0; background: var(--blue); border-radius: inherit; transform: scaleX(0); transform-origin: left; transition: transform 420ms var(--ease); }
.lens.lit .tok .sk.kt::after { transform: scaleX(1); }
.scanbar { position: absolute; left: 0; right: 0; height: 40px; background: linear-gradient(180deg, transparent, var(--blue-soft)); border-bottom: 1.5px solid var(--blue-line); opacity: 0; pointer-events: none; }
.verdict { display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.conf { position: relative; width: 26px; height: 26px; flex: none; }
.conf svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.conf circle { fill: none; stroke-width: 3; }
.conf .t { stroke: var(--surface-3); }
.conf .p { stroke: var(--blue); stroke-dasharray: 100; stroke-dashoffset: 100; stroke-linecap: round; transition: stroke-dashoffset 600ms var(--ease), stroke var(--t2) var(--ease); }
.conf.low .p { stroke: var(--amber); }
.vchip { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; opacity: 0; transform: scale(.8); transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease); }
.vchip.on { opacity: 1; transform: none; }
.vchip svg { width: 10px; height: 10px; stroke-width: 2.4; }
.lane { position: absolute; left: 0; width: 130px; height: 42px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: border-color 400ms var(--ease), background 400ms var(--ease); }
.lane .li { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: #fff; background: var(--c); flex: none; }
.lane .li svg { width: 12px; height: 12px; }
.lane .meter { flex: 1; height: 5px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
.lane .meter i { display: block; height: 100%; width: 100%; background: var(--c); transform-origin: left; transform: scaleX(0); transition: transform 500ms var(--ease); border-radius: inherit; }
.lane.hit { border-color: var(--line-2); background: var(--surface-2); transition-duration: 60ms; }
.lane.review { border-style: dashed; border-color: var(--amber-line); background: var(--amber-soft); }
.lane.review .pile { flex: 1; display: flex; gap: 4px; }
.lane.review .pile i { width: 10px; height: 10px; border-radius: 3px; background: var(--amber); }

/* Gather */
.fld { display: grid; grid-template-columns: 1fr; gap: 6px; }
.fld-box { position: relative; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px; transition: border-color var(--t2) var(--ease), box-shadow var(--t2) var(--ease), background var(--t2) var(--ease); }
#gForm .fld-src { display: none !important; }
.fld.active .fld-box { border-color: var(--blue-line); background: var(--surface); }
.fld.filled .fld-box { background: var(--surface); }
.fld.verified .fld-box { border-color: var(--green-line); }
.fld-box .fill { height: 6px; background: var(--ink-2); opacity: .75; }
.fld-box .fill.alt { background: var(--muted); }
.fld-box .fill.struck { background: var(--rose); opacity: .55; }
.fld-src { position: absolute; right: 8px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; opacity: 0; transform: scale(.6); transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease), background var(--t2) var(--ease), color var(--t2) var(--ease); }
.fld-src svg { width: 10px; height: 10px; }
.fld.filled .fld-src { opacity: 1; transform: none; }
.fld.verified .fld-src { background: var(--green); color: #fff; }

/* Verify */
.chk-row { position: absolute; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: border-color var(--t2) var(--ease), background var(--t2) var(--ease); }
.chk-row .ci { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; flex: none; transition: background var(--t2) var(--ease), color var(--t2) var(--ease); }
.chk-row .ci svg { width: 13px; height: 13px; }
.chk-row .ls { flex: 1; min-width: 0; display: flex; align-items: center; }
.chk-row .lbl { font-size: 11px; font-weight: 500; letter-spacing: -.01em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--t2) var(--ease); }
.chk-row .st { width: 16px; height: 16px; display: grid; place-items: center; flex: none; }
.chk-row[data-s="run"] .ci { background: var(--blue-soft); color: var(--blue); }
.chk-row[data-s="run"] .lbl,
.chk-row[data-s="ok"] .lbl { color: var(--ink); }
.chk-row[data-s="ok"] .ci { background: var(--green-soft); color: var(--green); }
/* right-side checklist: show every row (no clip / fade / scroll hide) */
.chk-scroll {
  position: absolute; left: 418px; top: 28px; width: 164px; height: auto; z-index: 2;
  display: flex; flex-direction: column; gap: 10px; padding: 8px 4px;
  overflow: visible;
}
.chk-scroll .chk-row { position: relative; left: auto; top: auto; width: 100%; flex: none; }
.chk-row[data-s="warn"] { border-color: var(--amber-line); background: color-mix(in srgb, var(--amber-soft) 55%, var(--surface)); }
.chk-row[data-s="warn"] .ci { background: var(--amber-soft); color: var(--amber); }
.env { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px -2px color-mix(in srgb, var(--blue) 50%, transparent); }
.env svg { width: 11px; height: 11px; }

/* Map */
.chip-n { position: absolute; height: 32px; width: 32px; }
.chip-n .u { position: absolute; left: 4px; right: 4px; bottom: -8px; height: 2px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.chip-n .u i { display: block; height: 100%; width: 100%; background: var(--blue); transform-origin: left; transform: scaleX(0); }
.chip-n[data-s="done"] .u i { background: var(--green); }
.tn { opacity: 0; transform: scale(.9); }
.nd.tn[data-k="root"] { color: var(--ink-2); }
.nd.tn:not([data-k="root"]) { background: color-mix(in srgb, currentColor 7%, var(--surface)); border-color: color-mix(in srgb, currentColor 22%, transparent); }
.tn.on { opacity: 1; transform: none; }
.tn .cdot { position: absolute; left: 50%; bottom: -12px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--c); }

/* Clean — stacked record cards, not a boxed spreadsheet */
.tbl { overflow: hidden; background: transparent; border: 0; box-shadow: none; }
.trow { position: absolute; left: 0; right: 0; height: 36px; display: grid; grid-template-columns: 22px 1.1fr 1.3fr .9fr .8fr; gap: 8px; align-items: center; padding: 0 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 80%, transparent), 0 4px 10px -8px rgba(11,18,32,.2); transition: background var(--t2) var(--ease), border-color var(--t2) var(--ease), box-shadow var(--t2) var(--ease); }
.trow.head { opacity: .78; }
.trow.head .sk { height: 6px; background: var(--surface-3); }
.trow .num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); color: var(--faint); display: grid; place-items: center; }
.trow .num svg { width: 11px; height: 11px; }
.trow.dup { background: var(--amber-soft); border-color: var(--blue-line); }
.trow.merged { border-color: var(--blue-line); }
.trow.merged .num { background: var(--amber); }
.cl { position: relative; height: 8px; }
.cl > span { position: absolute; left: 0; top: 0; height: 8px; border-radius: 4px; transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease), background var(--t2) var(--ease); }
.cl .o { background: var(--sk); }
.cl .n { background: var(--green); opacity: 0; transform: translateY(6px); }
.cl.flag .o { background: var(--rose); opacity: .7; }
.cl.fixed .o { opacity: 0; transform: translateY(-6px); }
.cl.fixed .n { opacity: .85; transform: none; }
.cl .spk { position: absolute; top: -5px; width: 12px; height: 12px; color: var(--green); opacity: 0; transform: scale(.5); transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease); }
.cl.fixed .spk { opacity: 1; transform: none; }
.tscan { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(180deg, transparent, var(--blue-soft)); border-bottom: 1.5px solid var(--blue-line); opacity: 0; z-index: 2; }
.bin { position: absolute; width: 130px; height: 56px; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: border-color 400ms var(--ease), background 400ms var(--ease); }
.bin .bi { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--c); flex: none; }
.bin .bi svg { width: 14px; height: 14px; }
.bin .act { flex: 1; display: flex; align-items: flex-end; gap: 4px; height: 16px; }
.bin .act i { flex: 1; height: 100%; border-radius: 2px; background: var(--c); opacity: .55; transform: scaleY(.22); transform-origin: bottom; transition: transform 260ms var(--ease), opacity 400ms var(--ease); }
.bin.hit { border-color: var(--line-2); background: var(--surface-2); transition-duration: 60ms; }

/* Consent */
.tokn { position: absolute; left: 0; top: 0; width: 132px; height: 46px; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: transform 440ms var(--ease), opacity 320ms var(--ease); }
.tokn .av { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-3); color: var(--faint); display: grid; place-items: center; flex: none; }
.tokn .av svg { width: 12px; height: 12px; }
.tokn .ls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.gate-cur { height: 52px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 14px; transition: opacity 220ms var(--ease), transform 220ms var(--ease); }
.gate-cur.out { opacity: 0; transform: translateX(10px); }
.gate-cur.pre { opacity: 0; transform: translateX(-10px); transition: none; }
.gate-cur .av { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; flex: none; }
.gate-cur .av svg { width: 14px; height: 14px; }
.gate-cur .ls { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.gchk { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 10px; transition: background var(--t1) var(--ease); }
.gchk .gi { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; flex: none; transition: background var(--t1) var(--ease), color var(--t1) var(--ease); }
.gchk .gi svg { width: 12px; height: 12px; }
.gchk .ls { flex: 1; }
.gchk .st { width: 16px; height: 16px; }
.gchk[data-s="run"] .gi { background: var(--blue-soft); color: var(--blue); }
.gchk[data-s="ok"] .gi { background: var(--blue-soft); color: var(--blue); }
.gchk[data-s="warn"] { background: color-mix(in srgb, var(--blue) 6%, var(--surface)); }
.gchk[data-s="warn"] .gi { background: var(--blue-2); color: #fff; }
.gchk[data-s="fail"] { background: color-mix(in srgb, var(--blue-3) 8%, var(--surface)); }
.gchk[data-s="fail"] .gi { background: var(--blue-3); color: #fff; }
.gchk[data-s="run"] { background: color-mix(in srgb, var(--blue) 5%, transparent); }
.gchk[data-s="ok"] { background: color-mix(in srgb, var(--blue) 4%, transparent); }
.gchk .okdot { background: var(--blue); }
.gchk .warndot { background: var(--blue-2); }
.gchk .rosedot { background: var(--blue-3); }
.batch { position: absolute; inset: 0; border-radius: 14px; background: var(--surface); padding: 20px; display: flex; flex-direction: column; justify-content: center; gap: 16px; opacity: 0; transition: opacity var(--t3) var(--ease); pointer-events: none; }
.batch.on { opacity: 1; }
.workers { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.workers i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-3); transition: background 200ms var(--ease); }
.workers i.w { background: var(--blue-line); }
.workers i.d { background: var(--blue-line); }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.donut circle { fill: none; stroke-width: 11; }
.donut .trk { stroke: var(--surface-3); }
.donut .sg { stroke-dasharray: 0 100; }
.donut .mid { position: absolute; inset: 0; display: grid; place-items: center; color: var(--blue-2); transition: color var(--t2) var(--ease); }
.donut .mid svg { width: 22px; height: 22px; transform: none; stroke-width: 1.7; opacity: .92; }
.donut.done .mid { color: var(--blue); }
.legend { display: flex; flex-direction: column; gap: 7px; justify-content: center; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.dleg { position: absolute; display: flex; flex-direction: row; align-items: center; gap: 12px; }
.dleg .donut { position: relative; left: auto; top: auto; flex: none; }

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 120ms !important; transition-delay: 0ms !important; }
  .seg.run i { transform: scaleX(.5); }
}
@media (max-width: 520px) {
  .bar { padding-top: 14px; }
  .loader { gap: 20px; }
  .title { font-size: 15.5px; }
}

/* ==========================================================================
   v3 — depth layers
   primary  : the agent's work (scene)
   secondary: beams, ripples, orbiting tasks, gloss
   ambient  : neural dust that follows the agent's attention
   ========================================================================== */
.subtabs { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; margin: 10px auto 0; width: max-content; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
.subtabs::-webkit-scrollbar { display: none; }
.subtab { appearance: none; border: 0; background: transparent; cursor: pointer; font-size: 11.5px; font-weight: 500; color: var(--muted); padding: 6px 12px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: color var(--t1) var(--ease), background var(--t2) var(--ease), box-shadow var(--t2) var(--ease); }
.subtab b { font-weight: 600; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; background: var(--surface-3); color: var(--muted); }
.subtab:hover { color: var(--ink); }
.subtab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.subtab[aria-selected="true"] b { background: var(--ink); color: var(--surface); }
.subtab:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.topwrap { display: flex; flex-direction: column; align-items: center; width: 100%; }

.dust { position: absolute; inset: 0; width: 720px; height: 360px; }
.wave { position: absolute; left: 0; top: 0; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(closest-side, var(--green-soft), color-mix(in srgb, var(--green) 6%, transparent) 60%, transparent); opacity: 0; pointer-events: none; }
.beam { fill: none; stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 0 3px currentColor); }
.beam-head { filter: drop-shadow(0 0 4px currentColor); }
.ripple { position: absolute; border: 1.5px solid; pointer-events: none; }

/* glassier surfaces */
.nd { background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); }
.card { background: linear-gradient(180deg, var(--surface) 0%, color-mix(in srgb, var(--surface-2) 60%, var(--surface)) 100%); }

/* core: scanner sweep + two orbiters, all state-driven */
.face .scanner { position: absolute; inset: -30%; background: conic-gradient(from 0deg, transparent 0 62%, color-mix(in srgb, var(--accent) 28%, transparent) 92%, transparent); animation: spin 2.6s linear infinite; transition: opacity var(--t2) var(--ease); }
[data-state="tool"] .face .scanner { animation-duration: 1.2s; }
[data-state="verify"] .face .scanner { animation-duration: 1.8s; }
[data-state="wait"] .face .scanner, [data-state="done"] .face .scanner { opacity: 0; }
.face .orbiters { position: absolute; inset: 14%; animation: spin 3.2s linear infinite; transition: opacity var(--t2) var(--ease); }
.face .orbiters.o2 { inset: 4%; animation-duration: 5.4s; animation-direction: reverse; }
.face .orbiters i { position: absolute; top: -2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.face .orbiters.o2 i { width: 3px; height: 3px; opacity: .6; }
[data-state="tool"] .face .orbiters { animation-duration: 1.4s; }
[data-state="done"] .face .orbiters, [data-state="wait"] .face .orbiters.o2 { opacity: 0; }
[data-state="wait"] .face .orbiters { animation-duration: 7s; }

/* nodes: tasks orbit while running */
.nd .tasks { position: absolute; inset: -13px; opacity: 0; transition: opacity var(--t2) var(--ease); animation: spin 2.2s linear infinite; pointer-events: none; }
.nd .tasks i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); top: -2px; left: 50%; margin-left: -2.5px; box-shadow: 0 0 6px var(--blue); }
.nd .tasks i:nth-child(2) { top: auto; bottom: -2px; opacity: .45; }
.nd[data-s="run"] .tasks { opacity: 1; }
.nd[data-s="wait"] .tasks { opacity: 1; animation-duration: 6s; }
.nd[data-s="wait"] .tasks i { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

/* skeleton shimmer + status sheen */
.sk { background: linear-gradient(90deg, var(--sk) 0 38%, color-mix(in srgb, var(--sk) 62%, var(--surface)) 50%, var(--sk) 62% 100%) 0 0 / 300% 100%; animation: shimmer 3.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0% 0; } }
.loader:not([data-state="done"]) .roll > span:last-child { background: linear-gradient(90deg, var(--ink-2) 0 38%, var(--accent) 50%, var(--ink-2) 62% 100%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.4s linear infinite; }
.seg { position: relative; }
.seg.run::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, #fff 75%, transparent), transparent); transform: translateX(-100%); animation: sheen 1.8s var(--ease-io) infinite; }
@keyframes sheen { to { transform: translateX(100%); } }

/* gloss sweep for "sealed" moments */
.gloss { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
.gloss::after { content: ""; position: absolute; top: 0; bottom: 0; width: 45%; left: -60%; background: linear-gradient(100deg, transparent, color-mix(in srgb, #fff 55%, transparent), transparent); }
.gloss.go::after { animation: glossgo 1.1s var(--ease-io) forwards; }
@keyframes glossgo { to { left: 120%; } }

/* encrypted traffic */
.stream { position: absolute; height: 4px; border-radius: 2px; background: radial-gradient(circle, var(--blue) 1.3px, transparent 1.8px) 0 0 / 12px 4px; opacity: 0; transition: opacity var(--t3) var(--ease); animation: flow .5s linear infinite; }
.stream.r { animation-direction: reverse; animation-duration: .8s; }
.stream.on { opacity: .75; }
@keyframes flow { to { background-position: 12px 0; } }

/* ---------- Brand constellation ---------- */
.pt { position: absolute; left: 0; top: 0; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--faint); opacity: 0;
  transition: transform 1100ms var(--ease-io), background 420ms var(--ease), opacity 420ms var(--ease), box-shadow 420ms var(--ease); }
.pt.on { opacity: .9; }
.pt.tint { background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 16%, transparent); }
.cl-ring { position: absolute; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--c) 45%, transparent); opacity: 0; transform: scale(.5); transition: opacity 600ms var(--ease), transform 900ms var(--ease); pointer-events: none; }
.cl-ring.on { opacity: 1; transform: none; }
.cl-halo { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 12%, transparent), transparent); opacity: 0; transition: opacity 900ms var(--ease); pointer-events: none; }
.cl-halo.on { opacity: 1; }
.orbit-c { position: absolute; width: 0; height: 0; animation: spin 26s linear infinite; }
.orbit-c.rev { animation-direction: reverse; animation-duration: 32s; }
.orbit-c .pt { opacity: .9; transition: none; }

/* ---------- Suggestion diff ---------- */

/* ---------- Record deck ---------- */
.deck { position: absolute; width: 150px; height: 60px; z-index: 2; transition: filter 320ms var(--ease); }

/* ==========================================================================
   v4 — AI blob as the central processor, refined surfaces, no particles
   ========================================================================== */
.core.blob { position: absolute; z-index: 3; display: grid; place-items: center; }

}

}

/* ---------- Encryption: whole-page loader ---------- */
.pg { position: absolute; inset: 0; overflow: visible; }

.pg-b::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 500ms var(--ease);

.pg-b.k-tk { border-radius: 3px; background: var(--surface-3); }

.pg.sealed .pg-b::after { background-image: radial-gradient(circle, color-mix(in srgb, var(--green) 45%, transparent) 1.1px, transparent 1.6px); }
.pg-b.k-bt, .pg-b.k-dt.k-on { transition: background 600ms var(--ease), border-color 600ms var(--ease); }
.pg.sealed .pg-b.k-bt { background: color-mix(in srgb, var(--green) 22%, var(--surface)); }
.pg.sealed .pg-b.k-dt.k-on { background: var(--green); border-color: var(--green); }
.pg-sweep { position: absolute; left: 0; right: 0; top: 0; height: 40px; opacity: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--green) 14%, transparent)); border-bottom: 1.5px solid var(--green-line);
  box-shadow: 0 0 10px 1px color-mix(in srgb, var(--green) 40%, transparent); }
.pg-veil { position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(130px 124px at 50% 47%, color-mix(in srgb, var(--bg) 92%, transparent) 45%, color-mix(in srgb, var(--bg) 0%, transparent) 100%); }
.shield { position: absolute; width: 160px; height: 184px; z-index: 2; overflow: visible; }

.sh-lock svg { width: 16px; height: 16px; overflow: visible; }

.sh-blind svg { width: 15px; height: 15px; }
.sh-blind.on { transform: scale(1); }

/* lighter page skeleton: it should whisper behind the shield */
.pg { opacity: .62; }
.pg-b { border-color: color-mix(in srgb, var(--line) 70%, transparent); }
.pg-b.k-cd { box-shadow: none; border-color: var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); }

.pg-b.k-bt { background: color-mix(in srgb, var(--blue) 9%, var(--surface)); }

.pg-b.enc:is(.k-cd, .k-bx, .k-ds)::after { opacity: .28; }
.pg-b.enc.k-ln, .pg-b.enc.k-ru { background: color-mix(in srgb, var(--blue) 18%, var(--sk)); }
.pg.sealed .pg-b.enc.k-ln, .pg.sealed .pg-b.enc.k-ru { background: color-mix(in srgb, var(--green) 18%, var(--sk)); }
.pg.sealed .pg-b.k-bt { background: color-mix(in srgb, var(--green) 12%, var(--surface)); }
.pg.sealed .pg-b.k-dt.k-on { background: color-mix(in srgb, var(--green) 60%, var(--surface)); }

/* ---------- Brand Map: radar + sunburst ---------- */
.radar, .sunburst { position: absolute; inset: 0; width: 720px; height: 360px; pointer-events: none; overflow: visible; }
.radar circle, .radar line { fill: none; stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 4; }
.radar { transition: opacity 800ms var(--ease); }
.radar.dim { opacity: .35; }
.sweep { position: absolute; width: 300px; height: 300px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 500ms var(--ease);
  background: conic-gradient(from 0deg, transparent 0 72%, color-mix(in srgb, var(--blue) 6%, transparent) 86%, color-mix(in srgb, var(--blue) 22%, transparent) 99.6%, var(--blue-line) 100%); }
.sweep.on { opacity: 1; }
.blip { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); opacity: 0; transform: scale(.3);
  transition: opacity 260ms var(--ease), transform 420ms var(--ease); }
.blip.on { opacity: 1; transform: none; }
.blip.in { opacity: 0; transition: transform 760ms var(--ease-io), opacity 400ms var(--ease) 380ms; }
.seg { fill: none; stroke-linecap: butt; transition: opacity var(--t3) var(--ease), stroke var(--t3) var(--ease); }
.seg.lob { opacity: .72; }
.seg.sug { opacity: .9; stroke: var(--amber) !important; stroke-dasharray: none; }
.bchip { position: absolute; z-index: 4; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--c); border: 2px solid var(--c); box-shadow: 0 4px 10px -4px rgba(11,18,32,.3); animation: chip-in 420ms var(--ease) both; }
.bchip svg { width: 12px; height: 12px; stroke-width: 2.2; }
.bchip.sug { width: 24px; height: 24px; background: var(--amber); border-color: var(--surface); color: #fff; }
@keyframes chip-in { from { opacity: 0; transform: scale(.6); } }

/* ---------- Matching: endless template stream ---------- */
.tstream { position: absolute; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14%, #000 86%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 14%, #000 86%, transparent 100%); }
.ttrack { display: flex; flex-direction: column; padding-top: 8px; }
.tstream.flow .ttrack { animation: tflow 14s linear infinite; }
@keyframes tflow { to { transform: translateY(-50%); } }
.tcard { flex: none; height: 40px; margin-bottom: 8px; padding: 0 10px; display: flex; align-items: center; gap: 9px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 80%, transparent), 0 4px 10px -8px rgba(11,18,32,.2); transition: border-color 200ms var(--ease), background 200ms var(--ease); }
.tcard .qi { width: 22px; height: 22px; border-radius: 7px; background: var(--surface-3); color: var(--faint); display: grid; place-items: center; flex: none; }
.tcard .qi svg { width: 11px; height: 11px; }
.tcard .ls { display: flex; flex-direction: column; gap: 5px; flex: 1; }
.tcard.picked { border-color: var(--blue-line); background: color-mix(in srgb, var(--blue) 6%, var(--surface)); }
.mlane { opacity: 0; transform: translateX(12px); transition: opacity var(--t3) var(--ease), transform var(--t3) var(--ease), border-color 400ms var(--ease), background 400ms var(--ease); }
.mlane.in { opacity: 1; transform: none; }
.mlane .act { flex: 1; display: flex; align-items: flex-end; gap: 4px; height: 16px; }
.mlane .act i { flex: 1; height: 100%; border-radius: 2px; background: var(--c); opacity: .55; transform: scaleY(.22); transform-origin: bottom; transition: transform 260ms var(--ease), opacity 400ms var(--ease); }
.mlane.done .act i { transform: scaleY(var(--h, .6)); opacity: .9; transition-duration: 620ms, 400ms; }
.mlane.done { border-color: color-mix(in srgb, var(--c) 32%, var(--line)); }
.tstream { transition: opacity 700ms var(--ease); }
.tstream.settle { opacity: .5; }
.tstream.settle .ttrack { animation-play-state: paused; }
.tchip { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line-2); color: var(--muted); box-shadow: var(--shadow-2); }
.tchip svg { width: 13px; height: 13px; }
.tchip.typed { background: var(--c); border-color: transparent; color: #fff; }
/* batched templates: cards stacked behind the chip */
.tchip.stack { box-shadow: 4px -4px 0 -1px var(--surface), 4px -4px 0 0 var(--line-2), var(--shadow-2); }
.tchip.stack.s3 { box-shadow: 4px -4px 0 -1px var(--surface), 4px -4px 0 0 var(--line-2), 8px -8px 0 -2px var(--surface), 8px -8px 0 -1px var(--line-2), var(--shadow-2); }
.tchip.typed.stack { box-shadow: 4px -4px 0 -1px color-mix(in srgb, var(--c) 55%, #fff), var(--shadow-2); }
.tchip.typed.stack.s3 { box-shadow: 4px -4px 0 -1px color-mix(in srgb, var(--c) 55%, #fff), 8px -8px 0 -2px color-mix(in srgb, var(--c) 30%, #fff), var(--shadow-2); }
.segs { grid-template-columns: repeat(var(--n, 4), 1fr); }

/* ---------- KYC: coloured sources + orbiting buffer ---------- */
.ksrc { color: var(--sc); }
.ksrc[data-s="idle"] { color: color-mix(in srgb, var(--sc) 70%, var(--muted)); }
.ksrc[data-s="run"] { color: var(--sc); border-color: color-mix(in srgb, var(--sc) 45%, transparent); background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 12%, var(--surface)), var(--surface)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 14%, transparent), 0 8px 18px -10px color-mix(in srgb, var(--sc) 50%, transparent); }
.ksrc[data-s="done"] { color: var(--sc); border-color: color-mix(in srgb, var(--sc) 35%, transparent); background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 8%, var(--surface)), var(--surface)); }
.ksrc .nd-ring .p { stroke: var(--sc); }
.kbuf-ring { position: absolute; border-radius: 50%; border: 1px dashed var(--line-2); opacity: 0; transform: scale(.7); transition: opacity var(--t3) var(--ease), transform 700ms var(--ease); pointer-events: none; }
.kbuf-ring.on { opacity: 1; transform: none; }
.kbuf { z-index: 4; }
.kfrag { position: absolute; width: 14px; height: 9px; margin: -4.5px 0 0 -7px; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 16%, transparent); animation: frag-in 420ms var(--ease) both; transition: transform 360ms var(--ease-in), opacity 360ms var(--ease); }
.kfrag.out { transform: scale(0); opacity: 0; }
@keyframes frag-in { from { transform: scale(0); opacity: 0; } }
.ksrc .nd-ring { transition: opacity var(--t2) var(--ease); }
.ksrc[data-s="done"] .nd-ring { opacity: 0; }

/* ---------- KYC scan bay ---------- */
.ksrc { transition: transform 600ms var(--ease-io), opacity var(--t3) var(--ease), color var(--t2) var(--ease), border-color var(--t2) var(--ease), background var(--t2) var(--ease), box-shadow var(--t2) var(--ease), filter var(--t3) var(--ease); }
.ksrc[data-s="idle"] { color: var(--faint); opacity: .55; filter: grayscale(1); }
.ksrc[data-s="idle"].active { opacity: 1; filter: none; color: var(--sc); z-index: 5; }
.ksrc[data-s="done"] { opacity: .8; }
.ksrc[data-s="done"].active { opacity: 1; }
.ksrc.lit { opacity: 1; box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 16%, transparent); }
.kbay { position: absolute; width: 64px; height: 64px; pointer-events: none; z-index: 6; opacity: 0; transform: scale(.85); transition: opacity var(--t2) var(--ease), transform var(--t3) var(--ease); --sc: var(--blue); }
.kbay.on { opacity: 1; transform: none; }
.kbay > i { position: absolute; width: 12px; height: 12px; border: 0 solid var(--sc); }
.kbay .tl { left: 0; top: 0; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 6px; }
.kbay .tr { right: 0; top: 0; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 6px; }
.kbay .bl { left: 0; bottom: 0; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 6px; }
.kbay .br { right: 0; bottom: 0; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 6px; }
.kbeam { position: absolute; left: 4px; right: 4px; top: 6px; height: 2px; border-radius: 2px; background: var(--sc); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--sc) 45%, transparent); opacity: 0; }
.kbay.on .kbeam { opacity: 1; animation: kscan 1s var(--ease-io) infinite alternate; }
@keyframes kscan { to { transform: translateY(48px); } }
.kfrag-f { display: block; width: 14px; height: 9px; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }

/* ==========================================================================
   Palette discipline: shades of blue for everything decorative.
   Green / amber / red appear only when they carry a status
   (done · waiting or needs review · error).
   ========================================================================== */
:root {
  --blue-2: #6F95F8; --blue-3: #1F44B8; --blue-4: #A9C0FB; --blue-5: #4A78F2;
  --violet: var(--blue-3); --violet-soft: color-mix(in srgb, var(--blue-3) 12%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue-2: #9DB6FF; --blue-3: #4D72E6; --blue-4: #C6D5FF; --blue-5: #7FA0FF;
    --violet: var(--blue-3); --violet-soft: color-mix(in srgb, var(--blue-3) 16%, transparent);
  }
}
:root[data-theme="dark"] {
  --blue-2: #9DB6FF; --blue-3: #4D72E6; --blue-4: #C6D5FF; --blue-5: #7FA0FF;
  --violet: var(--blue-3); --violet-soft: color-mix(in srgb, var(--blue-3) 16%, transparent);
}
/* duplicates / fixes / diffs: blue only — no amber, rose, or green in Migration */
.trow.dup { background: color-mix(in srgb, var(--blue) 7%, var(--surface)); border-color: var(--blue-line); }
.trow.merged { border-color: var(--blue-line); }
.trow.merged .num { background: var(--blue); }
.trow.read { border-color: var(--blue-line); background: color-mix(in srgb, var(--blue) 6%, var(--surface)); }
.cl .n { background: var(--blue); }
.cl.flag .o { background: var(--blue-4); opacity: .85; }
.cl .spk { color: var(--blue); }
.tbl .okdot { background: var(--blue); }
.tbl .warndot { background: var(--blue-2); }
.rec2.dupe { border-color: var(--blue-line); background: color-mix(in srgb, var(--blue) 7%, var(--surface)); }
.rec2.dupe .fp i { background: var(--blue); }
.rec2.merged { border-color: var(--blue-line); box-shadow: 4px 4px 0 -1px var(--surface), 4px 4px 0 0 var(--line-2), var(--shadow-1); }
.rec2.merged .fp i { background: var(--blue); }
.rec2 .mbadge { background: var(--blue); }
.diff .from { background: var(--blue-4); opacity: .75; }
.diff .from::after { display: none; }
.diff .to { background: var(--blue); }
.accept.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.rcard .qi { border-radius: 50%; }

/* review pile: newest enters on the right, oldest slides out on the left — never overflows */
.lane.review .pile { min-width: 0; overflow: hidden; justify-content: flex-end; flex-wrap: nowrap; height: 12px; align-items: center; }
.lane.review .pile i { flex: none; animation: pile-in 280ms var(--ease) both; }
@keyframes pile-in { from { opacity: 0; transform: translateX(8px) scale(.6); } }
.tray .pile { min-width: 0; overflow: hidden; max-height: 17px; align-content: flex-start; }
.kbay { transition: opacity var(--t2) var(--ease), transform var(--t3) var(--ease), left 520ms var(--ease-io), top 520ms var(--ease-io); }
.ksrc[data-s="idle"].active { transform: scale(1.12); }

/* ---------- KYC: checking, not "captured" ---------- */
.fld-box .fill.found { background: var(--blue-4); opacity: .75; height: 6px; }
.fld.checking .fld-box { overflow: hidden; }
.fld.checking .fld-box::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--blue) 16%, transparent), transparent); animation: fld-sweep 620ms var(--ease-io) both; }
@keyframes fld-sweep { to { left: 100%; } }
.fld.missing .fld-box { border-style: dashed; border-color: var(--line-2); background: transparent; }
.fld.filled .fld-src { background: var(--blue-soft); color: var(--blue); }
.fld.reviewed .fld-box { border-color: var(--blue-line); }
.fld.reviewed.missing .fld-box { border-color: var(--line-2); }
#gForm {
  background: transparent !important;
  border-color: transparent !important;
  box-shadow: none !important;
  transition: background var(--t3) var(--ease), box-shadow var(--t3) var(--ease);
}
#gForm.ready {
  background: transparent !important;
  border-color: transparent !important;
  box-shadow: none !important;
}
#vGate {
  background: var(--surface) !important;
  border-color: var(--line-2) !important;
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, #fff 90%, transparent),
    0 1px 2px rgba(11, 18, 32, .04),
    0 18px 40px -22px rgba(11, 18, 32, .18) !important;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
#vGate .gate-cur {
  height: 36px;
  gap: 8px;
  padding: 0 10px;
  background: var(--surface-2);
  border-color: var(--line);
  box-shadow: none;
}
#vGate .gate-cur .av { width: 22px; height: 22px; }
#vGate .gate-cur .av svg { width: 12px; height: 12px; }
#vGate .gate-cur .ls { gap: 5px; }
#vGate .gchk {
  height: 26px;
  gap: 8px;
  padding: 0 8px;
  background: transparent;
}
#vGate .gchk .gi { width: 20px; height: 20px; border-radius: 6px; }
#vGate .gchk .gi svg { width: 11px; height: 11px; }
#vGate .gchk[data-s="run"],
#vGate .gchk[data-s="ok"] {
  background: var(--surface-2);
}
#vGate .batch {
  background: var(--surface-2);
  border-color: var(--line);
  padding: 14px;
  gap: 12px;
}
#vGate .workers { gap: 4px; }
.loader[data-g="consent"] .nd[data-s="done"] {
  color: var(--blue);
  border-color: color-mix(in srgb, var(--blue) 28%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 8%, var(--tile-a)), var(--tile-b));
}
.loader[data-g="consent"] [data-s="done"] > .badge { background: var(--blue); }
.ksrc[data-s="done"] > .badge { background: var(--blue); }

/* review aid: run timer */
.runtime { position: fixed; top: 18px; right: 18px; z-index: 50; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.runtime b { color: var(--ink); font-weight: 600; }
.runtime i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
.runtime.done i { background: var(--green); }
@media (max-width: 900px) { .runtime { top: auto; bottom: 14px; } }

/* ---------- KYC Verify: document read + telecom approvals ---------- */
.docbeam { position: absolute; left: 0; right: 0; top: 0; height: 36px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--blue) 14%, transparent)); border-bottom: 1.5px solid var(--blue-line); opacity: 0; pointer-events: none; }
.docbeam.on { opacity: 1; animation: docscan 1.1s var(--ease-io) infinite alternate; }
@keyframes docscan { from { transform: translateY(-10px); } to { transform: translateY(150px); } }
.kdoc.read { border-color: var(--blue-line); }
.telco { position: absolute; width: 112px; height: 76px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 80%, transparent), 0 8px 20px -12px rgba(11,18,32,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: border-color var(--t2) var(--ease), box-shadow var(--t2) var(--ease); }
/* operators are analysed together — no per-operator status is ever shown */
.telco { overflow: hidden; }
.tlogo { height: 34px; display: grid; place-items: center; transition: filter 700ms var(--ease), opacity 700ms var(--ease); }
.tlogo img { height: 34px; width: auto; max-width: 84px; display: block; user-select: none; }
.telco[data-s="idle"] .tlogo { filter: grayscale(1); opacity: .42; }
.telco[data-s="live"] { border-color: var(--blue-line); }
.telco[data-s="result"] { border-color: var(--blue-line); box-shadow: 0 0 0 3px var(--blue-soft), inset 0 1px 0 color-mix(in srgb, #fff 80%, transparent), 0 8px 20px -12px rgba(11,18,32,.25); }
.tbar { position: relative; width: 64px; height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; transition: opacity 280ms var(--ease); }
.tbar i { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; opacity: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--blue), transparent); transition: opacity 300ms var(--ease); }
.telco.analysing .tbar i { opacity: 1; animation: tb-run 1.3s var(--ease-io) calc(var(--i) * 140ms) infinite; }
.telco[data-s="result"] .tbar { opacity: 0; }
.tres { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 18px; display: flex; align-items: center; gap: 6px; opacity: 0; transform: translateY(4px); transition: opacity 320ms var(--ease), transform 320ms var(--ease); pointer-events: none; }
.telco[data-s="result"] .tres { opacity: 1; transform: none; }
.tres .tb { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.tres .tb i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--blue); transform-origin: left; transition: width 480ms var(--ease); }
.telco[data-s="result"] .tlogo { filter: none; opacity: 1; }
@keyframes tb-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.telco::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: translateX(-100%);
  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--blue) 16%, transparent) 50%, transparent 70%); }
.telco.analysing::after { opacity: 1; animation: tc-sweep 2.2s var(--ease-io) calc(var(--i) * 180ms) infinite; }
@keyframes tc-sweep { to { transform: translateX(100%); } }
.telco.analysing .tlogo { animation: tl-breathe 2.2s var(--ease-io) calc(var(--i) * 180ms) infinite; }
@keyframes tl-breathe { 50% { scale: 1.035; } }
.telco.analysing { animation: tc-lift 2.2s var(--ease-io) calc(var(--i) * 180ms) infinite; }
@keyframes tc-lift { 50% { translate: 0 -3px; } }
.tgroup { position: absolute; pointer-events: none; }
.tgroup.beamed { box-shadow: none !important; border: 0 !important; }
@media (prefers-reduced-motion: reduce) {
  .telco.analysing .tbar i { animation: none; transform: none; width: 100%; opacity: .5; }
  .telco.analysing, .telco.analysing::after, .telco.analysing .tlogo { animation: none; }
}

/* ---------- KYC Verify: light wedge instead of connector lines ---------- */
.cone { position: absolute; inset: 0; width: 720px; height: 360px; pointer-events: none; z-index: 1; opacity: 0; overflow: visible; --bc: var(--blue);
  filter: blur(.6px); transition: opacity 360ms var(--ease); }
.cone.on { opacity: 1; }
/* light is strongest at the blob and dissolves toward the wide end */
.cone .s0 { stop-color: var(--bc); stop-opacity: .34; }
.cone .s1 { stop-color: var(--bc); stop-opacity: .14; }
.cone .s2 { stop-color: var(--bc); stop-opacity: .02; }
[data-state="wait"] .cone { --bc: var(--amber); }
.beamed { box-shadow: 0 0 0 3px var(--blue-soft), 0 0 22px -2px color-mix(in srgb, var(--blue) 35%, transparent), 0 8px 20px -12px rgba(11,18,32,.25) !important; border-color: var(--blue-line) !important; }
[data-state="wait"] .beamed { box-shadow: 0 0 0 3px var(--amber-soft), 0 0 22px -2px color-mix(in srgb, var(--amber) 35%, transparent), 0 8px 20px -12px rgba(11,18,32,.25) !important; border-color: var(--amber-line) !important; }
.chk-row, .telco, .kdoc { z-index: 2; }
.chk-row.scanning { overflow: hidden; }
.chk-row.scanning::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; left: -35%; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--blue) 14%, transparent), transparent); animation: row-sweep 900ms var(--ease-io) infinite; }
.chk-row[data-s="warn"].scanning::after { background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--amber) 18%, transparent), transparent); }
@keyframes row-sweep { to { left: 100%; } }
.chk-row[data-s="ok"] .ci { background: var(--blue-soft); color: var(--blue); }
.kdoc { transition: border-color var(--t2) var(--ease), box-shadow var(--t2) var(--ease); }
.kdoc.lit { border-color: var(--blue-line); box-shadow: 0 0 0 4px var(--blue-soft), 0 14px 32px -16px rgba(11,18,32,.26); }
/* ---------- Brand Map: live brand boards ---------- */
.bsrc { transition: opacity 600ms var(--ease), transform 600ms var(--ease), color var(--t2) var(--ease), border-color var(--t2) var(--ease), box-shadow var(--t2) var(--ease); }
.bsrc.dim { opacity: .32; transform: scale(.88); filter: saturate(.7); }
.bsrc[data-s="run"] { border-color: color-mix(in srgb, var(--blue) 55%, transparent) !important; color: var(--blue);
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--blue) 14%, transparent), 0 10px 22px -12px color-mix(in srgb, var(--blue) 45%, transparent); }
.bcol { position: absolute; height: 236px; border-radius: 18px; padding: 8px; border: 1px dashed transparent; opacity: 0; transform: translateY(12px) scale(.97); overflow: hidden;
  transition: opacity 480ms var(--ease), transform 560ms var(--ease-io), border-color 420ms var(--ease), background 420ms var(--ease), box-shadow 480ms var(--ease); }

/* ---------- Standalone HTML layout polish (from clarity.css) ---------- */
/* Sharp stage scaling + reference-matched sizing across viewports */

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-height: 100%;
  min-height: 100dvh;
}

main {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(16px, 3vh, 24px) clamp(12px, 3vw, 24px) clamp(28px, 5vh, 44px);
}

/* Stage scales to the wrap — keep height modest so the scene isn’t over-zoomed */
.loader {
  width: min(980px, 100%);
  gap: 0;
}

@media (min-width: 1100px) {
  .loader {
    width: min(1040px, 100%);
  }
}

@media (min-width: 1440px) {
  .loader {
    width: min(1120px, 90vw);
  }
}

.stage-wrap {
  width: 100%;
  max-width: 100%;
  aspect-ratio: 720 / 360;
  max-height: min(480px, calc(100dvh - 300px));
  min-height: clamp(180px, 24vh, 200px);
}

.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 720px;
  height: 360px;
  transform: translate3d(-50%, -50%, 0) scale(var(--fit, 1));
  transform-origin: center center;
  backface-visibility: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
  contain: layout paint;
}

/* Vector UI stays crisp; canvases fill their hosts at native DPR */
.scene,
.fx,
.wires,
.reticle,
.clip {
  -webkit-font-smoothing: antialiased;
}

.blob {
  overflow: visible;
}

.blob canvas {
  display: block;
  /* keep loaders.css overflow sizing (130% / -15%) — 100% + -15% offset misaligns the sphere */
  image-rendering: auto;
  transform: translateZ(0);
}

/* Status docks under the stage core (position set in JS via dockStatus). */
/* Pill docks under the blob; widen enough for full status lines (no ellipsis crop) */
.copy {
  position: absolute;
  left: 50%;
  top: 72%;
  bottom: auto;
  margin-top: 0;
  z-index: 12;
  width: max-content;
  max-width: min(92%, 420px);
  pointer-events: none;
  display: flex;
  justify-content: center;
  transform: translateX(-50%);
  transition: top 480ms var(--ease), left 480ms var(--ease);
}
.copy .status {
  pointer-events: auto;
  font-size: clamp(12px, 1.5vw, 12.5px);
  max-width: 100%;
}
.copy .roll {
  max-width: none;
}
.copy .roll > span {
  text-overflow: clip;
}

/* Narrow phones: keep stage readable */
@media (max-width: 520px) {
  .stage-wrap {
    max-height: min(360px, calc(100dvh - 260px));
  }
  .tabs {
    max-width: calc(100vw - 72px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .stage {
    transition: none !important;
  }
}

      stream.classList.add('settle');
      for (const lane of lanes) {
        $$('.act i', lane).forEach(b => { b.style.transform = ''; b.style.setProperty('--h', rnd(.45, 1).toFixed(2)); });
        lane.classList.add('done');
        await c.wait(80);
      }
      await c.wait(Math.max(0, END - (performance.now() - t0)));
    },
  };
})());


/* 4 · KYC — sources left, form right. Scan and field-fill overlap: while the
   funnel fills a source's fields, the bay already moves to the next source.
   Blob→field links use the gradient funnel (kvBeam), not curved packets. */
addScene((() => {
  const SRC = ['file', 'receipt', 'signal', 'globe', 'building'];
  const COL = Array(5).fill('var(--blue)');
  const F = [
    { col: '1 / -1', s: 2, w: .62 },
    { col: '1', s: 3, w: .78 }, { col: '2', s: 2, w: .7 },
    { col: '1 / -1', s: 2, w: .84, alt: 1 },
    { col: '1', s: 4, w: .66 }, { col: '2', s: 0, w: .74 },
  ];
  /* sources · blob · form — match edge gap on both sides of the blob (~74px) */
  const BX = 300, BY = 148, QX = 166;
  const QY = [48, 100, 152, 204, 256];
  const FRAGS = [1, 1, 1, 1, 2];                  /* fragments pulled from each source */
  /* scanned top to bottom; the fields each source fills (field 3 is contested by sources 3 and 4) */
  const PLAN = [[0, [5]], [1, [1]], [2, [4]], [3, [3]], [4, [0, 2, 3]]];
  const MISSING = new Set([4]);                   /* checked, but no data found — left for the AI to fill */
  return {
    id: 'kyc', tab: 'KYC',
    title: 'Fetching details', doneTitle: 'Details fetched', doneStep: 'Details fetched…',
    /* 3 readable groups, then a clean finish (no source list) */
    steps: ['Checking DLT Registry', 'Checking MCA · GST · RBI', 'Checking Trademark · & more', 'Details fetched…'],
    html: () => `
      <svg class="cone" id="vCone" viewBox="0 0 720 360" aria-hidden="true"><defs><linearGradient id="vConeG" gradientUnits="userSpaceOnUse"><stop offset="0" class="s0"/><stop offset=".3" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><polygon id="vConeP" points="0,0 0,0 0,0" fill="url(#vConeG)"/></svg>
      <div class="kbay" id="kBay" style="left:${QX - 32}px;top:${QY[0] - 32}px"><span class="kbeam"></span><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
      ${SRC.map((s, i) => nd(s, QX, QY[i], { s: 36, k: i, ring: true, style: `--sc:${COL[i]}`, cls: 'ksrc' })).join('')}
      ${core(BX, BY, 84)}
      <div class="card" id="gForm" style="left:416px;top:32px;width:280px;height:248px;padding:16px">
        <div class="card-h"><span class="hic">${ic('id')}</span><span class="lines">${sk(96, 't')}${sk(56)}</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px">
          ${F.map((f, i) => `<div class="fld" data-f="${i}" style="grid-column:${f.col}">${sk(i % 2 ? 44 : 62)}<div class="fld-box"></div></div>`).join('')}
        </div>
        <span class="gloss" id="gGloss"></span>
      </div>`,
    async run(c) {
      const t0 = performance.now(), END = 9580;   /* + the 420ms lead-in = 10s */
      const srcs = c.$$('.ksrc'), blob = c.$('#core'), bay = c.$('#kBay');
      const light = kvBeam(c);
      let stepNow = -1;
      /* status advances only on group change — each label stays for the whole group */
      const toStep = i => { if (i > stepNow) { stepNow = i; c.step(i); } };

      /* funnel from the blob onto a field, then fill (or mark missing) */
      const checkField = async (i, si, w, found = true) => {
        const fld = c.$(`.fld[data-f="${i}"]`), box = fld.querySelector('.fld-box');
        c.kick();
        await light.to(box, 240);
        fld.classList.add('active', 'checking'); c.focus(box, 4);
        await c.wait(340);
        fld.classList.remove('checking');
        if (found && !box.querySelector('.fill')) {
          const bar = document.createElement('span');
          bar.className = 'fill found';
          bar.style.width = `${w * 100}%`;
          box.appendChild(bar);
          await c.tween(260, t => { bar.style.transform = `scaleX(${t})`; });
          fld.classList.add('filled');
        } else if (!found) {
          fld.classList.add('missing');
        }
        fld.classList.remove('active');
        await c.wait(40);
      };

      /* contested field: keep the funnel on the field; both sources confirm via frags */
      const crossCheck = async () => {
        toStep(2); c.state('verify');
        const fld = c.$('.fld[data-f="3"]'), box = fld.querySelector('.fld-box');
        await light.to(box, 260);
        c.focus(box, 4);
        fld.classList.add('active', 'checking');
        await Promise.all([
          c.fly(srcs[3], blob, { html: `<span class="kfrag-f" style="--c:${COL[3]}"></span>`, ms: 400, scaleTo: .5, arc: 14 }),
          c.fly(srcs[4], blob, { html: `<span class="kfrag-f" style="--c:${COL[4]}"></span>`, ms: 400, scaleTo: .5, arc: 10 }),
        ]);
        c.kick();
        c.ripple(blob, 'var(--blue)', { scaleTo: 1.3 });
        await c.wait(360);
        fld.classList.remove('checking', 'active');
      };

      const scanSource = async (si) => {
        const n = srcs[si];
        c.state('tool');
        /* group status: DLT → MCA/GST/RBI → Trademark & more */
        if (si === 0) toStep(0);
        else if (si <= 3) toStep(1);
        else toStep(2);
        bay.style.translate = `0 ${QY[si] - QY[0]}px`;
        bay.style.setProperty('--sc', COL[si]);
        n.classList.add('active');
        if (stepNow < 1) el.reticle.classList.remove('on');
        c.glance(center(rectIn(n)));
        await c.wait(160);
        bay.classList.add('on');
        n.dataset.s = 'run';
        c.ring(n, 700).catch(() => {});
        await c.wait(140);
        for (let k = 0; k < FRAGS[si]; k++) {
          c.fly(n, blob, { html: `<span class="kfrag-f" style="--c:${COL[si]}"></span>`, ms: 360, scaleTo: .5, arc: 10 + k * 8 }).then(() => c.kick()).catch(() => {});
          await c.wait(90);
        }
        await c.wait(120);
        n.dataset.s = 'done';
        c.ripple(n, COL[si], { scaleTo: 1.4 });
        bay.classList.remove('on');
        n.classList.remove('active');
      };

      const fillFields = async (si, fields) => {
        if (si >= 1 && si <= 3) toStep(1);
        c.state('think');
        for (const fi of fields) {
          if (fi === 3 && si === 4) { await crossCheck(); continue; }
          await checkField(fi, si, F[fi].w, !MISSING.has(fi));
        }
      };

      /* pipeline: scan source N, then fill its fields while scanning N+1.
         fills stay serial (one funnel); scans overlap the in-flight fill */
      c.state('tool');
      let fillJob = Promise.resolve();
      for (let p = 0; p < PLAN.length; p++) {
        const [si, fields] = PLAN[p];
        await scanSource(si);
        fillJob = fillJob.then(() => fillFields(si, fields));
        if (p < PLAN.length - 1) await c.wait(60);
        else await fillJob;
      }
      light.off();
      c.unfocus();
      await c.wait(120);

      /* drop the source list — clean finish */
      toStep(3); c.state('verify');
      const form = c.$('#gForm');
      c.focus(form, 6);
      for (const fl of c.$$('.fld')) { fl.classList.add('reviewed'); await c.wait(50); }
      form.classList.add('ready');
      c.$('#gGloss').classList.add('go');
      await c.wait(Math.max(280, END - (performance.now() - t0)));
    },
  };
})());
