      <div class="rd-head"><div><h2>Ready for your go-ahead</h2><p class="rd-file">${esc(j.name)}</p></div><span class="chip-ok">${esc(j.lob)}</span></div>
      <div class="rd-stats">
        <div><small>Eligible for this submission</small><b>${num(j.verified)}</b></div>
        <div><small>Migration estimate</small><b>${inr2(total)}</b><span>including sample tax</span></div>
      </div>
      <div class="ok-note"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>Validation and authenticity checks are complete.${j.fixedApplied ? ` ${num(j.fixedApplied)} records were safely corrected and revalidated.` : ' No corrections were applied.'}</div>
      <details class="disc"><summary>${num(excluded)} records excluded from this submission</summary>
        <div class="disc-body">${why.map(([t, n]) => `<div><span>${t}</span><span>${num(n)}</span></div>`).join('')}</div>
      </details>
      ${j.failed ? `<div class="appeal"><h4>${num(j.failed)} records did not pass authenticity checks</h4><p>You can appeal these separately. The ${num(j.verified)} verified consents can proceed now.</p><button type="button" class="btn" data-do="appeal">Review reasons &amp; appeal</button></div>` : ''}
      <details class="disc"><summary>View preparation history</summary><div class="disc-body">${hist}</div></details>
      <div class="auth">
        <div class="auth-lbl">Migration authorization</div>
        <div class="auth-row"><span>${num(j.verified)} consents × ₹0.05</span><b>${inr2(base)}</b></div>
        <div class="auth-row"><span>Sample tax · 18%*</span><span>${inr2(tax)}</span></div>
        <div class="auth-row tot"><span>Total to authorize</span><b>${inr2(total)}</b></div>
        <p class="auth-note">*Illustrative rate and tax only. Replace with the actual contracted rate and applicable tax in production.</p>
      </div>
      <label class="declare auth-check"><input type="checkbox" id="authz"><span>I authorize migration of <b>${num(j.verified)} consents</b> for <b>${inr2(total)}, including the sample tax shown</b>. I understand that excluded records are not part of this submission.</span></label>
      <button type="button" class="btn btn-pri submit-full" id="submitBtn" data-do="submit" disabled>Submit ${num(j.verified)} consents for migration <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="concept">Concept: direct authorization by an eligible billing approver. Other roles send this same summary for approval.</p>`;
    } else if (j.phase === 'submitted') {
      const amt = (j.verified || 0) * .05 * 1.18;
      body = `
      <span class="tile-stage ok act-eyebrow">Submitted</span>
      <div><h2>Migration received</h2><p class="lead"><b>${num(j.verified)}</b> records from <b>${esc(j.name)}</b> were submitted${j.at && j.at.submitted ? ` at ${fmtTime(j.at.submitted)}` : ''}. Nothing else is needed from you.</p></div>
      <div class="act-sec"><h3>Receipt</h3><div class="sum">
        <div><span>Reference</span><span>MIG-2026-${String(j.id).padStart(4, '0')}</span></div>
        <div><span>Line of business</span><span>${esc(j.lob)}</span></div>
        <div><span>Records submitted</span><span>${num(j.verified)}</span></div>
        <div><span>Failed checks (not submitted)</span><span>${num(j.failed)}</span></div>
        <div class="tot"><span>Amount</span><span>${inr(amt)}</span></div>
      </div></div>
      <div class="act-foot"><button type="button" class="btn" data-nav="back">Back</button><button type="button" class="btn btn-pri" data-do="receipt">Download receipt</button></div>`;
    } else {
      const [a, b] = SEG_OF[k], items = SUB[k], p = progressF(j);
      const ms = thr => `${Math.max(0, Math.round((thr - p) / RATE))}ms`;
      body = `
      <span class="tile-stage run act-eyebrow"><i class="pulse"></i>Agent working</span>
      <div><h2>${esc(st.label)}</h2><p class="lead">${esc(st.tip)}. Nothing is needed from you right now. If this file needs you, it will show up here.</p></div>
      <div class="act-prog"><div class="tile-row"><span>Overall progress</span><b data-live-pct="${j.id}">${pct}%</b></div><div class="bar"><i data-live-bar="${j.id}" style="width:${p.toFixed(2)}%"></i></div></div>
      <div class="act-sec"><h3>Right now</h3><ul class="sub">${items.map((t, i) => `<li style="--s:${ms(a + (b - a) * i / items.length)};--e:${ms(a + (b - a) * (i + 1) / items.length)}"><span class="ic"><span class="spin"></span><span class="ok">${CHECK}</span></span>${t}</li>`).join('')}</ul></div>
      <div class="act-sec"><h3>Up next</h3><p class="next">${k === 'validate' && !j.autofix ? 'Review errors (autofix is off)' : NEXT[k]}</p></div>
      <div class="act-foot"><span class="note">You can leave this view, the agent keeps going.</span><button type="button" class="btn" data-nav="back">Back to files</button></div>`;
    }
    return `<div class="act" data-view="act-${j.id}-${j.phase}">${body}</div>`;
  }

  /* ---------- migration metrics ---------- */
  const MSTAT = [
    { k:'approved', l:'Approved for migration', s:'Approved', c:'#1b2f78' },
    { k:'action', l:'Action needed', s:'Action needed', c:'#93b8f8' },
    { k:'progress', l:'In progress', s:'In progress', c:'#3f78f0' },
    { k:'rejected', l:'Rejected for migration', s:'Rejected', c:'#c8dbfc' },
    { k:'excluded', l:'Excluded at validation', s:'Excluded', c:'#2a55c9' },
  ];
  function bucketsOf(j) {
    const o = { approved:0, action:0, progress:0, rejected:0, excluded:0 };
    if (isRunning(j)) o.progress = j.total;
    else if (j.phase === 'fix_review') o.action = j.total;
    else if (j.phase === 'ready' || j.phase === 'submitted') {
      o[j.phase === 'ready' ? 'action' : 'approved'] = j.verified;
      o.rejected = j.failed;
      o.excluded = j.total - j.verified - j.failed;
    }
    return o;
  }
  const sumBuckets = list => list.reduce((acc, j) => { const b = bucketsOf(j); MSTAT.forEach(m => { acc[m.k] += b[m.k]; }); return acc; }, { approved:0, action:0, progress:0, rejected:0, excluded:0 });
  const pctOf = (v, t) => t ? `${(v / t * 100).toFixed(1)}%` : '0%';
  const fmtK = v => v >= 1000 ? `${+(v / 1000).toFixed(1)}k` : `${v}`;
  const ARC = 'M22,100 A78,78 0 0 1 178,100';
  let metricsOpen = false;

  function metricsShell() {
    return `<div class="m-compact">
        <div class="m-head"><span class="m-lbl">Migration status</span><span class="m-total">Total uploaded<b id="mTotal">0</b></span>
          <button type="button" class="m-toggle" id="mToggle" aria-expanded="false" aria-controls="mMore"><span>View charts</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
        <div class="m-bar">${MSTAT.map(m => `<i data-k="${m.k}" style="background:${m.c}"></i>`).join('')}</div>
        <div class="m-legend">${MSTAT.map(m => `<span data-k="${m.k}"><i style="background:${m.c}"></i>${m.s}<b>0</b></span>`).join('')}</div>
      </div>
      <div class="m-more" id="mMore"><div class="m-more-in"><div class="m-charts">
        <div class="m-card"><div class="m-lbl">Status breakdown</div>
          <div class="m-donut-wrap"><svg class="m-donut" viewBox="0 0 200 104"><path class="arc" d="${ARC}" pathLength="100" stroke="var(--bg-2)"/>${MSTAT.map(m => `<path class="arc" data-k="${m.k}" d="${ARC}" pathLength="100" stroke="${m.c}" style="stroke-dasharray:0 200"/>`).join('')}</svg>
          <div class="m-center"><b id="mApproved">0</b><small>Approved</small></div></div>
          <ul class="m-list">${MSTAT.map(m => `<li data-k="${m.k}"><i style="background:${m.c}"></i><span>${m.l}</span><b>0</b><em>0%</em></li>`).join('')}</ul>
        </div>
        <div class="m-card"><div class="m-lbl">LOB-wise comparison</div><svg class="m-lob" id="mLob" viewBox="0 0 420 236" role="img" aria-label="Records per LOB by status"></svg></div>
      </div></div></div>`;
  }

  function lobSVG() {
    const groups = foldersFrom(jobs).map(([lob, files]) => ({ lob, b: sumBuckets(files), t: files.reduce((s, j) => s + j.total, 0) }));
    const W = 420, H = 236, L = 38, R = 8, T = 18, B = 30, pw = W - L - R, ph = H - T - B;
    const max = Math.max(1, ...groups.map(g => g.t));
    const raw = max / 4, pow = 10 ** Math.floor(Math.log10(raw)), n = raw / pow;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow, top = Math.ceil(max / step) * step;
    const y = v => T + ph - v / top * ph;
    let out = '';
    for (let v = 0; v <= top; v += step) out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${fmtK(v)}</text>`;
    const band = pw / groups.length, bw = Math.min(24, band * .5);
    groups.forEach((g, i) => {
      const x = L + band * i + (band - bw) / 2;
      let base = 0;
      const segs = MSTAT.filter(m => g.b[m.k] > 0);
      segs.forEach((m, si) => {
        const v = g.b[m.k], y0 = y(base), y1 = y(base + v), last = si === segs.length - 1;
        const h = Math.max(0, y0 - y1 - (si > 0 ? 2 : 0)), yy = y0 - (si > 0 ? 2 : 0) - h, r = Math.min(4, h, bw / 2);
        const tip = `${esc(g.lob)} · ${m.s}: ${num(v)} (${pctOf(v, g.t)})`;
        out += last
          ? `<path data-tip="${tip}" fill="${m.c}" d="M${x},${yy + h} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${yy + h} Z"/>`
          : `<rect data-tip="${tip}" fill="${m.c}" x="${x}" y="${yy}" width="${bw}" height="${h}"/>`;
        base += v;
      });
      out += `<text class="tot" x="${x + bw / 2}" y="${y(g.t) - 6}" text-anchor="middle">${fmtK(g.t)}</text>`;
      out += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle">${esc(g.lob)}</text>`;
    });
    return out;
  }

  function renderMetrics() {
    const el = $('#metrics');
    el.hidden = !jobs.length;
    if (!jobs.length) return;
    if (!el.dataset.built) {
      el.innerHTML = metricsShell(); el.dataset.built = '1';
      el.addEventListener('click', e => {
        if (!e.target.closest('#mToggle') && (metricsOpen || !e.target.closest('.m-compact'))) return;
        metricsOpen = !metricsOpen;
        el.classList.toggle('open', metricsOpen);
        if (metricsOpen && !RM) {
          /* replay the charts: arcs sweep in, columns grow from the baseline */
          $$('.arc[data-k]', el).forEach(a => { a.style.transition = 'none'; a.style.strokeDasharray = '0 200'; a.style.strokeDashoffset = '0'; });
          el.getBoundingClientRect();
          $$('.arc[data-k]', el).forEach(a => { a.style.transition = ''; });
          el.classList.add('grow');
          requestAnimationFrame(() => renderMetrics());
          setTimeout(() => el.classList.remove('grow'), 1200);
        }
        $('#mToggle').setAttribute('aria-expanded', metricsOpen);
        $('#mToggle span').textContent = metricsOpen ? 'Hide charts' : 'View charts';
      });
    }
    const b = sumBuckets(jobs), total = MSTAT.reduce((s, m) => s + b[m.k], 0);
    $('#mTotal').textContent = num(total);
    $('#mApproved').textContent = num(b.approved);
    let start = 0;
    MSTAT.forEach(m => {
      const v = b[m.k], pc = pctOf(v, total), len = total ? v / total * 100 : 0;
      const seg = $(`.m-bar i[data-k="${m.k}"]`, el);
      seg.style.flexGrow = v; seg.hidden = !v; seg.dataset.tip = `${m.l}: ${num(v)} (${pc})`;
      const lg = $(`.m-legend [data-k="${m.k}"]`, el); $('b', lg).textContent = num(v); lg.title = pc;
      const li = $(`.m-list [data-k="${m.k}"]`, el); $('b', li).textContent = num(v); $('em', li).textContent = pc;
      const arc = $(`.arc[data-k="${m.k}"]`, el);
      arc.style.strokeDasharray = `${Math.max(0, len - (len > 1 ? .8 : 0))} 200`;
      arc.style.strokeDashoffset = `${-start}`;
      arc.dataset.tip = `${m.l}: ${num(v)} (${pc})`;
      start += len;
    });
    $('#mLob').innerHTML = lobSVG();
  }

  const mTip = document.createElement('div');
  mTip.className = 'm-tip'; document.body.appendChild(mTip);
  document.addEventListener('mousemove', e => {
    const t = e.target.closest && e.target.closest('#metrics [data-tip]');
    if (!t) { mTip.style.opacity = 0; return; }
    mTip.textContent = t.dataset.tip; mTip.style.opacity = 1;
    mTip.style.left = `${Math.min(innerWidth - mTip.offsetWidth - 8, e.clientX + 12)}px`; mTip.style.top = `${e.clientY + 14}px`;
  });

  function render() {
    stampPhases();
    renderMetrics();
    const list = filtered();
    $('#cAll').textContent = jobs.length;
    $('#cNeeds').textContent = jobs.filter(needsYou).length;
    $('#cRun').textContent = jobs.filter(isRunning).length;
    $('#cDone').textContent = jobs.filter(isDone).length;

    const canvas = $('#canvas'), up = $('#uploadPane'), fp = $('#focusPane');
    if (focus && focus.type === 'file' && !jobs.some(j => j.id === focus.id)) focus = null;
    document.body.classList.toggle('is-focus', !!focus);
    up.hidden = !!focus; fp.hidden = !focus;
    if (focus) { renderFocus(canvas, fp); return; }
    fp.dataset.sig = '';

    if (!jobs.length) {
      patch(canvas, empty('No files yet', 'Your first upload will show up here.'));
      return;
    }

    patch(canvas, list.length ? fileList(list, 'page') : emptyFor());
  }

  function renderFocus(canvas, fp) {
    const j = jobs.find(x => x.id === focus.id);
    const sig = `f|${j.id}|${j.phase}`;
    if (fp.dataset.sig !== sig) { fp.innerHTML = fileRail(j); fp.dataset.sig = sig; animateFills(fp); }
    patch(canvas, actionPanel(j));
  }

  /* ---------- moving a page between the grid and the rail ---------- */
  const tplNode = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  function snapshot(host, sel) {
    const node = host && host.querySelector(sel);
    if (!node) return null;
    return { rect: node.getBoundingClientRect(), node: node.cloneNode(true), cls: host.className, fill: host.style.getPropertyValue('--fill') };
  }
  function fly(snap, dst, ms = 680) {
    if (!snap || !dst || RM) { if (dst) dst.style.visibility = ''; return; }
    const s = snap.rect, d = dst.getBoundingClientRect(), W = dst.offsetWidth, H = dst.offsetHeight;
    const g = document.createElement('div');
    g.className = `${snap.cls} focus-tile`;
    g.style.cssText = `position:fixed;left:${s.left}px;top:${s.top}px;width:${W}px;height:${H}px;z-index:70;pointer-events:none;transform-origin:0 0;margin:0;padding:0`;
    if (snap.fill) g.style.setProperty('--fill', snap.fill);
    snap.node.style.cssText += ';position:absolute;inset:0;scale:1;transform:none;margin:0;visibility:visible';
    g.appendChild(snap.node);
    document.body.appendChild(g);
    dst.style.visibility = 'hidden';
    const a = g.animate([
      { transform: `scale(${s.width / W})` },
      { transform: `translate(${d.left - s.left}px,${d.top - s.top}px) scale(${d.width / W})` },
    ], { duration: ms, easing: 'cubic-bezier(.22,1,.36,1)' });
    const done = () => { g.remove(); dst.style.visibility = ''; };
    a.onfinish = done; a.oncancel = done;
  }

  /* View transitions: the opened page morphs between grid and rail while
     the rail and stage slide; browsers without them fall back to the flying ghost. */
  const HAS_VT = !!document.startViewTransition;
  function morph(mode, update, from, toSel) {
    if (!HAS_VT || RM) return false;
    document.documentElement.dataset.vt = mode;
    if (from) from.style.viewTransitionName = 'hero';
    const vt = document.startViewTransition(() => {
      if (from) from.style.viewTransitionName = '';
      update();
      const to = toSel && toSel();
      if (to) to.style.viewTransitionName = 'hero';
    });
    vt.finished.finally(() => {
      delete document.documentElement.dataset.vt;
      $$('[style*="view-transition-name"]').forEach(el => { el.style.viewTransitionName = ''; });
    });
    return true;
  }

  function openFile(id, host) {
    const j = jobs.find(x => x.id === id);
    if (!j) return;
    lastFill.set(`r${id}`, progress(j));
    const next = { type: 'file', id };
    const src = host.querySelector('.paper, .r-ico');
    if (morph('in', () => { focus = next; render(); scrollTo({ top: 0 }); }, src, () => $('#focusPane .paper'))) return;
    const snap = host.querySelector('.paper') ? snapshot(host, '.paper') : null;
    focus = next; render(); scrollTo({ top: 0 });
    fly(snap, $('#focusPane .paper'));
  }
  function navigate() {
    if (!focus) return;
    const prev = focus;
    const findDst = () => $(`#canvas [data-key="t${prev.id}"] .paper, #canvas [data-key="t${prev.id}"] .r-ico`);
    const src = $('#focusPane .focus-tile .paper');
    const go = () => { focus = null; render(); const d = findDst(); if (d) d.closest('article').scrollIntoView({ block: 'nearest' }); };
    if (V2) { if (!morph('back', go, src, findDst)) go(); return; }
    if (morph('back', go, src, findDst)) return;
    const snap = snapshot($('#focusPane .focus-tile'), '.paper');
    go();
    fly(snap, findDst());
  }
  document.addEventListener('click', e => { const n = e.target.closest('[data-nav]'); if (n) navigate(n.dataset.nav); });

  function doAction(a, rowEl, extra) {
    const j = rowEl ? jobs.find(x => x.id === +rowEl.dataset.id) : focus && focus.type === 'file' && jobs.find(x => x.id === focus.id);
    if (!j) return;
    if (a === 'apply' || a === 'skip') {
      j.fixedApplied = a === 'apply' ? j.fixed : 0;
      j.phase = a === 'apply' ? 'fix' : 'verify'; j.fixDone = true;
      render(); startTicker();
      toast(a === 'apply' ? `Autofixing ${num(j.fixed)} errors` : 'Continuing without fixes');
    }
    const authz = rowEl ? $('.authz', rowEl) : $('#authz');
    if (a === 'submit' && authz && authz.checked) {
      j.phase = 'submitted';
      render(); toast(`${j.name} submitted`);
    }
    if (a === 'receipt') toast('Receipt downloaded');
    if (a === 'download-errors') toast(`Error report for ${j.name} downloaded`);
    if (a === 'appeal') {
      if (rowEl) { j.appealOpen = true; rerenderRow(rowEl, j); }
      else toast('Appeal review opens separately');
    }
    if (a === 'appeal-close') { j.appealOpen = false; rerenderRow(rowEl, j); }
    if (a === 'appeal-pick') { const inp = rowEl && $(`.ap-file[data-k="${extra}"]`, rowEl); if (inp) inp.click(); }
    if (a === 'appeal-rm') { j.appealForm[extra] = null; rerenderRow(rowEl, j); }
    if (a === 'appeal-template') toast('Mapping template downloaded');
    if (a === 'appeal-large') toast('Large uploads go through secure transfer · contact support');
    if (a === 'appeal-submit' && j.appealForm && j.appealForm.map && j.appealForm.zip && j.appealForm.ok) {
      j.appealed = true; j.appealOpen = false; rerenderRow(rowEl, j);
      toast(`Appeal submitted to the registrar for ${num(j.failed)} records`);
    }
  }

  /* ---------- the agent: one frame loop advances every running file ---------- */
  let raf = 0, lastT = 0;
  function startTicker() { if (!raf && jobs.some(isRunning)) { lastT = performance.now(); raf = requestAnimationFrame(tick); } }
  function tick(now) {
    const dt = Math.min(100, now - lastT); lastT = now;
    let changed = false;
    for (const j of jobs) {
      if (!isRunning(j)) continue;
      const prev = j.phase;
      j.p = Math.min(100, (j.p || 0) + dt * RATE);
      if (j.p >= 100) {
        j.failed = Math.round(j.total * .04);
        j.verified = j.valid + (j.fixedApplied || 0) - j.failed;
        j.phase = 'ready';
        toast(`${j.name} is ready to submit`);
      } else if (j.p >= 42 && !j.fixDone && !j.autofix) {
        /* autofix is off: stop after validation and ask the user */
        j.fixDone = true; j.p = 42; j.phase = 'fix_review';
        toast(`${j.name}: review errors`);
      } else if (j.p >= 60 && !j.fixDone) {
        j.fixDone = true; j.fixedApplied = j.fixed; j.phase = 'verify';
      } else {
        const skipped = j.fixDone && !j.fixedApplied;
        const ph = j.p >= 60 ? 'verify' : j.p >= 42 ? (skipped ? 'verify' : 'fix') : j.p >= 20 ? 'validate' : j.p >= 10 ? 'received' : 'upload';
        if (ph !== j.phase) j.phase = ph;
      }
      if (j.phase !== prev) changed = true;
    }
    if (changed) render();
    paintLive();
    raf = jobs.some(isRunning) ? requestAnimationFrame(tick) : 0;
  }
  function setFill(el, p) {
    el.style.setProperty('--fill', `${p.toFixed(2)}%`);
    el.dataset.to = Math.round(p);
    lastFill.set(el.dataset.fk, Math.round(p));
  }
  function paintLive() {
    for (const j of jobs) {
      if (!isRunning(j)) continue;
      const pr = `${Math.round(j.p)}%`;
      $$(`[data-fk="t${j.id}"],[data-fk="r${j.id}"]`).forEach(el => {
        setFill(el, j.p);
        const t = $(':scope > .tile-art > .tile-pct', el); if (t) t.textContent = pr;
      });
      $$(`[data-live-pct="${j.id}"]`).forEach(el => { el.textContent = pr; });
      $$(`[data-live-bar="${j.id}"]`).forEach(el => { el.style.width = `${j.p.toFixed(2)}%`; });
      if (V2) paintRow(j);
    }
  }

  function startJob({lob,name,size,autofix}) {
    const total = 80000 + Math.floor(Math.random() * 180000);
    const valid = Math.round(total * .9), fixed = Math.round(total * .06), manual = Math.round(total * .03);
    const job = {
      id:nextId++, lob, name, size, autofix, phase:'upload', p:0, fixDone:false,
      total, valid, fixed, manual, dup: total - valid - fixed - manual, verified:0, failed:0, fixedApplied:0
    };
    jobs=[job,...jobs];
    return job;
  }

  // Upload events
  $('#browse').onclick=e=>{e.stopPropagation();$('#file').click();};
  $('#sample').onclick=e=>{
    e.stopPropagation();
    if(!$('#lob').value)$('#lob').value='Credit Cards';
    const slug=$('#lob').value.toLowerCase().replace(/\s+/g,'_'), k=picked.length;
    addFiles([{name:`${slug}_part${k+1}.csv`,size:12.4*1048576},{name:`${slug}_part${k+2}.csv`,size:8.7*1048576}]);
  };
  $('#file').onchange=()=>{addFiles([...$('#file').files]);$('#file').value='';};
  $('#drop').onclick=e=>{if(!e.target.closest('button'))$('#file').click();};
  $('#drop').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===$('#drop')){e.preventDefault();$('#file').click();}};
  $('#pickedList').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){picked.splice(+b.dataset.rm,1);renderPicked();}};
  ['dragenter','dragover'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('is-drag');}));
  ['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('is-drag');}));
  $('#drop').addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));
  $('#declare').onchange=updateUpload;
  $('#lob').onchange=updateUpload;
  $('#uploadBtn').onclick=()=>{
    if(!picked.length||!$('#lob').value||!$('#declare').checked)return;
    const lob=$('#lob').value, autofix=$('#autofix').checked, n=picked.length, first=picked[0].name;
    /* each picked file's icon grows into its page on the grid, then processing begins */
    const srcs=$$('#pickedList .pi').map(el=>el.getBoundingClientRect());
    const created=[];
    [...picked].reverse().forEach(f=>created.unshift(startJob({lob,name:f.name,size:f.size,autofix})));
    picked=[]; $('#declare').checked=false;
    filter='all';
    $$('.filters .chip-btn').forEach(b=>b.classList.toggle('is-on',b.dataset.filter==='all'));
    renderPicked(); render();
    created.forEach((j,i)=>{
      const host=$(`#canvas [data-key="t${j.id}"]`); if(!host) return;
      const dst=host.querySelector('.paper, .r-ico');
      if(!RM){
        host.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:450,delay:i*140,fill:'backwards',easing:'cubic-bezier(.22,1,.36,1)'});
        if(srcs[i]){ dst.style.visibility='hidden'; setTimeout(()=>fly({rect:srcs[i],node:tplNode(paperHTML(j)),cls:host.className,fill:'0%'},dst,820),i*140); }
      }
    });
    if(V2) closeTray();
    startTicker();
    toast(n>1?`Received ${n} files for ${lob}`:`Received ${first}`);
  };

  $$('.filters .chip-btn').forEach(btn=>btn.onclick=()=>{
    filter=btn.dataset.filter;
    $$('.filters .chip-btn').forEach(b=>b.classList.toggle('is-on',b===btn));
    if(!morph('fade',render)) render();
  });
  $('#canvas').addEventListener('click', e => {
    const d=e.target.closest('[data-do]');
    if(d){ if(d.dataset.do) doAction(d.dataset.do, V3 ? d.closest('.file-row2') : null, d.dataset.k); return; }
    if(V3){
      const row=e.target.closest('.file-row2');
      if(row){
        if(e.target.closest('.r-more')) return;
        toggleRow(row, e.target.closest('[data-act]') ? true : undefined);
        return;
      }
    }
    const tile=e.target.closest('.file-tile,.file-row2');
    if(tile&&tile.dataset.id){ openFile(+tile.dataset.id, tile); return; }
  });
  $('#canvas').addEventListener('keydown', e => {
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('.file-tile,.file-row2')){
      if(V3&&e.target.matches('.file-row2')){ e.preventDefault(); toggleRow(e.target); return; } e.preventDefault(); e.target.click(); }
  });
  $('#canvas').addEventListener('input', e => {
    if(e.target.matches('.ap-desc')){ const j=jobs.find(x=>x.id===+e.target.closest('.file-row2').dataset.id); j.appealForm.desc=e.target.value; }
  });
  ['dragover','dragleave','drop'].forEach(ev => $('#canvas').addEventListener(ev, e => {
    const z=e.target.closest&&e.target.closest('.ap-drop:not(.has)'); if(!z) return;
    e.preventDefault(); z.classList.toggle('drag', ev==='dragover');
    if(ev==='drop'){ const f=e.dataTransfer.files[0], row=z.closest('.file-row2'), j=jobs.find(x=>x.id===+row.dataset.id); if(f){ j.appealForm[z.dataset.k]={name:f.name,size:f.size}; rerenderRow(row,j); } }
  }));
  $('#canvas').addEventListener('change', e => {
    if(e.target.id==='authz') $('#submitBtn').disabled=!e.target.checked;
    if(e.target.matches('.ap-file')||e.target.matches('.ap-okbox')){
      const row=e.target.closest('.file-row2'), j=jobs.find(x=>x.id===+row.dataset.id);
      if(e.target.matches('.ap-file')){ const f=e.target.files[0]; if(f){ j.appealForm[e.target.dataset.k]={name:f.name,size:f.size}; rerenderRow(row,j); } }
      else { j.appealForm.ok=e.target.checked; const b=$('.ap-submit',row); if(b) b.disabled=!(j.appealForm.map&&j.appealForm.zip&&j.appealForm.ok); }
      return;
    }
    if(e.target.matches('.authz')){ const b=e.target.closest('.file-row2').querySelector('.x-submit'); if(b) b.disabled=!e.target.checked; }
  });

  $('#seedDemo').onclick=()=>{
    jobs=[
      {id:nextId++,lob:'Credit Cards',name:'credit_cards_sept.csv',autofix:true,phase:'ready',total:100000,valid:90000,fixed:6000,manual:3000,dup:1000,verified:92000,failed:4000,fixedApplied:6000},
      {id:nextId++,lob:'Credit Cards',name:'credit_cards_aug.csv',autofix:true,phase:'verify',total:80000,valid:72000,fixed:4800,manual:2400,dup:800,verified:0,failed:0,fixedApplied:4800},
      {id:nextId++,lob:'Personal Loans',name:'personal_loans_sept.csv',autofix:false,phase:'fix_review',total:250000,valid:225000,fixed:15000,manual:7500,dup:2500,verified:0,failed:0,fixedApplied:0},
      {id:nextId++,lob:'Personal Loans',name:'personal_loans_july.csv',autofix:true,phase:'validate',total:120000,valid:108000,fixed:7200,manual:3600,dup:1200,verified:0,failed:0,fixedApplied:0},
      {id:nextId++,lob:'Savings Accounts',name:'savings_oct.csv',autofix:true,phase:'ready',total:180000,valid:162000,fixed:10800,manual:5400,dup:1800,verified:165600,failed:7200,fixedApplied:10800},
      {id:nextId++,lob:'Home Loans',name:'home_loans_aug.csv',autofix:true,phase:'submitted',total:72000,valid:65000,fixed:4000,manual:2000,dup:1000,verified:66000,failed:3000,fixedApplied:4000},
      {id:nextId++,lob:'Insurance',name:'insurance_q3.csv',autofix:true,phase:'upload',total:45000,valid:40500,fixed:2700,manual:1350,dup:450,verified:0,failed:0,fixedApplied:0},
      {id:nextId++,lob:'Insurance',name:'insurance_q2.csv',autofix:true,phase:'submitted',total:51000,valid:48000,fixed:2000,manual:800,dup:200,verified:49000,failed:1000,fixedApplied:2000},
      {id:nextId++,lob:'Savings Accounts',name:'savings_sep.csv',autofix:false,phase:'submitted',total:95000,valid:85500,fixed:5700,manual:2850,dup:950,verified:87400,failed:3800,fixedApplied:5700}
    ];
    const now=Date.now();
    jobs.forEach(j=>{
      j.p={upload:4,received:14,validate:31,fix:50,fix_review:42,verify:78}[j.phase] ?? 100;
      j.fixDone=!['upload','received','validate','fix'].includes(j.phase);
      const idx=j.phase==='submitted'?5:STEP_KEYS.indexOf(stepKey(j.phase));
      j.at={};
      for(let i=0;i<=idx;i++) j.at[STEP_KEYS[i]]=now-(idx-i)*(3+j.id%4)*60000;
    });
    filter='all'; focus=null;
    $$('.filters .chip-btn').forEach(b=>b.classList.toggle('is-on',b.dataset.filter==='all'));
    render();
    startTicker();
    toast('Sample queue loaded');
  };

  /* ---------- hover a segment: what that AI step found, in the "What's inside" table style ---------- */
  function stepFacts(j, k) {
    const failed = j.failed || Math.round(j.total * .04), fixedApplied = j.fixedApplied || 0;
    const verified = j.verified || (j.valid + fixedApplied - failed);
    const C = { ok: 'var(--green)', bad: 'var(--red)', fix: 'var(--blue)', warn: '#d9a54a', mute: '#a3adbd' };
    if (k === 0) return [[C.mute, 'Records found', num(j.total)], [C.mute, 'Columns detected', '8'], [C.mute, 'File size', fmtSize(sizeOf(j))]];
    if (k === 1) return [[C.mute, 'Rows checked', num(j.total)], [C.ok, 'Passed', num(j.valid)], [C.fix, 'Fixable errors', num(j.fixed)], [C.warn, 'Need manual edits', num(j.manual)], [C.bad, 'Duplicates', num(j.dup)]];
    if (k === 2) {
      if (j.phase === 'fix_review') return [[C.fix, 'Fixable errors', num(j.fixed)], [C.warn, 'Waiting for you', 'Autofix or skip']];
      return [[C.fix, 'Errors found', num(j.fixed)], [C.ok, 'Auto-fixed', num(fixedApplied)], [C.mute, 'Skipped', num(j.fixed - fixedApplied)], [C.mute, 'Mode', j.autofix ? 'Automatic' : 'Reviewed by you']];
    }
    if (k === 3) return [[C.mute, 'Records verified', num(j.valid + fixedApplied)], [C.ok, 'Consent valid', num(verified)], [C.bad, 'Failed authenticity', num(failed)]];
    const base = verified * .05;
    return [[C.ok, 'Eligible', num(verified)], [C.mute, 'Excluded', num(j.total - verified)], [C.mute, 'Estimate', inr2(base * 1.18)]];
  }
  const segPop = document.createElement('div');
  segPop.className = 'seg-pop'; segPop.setAttribute('role', 'tooltip'); document.body.appendChild(segPop);
  let segKey = '';
  function showSegPop(seg, k) {
    const row = seg.closest('.file-row2'), j = row && jobs.find(x => x.id === +row.dataset.id);
    if (!j) return;
    const a = aiState(j), reached = a.i > k || j.phase === 'ready' || j.phase === 'submitted';
    const st = reached ? ['done', 'Done'] : a.i === k ? (a.wait ? ['wait', 'Waiting for you'] : ['now', 'In progress']) : ['todo', 'Not started'];
    const key = `${j.id}|${k}|${st[0]}`;
    $$('i', seg).forEach((el, n) => el.classList.toggle('hov', n === k));
    if (key !== segKey) {
      segKey = key;
      const body = st[0] === 'done' || (st[0] === 'wait' && k === 2)
        ? `<ul class="mix">${stepFacts(j, k).map(([c, l, v]) => `<li><i style="background:${c}"></i>${l}<b>${v}</b></li>`).join('')}</ul>`
        : `<p class="sp-empty">${st[0] === 'now' ? `${AI_NOW[k]}… counts appear once this step finishes.` : 'This step hasn’t started yet.'}</p>`;
      segPop.innerHTML = `<div class="sp-h"><b>${AI_STEPS[k]}</b><span class="sp-st ${st[0]}">${st[1]}</span></div>${body}`;
    }
    const r = seg.children[k].getBoundingClientRect();
    segPop.classList.add('on');
    const w = segPop.offsetWidth, h = segPop.offsetHeight;
    segPop.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2))}px`;
    segPop.style.top = `${r.top - h - 12 < 8 ? r.bottom + 12 : r.top - h - 12}px`;
  }
  function hideSegPop() { segPop.classList.remove('on'); segKey = ''; $$('.ai-seg i.hov').forEach(el => el.classList.remove('hov')); }
  $('#canvas').addEventListener('mousemove', e => {
    const seg = e.target.closest && e.target.closest('.ai-seg');
    if (!seg) { if (segPop.classList.contains('on')) hideSegPop(); return; }
    const r = seg.getBoundingClientRect(), k = Math.max(0, Math.min(4, Math.floor((e.clientX - r.left) / r.width * 5)));
    showSegPop(seg, k);
  });
  $('#canvas').addEventListener('mouseleave', hideSegPop);
  addEventListener('scroll', hideSegPop, { passive: true });

  /* ---------- tray (V2) and version switcher ---------- */
  function openTray() {
    $('#tray').classList.add('open'); $('#trayBg').classList.add('open');
    $('#tray').setAttribute('aria-hidden', 'false'); $('#openTray').setAttribute('aria-expanded', 'true');
    setTimeout(() => $('#drop').focus({ preventScroll: true }), 350);
  }
  function closeTray() {
    $('#tray').classList.remove('open'); $('#trayBg').classList.remove('open');
    $('#tray').setAttribute('aria-hidden', 'true'); $('#openTray').setAttribute('aria-expanded', 'false');
  }
  $('#openTray').onclick = openTray;
  $('#seedDemo2').onclick = () => $('#seedDemo').click();
  $('#trayClose').onclick = closeTray;
  $('#trayBg').onclick = closeTray;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#tray').classList.contains('open')) closeTray(); });
  function setVersion(v, animate) {
    const apply = () => {
      V2 = v >= 2; V3 = v === 3; openRow = null;
      document.body.classList.toggle('v2', V2);
      document.body.classList.toggle('v3', V3);
      $$('.ver-seg button').forEach(b => b.classList.toggle('is-on', +b.dataset.ver === v));
      const pane = $('#uploadPane');
      if (V2) $('#trayBody').appendChild(pane); else { closeTray(); $('.upload-rail').prepend(pane); }
      focus = null;
      render();
    };
    VER = v;
    if (!(animate && morph('fade', apply))) apply();
    try { localStorage.setItem('am-version', String(v)); } catch (e) {}
  }
  let VER = 3;
  $$('.ver-seg button').forEach(b => { b.onclick = () => { if (+b.dataset.ver !== VER) setVersion(+b.dataset.ver, true); }; });

  const dropDoc = docHTML(3);
  $('#dropSheet').innerHTML = `${dropDoc}<div class="read">${dropDoc}<span class="trail"></span></div>`;
  try {
    const v = +localStorage.getItem('am-version');
    setVersion(v === 1 ? 1 : 3, false);
  } catch (e) {
    setVersion(3, false);
  }
  renderPicked();
})();
</script>
