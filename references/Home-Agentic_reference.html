<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiConsent · Home (agentic)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{--blue:#2560f6;--blue-dark:#154ace;--blue-soft:#edf3ff;--blue-border:#cddcff;--ink:#10213b;--muted:#64728c;--faint:#7c8ba4;--line:#e2e8f2;--bg:#f5f6fb;--green:#118252;--green-soft:#eaf7f0;--amber:#935e13;--amber-soft:#fff6e6;--red:#b73c4a;--red-soft:#fff0f2;--side:230px;--shadow:0 4px 22px #14294404;--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
*{box-sizing:border-box}
html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{margin:0;font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--blue)}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.48}
h1,h2,h3,h4,p{margin:0}
h1{font-size:32px;font-weight:680;letter-spacing:-1.1px;line-height:1.25}
h2{font-size:20px;letter-spacing:-.5px;line-height:1.35}
h3{font-size:15px;font-weight:640;line-height:1.45}
h4{font-size:13px}
p{line-height:1.65}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #729cff;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.icon.sm{width:15px;height:15px}
.icon.lg{width:25px;height:25px}
.skip{position:fixed;top:-90px;left:245px;z-index:500;background:white;padding:12px}
.skip:focus{top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-height:42px;background:white;font-weight:580;font-size:12px;line-height:1.4;text-decoration:none;color:inherit;transition:background 180ms var(--ease-out),box-shadow 180ms var(--ease-out),border-color 180ms var(--ease-out),transform 100ms ease-out;white-space:nowrap}
.btn:hover{background:#f9fbff;border-color:#baccef}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:white;box-shadow:0 2px 3px #2560f620}
.btn.primary:hover{background:var(--blue-dark)}
.btn.soft{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--blue-soft);color:var(--blue)}
.btn.outline{border-color:var(--blue-border);color:var(--blue)}
.btn.small{padding:7px 11px;min-height:34px;font-size:11px}
.btn.full{width:100%}
.btn.danger{color:var(--red);border-color:#f2cbd0}
.btn:disabled:hover{transform:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:35px;height:35px;border-radius:8px;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--blue-soft);color:var(--blue)}
.icon-btn.bordered{border:1px solid var(--line);background:white}
.link{display:inline-flex;align-items:center;gap:5px;color:var(--blue);font-weight:560;font-size:12px;padding:0}
.link:hover{text-decoration:underline}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:14px}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.flex1{flex:1;min-width:0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.blue{color:var(--blue)}
.green{color:var(--green)}
.amber{color:var(--amber)}
.red{color:var(--red)}
.small{font-size:12px}
.tiny{font-size:10px}
.strong{font-weight:600}
.mt6{margin-top:6px}
.mt10{margin-top:10px}
.mt16{margin-top:16px}
.mt22{margin-top:22px}
.mt28{margin-top:28px}
.mb16{margin-bottom:16px}
.mb22{margin-bottom:22px}
.gap6{gap:6px}
.gap16{gap:16px}
.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:650;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;background:#f0f3f9;color:var(--muted);border-radius:6px;padding:4px 8px;font-weight:600;font-size:10px;line-height:1.35;white-space:nowrap}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.card{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.pad{padding:23px}
.card-head{padding:19px 23px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
.card-head h2{font-size:17px}
.card-body{padding:23px}
.divider{height:1px;background:var(--line);margin:20px 0}
.note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--blue-border);background:#f3f7ff;color:#365783;border-radius:9px;padding:12px 15px;font-size:12px;line-height:1.65}
.note.warning{background:var(--amber-soft);border-color:#edddbf;color:#805a24}
.note.success{background:var(--green-soft);border-color:#cbe8d7;color:#226344}
.note .icon{width:17px;height:17px;margin-top:2px}
.note>div{flex:1}
.pill{padding:6px 10px;border:1px solid var(--line);background:white;border-radius:20px;font-size:11px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill.active{border-color:var(--blue-border);background:var(--blue-soft);color:var(--blue)}
.progress{height:4px;background:#e9eef8;overflow:hidden;border-radius:20px}
.progress span{display:block;height:100%;background:var(--blue);border-radius:20px;transition:width .4s}
.empty{padding:54px 24px;text-align:center}
.empty .ico-box{margin:0 auto 18px}
.empty p{max-width:420px;margin:10px auto 22px;color:var(--muted);font-size:13px}
.ico-box{width:43px;height:43px;display:flex;align-items:center;justify-content:center;border:1px solid var(--blue-border);background:var(--blue-soft);color:var(--blue);border-radius:11px;flex-shrink:0}
.ico-box.green{background:var(--green-soft);color:var(--green);border-color:#d4ecde}
.ico-box.lg{width:57px;height:57px;border-radius:16px}
.avatar{display:flex;align-items:center;justify-content:center;border-radius:50%;width:35px;height:35px;background:var(--blue);color:white;font-size:11px;font-weight:600;flex-shrink:0}
.avatar.light{background:var(--blue-soft);color:var(--blue)}
.avatar.square{border-radius:9px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.light-text{font-weight:450}
/* Stable shell: the enterprise's familiar blue and white system. */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.brand{height:75px;display:flex;align-items:center;gap:9px;padding:0 22px;border-bottom:1px solid var(--line)}
.brand-mark{width:25px;height:28px;flex-shrink:0;color:#6870ff}
.brand-name{font-size:21px;font-weight:730;letter-spacing:-.7px}
.nav-scroll{overflow:auto;flex:1;padding:13px 0 18px}
.nav-group{padding-top:23px}
.nav-caption{padding:0 22px 10px;color:#8291ad;font-size:9px;font-weight:620;letter-spacing:1.3px}
.nav-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 22px;font-size:12px;min-height:44px;color:#344460}
.nav-item:hover{background:#f6f9ff}
.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:610}
.nav-item.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.nav-item.locked{color:#8995aa}
.nav-item .icon.sm:last-child{margin-left:auto;width:13px;height:13px}
.nav-count{margin-left:auto;font-size:9px;min-width:17px;height:17px;line-height:17px;text-align:center;background:var(--blue);color:white;border-radius:5px}
.sidebar-foot{padding:12px 14px 0;border-top:1px solid #f0f3f8}
.mission-mini{background:#f6f9ff;border:1px solid #e0e8f8;border-radius:10px;width:100%;padding:13px;text-align:left}
.mission-mini h3{font-size:11px}
.mission-mini .progress{margin-top:11px}
.profile{padding:17px 3px;display:flex;align-items:center;gap:9px}
.profile strong{font-size:11px;display:block}
.profile .badge{font-size:8px;padding:2px 6px;margin-top:4px}
.shell{margin-left:var(--side);min-height:100vh}
.topbar{position:sticky;top:0;height:65px;background:#ffffffef;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px;backdrop-filter:blur(10px);z-index:20}
.breadcrumb{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.breadcrumb strong{color:var(--ink);font-weight:560}
.top-actions{display:flex;align-items:center;gap:9px}
.demo-chip{font-size:10px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:#f9fbff;color:var(--muted);display:flex;align-items:center;gap:5px}
.dev-switch{
  display:flex;
  align-items:center;
  padding:2px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#f4f6fb;
}
.dev-switch-btn{
  height:26px;
  padding:0 8px;
  border:0;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
  letter-spacing:0.01em;
  white-space:nowrap;
}
.dev-switch-btn.is-on{
  background:#fff;
  color:var(--ink);
  box-shadow:0 1px 2px rgba(16,33,59,0.08);
}
.enterprise-chip{display:flex;gap:8px;align-items:center;border-left:1px solid var(--line);padding-left:13px;margin-left:5px}
.enterprise-chip strong{display:block;font-size:10px;font-weight:640}
.enterprise-chip .avatar{width:28px;height:28px;font-size:9px;background:#143a75}
.enterprise-chip small{font-size:8px;letter-spacing:.9px;color:var(--muted)}
.mobile-menu{display:none}
.content{max-width:1450px;margin:auto;padding:30px 34px 22px}
.page{animation:enter .2s ease}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;margin-bottom:24px}
.page-head p{font-size:13px;color:var(--muted);margin-top:8px}
.page-head .eyebrow{margin-bottom:8px}
.page-head .head-actions{padding-top:6px;display:flex;gap:8px}
.footer{margin-top:27px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--faint);font-size:10px}
.footer .link{font-size:10px}
.footer .icon{width:13px;height:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 13px}
.section-head h2{font-size:16px}
.stage-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:23px}
.stage-nav-btn{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 14px;background:white;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:12px}
.stage-nav-btn.active{border-color:var(--blue-border);background:var(--blue-soft);color:var(--blue)}
.stage-nav-btn>span:nth-child(2){flex:1}
.number{height:25px;width:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line);background:#f6f8fc;font-weight:650;font-size:10px}
.number.active{background:var(--blue);border-color:var(--blue);color:white}
.number.done{background:var(--green-soft);color:var(--green);border-color:transparent}
.stage-nav-btn .icon{width:14px;height:14px}
/* Homepage: one briefing, three outcomes, one decision. */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding:30px 32px;border:1px solid #d9e4fd;border-radius:15px;background:linear-gradient(110deg,#fff 30%,#f0f5ff 100%);overflow:hidden;min-height:236px}
.hero-copy{position:relative;z-index:1;align-self:center}
.hero-kicker{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--blue);font-weight:620}
.agent-spark{height:26px;width:26px;border-radius:7px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center}
.hero h2{font-size:28px;font-weight:670;letter-spacing:-.9px;line-height:1.28;margin-top:15px}
.hero p{max-width:490px;color:var(--muted);font-size:13px;line-height:1.7;margin-top:8px}
.hero-actions{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.hero-visual{position:relative;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:2px 6px 2px 20px}
.hero-visual:before{content:"";position:absolute;width:225px;height:225px;top:0;right:-45px;border:1px solid #d9e4ff;border-radius:50%;box-shadow:0 0 0 26px #eaf0ff80,0 0 0 54px #edf3ff60;pointer-events:none}
.mini-work{position:relative;background:#ffffffef;border:1px solid #dfe7f7;border-radius:9px;display:flex;align-items:center;gap:11px;padding:12px 14px;box-shadow:0 3px 12px #23478804;transform:translateX(0)}
.mini-work:nth-child(2){transform:translateX(-15px)}
.mini-work .ico-box{height:31px;width:31px;border-radius:8px;border:0}
.mini-work strong{display:block;font-size:11px;font-weight:600}
.mini-work span{font-size:10px;color:var(--muted)}
.mini-work>.icon{margin-left:auto;width:15px;height:15px;color:var(--green)}
.mini-work>.icon.wait{color:var(--faint)}
.hero-kicker .badge{margin-left:2px}
.brand img{width:28px;height:28px;object-fit:contain}
.nav-item:active{background:#eef4ff}
.demo-chip:hover{border-color:var(--blue-border);color:var(--blue)}
.demo-chip:active{transform:scale(0.97)}
.icon-btn:active{transform:scale(0.96)}
.stage:active:not(.locked){transform:scale(0.995)}
.scenario-pick{display:grid;gap:10px}
.scenario-pick .btn{justify-content:flex-start;height:auto;min-height:52px;white-space:normal;text-align:left}
.scenario-pick .btn small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.hero-run{margin-top:19px;max-width:420px}
.hero-run .between{font-size:11px;margin-bottom:9px;color:var(--muted)}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.stage{padding:21px 21px 17px;display:flex;flex-direction:column;text-align:left;position:relative;min-height:178px;transition:border-color .18s,box-shadow .18s}
.stage:hover{border-color:#b8cef9;box-shadow:0 4px 14px #20447508}
.stage.current{border-color:#9ebbff;box-shadow:inset 0 3px 0 var(--blue)}
.stage.locked{background:#fcfdff}
.stage h3{font-size:16px;margin:15px 0 6px;letter-spacing:-.3px;line-height:1.4}
.stage p{font-size:11px;color:var(--muted)}
.stage-foot{margin-top:auto;padding-top:16px;font-size:11px;display:flex;align-items:center;justify-content:space-between;color:var(--blue);font-weight:570}
.stage.locked .stage-foot{color:var(--faint)}
.decision-strip{display:flex;align-items:center;gap:17px;padding:20px 23px}
.decision-strip h3{font-size:14px}
.decision-strip p{font-size:11px;color:var(--muted);margin-top:4px}
.decision-strip>.btn{margin-left:auto}
.section-head .link{font-size:11px}
.quiet-line{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:19px;font-size:11px;color:var(--muted)}
.quiet-line .row{gap:7px}
.quiet-line .icon{width:14px;height:14px}
.quiet-line .link{font-size:11px}
.ready-hero{background:linear-gradient(110deg,white,#edf6ff);border-color:#cddffc}
.ready-hero .hero-visual:before{box-shadow:0 0 0 30px #e9f1ff80,0 0 0 57px #eff5ff}
/* Workspaces use progressive detail rather than homepage paragraphs. */
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:21px;overflow-x:auto}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:12px 17px;color:var(--muted);font-size:12px;font-weight:580;white-space:nowrap}
.tab.active{color:var(--blue)}
.tab.active:after{content:"";position:absolute;bottom:0;left:12px;right:12px;height:2px;background:var(--blue);border-radius:2px}
.tab .badge{padding:2px 5px;font-size:9px}
.workspace-grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:21px;align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field{min-width:0}
.field.full{grid-column:1/-1}
.field label,.field-label{display:block;font-size:12px;font-weight:590;margin-bottom:7px}
.field input,.field select,.field textarea,.input,.select{display:block;width:100%;border:1px solid #dce4f2;border-radius:8px;background:white;padding:10px 12px;min-height:42px;font-size:12px;color:var(--ink);outline:none}
.field textarea,textarea.input{resize:vertical;min-height:79px}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus,.select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2560f612}
.field input[readonly]{background:#f6f8fc;color:var(--muted)}
.field.needs input,.field.needs select{border-color:#ddbc7b;background:#fffdf8}
.field .source-link{display:flex;align-items:center;gap:5px;margin-top:7px;color:var(--muted);font-size:10px;padding:0;text-align:left}
.field .source-link:hover{color:var(--blue);text-decoration:underline}
.field .source-link .icon{height:12px;width:12px}
.required{color:var(--red)}
.helper{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.65}
.error-text{font-size:11px;color:var(--red);margin-top:7px}
.check-label{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.65;cursor:pointer}
.check-label input{width:16px;height:16px;accent-color:var(--blue);flex-shrink:0;margin-top:3px}
.check-panel{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;background:#f7f9fd;border:1px solid var(--line);border-radius:9px;font-size:12px;line-height:1.7;cursor:pointer}
.check-panel input{accent-color:var(--blue);width:16px;height:16px;flex-shrink:0;margin-top:3px}
.form-footer{padding:17px 23px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fcfdff;border-radius:0 0 13px 13px}
.logo-preview{display:flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:12px;border:1px solid #d9e4f8;color:var(--blue);background:#f3f7ff;font-size:23px;font-weight:670;overflow:hidden;flex-shrink:0}
.logo-preview img{width:100%;height:100%;object-fit:contain}
.quick-summary{display:flex;gap:20px;align-items:center;padding:18px 22px;border:1px solid var(--line);border-radius:11px;background:white;margin-bottom:21px}
.quick-summary .sum{display:flex;align-items:baseline;gap:7px;padding-right:20px;border-right:1px solid var(--line)}
.quick-summary .sum:last-child{border:0}
.quick-summary strong{font-size:23px;letter-spacing:-.6px}
.quick-summary span{font-size:11px;color:var(--muted)}
.rail-card h3{font-size:13px}
.kv{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #edf1f7;font-size:11px}
.kv:last-child{border:0}
.kv>span:first-child{color:var(--muted)}
.kv>span:last-child{text-align:right;font-weight:530;overflow-wrap:anywhere}
.telco-row{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #edf1f7;font-size:12px}
.telco-row:last-child{border:0}
.telco-row>.badge{margin-left:auto}
.telco-icon{width:26px;height:26px;border-radius:7px;background:#f1f5fc;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:650}
.team-card{padding:20px 23px;display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--line)}
.team-card:last-child{border-bottom:0}
.team-card h3{font-size:13px}
.team-card p{font-size:11px;color:var(--muted);margin-top:4px}
.team-card .selection{width:16px;height:16px;accent-color:var(--blue);flex-shrink:0}

@keyframes cl-bar-glow{
  0%{box-shadow:0 0 0 rgba(37,99,235,0)}

@keyframes cl-index-pulse{

.cl-row{

  background:transparent;

  position:relative;
  z-index:1;
  flex-shrink:0;
  width:22px;
  height:22px;
  margin-top:0;
  border-radius:50%;
  display:grid;

}
.cl-row.is-current .cl-index{
  background:#2563eb;
  border-color:#2563eb;
  color:#fff;
}
.cl-row.is-done .cl-index{
  background:#15814c;
  border-color:#15814c;
  color:#fff;
  transition:background-color 260ms var(--ease-out),border-color 260ms var(--ease-out);
}
.cl-index-tick{ display:none; }
.cl-index-tick .icon{ width:12px; height:12px; stroke-width:2.6; }
.cl-row.is-done .cl-index-num{ display:none; }
.cl-row.is-done .cl-index-tick{
  display:grid;
  place-items:center;
  animation:cl-tick-in 420ms cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cl-tick-in{
  from{ opacity:0; transform:scale(.3) rotate(-20deg); }
  to{ opacity:1; transform:none; }
}
.cl-row.is-done .cl-title{ color:#5c6781; }

.cl-row[data-stage="3"]:not(.is-locked) .cl-countdown{ display:inline-flex; }
.cl-row[data-stage="3"]:not(.is-locked) .cl-lock,
.cl-row[data-stage="3"]:not(.is-locked) .cl-meter{ display:none; }
.cl-countdown .icon{ width:14px; height:14px; color:#64728c; flex-shrink:0; }
.cl-countdown.is-live .icon{ color:#118252; }
.cl-countdown.is-closed{ color:#64728c; border-color:#e2e8f2; }
.cl-countdown.is-soon{ color:#5c6781; }
.cl-countdown.is-live{ color:#118252; border-color:#cbe8d7; background:#f7fcf9; }
.cl-countdown.is-last{ color:#935e13; border-color:#edddbf; background:#fffaf2; }
.cl-countdown-label{

  font-weight:600;

.cl-row[data-stage="3"] .cl-copy-head{ align-items:flex-start; min-height:43px; }
.cl-row[data-stage="3"] .cl-head-end{ height:auto; align-items:center; padding-top:2px; }
.cl-row[data-stage="3"] .cl-toggle-title{ align-items:flex-start; }

.cl-row.is-done .cl-meter,.cl-row.is-locked .cl-meter{ display:none; }
.cl-row:not(:last-child)::before{
  content:"";
  position:absolute;
  left:10px;
  top:22px;
  bottom:-14px;
  width:0;
  border-left:2px dotted #c5cde0;

}
.checklist-card.is-intro .cl-row:not(:last-child)::before{

  animation-delay:calc(var(--row, 0) * 80ms + 180ms);
}
@keyframes cl-draw{
  from{transform:scaleY(0);opacity:0}
  to{transform:scaleY(1);opacity:1}
}
.cl-row:not(.is-open):not(:last-child)::before{
  bottom:-30px;
}
.cl-row.is-current:not(:last-child)::before,
.cl-row.is-done:not(:last-child)::before{
  border-left-color:#9db4e8;

/* STAGE METER -------------------------------------------------------------
   Only the stage being worked carries one, so the bar always means "here is
   how far you are in the thing you are doing now". */
.cl-meter{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-shrink:0;
  width:112px;
  height:22px;
  margin:0;
  line-height:0;
}
.cl-meter-track{
  flex:1;
  min-width:0;
  height:4px;
  border-radius:99px;
  background:#e6ecf8;
  overflow:hidden;
}
.cl-meter-track span{
  display:block;
  position:relative;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#2563eb,#4f83f7);
  transition:width 680ms cubic-bezier(0.22,1,0.36,1);
}
.cl-meter-count.is-tick{
  animation:cl-tick 340ms var(--ease-out);
}
@keyframes cl-tick{
  40%{transform:translateY(-2px);color:#2563eb}
}
.cl-meter-count{
  display:flex;
  align-items:center;
  height:22px;
  flex-shrink:0;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.02em;
  line-height:1;
  color:#5c6781;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* SUB-STEPS ---------------------------------------------------------------
   Three legible states rather than one flat bullet list: done keeps its tick
   as evidence, the active row is lifted onto its own surface and carries the
   only CTA, and upcoming rows stay quiet. */
.cl-sub-wrap{
  margin:8px 0 0;
  background:#fff;
  border:1px solid #e4e8f0;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 1px 2px rgba(15,23,42,0.04);
}
.cl-sub{
  list-style:none;
  margin:0;
  padding:4px 14px;
  display:flex;
  flex-direction:column;
  gap:0;
}
.cl-sub-item{
  position:relative;
  display:flex;

.agent-tel-browser{

.agent-tel-orbit-wrap{

  width:100%;

}
.agent-tel-nav{
  appearance:none;

  top:calc(var(--hub-y, 44px) - 14px);

  place-items:center;
  width:30px;
  height:30px;

  padding:0;

  background:rgba(255,255,255,.82);

  z-index:5;

  box-shadow:
    0 6px 16px rgba(15,23,42,.08),
    inset 0 1px 0 rgba(255,255,255,.85);
  transition:
    background-color 220ms cubic-bezier(0.22,1,0.36,1),
    border-color 220ms cubic-bezier(0.22,1,0.36,1),
    color 220ms cubic-bezier(0.22,1,0.36,1),
    transform 220ms cubic-bezier(0.22,1,0.36,1),
    opacity 220ms cubic-bezier(0.22,1,0.36,1),
    box-shadow 220ms cubic-bezier(0.22,1,0.36,1);
}
.agent-tel-nav.is-prev{ left:10px; }
.agent-tel-nav.is-next{ right:10px; }
.agent-tel-nav .icon{ width:14px; height:14px; }
.agent-tel-nav.is-prev .icon{ transform:scaleX(-1); }
.agent-tel-nav:hover:not(:disabled){
  border-color:rgba(37,99,235,.28);
  color:#2563eb;
  background:rgba(255,255,255,.95);
  transform:scale(1.06);
  box-shadow:
    0 8px 20px rgba(37,99,235,.16),
    inset 0 1px 0 rgba(255,255,255,.9);
}
.agent-tel-nav:focus-visible{ outline:2px solid #2563eb; outline-offset:2px; }
.agent-tel-nav:disabled{
  opacity:.28;
  cursor:default;
  transform:none;
  box-shadow:none;
}
.agent-tel-track{
  --tel-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --hub-y: 48px;
  position:relative;
  width:100%;
  height:196px;
  overflow:hidden;
  touch-action:pan-y;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  outline:none;
  background:
    radial-gradient(40% 44% at 50% var(--hub-y), rgba(96,150,255,.16), transparent 72%),
    radial-gradient(70% 36% at 50% 100%, rgba(37,99,235,.06), transparent 70%);
}
.agent-tel-track:focus-visible{ box-shadow:inset 0 0 0 2px rgba(37,99,235,.32); }
.agent-tel-track.is-dragging{ cursor:grabbing; }
.agent-tel-track::before,
.agent-tel-track::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:22px;
  z-index:4;
  pointer-events:none;
}
.agent-tel-track::before{
  left:0;
  background:linear-gradient(90deg, #fff, rgba(255,255,255,0));
}
.agent-tel-track::after{
  right:0;
  background:linear-gradient(270deg, #fff, rgba(255,255,255,0));
}
.agent-tel-path{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:visible;
  z-index:0;
}
.agent-tel-rail{
  fill:none;

  stroke-width:1.25;
  stroke-linecap:round;
}
.agent-tel-progress{
  fill:none;
  stroke:url(#agentTelProgGrad);
  stroke-width:2;
  stroke-linecap:round;
  filter:drop-shadow(0 0 4px rgba(59,130,246,.35));
}
.agent-tel-beam{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:visible;
  z-index:1;
  opacity:var(--beam-o, 1);
}
.agent-tel-beam-pool{ fill:url(#agentTelPoolGrad); }
.agent-tel-beam-cone{
  fill:url(#agentTelBeamGrad);
  filter:blur(1.2px);
}
.agent-tel-beam-core{ display:none; }
.agent-tel-hub{
  position:absolute;
  left:50%;
  top:var(--hub-y, 48px);
  z-index:3;
  width:80px;
  height:80px;
  transform:translate(-50%, -50%);
  pointer-events:none;
}
.agent-tel-hub::before{
  content:"";

  z-index:-1;
}
.agent-tel-hub .agent-tel-blob{

  height:80px;
  filter:drop-shadow(0 10px 24px rgba(37,99,235,.28));
}
.agent-tel-hub .agent-tel-blob canvas{
  width:80px;
  height:80px;
}
.agent-tel-icons{
  position:absolute;
  inset:0;
  z-index:2;
  margin:0;
  padding:0;
}
.agent-tel-ico{
  position:absolute;
  left:0;
  top:0;
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  margin:0;
  padding:0;
  border:1px solid #dbe3ef;
  border-radius:50%;
  background:linear-gradient(180deg, #fff, #f5f8fc);
  color:#6b7a94;
  cursor:pointer;
  opacity:var(--arc-o, 1);
  transform:translate3d(-50%, -50%, 0);
  box-shadow:
    0 1px 2px rgba(15,23,42,.04),
    0 6px 14px rgba(15,23,42,.06),
    inset 0 1px 0 #fff;
  will-change:transform, opacity;
  transition:
    color 260ms var(--tel-ease),
    border-color 260ms var(--tel-ease),
    background-color 260ms var(--tel-ease);
}
.agent-tel-ico::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  background:linear-gradient(155deg, #5b95ff 0%, #2563eb 52%, #1d4ed8 100%);
  box-shadow:
    0 12px 26px rgba(37,99,235,.34),
    inset 0 1px 0 rgba(255,255,255,.35);
  opacity:var(--arc-f, 0);
  pointer-events:none;
}
.agent-tel-ico > .icon{ position:relative; z-index:1; width:16px; height:16px; }
.agent-tel-ico.is-focus{ color:#fff; border-color:transparent; }
.agent-tel-ico:hover:not(:disabled):not(.is-focus){ border-color:#a9c2f7; color:#2563eb; }
.agent-tel-ico:focus-visible{ outline:2px solid #2563eb; outline-offset:3px; }
.agent-tel-ico:disabled{
  cursor:not-allowed;
  opacity:calc(var(--arc-o, 1) * .55);
  background:#f6f8fb;
  border-style:dashed;
  border-color:#d5deea;
  color:#a6b1c4;
  box-shadow:none;
}
.agent-tel-ico.is-done:not(.is-focus){ color:#2563eb; border-color:#cfdcf7; }
.agent-tel-badge{
  position:absolute;
  z-index:2;
  right:-3px;
  bottom:-3px;
  display:grid;
  place-items:center;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#16a34a;
  color:#fff;
  box-shadow:0 0 0 2px #fff;
}
.agent-tel-badge .icon{ width:9px; height:9px; stroke-width:3; }
.agent-tel-ico.is-active::after{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:50%;
  padding:1.5px;
  background:conic-gradient(from 0deg, rgba(37,99,235,0), rgba(37,99,235,.9) 300deg, rgba(37,99,235,0));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:0;
  transition:opacity 300ms var(--tel-ease);
  pointer-events:none;
}
.agent-card.is-working .agent-tel-ico.is-active::after{
  opacity:1;
  animation:agent-tel-spin 1.4s linear infinite;
}
@keyframes agent-tel-spin{ to{ transform:rotate(360deg); } }
.agent-tel-blob{
  position:relative;
  display:block;
  width:80px;
  height:80px;
  filter:drop-shadow(0 8px 16px rgba(37,99,235,.22));
  pointer-events:none;
}
.agent-tel-blob canvas{
  display:block;
  width:80px;
  height:80px;
}
.agent-tel-blob::before{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:1px solid rgba(37,99,235,.14);
  opacity:.7;

.agent-card.is-working .agent-tel-blob::before{

@keyframes agent-tel-ring{
  0%{ transform:scale(.92); opacity:.55; }
  70%{ transform:scale(1.08); opacity:0; }
  100%{ transform:scale(1.08); opacity:0; }
}
.agent-tel-core{
  position:absolute;
  left:50%;
  top:50%;
  display:grid;
  place-items:center;
  width:26px;
  height:26px;
  border-radius:50%;

    0 0 0 3px rgba(255,255,255,.92),

}
.agent-tel-core .ai-mark{ display:block; width:15px; height:15px; }

.agent-card.is-working .agent-tel-blob{

.agent-tel-panel-head{

.org-fetch{
  position:fixed;
  z-index:45;
  left:var(--side);
  right:0;
  top:65px;
  bottom:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f6fb;
  overflow:hidden;
  opacity:0;
  pointer-events:none;
  transition:opacity 420ms var(--ease-out), background-color 480ms var(--ease-in-out);
}
.org-fetch::before{
  content:"";
  position:absolute;
  inset:-18%;
  background:
    radial-gradient(ellipse 48% 42% at 28% 32%, rgba(147,197,253,0.42), transparent 62%),
    radial-gradient(ellipse 42% 48% at 78% 68%, rgba(196,181,253,0.28), transparent 58%),
    radial-gradient(ellipse 36% 30% at 62% 18%, rgba(255,255,255,0.78), transparent 52%);
  animation:org-wash 18s ease-in-out infinite;
  pointer-events:none;
  transition:opacity 480ms var(--ease-in-out);
}
@keyframes org-wash{
  0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:0.85 }
  50%{ transform:translate3d(5%,-4%,0) scale(1.08); opacity:1 }
}
.org-fetch.is-on{
  opacity:1;
  pointer-events:auto;
}
.org-fetch-panel{
  width:min(920px,92%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
  padding:8px 12px;
}
.org-fetch-canvas{
  position:relative;
  width:940px;
  max-width:100%;
  display:flex;
  flex-direction:column;
  gap:22px;
}
.org-constellation{
  position:relative;
  width:100%;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:40px;
  overflow:visible;
}
.org-stage{
  position:relative;
  width:560px;
  height:560px;
  flex-shrink:0;
}
.org-orbit-ring{
  position:absolute;
  left:50%;
  top:50%;
  width:472px;
  height:472px;
  margin:-236px 0 0 -236px;
  border-radius:50%;
  border:1px dashed rgba(37,96,246,0.16);
  pointer-events:none;
}
.org-orbit{
  position:absolute;
  inset:0;
  animation:org-orbit-spin 58s linear infinite;
}
@keyframes org-orbit-spin{
  to{ transform:rotate(360deg); }
}
@keyframes org-orbit-counter{
  to{ transform:rotate(-360deg); }
}
.org-rail{
  position:absolute;
  left:0;
  top:0;
  height:1.5px;
  background:linear-gradient(90deg,
    rgba(30,58,138,0) 0%,
    rgba(30,58,138,0.3) 18%,
    rgba(37,96,246,0.42) 50%,
    rgba(30,58,138,0.3) 82%,
    rgba(30,58,138,0) 100%);
  transform-origin:0 50%;
  opacity:0;
  pointer-events:none;
  z-index:5;
  transition:opacity 240ms var(--ease-out);
}
.org-rail.is-on{
  opacity:1;
}
.org-fetch.is-beaming .org-orbit,
.org-fetch.is-beaming .org-sat-spin{
  animation-play-state:paused;
}
.org-particles{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:6;
}
.org-bit,
.org-dot-tag{
  position:absolute;
  left:0;
  top:0;
  pointer-events:none;
  offset-path:var(--arc);
  offset-rotate:0deg;
  offset-anchor:center;
  will-change:offset-distance,opacity;
}
.org-bit{
  width:4.5px;
  height:4.5px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #6ea8ff 0%, #2560f6 45%, #1e3a8a 100%);
  box-shadow:
    0 0 4px rgba(37,96,246,0.6),
    0 0 10px rgba(37,96,246,0.32),
    0 0 18px rgba(37,96,246,0.14);
  opacity:0;
  z-index:7;
}
.org-bit.is-flying{
  animation:org-bit-fly 1.32s cubic-bezier(0.65,0,0.35,1) both;
}
.org-dot-tag{
  padding:3px 8px;
  border-radius:99px;
  background:#fff;
  border:1px solid rgba(30,58,138,0.2);
  box-shadow:0 8px 18px rgba(16,33,59,0.12);
  font-size:10px;
  font-weight:650;
  letter-spacing:0.01em;
  color:#1e3a8a;
  white-space:nowrap;
  opacity:0;
  z-index:8;
  animation:org-dot-tag 1.32s cubic-bezier(0.65,0,0.35,1) both;
}
@keyframes org-bit-fly{
  0%{ opacity:0; offset-distance:0%; }
  8%{ opacity:1; offset-distance:6%; }
  82%{ opacity:1; }
  100%{ opacity:0; offset-distance:100%; }
}
@keyframes org-dot-tag{
  0%{ opacity:0; offset-distance:0%; transform:scale(0.86); }
  12%{ opacity:1; offset-distance:10%; transform:scale(1); }
  78%{ opacity:1; offset-distance:76%; }
  100%{ opacity:0; offset-distance:100%; transform:scale(0.9); }
}
.org-sat{
  position:absolute;
  left:calc(50% + cos(calc(var(--i) * 72deg - 90deg)) * var(--r));
  top:calc(50% + sin(calc(var(--i) * 72deg - 90deg)) * var(--r));
  --r:236px;
  width:0;
  height:0;
  z-index:2;
  opacity:0;
  pointer-events:none;
  transition:opacity 336ms var(--ease-out);
}
.org-fetch.is-on .org-sat{
  opacity:0.88;
}
.org-fetch.is-on .org-sat.is-on,
.org-fetch.is-on .org-sat.is-live{

}
.org-fetch.is-on .org-sat.is-done{

}
.org-sat-spin{
  width:84px;
  margin:-32px 0 0 -42px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  transform-origin:42px 32px;

}
.org-sat small{
  font-size:10px;
  font-weight:650;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:#5b6b86;
  white-space:nowrap;
}
.org-badge{
  position:relative;
  width:64px;
  height:64px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 22%, rgba(255,255,255,0.98), rgba(255,255,255,0) 58%),
    linear-gradient(180deg,#ffffff 0%,#f4f7fd 62%,#eef2fb 100%);
  color:#2560f6;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(37,96,246,0.22);
  box-shadow:
    0 1px 1px rgba(16,33,59,0.05),
    0 3px 6px rgba(16,33,59,0.07),
    0 12px 28px rgba(16,33,59,0.11),
    inset 0 1.5px 0 rgba(255,255,255,1),
    inset 0 -6px 12px rgba(37,96,246,0.05);
  transition:box-shadow 420ms var(--ease-out), transform 420ms cubic-bezier(0.34,1.56,0.64,1), border-color 336ms var(--ease-out);
}
/* the specular rim: a bright arc along the top edge that sells the badge as a
   physical disc rather than a circle with a border */
.org-badge::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  padding:1px;
  background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(255,255,255,0) 42%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
/* Filled marks. No strokes anywhere — an outline over a tint plate doubles
   every edge, which is what made these read as overlapping. Depth comes from
   opacity tiers on separated shapes, and detail from knocked-out negative
   space (fill-rule: evenodd), never from a line drawn on top of a fill. */
.org-badge svg{
  width:27px;
  height:27px;
  fill:currentColor;
  stroke:none;
  overflow:visible;
}
.org-sat.is-live .org-badge{
  transform:scale(1.1) translateY(-2px);
  border-color:rgba(59,130,246,0.6);
  box-shadow:
    0 2px 3px rgba(16,33,59,0.06),
    0 10px 20px rgba(37,96,246,0.18),
    0 22px 44px rgba(37,96,246,0.16),
    0 0 0 5px rgba(37,96,246,0.1),
    0 0 0 10px rgba(37,96,246,0.05),
    inset 0 1.5px 0 rgba(255,255,255,1);
}
.org-sat.is-done .org-badge{
  border-color:rgba(17,130,82,0.32);
  color:#118252;
  box-shadow:
    0 1px 1px rgba(16,33,59,0.05),
    0 3px 6px rgba(16,33,59,0.06),
    0 10px 22px rgba(17,130,82,0.1),
    inset 0 1.5px 0 rgba(255,255,255,1);
}
.org-sat.is-scraping .org-badge{
  position:relative;
  overflow:hidden;
}
.org-sat.is-scraping .org-badge::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent,rgba(59,130,246,0.4),transparent);

   Replaces the Received list. The findings the agent pulls back now arrive as

/* ===================================================================
   AGENTIC HOME
   The banner owns one control; the three steps below shimmer, then
   populate with what the setup agent found. Phases are driven by
   [data-phase] on each card so JS never has to re-render the list.
   =================================================================== */

.sr-only{
  position:absolute;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
  border:0;
}

/* ---- banner ---- */
.welcome-card.is-agentic{ min-height:0; padding-bottom:26px; }

/* the one agent control. A slow conic sweep rides the border so it reads
   as the AI action without shouting over the rest of the page. */
@property --ag-angle{ syntax:"<angle>"; initial-value:0deg; inherits:false; }
.ag-cta{
  --ag-angle:0deg;
  position:relative;
  display:inline-flex;
  align-items:center;
  border:0;
  border-radius:10px;
  padding:1.5px;
  background:
    conic-gradient(from var(--ag-angle),
      #2563eb 0deg, #60a5fa 70deg, #a78bfa 140deg,
      #2563eb 210deg, #1d4ed8 300deg, #2563eb 360deg);

  font:inherit;
  box-shadow:0 6px 18px rgba(37,99,235,0.20);

  transition:box-shadow 200ms var(--ease-out), transform 200ms var(--ease-out);

  padding:0 18px;

  color:#fff;

.ag-cta.is-done{ animation:ag-settle 420ms var(--ease-out) both; background:#cfe0ff; box-shadow:none; }

.ag-scan{

/* people found — stack a few faces; overflow stays a +N chip */
.ag-faces{ display:flex; align-items:center; margin-top:10px; }
.ag-face{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:26px;height:26px;
  border-radius:50%;
  border:2px solid #fff;
  background:#2563eb;
  color:#fff;
  font-size:9px;
  font-weight:600;
  letter-spacing:0.2px;
  flex-shrink:0;
  cursor:default;
  z-index:calc(4 - var(--n));
  transition:transform 200ms var(--ease-out);
  animation:ag-resolve 520ms var(--ease-out) backwards;
  animation-delay:calc(var(--n) * 100ms + 120ms);
}
.ag-face:hover{
  transform:translateY(-3px) scale(1.06);
  z-index:6;
}
.ag-face::after{
  content:attr(data-tip);
  position:absolute;
  left:0;
  bottom:calc(100% + 8px);
  padding:5px 8px;
  border-radius:7px;
  background:#0b1a33;
  color:#fff;
  font-size:11px;
  font-weight:500;
  letter-spacing:0;
  line-height:1.35;
  white-space:nowrap;
  opacity:0;
  transform:translateY(4px);
  pointer-events:none;
  box-shadow:0 8px 18px rgba(11,26,51,.16);
  transition:opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
}
.ag-face:hover::after{
  opacity:1;
  transform:translateY(0);
}
.ag-face:last-child::after{ left:auto; right:0; }
.ag-face + .ag-face,
.ag-face + .ag-face-more{ margin-left:-8px; }
.ag-face:nth-child(2){ background:#3b82f6; }
.ag-face:nth-child(3){ background:#6366f1; }
.ag-face:nth-child(4){ background:#1d4ed8; }
.ag-face i{ font-style:normal; }
.ag-face-more{
  position:relative;

  justify-content:center;
  width:26px;
  height:26px;
  border-radius:50%;

  background:#e8efff;
  color:#1d4ed8;
  font-size:10px;
  font-weight:650;
  letter-spacing:-0.02em;

@keyframes ag-pop{

/* the agreement summary — lines arrive one after another */
.ag-summary{

}

}
@keyframes ag-line{
  from{opacity:0;transform:translateX(-8px)}

}
.ag-summary li + li{ margin-top:7px; }
.ag-summary li::before{

/* trusted sources — each chip ticks in */
.ag-sources{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.ag-source{

.ag-source:hover{ transform:translateY(-2px); border-color:#c5d4f5; }

/* ---- status + actions ---- */
.ag-step-end{

}
.ag-step[data-phase="live"]{ --ag-end-w:64px; }
.ag-step[data-phase="failed"],
.ag-step[data-phase="submitted"],

.ag-status{

.ag-step[data-phase="failed"] .ag-status-live,

/* the pill needs its own normal-case, sized type — it sits inside the

.ag-status-pill{
  position:relative;

.ag-status:hover .ag-status-pill,

.ag-status-pill.is-done{

.ag-spin{

.ag-actions{

.ag-btn{

.ag-btn:hover{ background:#e2ebff; transform:translateY(-1px); }

.ag-btn.is-primary{

/* ===================================================================
   BOOT — the setup agent's three opening lines.
   Covers the app while home.js renders beneath it, then dissolves.
   =================================================================== */

.ag-boot{
  position:fixed;
  inset:0;
  z-index:900;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  background:
    radial-gradient(900px 520px at 50% 38%, #ffffff 0%, #f7f9ff 45%, #f2f5fc 100%);
  transition:opacity 620ms var(--ease-out), visibility 620ms;
}
.ag-boot.is-out{ opacity:0; visibility:hidden; pointer-events:none; }
/* nothing to cover once the agent has finished speaking */
.ag-boot[hidden]{ display:none; }

.ag-boot-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  max-width:640px;
  text-align:center;
}

/* the mark, with one slow ring breathing behind it */
.ag-boot-mark{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:132px;height:132px;
  margin-bottom:22px;
  color:#2563eb;
  filter:drop-shadow(0 14px 32px rgba(37,99,235,.28));
  animation:ag-boot-in 640ms var(--ease-out) both;
}
.ag-boot-mark::before{
  content:"";
  position:absolute;
  inset:-18px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(96,150,255,.22), transparent 66%);
  z-index:-1;
  pointer-events:none;
}
.ag-boot-cluster{ display:block; width:132px; height:132px; }
.ag-boot-core{
  width:42px;
  height:42px;
  box-shadow:
    0 0 0 4px rgba(255,255,255,.92),
    0 6px 16px rgba(37,99,235,.32);
  animation:ag-boot-breathe 1.4s ease-in-out infinite;
}
.ag-boot-core .ai-mark{
  display:block;
  width:24px;
  height:24px;
}
@keyframes ag-boot-breathe{
  0%,100%{ box-shadow:0 0 0 4px rgba(255,255,255,.92),0 6px 16px rgba(37,99,235,.32); }
  50%{ box-shadow:0 0 0 8px rgba(255,255,255,.55),0 8px 20px rgba(37,99,235,.48); }
}

/* the aperture: seven blades cut from the DigiConsent mark's own triangle.
   They open and close together like an iris while the whole assembly turns. */
.ag-iris{ width:100%; height:100%; overflow:visible; }
.ag-iris-spin{
  transform-box:view-box;
  transform-origin:60px 60px;
  animation:ag-iris-spin 11s linear infinite;
}
@keyframes ag-iris-spin{ to{ transform:rotate(360deg); } }

/* the arm carries the blade out from the centre. Translation does not depend
   on transform-origin, so this half needs no origin gymnastics. */
.ag-blade-arm{ animation:ag-iris-reach 3.4s var(--ease-in-out) infinite; }
@keyframes ag-iris-reach{
  0%,100%{ transform:translateX(20px); }
  46%{ transform:translateX(41px); }
}

/* the blade pivots on its own base. fill-box + 100% 50% is exactly the
   path's local origin (its bounding box is x:-18..0, y:-10..10). */
.ag-blade{
  transform-box:fill-box;
  transform-origin:100% 50%;
  fill:url(#agBladeFill);
  opacity:.9;
  animation:ag-iris-cant 3.4s var(--ease-in-out) infinite;
}
/* alternating weight gives the ring depth as it turns */
.ag-iris g:nth-child(even) > .ag-blade-arm > .ag-blade{ opacity:.6; }

@keyframes ag-iris-cant{
  0%,100%{ transform:rotate(0deg) scale(.92); }
  46%{ transform:rotate(-30deg) scale(1.06); }
}

.ag-iris-core{
  transform-box:view-box;
  transform-origin:60px 60px;
  animation:ag-iris-core 3.4s var(--ease-in-out) infinite;
}
@keyframes ag-iris-core{
  0%,100%{ transform:scale(.72); opacity:.9; }
  46%{ transform:scale(1.08); opacity:.5; }
}
@keyframes ag-boot-in{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:none; }
}

/* the line the agent is currently saying */
.ag-boot-line{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:1px;
  margin:0;
  min-height:62px;
  font-family:Geist,Inter,system-ui,sans-serif;
  font-size:21px;
  font-weight:400;
  letter-spacing:-0.3px;
  line-height:31px;
  color:#0b1a33;
  transition:opacity 300ms var(--ease-out);
}
.ag-boot-line.is-fading{ opacity:0; }
.ag-boot-caret{
  display:inline-block;
  width:2px;
  height:20px;
  margin-left:2px;
  border-radius:1px;
  background:#2563eb;
  transform:translateY(2px);
  animation:ag-boot-caret 1s steps(1) infinite;
}
.ag-boot.is-done .ag-boot-caret{ display:none; }
@keyframes ag-boot-caret{
  0%,49%{ opacity:1; }
  50%,100%{ opacity:0; }
}

.ag-boot-bar{
  width:220px;
  height:2px;
  margin-top:38px;
  border-radius:2px;
  background:#e2e8f4;
  overflow:hidden;
}

  display:block;
  width:0;
  height:100%;
  border-radius:2px;
  background:linear-gradient(90deg,#60a5fa,#2563eb);
  transition:width 520ms var(--ease-out);
}

.ag-boot-skip{
  position:absolute;
  right:28px;
  bottom:24px;
  padding:7px 14px;
  border:1px solid #dfe6f3;
  border-radius:8px;
  background:rgba(255,255,255,0.8);
  color:#5c6781;
  font-family:Geist,Inter,system-ui,sans-serif;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  transition:color 160ms var(--ease-out), border-color 160ms var(--ease-out);
}
.ag-boot-skip:hover{ color:#2563eb; border-color:#cddcff; }
.ag-boot-skip:focus-visible{ outline:2px solid #2563eb; outline-offset:2px; }

@media(max-width:560px){
  .ag-boot-line{ font-size:17px; line-height:26px; min-height:78px; }
  .ag-boot-mark{ margin-bottom:26px; }
  .ag-boot-skip{ right:16px; bottom:16px; }

  const AG_MORPH_MS = 520;
  const AG_MORPH_EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
  function agMorphMany(els, mutate) {
    const list = [...new Set((els || []).filter(Boolean))];
    if (!list.length || matchMedia("(prefers-reduced-motion: reduce)").matches) {
      mutate();
      return;
    }
    const from = list.map((el) => el.getBoundingClientRect().height);
    list.forEach((el, n) => {
      el.classList.add("is-morphing");
      el.style.overflow = "hidden";
      el.style.height = from[n] + "px";
    });
    mutate();
    list.forEach((el, n) => {
      el.style.height = "auto";
      el.classList.remove("is-morphing");
      const collapsed = el.getBoundingClientRect().height;
      el.classList.add("is-morphing");
      const expanded = el.scrollHeight;
      const opening = el.classList.contains("is-open");
      const to = opening ? expanded : collapsed;
      el.style.height = from[n] + "px";
      if (Math.abs(from[n] - to) < 0.5) {
        el.style.height = "";
        el.style.overflow = "";
        el.classList.remove("is-morphing");
        return;
      }
      const token = (el._morph || 0) + 1;
      el._morph = token;
      void el.offsetHeight;
      el.style.transition = `height ${AG_MORPH_MS}ms ${AG_MORPH_EASE}`;
      el.style.height = to + "px";
      const clear = (ev) => {
        if (el._morph !== token) return;
        if (ev && (ev.target !== el || ev.propertyName !== "height")) return;
        el.style.height = "";
        el.style.overflow = "";
        el.style.transition = "";
        el.classList.remove("is-morphing");
        el.removeEventListener("transitionend", clear);
      };
      el.addEventListener("transitionend", clear);
      setTimeout(clear, AG_MORPH_MS + 80);
    });
  }

  /* The one control that starts the agent, anchored to the checklist it
     fills in. Its label tracks the run so the button never lies about
     state; lives in its own function so both the header and a later
     re-render agree on the same markup. */
  function agCtaRow() {
    return "";
  }

  function miniWork(icon, title, sub, complete = true) {
    return `<div class="mini-work"><div class="ico-box">${I(icon, "sm")}</div><div class="flex1"><strong>${title}</strong><span>${sub}</span></div>${I(complete ? "check" : "clock", complete ? "sm" : "sm wait")}</div>`;
  }

  /* One sub-step row. Only the active one is actionable, so only it carries a
     CTA; done rows keep their tick as evidence and upcoming rows stay quiet. */
  function subRow(item, phase) {
    const mark = phase === "done"
      ? `<span class="cl-sub-mark is-done"><img src="data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjExIiBoZWlnaHQ9IjExIiB2aWV3Qm94PSIwIDAgMTEgMTEiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGlkPSJGcmFtZSI+CjxwYXRoIGlkPSJWZWN0b3IiIGQ9Ik05LjE2NTM2IDIuNzVMNC4xMjM3IDcuNzkxNjdMMS44MzIwMyA1LjUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMS4zNzUiLz4KPC9nPgo8L3N2Zz4K" alt="" width="9" height="9"></span>`
      : `<span class="cl-sub-mark is-${phase}" aria-hidden="true"></span>`;
    const cta = state.ctaPlace === "sub" && phase === "active" && item.target
      ? `<button type="button" class="cl-sub-cta" data-go="${item.target}">${item.cta} →</button>`
      : "";
    const ico = item.icon ? `<span class="cl-sub-ico">${I(item.icon, "sm")}</span>` : "";
    return `<li class="cl-sub-item is-${phase}">
      ${mark}
      ${ico}
      <span class="cl-sub-label">${item.label}</span>
      ${cta}
    </li>`;
  }

  /* One agentic step. All three phases ship in the markup and CSS picks the
     one that is showing, so the sequencer only has to swap a data attribute —
     no re-render mid-animation, which would restart every keyframe. */
  function agPeopleStack(list, max = 4) {
    const people = list || [];
    if (!people.length) return "";
    const shown = people.slice(0, max);
    const more = people.length - shown.length;
    const faces = shown.map((p, n) =>
      `<span class="ag-face" style="--n:${n}" data-tip="${p.name} · ${p.designation}"><i aria-hidden="true">${p.initials}</i><span class="sr-only">${p.name}, ${p.designation}</span></span>`).join("");
    const overflow = more > 0
      ? `<span class="ag-face-more" title="${more} more">+${more}</span>`
      : "";
    return `<div class="ag-faces" aria-label="${people.length} people found">${faces}${overflow}</div>`;
  }
  function agBrandStack(list, label) {
    const brands = list || [];
    if (!brands.length) return "";
    const kind = label || "brands suggested";
    return `<div class="ag-blogos" aria-label="${brands.length} ${kind}">${brands.map((b, n) => {
      const inner = b.logo
        ? `<img src="${b.logo}" alt="" width="20" height="20" draggable="false">`
        : `<i aria-hidden="true">${b.mark}</i>`;
      return `<span class="ag-blogo${b.logo ? " is-img" : ""}" style="--n:${n};--c:${b.tone || "#2563eb"}" data-tip="${b.name}">${inner}<span class="sr-only">${b.name}</span></span>`;
    }).join("")}</div>`;
  }
  /* Named selection chips — result-first, scannable (Tripadvisor/Perplexity-style picks). */
  function agEntityChips(list, label) {
    const items = list || [];
    if (!items.length) return "";
    const kind = label || "selected";
    return `<div class="ag-picks" aria-label="${items.length} ${kind}">${items.map((b, n) => {
      const mark = b.logo
        ? `<span class="ag-pick-mark is-img"><img src="${b.logo}" alt="" width="16" height="16" draggable="false"></span>`
        : `<span class="ag-pick-mark" style="--c:${b.tone || "#2563eb"}" aria-hidden="true">${b.mark || "?"}</span>`;

  function formatMigDate(ts) {

  function migrationWindowLabel() {
    const win = state.migWindow || "open";
    if (win === "closed") return "Migration window closed";
    if (win === "soon") return `Opens on ${formatMigDate(state.migrationOpensAt)}`;
    const ms = Math.max(0, (state.migrationEndsAt || Date.now()) - Date.now());
    const totalMin = Math.floor(ms / 60000);
    const days = Math.floor(ms / 86400000);
    const hours = Math.floor(ms / 3600000);
    const mins = Math.max(1, totalMin);
    if (win === "lastDay" || days < 1) {
      if (hours >= 1) return `${hours} ${hours === 1 ? "hour" : "hours"} to close`;
      return `${mins} ${mins === 1 ? "minute" : "minutes"} to close`;
    }
    const d = Math.max(1, days);
    return `${d} ${d === 1 ? "day" : "days"} to close`;
  }
  function migrationCountdownHtml() {
    const win = state.migWindow || "open";
    const label = migrationWindowLabel();
    const kind = win === "closed" ? "closed" : win === "soon" ? "soon" : win === "lastDay" ? "last" : "live";
    const mark = win === "open" || win === "lastDay"
      ? `<span class="dot" style="background:${win === "lastDay" ? "#935e13" : "#118252"}"></span>`
      : I("clock", "sm");
    return `<div class="cl-countdown is-${kind}" id="migCountdown" role="status" aria-label="${label}">
      ${mark}
      <span class="cl-countdown-label" data-mig-label>${label}</span>
    </div>`;
  }
  let migCountdownTimer = null;

    if (migCountdownTimer) clearInterval(migCountdownTimer);

      const root = $("#migCountdown");

      const label = migrationWindowLabel();
      const el = root.querySelector("[data-mig-label]");
      if (el) el.textContent = label;
      root.setAttribute("aria-label", label);

  function stageMode(id) {
    const idxs = AG_STEPS.map((step, i) => step.stage === id ? i : -1).filter((i) => i >= 0);
    const locked = id === 1 ? false : id === 2 ? !stage1Ready() : idxs.every((i) => state.ag.steps[i] === "locked") && !["success","live"].includes(state.ag.steps[6]);
    const done = idxs.length > 0 && idxs.every((i) => {
      if (id === 1 && AG_STEPS[i].id === "kyc") return (state.kycTelcos || 0) >= 1;
      return countsProgress(state.ag.steps[i], AG_STEPS[i].id);
    });
    return { done, locked, current: !locked && !done };

  function renderHome() {
    const c = copyForScene();

    const allDone = doneN >= AG_STEPS.length && state.migWindow !== "soon";
    const mySteps = AG_STEPS.filter((s) => stepAccess(s.id) === "do");
    const myDone = mySteps.every((s) => {
      const i = AG_STEPS.findIndex((x) => x.id === s.id);
      return countsProgress(state.ag.steps[i], s.id);
    });
    const orgDone = AG_STEPS.every((s, i) => countsProgress(state.ag.steps[i], s.id));
    const yourPart = myDone && !orgDone && state.role !== "auditor" && mySteps.length;
    const title = allDone || state.setupComplete
      ? "Setup complete"
      : yourPart
      ? "Your part is done"

  /* ---- boot: the agent's three opening lines ---------------------------
     Types one line at a time, then dissolves to reveal the page that has
     been rendering underneath. Plays once per user on Home. */

  const AG_BOOT_KEY = "dcHomeBootSeen";

  const AG_BOOT_LINES = [
    `Setting up DigiConsent for ${ENTERPRISE_NAME}…`,
    "Fetching information about your organisation from trusted sources…",
    "Validating and organising the data…",
  ];

  const AG_TYPE_MS = 20;    /* per character */
  const AG_HOLD_MS = 700;   /* pause on a finished line before the next */
  let agBootTimers = [];
  let agBootEnded = false;

  function agBootLater(fn, ms) {
    return new Promise((resolve) => {
      agBootTimers.push(setTimeout(() => { fn && fn(); resolve(); }, ms));
    });
  }

  function endBoot(immediate) {
    if (agBootEnded) return;
    agBootEnded = true;
    try { localStorage.setItem(AG_BOOT_KEY, "1"); } catch (err) {}
    agBootTimers.forEach(clearTimeout);
    agBootTimers = [];
    const boot = $("#agBoot");
    /* lets the banner watermark fade up now the loader is out of the way */
    document.body.classList.add("ag-booted");
    /* the agent starts on its own; the rail card says what it is doing */
    agentSay("Getting started", true, "Opening your trusted sources");
    setTimeout(() => {
      if (state.ag.phase === "idle") runAgenticSetup();
    }, immediate ? 200 : 900);
    const introCard = $(".checklist-card");
    if (introCard) {
      introCard.classList.add("is-intro");
      /* drop the intro once it has played, so a later phase pulse doesn't replay it */
      setTimeout(() => introCard.classList.remove("is-intro"), 1200);
    }
    if (!boot) return;
    boot.classList.add("is-done");
    if (immediate) {
      boot.hidden = true;
      return;
    }
    boot.classList.add("is-out");
    /* hidden only after the fade, so it never eats a click on the page */
    setTimeout(() => { boot.hidden = true; }, 660);
  }

  /* The loader uses the same dot-sphere orb as the rail, spinning while it types. */
  function startBootOrb() {
    const canvas = $("#agBootCluster");
    const core = $("#agBootCore");
    const boot = $("#agBoot");
    if (!canvas || !boot) return;
    if (core) core.innerHTML = aiMark();
    const paint = sphereCanvas(canvas, 132, 360, 0.84);
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let rotY = 0;
    let rotX = 0.55;
    const draw = () => {
      if (boot.hidden) return;
      if (!still) {
        rotY += 0.022;
        rotX += 0.006;
      }
      paint(rotY, rotX, 46 + (still ? 0 : Math.sin(performance.now() / 420) * 1.4), 1);
      if (!still) requestAnimationFrame(draw);
    };
    draw();
  }

  function playBoot() {
    const boot = $("#agBoot");
    const text = $("#agBootText");
    const line = $(".ag-boot-line");
    /* the typed element is aria-hidden: announcing it would read out every
       keystroke. Screen readers get each finished line once, here. */
    const sr = $("#agBootSr");
    const bar = $("#agBootBar");
    const skip = $("#agBootSkip");
    if (!boot || !text) return;
    startBootOrb();

    let seen = false;
    try { seen = !!localStorage.getItem(AG_BOOT_KEY); } catch (err) {}
    if (seen) {
      endBoot(true);
      return;
    }

    if (skip) skip.hidden = true;

    /* reduced motion gets the page, not a monologue */
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      endBoot(true);
      return;
    }

    (async () => {
      await agBootLater(null, 420);
      for (let i = 0; i < AG_BOOT_LINES.length; i += 1) {
        if (agBootEnded) return;
        const copy = AG_BOOT_LINES[i];
        text.textContent = "";
        if (sr) sr.textContent = copy;
        if (line) line.classList.remove("is-fading");

        for (let c = 0; c < copy.length; c += 1) {
          if (agBootEnded) return;
          await agBootLater(() => { text.textContent = copy.slice(0, c + 1); }, AG_TYPE_MS);
        }
        if (bar) bar.style.width = Math.round(((i + 1) / AG_BOOT_LINES.length) * 100) + "%";

        await agBootLater(null, AG_HOLD_MS);
        if (agBootEnded) return;
        /* the last line stays up through the dissolve rather than blanking */
        if (i < AG_BOOT_LINES.length - 1) {
          if (line) line.classList.add("is-fading");
          await agBootLater(null, 300);
        }
      }
      endBoot(false);
    })();
  }

  /* ---- the agentic setup run -------------------------------------------
     Each step shimmers, then populates with what the agent found. The
     sequencer writes phases straight onto the cards: a full re-render would
     restart every keyframe in the list halfway through the run. State is
     kept in step so a later re-render redraws the run where it left off. */

  const AG_SCAN_MS = 1600;
  const AG_SUBSTEP_MS = 1650;
  const AG_TRACE_HOLD_MS = 1200;
  const agScanMs = (i) => Math.max(AG_SCAN_MS, ((AG_STEPS[i] && AG_STEPS[i].steps) || []).length * AG_SUBSTEP_MS + AG_TRACE_HOLD_MS);
  const AG_GAP_MS = 1450;   /* offset between one step starting and the next */
  let agTimers = [];

  function agPrepared() {
    return completedCount();
  }

  function agPct() {
    return Math.round((agPrepared() / AG_STEPS.length) * 100);
  }

  function agClearTimers() {
    agTimers.forEach(clearTimeout);
    agTimers = [];
    agQueued = false;
  }

  function agLater(fn, ms) {
    agTimers.push(setTimeout(fn, ms));
  }

  /* progress readouts sit outside the animated list, so they are safe to
     repaint on every phase change */
  function agPaint() {
    const pct = agPct();
    const label = $("#agPct");
    const bar = $("#agPctBar");
    if (label) label.textContent = `${completedCount()} of ${AG_STEPS.length} complete`;
    if (bar) bar.style.width = `${pct}%`;
    document.querySelectorAll(".stages > .cl-row").forEach((row, n) => {
      const idxs = AG_STEPS.map((step, i) => step.stage === n + 1 ? i : -1).filter((i) => i >= 0);
      if (!idxs.length) return;
      const ready = idxs.filter((i) => countsProgress(state.ag.steps[i], AG_STEPS[i].id)).length;
      const count = row.querySelector(".cl-meter-count");
      const meterBar = row.querySelector(".cl-meter-track span");
      if (count) {
        const next = `${ready}/${idxs.length}`;
        if (count.textContent !== next) {
          count.textContent = next;
          count.classList.remove("is-tick");
          void count.offsetWidth;
          count.classList.add("is-tick");
        }
      }
      if (meterBar) meterBar.style.width = `${Math.round((ready / idxs.length) * 100)}%`;
      const locked = n === 0 ? false : n === 1 ? !stage1Ready() : idxs.every((i) => state.ag.steps[i] === "locked") && !countsProgress(state.ag.steps[6], "migration");
      const done = n === 0
        ? stage1Ready()
        : idxs.every((i) => countsProgress(state.ag.steps[i], AG_STEPS[i].id));
      row.classList.toggle("is-locked", locked);
      row.classList.toggle("is-done", done);
      row.classList.toggle("is-current", !locked && !done);
      if (!locked) {
        row.querySelector(".cl-lock")?.remove();
        row.querySelector(".cl-chip.is-lock")?.remove();
      }
    });
  }

  function agSyncCard() {
    const card = $(".checklist-card");
    if (!card) return;
    card.classList.remove("is-idle", "is-running", "is-done", "is-just-done");
    card.classList.add("is-" + state.ag.phase);
  }

  /* Grow or shrink a step around a phase swap so the list doesn't jump. */
  function agMorphHeight(el, mutate) {
    agMorphMany([el], mutate);
  }

  function agRenderCta() {
    const el = $(".cl-cta-row");
    if (el) el.outerHTML = agCtaRow();
  }

  function agSetPhase(i, phase) {
    const prevOpen = state.stepOpen;
    state.ag.steps[i] = phase;
    if (phase === "scan") state.stepOpen = i;
    else if (state.stepOpen != null) state.stepOpen = firstOpenableStep();
    const cards = [
      document.querySelector(`[data-ag-step="${prevOpen}"]`),
      document.querySelector(`[data-ag-step="${i}"]`),
      document.querySelector(`[data-ag-step="${state.stepOpen}"]`),
    ];
    const apply = () => {
      const card = document.querySelector(`[data-ag-step="${i}"]`);
      if (card) {
        card.dataset.phase = phase;
        hydrateStepLive(i);
      }
      paintStepOpen();
    };
    agMorphMany(cards, apply);
    agPaint();
    const d = AG_STEPS[i];
    const line = d && d.log && d.log[phase];
    if (!line) return;
    agentTelSetStep(d.id, d.title);
    const sub = phase === "scan" ? (d.steps && d.steps[0]) : d.sub && d.sub[phase];
    agentSay(line, phase === "scan", sub);
    if (phase === "scan" && d.steps) agWalkSteps(i);
  }

  /* While a step is being read, its sub-steps land one by one as a trail:
     the current one spins, earlier ones tick off and drop what they found. */
  function agWalkSteps(i) {
    const d = AG_STEPS[i];
    agTraceAt(i, 0);
    d.steps.forEach((text, n) => {
      agLater(() => {
        if (state.ag.steps[i] !== "scan") return;
        agTraceAt(i, n + 1);
        if (text && n + 1 < d.steps.length) agentSub(d.steps[n + 1]);
      }, (n + 1) * AG_SUBSTEP_MS);
    });
  }

  /* Everything before `active` is done, `active` is working, the rest wait. */
  function agTraceAt(i, active) {
    const row = $(`[data-ag-step="${i}"]`);
    if (!row) return;
    row.querySelectorAll(".ag-trace-step").forEach((el, n) => {
      el.dataset.state = n < active ? "done" : n === active ? "active" : "pending";
    });
    row.querySelectorAll(".ag-find").forEach((el, n) => {
      el.classList.toggle("is-in", n < active);
    });
  }

  /* Horizontal step strip + detail panel. No session bucket — activity starts
     with Add Users and follows each AG_STEPS item the agent touches. */
  let agentToken = 0;
  let agentTelClock = new Date();
  let agentTelCtx = { key: "", title: "" };
  let agentTelActive = "";
  let agentTelView = "";
  const agentTelStore = Object.create(null);
  const telMonths = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function agentTelReset() {
    Object.keys(agentTelStore).forEach((k) => { delete agentTelStore[k]; });
    agentTelCtx = { key: "", title: "" };
    agentTelActive = "";
    agentTelView = "";
    agentTelClock = new Date();
  }
  function agentTelFmtParts(d) {
    const day = d.getDate();
    const mon = telMonths[d.getMonth()];
    const year = d.getFullYear();
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    const ss = String(d.getSeconds()).padStart(2, "0");
    return {
      date: `${day} ${mon} ${year}`,
      clock: `${hh}:${mm}:${ss}`,
      iso: d.toISOString(),
    };
  }
  function agentTelEnsureStore(key, title) {
    if (!key) return null;
    if (!agentTelStore[key]) {
      const step = AG_STEPS.find((s) => s.id === key);
      agentTelStore[key] = {
        title: title || (step && step.title) || key,
        icon: (step && step.icon) || "spark",
        entries: [],
        date: "",
      };
    }
    return agentTelStore[key];
  }
  function agentTelSetStep(key, title) {
    if (!key || key === "session") return;
    const following = !agentTelView || agentTelView === agentTelActive;
    agentTelCtx = { key, title: title || key };
    agentTelActive = key;
    agentTelEnsureStore(key, title);
    if (following) agentTelView = key;
    agentTelRender();
    agentTelCenter(agentTelView || key);
  }
  let agentTelOrbitT = 0;
  let agentTelOrbitTarget = 0;
  let agentTelOrbitVel = 0;
  let agentTelOrbitRaf = 0;
  let agentTelOrbitLast = 0;
  let agentTelOrbitSnap = 0;
  /* Angular spacing between steps on the oval; sets how far the neighbours sit from centre. */
  const AGENT_TEL_ARC_STEP = 0.6;
  function agentTelOrbitIndexOf(id) {
    const i = AG_STEPS.findIndex((s) => s.id === id);
    return i < 0 ? 0 : i;
  }
  function agentTelOrbitClamp(t, slack = 0) {
    const n = AG_STEPS.length || 1;
    return Math.max(-slack, Math.min(n - 1 + slack, t));
  }
  function agentTelOrbitCur() {
    return Math.round(agentTelOrbitClamp(agentTelOrbitTarget));
  }
  function agentTelOrbitStep(now) {
    const dt = Math.min(0.034, Math.max(0.001, (now - agentTelOrbitLast) / 1000));
    agentTelOrbitLast = now;
    const k = 150;
    const c = 2 * Math.sqrt(k) * 0.86;
    const x = agentTelOrbitT - agentTelOrbitTarget;
    agentTelOrbitVel += (-k * x - c * agentTelOrbitVel) * dt;
    agentTelOrbitT += agentTelOrbitVel * dt;
    if (Math.abs(agentTelOrbitT - agentTelOrbitTarget) < 0.0008 && Math.abs(agentTelOrbitVel) < 0.01) {
      agentTelOrbitT = agentTelOrbitTarget;
      agentTelOrbitVel = 0;
      agentTelOrbitRaf = 0;
      agentTelArcLayout();
      return;
    }
    agentTelArcLayout();
    agentTelOrbitRaf = requestAnimationFrame(agentTelOrbitStep);
  }
  function agentTelOrbitKick() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      cancelAnimationFrame(agentTelOrbitRaf);
      agentTelOrbitRaf = 0;
      agentTelOrbitT = agentTelOrbitTarget;
      agentTelOrbitVel = 0;
      agentTelArcLayout();
      return;
    }
    if (agentTelOrbitRaf) return;
    agentTelOrbitLast = performance.now();
    agentTelOrbitRaf = requestAnimationFrame(agentTelOrbitStep);
  }
  function agentTelUnlocked(id, i) {
    const phase = state.ag.steps[i] || "idle";
    const store = agentTelStore[id];
    const has = !!(store && store.entries.length);
    return has || agentTelActive === id || ["scan","live","success","skipped","partial","attention","submitted","waiting","half","failed"].includes(phase);
  }
  function agentTelViewable(id) {
    const store = agentTelStore[id];
    return !!(store && store.entries.length) || id === agentTelActive;
  }
  function agentTelSyncSelected() {
    const wrap = $("#agentTelIcons");
    if (!wrap) return;
    [...wrap.querySelectorAll(".agent-tel-ico")].forEach((b) => {
      const on = b.dataset.telId === agentTelView;
      b.classList.toggle("is-selected", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
  }
  function agentTelUpdateNav() {
    const prev = document.querySelector('.agent-tel-nav[data-tel-nav="-1"]');
    const next = document.querySelector('.agent-tel-nav[data-tel-nav="1"]');
    if (!prev && !next) return;
    const n = AG_STEPS.length || 1;
    const cur = agentTelOrbitCur();
    let canPrev = false;
    let canNext = false;
    for (let i = cur - 1; i >= 0; i--) {
      if (agentTelViewable(AG_STEPS[i].id)) { canPrev = true; break; }
    }
    for (let i = cur + 1; i < n; i++) {
      if (agentTelViewable(AG_STEPS[i].id)) { canNext = true; break; }
    }
    if (prev) prev.disabled = !canPrev;
    if (next) next.disabled = !canNext;
  }
  function agentTelNav(dir) {
    const n = AG_STEPS.length || 1;
    const cur = agentTelOrbitCur();
    const step = dir < 0 ? -1 : 1;
    for (let i = cur + step; i >= 0 && i < n; i += step) {
      const id = AG_STEPS[i].id;
      if (!agentTelViewable(id)) continue;
      agentTelPick(id);
      return;

  function sphereCanvas(canvas, size, count, dotScale) {
    const ctx = canvas.getContext("2d");

    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pts = [];
    for (let i = 0; i < count; i++) {
      const y = 1 - (i / (count - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = i * 2.399963;
      pts.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, s: (0.72 + (i % 7) * 0.06) * dotScale });
    }
    return (rotY, rotX, radius, dim) => {
      ctx.clearRect(0, 0, size, size);
      const cx = size / 2;
      const cy = size / 2;
      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);
      const drawn = pts.map((p) => {
        const x1 = p.x * cosY - p.z * sinY;
        const z1 = p.x * sinY + p.z * cosY;
        return { x: x1, y: p.y * cosX - z1 * sinX, z: p.y * sinX + z1 * cosX, s: p.s };
      });
      drawn.sort((a, b) => a.z - b.z);
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.2);
      glow.addColorStop(0, "rgba(96,150,255,0.16)");
      glow.addColorStop(1, "rgba(72,124,246,0)");

        const depth = (p.z + 1) / 2;
        const r = (0.35 + depth * 1.05) * p.s;
        const focus = 0.24 + depth * depth * 0.76;
        const alpha = (0.12 + focus * 0.7) * dim;
        ctx.beginPath();
        ctx.arc(cx + p.x * radius, cy + p.y * radius, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + Math.round(40 + focus * 70) + "," + Math.round(90 + focus * 70) + "," + Math.round(230 + focus * 25) + "," + alpha + ")";

  function gateOpen(i) {
    const id = AG_STEPS[i] && AG_STEPS[i].id;
    if (id === "kyc") return !!state.done.terms;
    if (id === "brands" || id === "partners") return stage1Ready();
    if (id === "templates") return brandsApproved();
    if (id === "migration") return countsProgress(state.ag.steps[5], "templates");
    return true;
  }

  /* One step at a time: a calm working line, then the overview and its CTA. */
  function workStep(i) {
    agQueued = false;
    if (["success", "live", "scan", "skipped", "partial", "attention", "submitted", "waiting", "half"].includes(state.ag.steps[i])) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      agSetPhase(i, "live");
      return;
    }
    agSetPhase(i, "scan");
    agLater(() => {
      if (state.ag.steps[i] === "scan") agSetPhase(i, "live");
    }, agScanMs(i));
  }

  /* Scan → live, then the next locked step. Brands before GTM when both unlock. */
  function queueWorkSteps(indices, delay = 0) {
    let at = delay;
    indices.forEach((idx) => {
      agLater(() => workStep(idx), at);
      at += agScanMs(idx) + 420;
    });
  }

  /* Confirming a step records it and, if the next gate is open, lets the
     agent start on that step. The CTA itself is the handoff to the other page. */
  function stampDone(id, who = "You") {
    const at = new Date();
    state.done[id] = true;
    state.doneWho[id] = who;
    state.doneMeta[id] = formatDoneWhen(at, who);
  }
  function unlockNextFrom(i) {
    const step = AG_STEPS[i];
    const liveNext = AG_STEPS.findIndex((_, idx) => idx !== i && state.ag.steps[idx] === "live");
    if (liveNext >= 0) {
      const peer = AG_STEPS[liveNext];
      agentTelSetStep(peer.id, peer.title);
      if (peer.log && peer.log.live) agentSay(peer.log.live, false, peer.sub && peer.sub.live);
      return;
    }
    const nexts = AG_STEPS.map((_, idx) => idx).filter((idx) => state.ag.steps[idx] === "locked" && gateOpen(idx));
    if (!nexts.length) return;
    const next = nexts[0];
    const stage = AG_STEPS[next].stage;
    if (stage !== step.stage && stageMode(step.stage).done) {
      agQueued = true;
      agLater(() => focusStage(stage), 1100);
      queueWorkSteps(nexts, 1100 + 560);
      return;
    }
    const row = document.querySelectorAll(".stages > .cl-row")[stage - 1];
    const wasClosed = row && !row.classList.contains("is-open");
    if (wasClosed) focusStage(stage);
    agQueued = true;
    queueWorkSteps(nexts, wasClosed ? 480 : 120);
  }
  function confirmAgStep(i, phase = "success") {
    const step = AG_STEPS[i];
    if (!step || state.ag.steps[i] === "locked") return;
    stampDone(step.id);
    state.doneOutcome[step.id] = step.successMeta || "Done";
    agSetPhase(i, phase);
    const metaEl = document.querySelector(`[data-ag-step="${i}"] .ag-done-meta`);
    if (metaEl && phase === "success") metaEl.textContent = state.doneMeta[step.id];
    if (step.successToast && phase === "success") toast(step.successToast);
    if (phase !== "success") render();
    unlockNextFrom(i);
  }

  /* Automatic moves keep one stage open; the user can still open more by hand. */
  function focusStage(stage) {
    [1, 2, 3].forEach((id) => {
      if (id !== stage && document.getElementById("cl-panel-" + id)?.closest(".cl-row")?.classList.contains("is-open")) {
        setStageOpen(id, false);
      }
    });
    setStageOpen(stage, true);
  }

  function agFinish() {
    state.ag.phase = "done";
    if (state.stepOpen == null) state.stepOpen = firstOpenableStep();
    agRenderCta();
    agSyncCard();
    paintStepOpen();
    /* Sessions for users + terms are ready — park the orbit on Add Users so
       action starts there; confirmAgStep advances it as the user moves on. */
    const start = AG_STEPS[0];
    if (start && state.ag.steps[0] === "live") {
      agentTelSetStep(start.id, start.title);
      agentSay(start.log.live, false, start.sub && start.sub.live);
    }
  }

  function runAgenticSetup(replay = false) {
    if (state.ag.phase === "running") return;
    agClearTimers();
    const replayed = replay || state.ag.phase === "done";
    const first = [0, 1];
    if (replayed) {
      state.done = {};
      state.doneMeta = {};
      state.doneOutcome = {};
      state.doneWho = {};
      state.kycTelcos = 0;
      state.flags = {};
      state.migFiles = 0;
      state.migFinApproved = false;
      state.setupComplete = false;
      state.agentLine = "Getting started";
      state.agentSub = "Opening your trusted sources";
      state.ag.steps = ["idle", "idle", "locked", "locked", "locked", "locked", "locked"];
      state.stepOpen = 0;
      delete state.stageOpen[1];
      delete state.stageOpen[2];
      delete state.stageOpen[3];
      resetTeamPeople();
      agentTelReset();
      state.ag.phase = "idle";
      state.stepOpen = 0;
      render();
    }
    state.ag.phase = "running";
    agRenderCta();
    agSyncCard();

    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      first.forEach((i) => agSetPhase(i, "live"));
      agFinish();
      return;
    }

    /* one step at a time, so each step's work is readable before the next starts */
    let at = replayed ? 560 : 0;
    first.forEach((i) => {
      agLater(() => agSetPhase(i, "scan"), at);
      at += agScanMs(i);
      agLater(() => agSetPhase(i, "live"), at);
      at += 420;
    });
    agLater(agFinish, at);
  }

  function stopRun() {
    if (state.runTimer) {
      clearInterval(state.runTimer);
      state.runTimer = null;
    }
  }

  function startAgents() {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      stopRun();
      state.scene = "prepared";
      state.running = false;
      render();
      toast("Review pack is ready. Confirm the missing profile field.");
      return;
    }
    state.scene = "working";
    state.running = true;
    state.paused = false;
    state.runStep = 0;
    stopRun();
    render();
    toast("Onboarding team started. Nothing is submitted without you.");
    state.runTimer = setInterval(() => {
      if (state.paused) return;
      state.runStep += 1;
      if (state.runStep >= state.runTotal) {
        stopRun();
        state.scene = "prepared";
        state.running = false;
        toast("Review pack is ready. Confirm the missing profile field.");
      }
      render();
    }, 900);
  }
