<script>
var LOGO="__LOGO__";

function I(n,c){return '<svg class="i '+(c||'')+'"><use href="#i-'+n+'"/></svg>'}
var STEPS=[
 {k:"profile",ic:"id",title:"Business profile",src:[["file","DLT"],["receipt","GSTIN"],["pulse","MCA"],["globe","Website"]],checks:["Checking DLT registration","Checking GSTIN","Checking MCA","Looking up your company website","Filling in your business profile"],done:["Checked DLT registration","Checked GSTIN","Checked MCA","Looked up your company website","Filled in your business profile"],mini:"7 fields filled",rh:"Please review your business profile",rs:"Filled your logo and all 7 fields from 4 sources. Check the details and submit.",need:"Confirm you are authorised to submit, then send it for approval.",next:"Telecom operators check it. Your Team step opens once it is approved."},
 {k:"team",ic:"users",title:"Team",src:[["file","DLT registry"]],checks:["Looking up your DLT registration","Finding people on record","Matching roles and permissions","Suggesting people to invite"],done:["Looked up your DLT registration","Found people on record","Matched roles and permissions","Suggested people to invite"],mini:"6 people found",rh:"Choose who to invite",rs:"Found 6 people on your DLT registration and suggested a role for each.",need:"Untick anyone you do not want to invite, then send the invites.",next:"They get an email invite to DigiConsent. Brands and LOBs opens next."},
 {k:"brands",ic:"layers",title:"Brands and LOBs",src:[["file","DLT headers"]],checks:["Reading DLT registrations","Grouping them into brands","Creating lines of business","Refining the drafts"],done:["Read DLT registrations","Grouped them into brands","Created lines of business","Refined the drafts"],mini:"3 brands · 7 LOBs",rh:"3 brands and 7 lines of business",rs:"Drafted from your DLT headers. Confirm as drafted and they are set up straight away.",need:"Confirm the draft, or remove a line of business you do not need.",next:"GTM partners opens next. Templates open once brands are set up."},
 {k:"gtm",ic:"bars",title:"GTM partners",src:[["receipt","Rate cards from 4 partners"]],checks:["Seeing available partners","Reviewing rate cards","Selecting best rate cards","Setting allocations","Preparing for review"],done:["Saw available partners","Reviewed rate cards","Selected the best rate cards","Set allocations","Prepared for review"],mini:"2 of 4 chosen",attn:true,rh:"Karix and Value First, split by phase",rs:"4 partners sent rate cards. These two have the lowest rates across the three phases.",need:"Check the two chosen partners. You can swap one.",next:"Templates opens once you confirm the partners."},
 {k:"templates",ic:"doc",title:"Templates",src:[["doc","100 DLT templates"]],checks:["Getting your templates","Getting lines of business","Mapping templates"],done:["Got your templates","Got lines of business","Mapped templates"],mini:"98 of 100 mapped",attn:true,rh:"98 of 100 templates have a line of business",rs:"Matched by reading each message. 2 still need a line of business.",need:"2 templates have no line of business yet. They do not hold up migration.",next:"This is the last step. After it, your migration window opens."}
];

var S={phase:"start",active:0,status:["queued","queued","queued","queued","queued"],p:[0,0,0,0,0],view:null,auth:false,verify:-1,lobf:"all",run:0,open:{}};
var timers=[];
function T(f,ms){var id=setTimeout(f,ms);timers.push(id);return id}
function clearT(){timers.forEach(clearTimeout);timers=[];S.run++}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},2600)}
/* ---------- tabs ---------- */
function tabInfo(i){var s=S.status[i],st=STEPS[i];
  if(S.phase==="start") return {cls:"",s:"Queued",p:0,ic:st.ic};
  if(S.phase==="proc"){ if(s==="working") return {cls:"on",s:"Reading sources · "+Math.round(S.p[i]*100)+"%",p:S.p[i]*100,ic:st.ic}; if(s==="ready") return {cls:"rdy"+(st.attn?" amb":""),s:st.mini,p:100,ic:"check"}; return {cls:"",s:"Queued",p:0,ic:st.ic}; }
  if(S.phase==="ready") return {cls:"rdy"+(st.attn?" amb":""),s:st.mini,p:100,ic:"check"};
  if(S.phase==="final") return {cls:"done",s:"Done",p:100,ic:"check"};
  if(s==="done") return {cls:"done click",s:"Done",p:100,ic:"check"};
  if(s==="verifying") return {cls:"amb",s:"In review",p:60,ic:st.ic};
  if(s==="review") return {cls:"on amb",s:"Needs you",p:100,ic:st.ic};
  return {cls:"lock",s:"Opens after the step before",p:0,ic:"lock"};}
function tabsHTML(){var cur=viewIdx();return '<div class="tabs" id="tabs">'+STEPS.map(function(st,i){var t=tabInfo(i),on=(S.phase==="proc"?S.status[i]==="working":S.phase==="review"?i===cur:false);
  return '<div class="tab '+t.cls+(on&&t.cls.indexOf("on")<0?" on":"")+'" '+(t.cls.indexOf("click")>=0?'data-a="tab" data-i="'+i+'"':'')+'><div class="t">'+I(t.ic)+'<span>'+esc(st.title)+'</span></div><div class="s">'+esc(t.s)+'</div><div class="b"><i style="width:'+t.p+'%"></i></div></div>'}).join("")+'</div>'}
function viewIdx(){return S.view!=null?S.view:S.active}
/* ---------- fields ---------- */
function fd(l,v,tag,fill,wide,ro,id){return '<div class="fd'+(wide?" w2":"")+'"><label>'+esc(l)+' <b>*</b>'+(tag&&fill?'<em>'+esc(tag)+'</em>':'')+'</label>'+(fill?(ro?'<div class="inp">'+esc(v)+'</div>':'<input class="inp" value="'+esc(v)+'" data-f="'+id+'">'):'<div class="inp"><span class="sk"></span></div>')+'</div>'}
function srcline(st,n){return '<div class="srcl">'+st.src.map(function(s,k){return k<n?'<span><i class="ck">'+I("check")+'</i>'+esc(s[1])+'</span>':'<span class="q">'+I(s[0])+esc(s[1])+'</span>'}).join("")+'</div>'}
/* ---------- processing views ---------- */
function liveHTML(i){var st=STEPS[i],p=S.p[i],n=Math.min(st.src.length,Math.floor(p*(st.src.length+1)));var h='<div class="hd"><div><h2>'+esc(st.title)+'</h2></div><span class="pill">Reading sources · '+n+' of '+st.src.length+'</span></div>'+srcline(st,n)+'<div class="hr"></div>';
  if(st.k==="profile"){var c=Math.min(7,Math.floor(p*8));h+='<div class="form">'+PROFILE.map(function(f,k){return fd(f[0],f[1],f[2],k<c,k===2,true)}).join("")+'</div>'}
  if(st.k==="team"){var c=Math.min(6,Math.floor(p*7.5));h+=PEOPLE.map(function(x,k){var on=k<c;return '<div class="row" style="grid-template-columns:44px 1fr 200px 170px;opacity:'+(on?1:.5)+'"><div class="av">'+(on?x.i:'')+'</div><div>'+(on?'<div class="rn">'+esc(x.name)+'</div><div class="rm">'+esc(x.email)+'</div>':'<div class="inp" style="height:30px"><span class="sk"></span></div>')+'</div><div style="color:var(--muted)">'+(on&&p>.55?esc(x.dept):'')+'</div><div>'+(on&&p>.75?'<span class="pill">'+ROLES[x.role]+'</span>':'')+'</div></div>'}).join("")}
  if(st.k==="brands"){var nb=Math.min(3,Math.floor(p*4)),nl=Math.floor(p*9);var cnt=0;h+='<div class="root"><div class="tile on">'+I("build")+'</div><div><b style="font-size:17px">HDFC Bank Limited</b><div class="ls">'+nb+' brands · '+Math.min(7,nl)+' lines of business</div></div></div><ul class="tree">'+BRANDS.slice(0,nb).map(function(b){var ls=b.lobs.filter(function(){return cnt++<nl});return '<li><div class="bn"><span class="tile" style="width:34px;height:34px">'+I("layers")+'</span><div><small>Brand</small><b>'+esc(b.name)+'</b></div><span class="mono">'+b.hdr+'</span></div><ul class="leaves">'+ls.map(function(l){return '<li><span class="lob">'+esc(l)+'</span></li>'}).join("")+'</ul></li>'}).join("")+'</ul>'}
  if(st.k==="gtm"){h+='<div class="row" style="grid-template-columns:1.4fr repeat(3,100px) 110px;color:var(--muted);font-size:13px;font-weight:600;padding:8px 0"><span>Partner</span>'+PH.map(function(x){return '<span>'+x+'</span>'}).join("")+'<span></span></div>'+PARTNERS.map(function(x,k){var on=p>.12*(k+1);var rv=p>.35+k*.08;return '<div class="row" style="grid-template-columns:1.4fr repeat(3,100px) 110px;opacity:'+(on?1:.5)+'"><b>'+(on?esc(x.name):'')+'</b>'+x.r.map(function(r){return '<span>'+(rv?'₹'+r.toFixed(2):'')+'</span>'}).join("")+'<span>'+(p>.78&&x.pick?'<span class="pill gr">'+I("star")+'Best</span>':'')+'</span></div>'}).join("")+(p>.9?'<div style="margin-top:22px;font-size:14.5px;color:var(--muted)">Splitting volume between '+esc(PARTNERS[0].name)+' and '+esc(PARTNERS[1].name)+' across three phases.</div>':'')}
  if(st.k==="templates"){var sc=Math.round(100*Math.min(1,p*2)),mp=Math.round(98*Math.max(0,(p-.3)/.7));h+='<div class="stat"><div><b>'+sc+'</b><span>Templates scanned</span></div><div><b>'+mp+'</b><span>Lines of business suggested</span></div><div><b>'+(p>.9?2:0)+'</b><span>Unmapped</span></div></div><div style="margin-top:22px">'+TLOBS.map(function(l,k){var w=Math.round(l[1]*4.2*Math.max(0,Math.min(1,(p-.25-k*.05)*3)));return '<div class="row" style="grid-template-columns:170px 1fr 40px;padding:10px 0"><span>'+l[0]+'</span><div class="bar"><i style="width:'+Math.min(100,w/ (22*4.2)*100)+'%"></i></div><span style="text-align:right;color:var(--muted)">'+(w?Math.round(w/4.2):'')+'</span></div>'}).join("")+'</div>'}
  return h}
/* ---------- review views ---------- */
function footHTML(l,r){return '<div class="foot"><div>'+(l||'')+'</div><div>'+(r||'')+'</div></div>'}
function reviewHTML(i){var st=STEPS[i],h='',f='';
  if(S.status[i]==="verifying") return verifyHTML();
  if(st.k==="profile"){h='<div class="lslot"><div class="lbox"><b>HDFC</b></div><div><div class="lt">Enterprise logo</div><div class="ls">Found on your website</div></div></div><div class="form">'+PROFILE.map(function(x,k){return fd(x[0],x[1],x[2],true,k===2,false,k)}).join("")+'</div>';
    f=footHTML('<div class="auth" data-a="auth"><div class="cb'+(S.auth?' on':'')+'">'+(S.auth?I("check"):'')+'</div><div><b>I\'m authorised to submit this KYC, and it\'s accurate.</b><small>The company accepts responsibility for any false information.</small></div></div>','<button class="btn" data-a="submit"'+(S.auth?'':' disabled')+'>Submit for approval</button>')}
  if(st.k==="team"){var on=PEOPLE.filter(function(x){return x.on}).length;h='<div class="row" style="grid-template-columns:30px 1fr 190px 190px;color:var(--muted);font-size:13px;font-weight:600;padding:8px 0"><span></span><span>User</span><span>Department</span><span>Role</span></div>'+PEOPLE.map(function(x,k){return '<div class="row" style="grid-template-columns:30px 1fr 190px 190px;opacity:'+(x.on?1:.5)+'"><span class="chk'+(x.on?' on':'')+'" data-a="ptog" data-i="'+k+'">'+(x.on?I("check"):'')+'</span><div style="display:flex;gap:14px;align-items:center"><div class="av">'+x.i+'</div><div><div class="rn">'+esc(x.name)+'</div><div class="rm">'+esc(x.email)+'</div></div></div><span style="color:var(--muted)">'+esc(x.dept)+'</span><select class="inp" data-a="role" data-i="'+k+'">'+ROLES.map(function(r,q){return '<option value="'+q+'"'+(q===x.role?' selected':'')+'>'+r+'</option>'}).join("")+'</select></div>'}).join("");
    f=footHTML('<button class="btn ghost" data-a="later">Do it later</button>','<button class="btn" data-a="invites"'+(on?'':' disabled')+'>Send '+on+' invites</button>')}
  if(st.k==="brands"){var nl=BRANDS.reduce(function(a,b){return a+b.lobs.length},0);h='<div class="root"><div class="tile on">'+I("build")+'</div><div><b style="font-size:17px">HDFC Bank Limited</b><div class="ls">'+BRANDS.length+' brands · '+nl+' lines of business</div></div><span class="pill" style="margin-left:auto">Enterprise</span></div><ul class="tree">'+BRANDS.map(function(b,bi){return '<li><div class="bn"><span class="tile" style="width:34px;height:34px">'+I("layers")+'</span><div><small>Brand</small><b>'+esc(b.name)+'</b></div><span class="mono">'+b.hdr+'</span></div><ul class="leaves">'+b.lobs.map(function(l,li){return '<li><span class="lob">'+esc(l)+'<button data-a="rmlob" data-b="'+bi+'" data-l="'+li+'" aria-label="Remove">'+I("x")+'</button></span></li>'}).join("")+'</ul></li>'}).join("")+'</ul>';
    f=footHTML('<span class="ls">Confirm as drafted and it is set up straight away.</span>','<button class="btn" data-a="brands">Confirm brands</button>')}
  if(st.k==="gtm"){var n=PARTNERS.filter(function(x){return x.pick}).length,pk=PARTNERS.filter(function(x){return x.pick});h='<div class="row" style="grid-template-columns:30px 1.3fr repeat(3,90px) 1.6fr;color:var(--muted);font-size:13px;font-weight:600;padding:8px 0"><span></span><span>Partner</span>'+PH.map(function(x){return '<span>'+x+'</span>'}).join("")+'<span>Why</span></div>'+PARTNERS.map(function(x,k){return '<div class="row" style="grid-template-columns:30px 1.3fr repeat(3,90px) 1.6fr;opacity:'+(x.pick?1:.7)+'"><span class="chk'+(x.pick?' on':'')+'" data-a="ptn" data-i="'+k+'">'+(x.pick?I("check"):'')+'</span><b>'+esc(x.name)+'</b>'+x.r.map(function(r){return '<span>₹'+r.toFixed(2)+'</span>'}).join("")+'<span style="color:var(--muted);font-size:14px">'+esc(x.why)+'</span></div>'}).join("")+'<div style="margin-top:26px;font-weight:650;font-size:16px">Volume split by phase</div>'+(n===2?PH.map(function(x,k){return '<div class="row" style="grid-template-columns:130px 1fr 190px;padding:12px 0"><span>'+x+'</span><div class="spl"><i style="width:'+ALLOC[k]+'%;background:#2563eb"></i><i style="width:'+(100-ALLOC[k])+'%;background:#9bb8ff"></i></div><span style="color:var(--muted);font-size:14px">'+esc(pk[0].name)+' '+ALLOC[k]+'% · '+esc(pk[1].name)+' '+(100-ALLOC[k])+'%</span></div>'}).join(""):'<div class="note" style="margin-top:12px">'+I("info")+'Choose exactly two partners to see the split.</div>');
    f=footHTML('<span class="ls">'+n+' of 2 partners chosen</span>','<button class="btn" data-a="gtm"'+(n===2?'':' disabled')+'>Confirm partners</button>')}
  if(st.k==="templates"){var rows=TPLS.filter(function(t){return S.lobf==="all"||(S.lobf==="un"?!t[2]:t[2]===S.lobf)});h='<div class="note">'+I("info")+'2 templates have no line of business yet. They do not hold up migration.</div><div class="stat"><div><b>100</b><span>Scanned</span></div><div><b>98</b><span>Suggested</span></div><div><b style="color:#a55a05">2</b><span>Unmapped</span></div></div><div class="chips"><button class="fc'+(S.lobf==="all"?' on':'')+'" data-a="lobf" data-v="all">All</button>'+TLOBS.map(function(l){return '<button class="fc'+(S.lobf===l[0]?' on':'')+'" data-a="lobf" data-v="'+l[0]+'">'+l[0]+' · '+l[1]+'</button>'}).join("")+'<button class="fc'+(S.lobf==="un"?' on':'')+'" data-a="lobf" data-v="un">Unmapped · 2</button></div><div style="margin-top:8px">'+rows.map(function(t){return '<div class="row" style="grid-template-columns:190px 1fr 150px 90px"><b style="font:600 13px/1.3 ui-monospace,monospace">'+t[0]+'</b><span style="color:var(--ink2);font-size:14.5px">'+esc(t[1])+'</span><span style="color:'+(t[2]?'var(--ink2)':'#a55a05')+'">'+(t[2]||'No line of business')+'</span><span class="cf '+t[3]+'">'+({h:'High',m:'Check',u:'Unmapped'})[t[3]]+'</span></div>'}).join("")+'</div>';
    f=footHTML('<span class="ls">Showing '+rows.length+' of 9 sample templates</span>','<button class="btn" data-a="tpl">Confirm mapping</button>')}
  return {h:h,f:f}}
function verifyHTML(){var steps=["Sent to the 4 telecom operators","Waiting for their checks","Approved by 4 of 4 operators"];return {h:'<div class="hd"><div><h2>Checking your business details</h2><p>This takes a moment. You can read the other steps while you wait.</p></div></div><div style="max-width:520px">'+steps.map(function(t,k){var s=k<S.verify?'ok':k===S.verify?'act':'pen';return '<div style="display:flex;gap:14px;align-items:center;padding:14px 0;font-size:17px;border-bottom:1px solid var(--line);color:'+(s==='pen'?'#a3aec4':'var(--ink)')+';font-weight:'+(s==='act'?650:500)+'"><span style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:'+(s==='ok'?'var(--gsoft);color:var(--green)':s==='act'?'var(--soft)':'#f1f3f8')+'">'+(s==='ok'?I("check").replace('class="i "','class="i" style="width:14px;height:14px;stroke-width:3"'):'')+'</span>'+t+'</div>'}).join("")+'</div>',f:''}}
function doneHTML(i){var st=STEPS[i];return {h:'<div class="hd"><div><h2>'+esc(st.title)+'</h2><p>'+esc(st.mini)+'</p></div><span class="pill gr">'+I("check").replace('class="i "','class="i" style="width:13px;height:13px;stroke-width:3"')+'Done</span></div><div class="srcl" style="margin-bottom:10px">'+st.src.map(function(s){return '<span><i class="ck">'+I("check")+'</i>'+esc(s[1])+'</span>'}).join("")+'</div><div class="hr"></div><div class="tl" style="color:var(--ink);margin:0">'+st.done.map(function(t){return '<div class="r ok" style="padding:8px 0"><span class="d" style="background:var(--gsoft);color:var(--green)">'+I("check")+'</span>'+esc(t)+'</div>'}).join("")+'</div>',f:''}}
/* ---------- console ---------- */
function tlHTML(i){var st=STEPS[i],n=st.checks.length,p=S.p[i],a=Math.min(n-1,Math.floor(p*n));return st.checks.map(function(t,k){var c=S.status[i]==="ready"||k<a?'ok':k===a?'act':'pen';return '<div class="r '+c+'"><span class="d">'+(c==='ok'?I("check"):'')+'</span>'+esc(t)+'</div>'}).join("")}
function readyCount(){return S.status.filter(function(s){return s==="ready"||s==="done"||s==="review"||s==="verifying"}).length}
function cprog(){var cur=0,tot=0;if(S.phase==="proc"){tot=S.p.reduce(function(a,b){return a+b},0)/5;}return Math.round(tot*100)}
function accHTML(st){var a=S.open;return '<div class="acc"><div class="'+(a.did?'open':'')+'"><button data-a="acc" data-k="did">What I did'+I("chev")+'</button><div class="bd"><ul>'+st.done.map(function(t){return '<li>'+I("check")+esc(t)+'</li>'}).join("")+'</ul></div></div><div class="'+(a.nxt?'open':'')+'"><button data-a="acc" data-k="nxt">What happens next'+I("chev")+'</button><div class="bd">'+esc(st.next)+'</div></div></div>'}
function conHTML(){var chip='<span class="chip"><img class="lg" src="'+LOGO+'" alt="">Agent summary</span>',ph=S.phase,i=S.active;
  if(ph==="start") return chip+'<h1>I\'ll prepare your five setup steps</h1><div class="sub">I\'ll read your DLT registration, GSTIN, MCA and website, then you check each step.</div><button class="cbtn" data-a="start">Start AI analysis'+I("arrow")+'</button>';
  if(ph==="proc"){var w=S.status.indexOf("working");w=w<0?4:w;return chip+'<h1>Preparing your five steps</h1><div class="sub">Each step opens for your review as soon as it is ready.</div><div class="tl" id="tl">'+tlHTML(w)+'</div><div class="cfoot"><div class="t"><span id="cn">'+readyCount()+' of 5 steps ready</span><span>about 40 s left</span></div><div class="bar"><i id="cb" style="width:'+Math.max(4,cprog())+'%"></i></div></div>'}
  if(ph==="ready") return chip+'<h1>Your five steps are ready</h1><div class="sub">I\'ve done the groundwork. Open each step, check it and approve.</div><button class="cbtn" data-a="review">Review them'+I("arrow")+'</button>';
  if(ph==="final") return chip+'<h1>You\'re set to start migration</h1><div class="sub">Every step is done and your migration window is open.</div>';
  var st=STEPS[viewIdx()],done=S.status[viewIdx()]==="done";
  if(S.status[viewIdx()]==="verifying") return chip+'<h1>Checking your business details</h1><div class="sub">Telecom operators are checking the profile. Your Team step opens as soon as it is approved.</div>';
  if(done) return chip+'<h1>'+esc(st.title)+' is done</h1><div class="sub">Nothing more to do here.</div>'+accHTML(st);
  return chip+'<h1>'+esc(st.rh)+'</h1><div class="sub">'+esc(st.rs)+'</div><div class="need"><b>Needs you</b>'+esc(st.need)+'</div>'+accHTML(st)}
/* ---------- surface ---------- */
function surfHTML(){var ph=S.phase,m='',f='';
  if(ph==="start"){m='<div class="hd"><div><h2>What I\'ll prepare</h2><p>One pass over your records. Nothing is submitted without your approval.</p></div></div>'+STEPS.map(function(st){return '<div class="row" style="grid-template-columns:44px 1fr auto"><div class="tile">'+I(st.ic)+'</div><div><div class="rn" style="font-size:16.5px">'+esc(st.title)+'</div><div class="ls">From '+st.src.map(function(s){return s[1]}).join(", ")+'</div></div><span class="pill gy">Queued</span></div>'}).join("")}
  else if(ph==="proc"){var w=S.status.indexOf("working");w=w<0?4:w;m=liveHTML(w)}
  else if(ph==="ready"){m='<div class="hd"><div><h2>All five steps are ready</h2><p>You review them one at a time. The next step opens after you finish the one before.</p></div></div>'+STEPS.map(function(st){return '<div class="row" style="grid-template-columns:44px 1fr auto"><div class="tile" style="background:var(--gsoft);color:var(--green)">'+I("check")+'</div><div><div class="rn" style="font-size:16.5px">'+esc(st.title)+'</div><div class="ls" style="'+(st.attn?'color:#a55a05;font-weight:600':'')+'">'+esc(st.mini)+'</div></div><span class="pill '+(st.attn?'am':'gr')+'">'+(st.attn?'Needs a look':'Ready')+'</span></div>'}).join("")}
  else if(ph==="final"){m='<div style="display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:6px"><div class="big">'+I("check")+'</div><div class="hd" style="margin:6px 0 0"><div><h2 style="font-size:32px">Setup complete</h2><p>Your migration window is open until <b id="cdate"></b>.</p></div></div><div class="clock" id="clock"></div></div><div class="hr"></div>'+STEPS.map(function(st){return '<div class="row" style="grid-template-columns:44px 1fr auto"><div class="tile" style="background:var(--gsoft);color:var(--green)">'+I("check")+'</div><div><div class="rn" style="font-size:16.5px">'+esc(st.title)+'</div><div class="ls">'+esc(st.mini)+'</div></div><span class="pill gr">Done</span></div>'}).join("");f=footHTML('','<button class="btn" data-a="mig">Go to migration'+I("arrow")+'</button>')}
  else{var i=viewIdx(),st=STEPS[i],r=S.status[i]==="done"?doneHTML(i):S.status[i]==="verifying"?verifyHTML():reviewHTML(i);var head=(S.status[i]==="done"||S.status[i]==="verifying")?'':'<div class="hd"><div><h2>'+esc(st.title)+'</h2></div>'+(S.status[i]==="review"?'<span class="pill am">Needs you</span>':'')+'</div>';m=head+r.h;f=r.f||''}
  return tabsHTML()+'<div class="main" id="main">'+m+'</div>'+f}
function draw(){$("#con").innerHTML=conHTML();$("#surf").innerHTML=surfHTML();}
function tick(){ // processing: update only the live parts
  var w=S.status.indexOf("working");w=w<0?4:w;var t=$("#tabs");if(!t) return draw();
  t.outerHTML=tabsHTML();var mn=$("#main");if(mn) mn.innerHTML=liveHTML(w);var tl=$("#tl");if(tl) tl.innerHTML=tlHTML(w);var b=$("#cb");if(b) b.style.width=Math.max(4,cprog())+"%";var c=$("#cn");if(c) c.textContent=readyCount()+" of 5 steps ready";}
/* ---------- flow ---------- */
function startProc(from){clearT();S.phase="proc";S.view=null;S.auth=false;S.verify=-1;for(var k=0;k<5;k++){S.status[k]=k<from?"ready":"queued";S.p[k]=k<from?1:0}draw();var run=S.run;
  (function step(i){if(run!==S.run) return; if(i>4){T(function(){S.phase="ready";S.status=["ready","ready","ready","ready","ready"];draw()},700);return}
    S.status[i]="working";S.p[i]=0;tick();var iv=setInterval(function(){if(run!==S.run){clearInterval(iv);return}S.p[i]=Math.min(1,S.p[i]+.022);tick();if(S.p[i]>=1){clearInterval(iv);S.status[i]="ready";tick();T(function(){step(i+1)},350)}},110);timers.push(iv)})(from)}
function startReview(at){clearT();S.phase="review";S.active=at||0;S.view=null;S.status=STEPS.map(function(_,k){return k<S.active?"done":k===S.active?"review":"locked"});S.auth=false;S.verify=-1;S.lobf="all";draw()}
function advance(msg){var i=S.active;S.status[i]="done";if(i>=4){S.phase="final";draw();finalClock();return}S.active=i+1;S.status[i+1]="review";S.view=null;draw();toast(msg||STEPS[i].title+" done. "+STEPS[i+1].title+" is open.")}
function finalClock(){var end=Date.now()+30*864e5;$("#cdate").textContent=new Date(end).toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"});function t(){var s=Math.max(0,Math.floor((end-Date.now())/1000));var c=$("#clock");if(!c) return;c.innerHTML=[[Math.floor(s/86400),"days"],[Math.floor(s/3600)%24,"hrs"],[Math.floor(s/60)%60,"mins"],[s%60,"secs"]].map(function(x){return '<div><b>'+String(x[0]).padStart(2,"0")+'</b><span>'+x[1]+'</span></div>'}).join("");T(t,1000)}t()}
function jump(w){clearT();S.view=null;S.auth=false;S.verify=-1;
  if(w==="start"){S.phase="start";S.status=["queued","queued","queued","queued","queued"];S.p=[0,0,0,0,0];S.active=0;draw()}
  else if(w==="proc") startProc(0);
  else if(w==="ready"){S.phase="ready";S.status=["ready","ready","ready","ready","ready"];draw()}
  else if(w==="final"){S.phase="final";S.status=["done","done","done","done","done"];draw();finalClock()}
  else startReview(+w.replace("r",""))}
/* ---------- events ---------- */
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el){if(!e.target.closest(".proto"))$("#pm").classList.remove("on");return}var a=el.dataset.a,i=+el.dataset.i;
  if(a==="start") startProc(0);
  else if(a==="review") startReview(0);
  else if(a==="tab"){S.view=(i===S.active)?null:i;draw()}
  else if(a==="auth"){S.auth=!S.auth;draw()}
  else if(a==="submit"){if(!S.auth)return;S.status[0]="verifying";S.verify=0;draw();var run=S.run;(function nx(){T(function(){if(run!==S.run)return;S.verify++;if(S.verify>=3){advance("Business profile approved. Team is open.")}else{draw();nx()}},1000)})();draw()}
  else if(a==="ptog"){PEOPLE[i].on=!PEOPLE[i].on;draw()}
  else if(a==="later"){advance("Team invites saved for later. Brands and LOBs is open.")}
  else if(a==="invites"){advance("Invites sent. Brands and LOBs is open.")}
  else if(a==="rmlob"){BRANDS[+el.dataset.b].lobs.splice(+el.dataset.l,1);draw()}
  else if(a==="brands"){advance("Brands and LOBs set up. GTM partners is open.")}
  else if(a==="ptn"){var n=PARTNERS.filter(function(x){return x.pick}).length;if(PARTNERS[i].pick||n<2){PARTNERS[i].pick=!PARTNERS[i].pick}else{toast("Untick one partner first")}draw()}
  else if(a==="gtm"){advance("Partners confirmed. Templates is open.")}
  else if(a==="lobf"){S.lobf=el.dataset.v;draw()}
  else if(a==="tpl"){advance()}
  else if(a==="acc"){S.open[el.dataset.k]=!S.open[el.dataset.k];draw()}
  else if(a==="mig"){toast("Opening Consent Migration…")}
});
document.addEventListener("change",function(e){var el=e.target;if(el.dataset&&el.dataset.a==="role"){PEOPLE[+el.dataset.i].role=+el.value}});
(function(){var pm=$("#pm");pm.innerHTML=[["start","Start"],["proc","AI processing"],["ready","Ready for review"],["r0","Review: Business profile"],["r1","Review: Team"],["r2","Review: Brands and LOBs"],["r3","Review: GTM partners"],["r4","Review: Templates"],["final","Finished"]].map(function(x){return '<button data-j="'+x[0]+'">'+x[1]+'</button>'}).join("");
 $("#pmb").onclick=function(e){e.stopPropagation();pm.classList.toggle("on")};pm.onclick=function(e){var b=e.target.closest("[data-j]");if(b){pm.classList.remove("on");jump(b.dataset.j)}}})();
var h=(location.hash||"").replace("#","");if(h) jump(h);else draw();
</script>
