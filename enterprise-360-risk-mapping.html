<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enterprise 360 — WiselyConsent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&family=Geist+Mono:wght@400..800&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#0b1a33; --mute:#5c6781; --faint:#8590a8;
  --line:#e4e8f0; --line2:#eef1f6; --page:#eef1f6;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-t:#eef4ff; --blue-b:#bfdbfe;
  --red:#dc2626; --red-t:#fee2e2;
  --shadow:0 4px 8px rgba(11,26,51,.06),0 1px 2px rgba(11,26,51,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{font-family:'Geist',system-ui,sans-serif;color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;min-width:1280px}
button{font-family:inherit;cursor:pointer;color:inherit}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
svg{flex-shrink:0}

/* ── Shell ─────────────────────────────── */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.sb-logo{height:60px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;padding:0 20px}
.sb-logo b{font-size:19px;font-weight:700;letter-spacing:-.4px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 0 14px}
.sb-sec{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:9px;letter-spacing:1.44px;text-transform:uppercase;color:var(--mute);padding:16px 20px 0;line-height:13.5px}
.sb-sec:first-child{padding-top:8px}
.sb-item{display:flex;align-items:center;gap:11px;height:37.5px;padding:0 20px 0 23px;border-left:3px solid transparent;font-weight:500;font-size:13px;color:var(--ink);cursor:pointer}
.sb-item:hover{background:#f7f9fd}
.sb-item.mt{margin-top:6px}
.sb-item .ic{color:#5c6781}
.sb-item.active{background:var(--blue-t);border-left-color:var(--blue);color:var(--blue-d);font-weight:600}
.sb-item.active .ic{color:var(--blue-d)}
.sb-item.dim{color:var(--faint);opacity:.78}
.sb-item .r{margin-left:auto;display:flex}
.sb-sub{padding:4px 10px 4px 36px;display:flex;flex-direction:column;gap:4px}
.sb-subi{height:34px;border:1px solid transparent;border-radius:10px;display:flex;align-items:center;gap:9px;padding:0 9px;font-weight:700;font-size:12.5px;cursor:pointer}
.sb-subi:hover{background:#f7f9fd}
.sb-subi.active{background:#fff;border-color:var(--blue-b);box-shadow:0 6px 8px rgba(37,99,235,.08);color:var(--blue-d);font-weight:850}
.sb-subi .ic{color:#5c6781}.sb-subi.active .ic{color:var(--blue-d)}
.sb-user{border-top:1px solid var(--line2);display:flex;align-items:center;gap:10px;padding:15px 20px 14px}
.av-rm{width:34px;height:34px;border-radius:17px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.role{display:inline-block;margin-top:4px;background:#fff4da;color:#8a6d2a;font-weight:700;font-size:10px;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:999px;line-height:15px}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:61px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:30}
.crumbs{display:flex;align-items:center;gap:4px;font-size:13px;line-height:20px;color:var(--mute)}
.crumbs a{color:var(--mute);text-decoration:none;cursor:pointer}
.crumbs a:hover{color:var(--blue)}
.crumbs .cur{color:var(--ink);font-weight:600}
.crumbs .sep{font-size:11px;color:var(--faint)}
.tb-sp{flex:1}
.bell{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#f8fafd;display:grid;place-items:center;position:relative;color:var(--ink)}
.bell::after{content:"";position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#ef4444;border:1.5px solid #fff}
.reg{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#f8fafd}
.reg b{display:block;font-size:11.5px;font-weight:700;line-height:15px}
.reg small{display:block;font-family:'Geist Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);line-height:13px}
main{padding:32px 40px 40px;max-width:1260px;width:100%}
h1{font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:38px}

/* ── Cards ─────────────────────────────── */
.card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:12px;box-shadow:var(--shadow)}
.card-h{padding:14px 18px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card-t{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px;line-height:22.5px}
.icb{width:20px;height:20px;border-radius:6px;background:var(--blue-t);display:grid;place-items:center;color:var(--blue)}
.card-s{font-size:11.5px;color:var(--mute);padding-top:3px;line-height:17.25px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.kpi{position:relative;padding:17px 53px 17px 18px;min-height:128px;overflow:hidden}
.kpi.g-blue{background:linear-gradient(180deg,#eef4ff,#fff 62%)}
.kpi.g-red{background:linear-gradient(180deg,#fee2e2,#fff 62%)}
.kpi-l{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;line-height:12.8px;color:var(--mute);max-width:178px;min-height:26px}
.kpi-v{display:flex;align-items:baseline;gap:4px;margin-top:11px}
.kpi-v b{font-size:32px;font-weight:600;letter-spacing:-.8px;line-height:32px}
.kpi-v span{font-weight:500;font-size:12px;color:var(--mute)}
.kpi-f{font-size:11px;color:var(--mute);padding-top:8px;line-height:15.4px}
.kpi-i{position:absolute;right:16px;top:15px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}

/* ── Directory table ───────────────────── */
.filters{display:flex;gap:6px;align-items:center;flex:1;flex-wrap:wrap}
.pill-btn{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:11.5px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.pill-btn:hover{border-color:#c9d3e6}
.pill-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill-btn.low{border-color:#f5c2c2;color:#b91c1c;background:#fff7f7}
.pill-btn.low.on{background:var(--red);border-color:var(--red);color:#fff}
.pill-btn .cnt{font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;opacity:.85}
.search{height:38px;width:340px;border:1px solid #dce6f8;border-radius:10px;display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--faint)}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:13px;color:var(--ink);background:transparent}
.search input::placeholder{color:var(--faint)}
.btn-o{height:38px;border:1px solid #dce6f8;border-radius:10px;background:#fff;display:inline-flex;align-items:center;gap:7px;padding:0 13px;font-weight:600;font-size:12.5px}
.btn-p{height:36px;border:1px solid var(--blue);border-radius:10px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;gap:7px;padding:0 14px;font-weight:600;font-size:12.5px}
.alert{margin:0 18px;margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,#fff1f1,#fff 80%);border:1px solid #f9d4d4;font-size:12.5px;color:#7f1d1d}
.alert .a-ic{width:26px;height:26px;border-radius:8px;background:var(--red-t);display:grid;place-items:center;color:var(--red)}
.alert b{font-weight:700}
.alert button{margin-left:auto;border:0;background:none;color:var(--red);font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:4px}
table.dir{width:100%;border-collapse:collapse;table-layout:fixed}
.dir th{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);text-align:left;padding:9px 12px;background:#f7f9fc;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.dir th.sortable{cursor:pointer}
.dir th.sorted{color:var(--blue)}
.dir th .ar{display:inline-block;margin-left:4px;opacity:.6}
.dir th.r,.dir td.r{text-align:right}
.dir td{padding:11.5px 12px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:18.75px;vertical-align:middle}
.dir tbody tr{cursor:pointer;transition:background .12s}
.dir tbody tr:hover{background:#f7f9fd}
.dir tbody tr.row-low{background:#fffafa}
.dir tbody tr.row-low:hover{background:#fff3f3}
.dir tbody tr.row-low td:first-child{box-shadow:inset 3px 0 0 #ef4444}
.ent{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.ent span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:9.5px;flex-shrink:0;letter-spacing:.2px}
.muted{color:var(--mute)}
.status{display:inline-flex;align-items:center;gap:5px;height:20.5px;padding:2px 9px;border-radius:3px;font-weight:600;font-size:11px;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:3px;background:currentColor}
.st-approved{background:#e0f1e7;color:#15814c}
.st-partial{background:var(--blue-t);color:var(--blue-d)}
.st-review{background:#fff4da;color:#8a6d2a}
.st-rejected{background:var(--red-t);color:#b91c1c}
.st-blacklisted{background:#7f1d1d;color:#fff}
.tcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.tnum{font-weight:700;font-size:13px;min-width:18px;text-align:right}
.band{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:999px;font-weight:700;font-size:10px;letter-spacing:.2px;white-space:nowrap}
.b-healthy{background:#e0f1e7;color:#15814c}
.b-watch{background:#fff4da;color:#8a6d2a}
.b-risk{background:#ffedd5;color:#c2410c}
.b-low{background:var(--red-t);color:#b91c1c}
.links-chip{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px;border-radius:999px;border:1px solid #f5c2c2;background:#fff;color:#b91c1c;font-weight:700;font-size:10px;white-space:nowrap}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 16px}
.tfoot .mono{font-size:10px;font-weight:700;color:var(--mute)}
.pager{display:flex;gap:6px}
.pager button{width:26px;height:24px;border-radius:999px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.pager button:disabled{opacity:.4;cursor:default}
.empty-row td{text-align:center;color:var(--mute);padding:28px}

/* charts */
.chart-wrap{padding:18px}
.legend-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12px;font-weight:500}
.legend-row:last-child{border-bottom:0}
.legend-row b{color:var(--blue-d);font-weight:700}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:-1px}
.bar-low{cursor:pointer}
.bar-low:hover rect{opacity:.85}

/* ── Detail page ───────────────────────── */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--mute);background:none;border:0;margin-bottom:14px}
.back:hover{color:var(--blue)}
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;padding:22px 24px;overflow:hidden}
.hero.lowh{background:linear-gradient(180deg,#fee2e2,#fff 70%)}
.hero-top{display:flex;align-items:center;gap:14px}
.hero .av{width:48px;height:48px;border-radius:12px;font-size:14px}
.hero h1{font-size:26px;line-height:32px}
.meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.meta .dot{width:3px;height:3px;border-radius:50%;background:#b6bfd1}
.summary{margin-top:16px;font-size:13.5px;line-height:21px;color:#26344d;max-width:720px}
.summary b{font-weight:700;color:var(--ink)}
.summary .red{color:#b91c1c;font-weight:700}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:170px}
.gauge .lbl{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.stat{padding:15px 18px}
.stat .kpi-l{min-height:0}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.6px;line-height:30px;margin-top:8px}
.stat .f{font-size:11px;color:var(--mute);margin-top:4px;line-height:15px}

.seg{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;background:#f7f9fc}
.seg button{height:28px;border:0;background:transparent;border-radius:999px;padding:0 12px;font-weight:700;font-size:11.5px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.seg button .k{font-family:'Geist Mono',ui-monospace,monospace;font-size:9.5px;opacity:.7}
.seg button.on{background:#fff;color:var(--blue-d);box-shadow:0 1px 2px rgba(11,26,51,.08),0 0 0 1px var(--blue-b)}
.legend{display:flex;gap:16px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line2);font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .tip{margin-left:auto;font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;font-weight:700;color:var(--blue)}
.tchip{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.map-body{padding:22px 24px 26px;position:relative}

/* variation A — lanes */
.lanes{position:relative;display:grid;grid-template-columns:240px 1fr 280px;column-gap:96px;align-items:center;min-height:300px}
.lanes-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lane{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.lane-h{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.lanes-heads{display:grid;grid-template-columns:240px 1fr 280px;column-gap:96px;margin-bottom:12px}
.focal{border:1px solid #f5c2c2;border-radius:12px;padding:16px;background:linear-gradient(180deg,#fff1f1,#fff);box-shadow:var(--shadow)}
.focal.ok{border-color:var(--line);background:#fff}
.focal .row{display:flex;align-items:center;gap:10px}
.focal .nm{font-weight:700;font-size:13.5px;line-height:18px}
.focal .sc{display:flex;align-items:baseline;gap:6px;margin-top:14px}
.focal .sc b{font-size:34px;font-weight:600;letter-spacing:-1px;line-height:34px}
.focal .sc span{color:var(--mute);font-size:12px}
.focal .net{margin-top:10px;font-size:11.5px;color:var(--mute);line-height:16px}
.focal .net b{color:#b91c1c}
.idc{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;transition:opacity .15s,border-color .15s,box-shadow .15s;cursor:default}
.idc .t1{font-weight:700;font-size:12.5px;line-height:17px}
.idc .t1 small{font-weight:500;color:var(--mute);font-size:11px;margin-left:4px}
.idc .t2{grid-column:2/4;font-size:11.5px;color:var(--mute);line-height:16px}
.idc .tag{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:8.5px;letter-spacing:1px;text-transform:uppercase}
.idc .tchip{grid-row:1/3;align-self:start;width:28px;height:28px;border-radius:8px}
.pts{font-family:'Geist Mono',ui-monospace,monospace;font-weight:700;font-size:11px;color:#b91c1c;white-space:nowrap}
.entc{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;cursor:pointer;transition:opacity .15s,border-color .15s,box-shadow .15s}
.entc:hover{border-color:var(--blue-b)}
.entc.bl{border-color:#f5a3a3;background:linear-gradient(180deg,#fff5f5,#fff)}
.entc .row{display:flex;align-items:center;gap:9px}
.entc .nm{font-weight:700;font-size:12.5px;line-height:17px;flex:1;min-width:0}
.entc .row2{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.entc .row3{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--mute)}
.entc .row3 a{color:var(--blue);font-weight:600;text-decoration:none}
.bl-badge{font-family:'Geist Mono',ui-monospace,monospace;font-weight:700;font-size:8.5px;letter-spacing:1px;color:#fff;background:#b91c1c;padding:2px 6px;border-radius:4px}
.edge{fill:none;stroke-width:1.6;opacity:.55;transition:opacity .15s,stroke-width .15s}
.hl .edge{opacity:.08}
.hl .edge.on{opacity:1;stroke-width:2.6}
.hl [data-node]{opacity:.28}
.hl [data-node].on{opacity:1}
.hl .idc.on,.hl .entc.on{box-shadow:0 0 0 2px var(--blue-b),var(--shadow)}

/* variation B — hub */
.hub svg{width:100%;height:auto;display:block}
.hub text{font-family:'Geist',sans-serif}
.hub .halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.hub [data-node]{cursor:pointer;transition:opacity .15s}
.hub g[data-node^="id:"]{cursor:default}
.hub svg{border:1px solid var(--line);border-radius:14px;background:radial-gradient(#dde3ee 1px,transparent 1.2px) 0 0/22px 22px,#fafbfd}
.hub .nd{stroke:#fff;stroke-width:3;filter:drop-shadow(0 3px 6px rgba(11,26,51,.18))}
.hub .plate{filter:drop-shadow(0 2px 5px rgba(11,26,51,.1))}
.hub .chip{filter:drop-shadow(0 1px 3px rgba(11,26,51,.08));transition:stroke-width .15s}
.hub.hl g.on .chip{stroke-width:2}
.hub .edge{stroke:var(--c);stroke-width:1.8;opacity:.42;stroke-linecap:round;transition:opacity .15s,stroke-width .15s}
.hub.hl .edge{opacity:.1}
.hub.hl .edge.on{opacity:1;stroke-width:2.8}
.hub-key{display:flex;gap:22px;font-size:11.5px;color:var(--mute);margin-bottom:12px}
.hub-key span{display:inline-flex;align-items:center;gap:7px}
.hub-key i{display:block;border-radius:50%}
.hub-key .k-ent{width:16px;height:16px;background:#5c6781}
.hub-key .k-id{width:18px;height:10px;border-radius:5px;background:#fff;border:1.5px solid #8590a8}
.hub-key .k-ln{width:18px;height:2px;border-radius:1px;background:#8590a8}

/* variation C — matrix */
table.mx{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.mx th{font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);text-align:left;padding:10px 12px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.mx th .hh{display:flex;align-items:center;gap:7px}
.mx th .imp{display:block;margin-top:3px;color:#b91c1c;letter-spacing:.4px}
.mx td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12.5px}
.mx tr.mrow{transition:opacity .15s}
.mx tr.mrow td:first-child{cursor:pointer}
.mx .cellchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;border:1px solid;font-weight:600;font-size:11.5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s,box-shadow .15s}
.mx .none{color:#c3cad8;font-size:14px}
.ovl{display:flex;align-items:center;gap:8px}
.ovl .segs{display:flex;gap:3px}
.ovl .segs i{width:14px;height:6px;border-radius:2px;background:#e8ecf3}
.ovl .segs i.f{background:#ef4444}
.mx-note{font-size:11.5px;color:var(--mute);margin-top:12px}
.hl .mx [data-node]{opacity:.3}
.hl .mx [data-node].on{opacity:1}
.hl .mx .cellchip.on{box-shadow:0 0 0 2px var(--blue-b)}

/* breakdown + actions */
.split{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-top:14px}
.bd-body{padding:18px}
.bd-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#f1f4f9}
.bd-bar i{display:block;height:100%}
.bd-scale{display:flex;justify-content:space-between;font-family:'Geist Mono',ui-monospace,monospace;font-size:9.5px;color:var(--faint);margin-top:5px}
.bd-g{margin-top:16px}
.bd-gh{display:flex;justify-content:space-between;font-family:'Geist Mono',ui-monospace,monospace;font-weight:600;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);padding-bottom:6px;border-bottom:1px solid var(--line)}
.bd-gh b{color:#b91c1c}
.bd-r{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px;line-height:17px}
.bd-r:last-child{border-bottom:0}
.bd-r .tx{flex:1}
.bd-r .tx small{display:block;color:var(--mute);font-size:11px}
.bd-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 12px;border-radius:10px;background:#f7f9fc;font-weight:600}
.act{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:12.5px;line-height:18px}
.act:last-child{border-bottom:0}
.act .num{width:22px;height:22px;border-radius:7px;background:var(--blue-t);color:var(--blue-d);font-family:'Geist Mono',ui-monospace,monospace;font-weight:700;font-size:10.5px;display:grid;place-items:center;flex-shrink:0}
.act-btns{display:flex;gap:8px;margin-top:14px}
.empty{text-align:center;padding:44px 20px;color:var(--mute)}
.empty .e-ic{width:44px;height:44px;border-radius:12px;background:#e0f1e7;color:#15814c;display:grid;place-items:center;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}
.mt14{margin-top:14px}.mt18{margin-top:18px}
</style>

/* ── Scoring helpers ─────────────────────────────────────────── */
function band(s){
  if(s>=85) return {k:'healthy', l:'Healthy',   num:'#22c58b', c:'#15814c'};
  if(s>=70) return {k:'watch',   l:'Watch',     num:'#f5a524', c:'#b7791f'};
  if(s>=50) return {k:'risk',    l:'At risk',   num:'#ef4444', c:'#c2410c'};
  return            {k:'low',    l:'Low trust', num:'#dc2626', c:'#b91c1c'};
}
const shared = eid => IDS.filter(i=>i.ents.includes(eid) && i.ents.length>1)
  .map(i=>({...i, others:i.ents.filter(x=>x!==eid), pts:impact(i,eid)}))
  .sort((a,b)=>TYPES[a.type].order-TYPES[b.type].order || b.pts-a.pts);
const linked = eid => [...new Set(shared(eid).flatMap(i=>i.others))];
function impact(idf, eid){
  const others = idf.ents.filter(x=>x!==eid).map(x=>E[x]);
  const hasBL = others.some(o=>o.blacklisted);
  if(idf.type==='pan') return 12 + (hasBL?12:0);
  const per = {director:6,address:4,template:3}[idf.type];
  let v = others.reduce((s,o)=>s+(o.trust<50?per:2),0);
  if(idf.type==='director' && hasBL) v += 10;
  return v;
}
function ownSignals(e){
  const net = shared(e.id).reduce((s,i)=>s+i.pts,0);
  if(OWN[e.id]) return OWN[e.id];
  const rest = 100-e.trust-net;
  return rest>0 ? [{t:'Operational signals', s:'Complaints, header health and KYC', v:rest}] : [];
}
const names = arr => { const n=arr.map(x=>E[x].name); return n.length<=1?n.join(''):n.slice(0,-1).join(', ')+' and '+n[n.length-1]; };
function describe(i){
  const n = names(i.others);
  return {pan:`Same PAN as ${n}`, director:`Also a director of ${n}`, address:`Same registered address as ${n}`, template:`Near-identical templates to ${n}`}[i.type];
}
function secondDegree(xid, focal){
  const first = new Set([focal, ...linked(focal)]);
  const out = new Set();
  IDS.filter(i=>i.ents.includes(xid)).forEach(i=>i.ents.forEach(o=>{ if(!first.has(o)) out.add(o); }));
  return [...out];
}

const cr = v => v===0 ? '0' : (Number.isInteger(v) ? v+' Cr' : v.toFixed(2)+' Cr');
const avatar = (e, s=28) => `<span class="av" style="background:${e.col};width:${s}px;height:${s}px">${e.ini}</span>`;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

function setStatus(s){ DS.status=s; DS.low=false; DS.page=0; renderTable(); }
function setLow(on){ DS.low=on; DS.status='all'; DS.page=0; DS.sort={k:'trust',dir:1}; renderTable(); document.getElementById('dir').scrollIntoView({behavior:'smooth',block:'start'}); }
function setSort(k){ DS.sort = DS.sort.k===k ? {k, dir:-DS.sort.dir} : {k, dir: k==='trust'?1:-1}; renderTable(); }

function renderTable(){
  const F = [['all','All'],['approved','Approved'],['partial','Partially Approved'],['review','Under Review'],['rejected','Rejected']];
  document.getElementById('filters').innerHTML =
    F.map(([k,l])=>`<button class="pill-btn ${!DS.low&&DS.status===k?'on':''}" onclick="setStatus('${k}')">${l}</button>`).join('') +
    `<button class="pill-btn low ${DS.low?'on':''}" onclick="setLow(${!DS.low})">${icon('link',12)}Low trust <span class="cnt">${lowCount()}</span></button>`;
  document.getElementById('lowAlert').style.display = DS.low ? 'none' : 'flex';

  const cols = [['name','Enterprise'],['industry','Industry'],['status','Status'],['consents','Active consents','r'],['subs','Active subscribers','r'],['trust','Trust score','r']];
  document.getElementById('thead').innerHTML = cols.map(([k,l,a])=>{
    const on = DS.sort.k===k; const ar = on ? (DS.sort.dir>0?'↑':'↓') : '↕';
    return `<th class="sortable ${a||''} ${on?'sorted':''}" onclick="setSort('${k}')">${l}<span class="ar">${ar}</span></th>`;
  }).join('');

  let rows = ENT.filter(e=>{
    if(DS.low && e.trust>=50) return false;
    if(!DS.low && DS.status!=='all'){
      if(DS.status==='rejected' && !['rejected','blacklisted'].includes(e.status)) return false;
      if(DS.status!=='rejected' && e.status!==DS.status) return false;
    }
    const q = DS.q.trim().toLowerCase();
    return !q || e.name.toLowerCase().includes(q) || e.pe.toLowerCase().includes(q);
  });
  const {k,dir} = DS.sort;
  rows.sort((a,b)=> typeof a[k]==='string' ? a[k].localeCompare(b[k])*dir : (a[k]-b[k])*dir);
  const total = rows.length, pages = Math.max(1, Math.ceil(total/PAGE));
  DS.page = Math.min(Math.max(DS.page,0), pages-1);
  const slice = rows.slice(DS.page*PAGE, DS.page*PAGE+PAGE);

  document.getElementById('tbody').innerHTML = slice.length ? slice.map(e=>{
    const b = band(e.trust); const s = shared(e.id); const L = linked(e.id);
    const chip = e.trust<50 && s.length ? `<span class="links-chip" title="Shares ${s.length} identifiers with ${L.length} enterprises">${icon('link',10)}${s.length} links</span>` : '';
    return `<tr class="${e.trust<50?'row-low':''}" onclick="go('#/e/${e.id}/${VIEW}')">

      <td class="r">${cr(e.consents)}</td>
      <td class="r">${cr(e.subs)}</td>
      <td class="r"><div class="tcell">${chip}${bandPill(e.trust)}<span class="tnum" style="color:${b.num}">${e.trust}</span></div></td>
    </tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="6">No enterprises match these filters.</td></tr>`;
  document.getElementById('pinfo').textContent = total ? `${DS.page*PAGE+1}–${DS.page*PAGE+slice.length} of ${total} enterprises` : '0 enterprises';
  document.getElementById('prev').disabled = DS.page===0;
  document.getElementById('next').disabled = DS.page>=pages-1;
}

      s.map(i=>`<i style="width:${i.pts}%;background:${TYPES[i.type].c};opacity:.85;border-left:1px solid #fff" title="${TYPES[i.type].label} −${i.pts}"></i>`).join('')}${
      own.map(o=>`<i style="width:${o.v}%;background:repeating-linear-gradient(45deg,#cbd3e1 0 3px,#e3e8f0 3px 6px);border-left:1px solid #fff" title="${o.t} −${o.v}"></i>`).join('')}</div>
    <div class="bd-scale"><span>0</span><span>Score ${e.trust}</span><span>100</span></div>`;
  const g1 = s.length ? `<div class="bd-g"><div class="bd-gh"><span>From shared identifiers</span><b>−${net}</b></div>${
    s.map(i=>{ const t=TYPES[i.type]; return `<div class="bd-r"><span class="tchip" style="background:${t.bg};color:${t.c}">${icon(t.icon,12)}</span><span class="tx">${describe(i)}<small>${t.label} · ${i.label}</small></span><span class="pts">−${i.pts}</span></div>`; }).join('')}</div>` : '';
  const g2 = own.length ? `<div class="bd-g"><div class="bd-gh"><span>Own signals</span><b>−${ownSum}</b></div>${
    own.map(o=>`<div class="bd-r"><span class="tchip" style="background:#f1f4f9;color:#5c6781">${icon('activity',12)}</span><span class="tx">${o.t}<small>${o.s}</small></span><span class="pts">−${o.v}</span></div>`).join('')}</div>` : '';
  return bar + g1 + g2 + `<div class="bd-total"><span>Trust score</span><span style="color:${b.num};font-size:16px">${e.trust} <span style="color:#8590a8;font-size:11px;font-weight:500">/ 100</span></span></div>`;
}

function setView(v){ VIEW=v; history.replaceState(null,'',`#/e/${CUR.id}/${v}`); document.querySelectorAll('.seg button').forEach((b,i)=>b.classList.toggle('on', Object.keys(VIEWS)[i]===v)); renderMap(); }
function renderMap(){
  const body = document.getElementById('mapBody');
  const s = shared(CUR.id);
  if(!s.length){
    body.innerHTML = `<div class="empty"><div class="e-ic">${icon('shieldCheck',22)}</div><b>No shared entities found</b>This enterprise doesn't share a PAN, director, registered address or template with any other enterprise on the platform.</div>`;
    return;
  }
  ({lanes:renderLanes, hub:renderHub, matrix:renderMatrix})[VIEW](body, CUR, s);
}

/* ── Highlighting (shared by all three variations) ───────────── */
function wireHL(root, s){
  const nodes = root.querySelectorAll('[data-node]');
  const edges = root.querySelectorAll('[data-eid]');
  const set = (ids, ents) => {
    root.classList.add('hl');
    nodes.forEach(n=>{ const [k,v]=n.dataset.node.split(':'); n.classList.toggle('on', k==='focal' || (k==='id'?ids.has(v):ents.has(v))); });
    edges.forEach(ed=>{ const ent=ed.dataset.eent; ed.classList.toggle('on', ids.has(ed.dataset.eid) && (!ent || ents.has(ent))); });
  };
  const clear = () => { root.classList.remove('hl'); nodes.forEach(n=>n.classList.remove('on')); edges.forEach(e=>e.classList.remove('on')); };
  nodes.forEach(n=>{
    const [k,v] = n.dataset.node.split(':');
    if(k==='focal') return;
    n.addEventListener('mouseenter', ()=>{
      if(k==='id'){ const i=s.find(x=>x.id===v); set(new Set([v]), new Set(i.others)); }
      else { set(new Set(s.filter(i=>i.others.includes(v)).map(i=>i.id)), new Set([v])); }
    });
    n.addEventListener('mouseleave', clear);
    if(k==='ent') n.addEventListener('click', ()=>go(`#/e/${v}/${VIEW}`));
  });
}

/* ── Variation A: Linked lanes ───────────────────────────────── */
function entCard(x, focal, s){
  const e=E[x], b=band(e.trust), cnt=s.filter(i=>i.others.includes(x)).length, sd=secondDegree(x, focal.id);
  return `<div class="entc ${e.blacklisted?'bl':''}" data-node="ent:${x}">
    <div class="row">${avatar(e,26)}<span class="nm">${e.name}</span></div>
    <div class="row2"><span class="tnum" style="color:${b.num};min-width:0">${e.trust}</span>${bandPill(e.trust)}${statusPill(e.status)}</div>
    <div class="row3"><span>Shares ${cnt} identifier${cnt>1?'s':''}</span>${sd.length?`<span title="${names(sd)}">+${sd.length} more link${sd.length>1?'s':''}</span>`:''}</div>
  </div>`;
}
function renderLanes(body, f, s){
  const L = linked(f.id);
  // order enterprises by the average position of the identifiers they share (fewer crossings)
  const pos = Object.fromEntries(s.map((i,k)=>[i.id,k]));
  L.sort((a,b)=>{ const m=x=>{const r=s.filter(i=>i.others.includes(x));return r.reduce((t,i)=>t+pos[i.id],0)/r.length}; return m(a)-m(b); });
  const net = s.reduce((a,i)=>a+i.pts,0), b=band(f.trust);
  body.innerHTML = `
    <div class="lanes-heads"><div class="lane-h">This enterprise</div><div class="lane-h">What it shares · ${s.length}</div><div class="lane-h">With these enterprises · ${L.length}</div></div>
    <div class="lanes" id="lanes">
      <svg class="lanes-svg" id="lanesSvg"></svg>
      <div class="lane"><div class="focal ${f.trust<50?'':'ok'}" data-node="focal:${f.id}" id="focalCard">
        <div class="row">${avatar(f,32)}<div class="nm">${f.name}</div></div>
        <div class="sc"><b style="color:${b.num}">${f.trust}</b><span>/ 100</span>${bandPill(f.trust)}</div>
        <div class="net">Shared identifiers cost <b>−${net} points</b></div>
      </div></div>
      <div class="lane">${s.map(i=>{ const t=TYPES[i.type]; return `
        <div class="idc" data-node="id:${i.id}" style="border-left:3px solid ${t.c}">
          <span class="tchip" style="background:${t.bg};color:${t.c}">${icon(t.icon,15)}</span>
          <div class="t1"><span class="tag" style="color:${t.c}">${t.label}</span><br>${i.label}<small>${i.type==='pan'?'':i.sub}</small></div>
          <span class="pts">−${i.pts}</span>
          <div class="t2">${describe(i)}</div>
        </div>`; }).join('')}</div>
      <div class="lane">${L.map(x=>entCard(x,f,s)).join('')}</div>
    </div>`;
  const draw = () => {
    const wrap = document.getElementById('lanes'); if(!wrap) return;
    const W = wrap.getBoundingClientRect();
    const rel = el => { const r=el.getBoundingClientRect(); return {l:r.left-W.left, r:r.right-W.left, y:r.top-W.top+r.height/2}; };
    const fc = rel(document.getElementById('focalCard'));
    const curve = (x1,y1,x2,y2) => { const dx=(x2-x1)*.5; return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`; };
    let out = '';
    s.forEach(i=>{
      const c = TYPES[i.type].c, ic = rel(wrap.querySelector(`[data-node="id:${i.id}"]`));
      out += `<path class="edge" data-eid="${i.id}" data-eent="" stroke="${c}" d="${curve(fc.r,fc.y,ic.l,ic.y)}"/>`;
      i.others.forEach(x=>{
        const ec = rel(wrap.querySelector(`[data-node="ent:${x}"]`));
        out += `<path class="edge" data-eid="${i.id}" data-eent="${x}" stroke="${c}" d="${curve(ic.r,ic.y,ec.l,ec.y)}"/>`;
      });
      out += `<circle cx="${ic.l}" cy="${ic.y}" r="3" fill="${c}"/><circle cx="${ic.r}" cy="${ic.y}" r="3" fill="${c}"/>`;
    });
    out += `<circle cx="${fc.r}" cy="${fc.y}" r="3.5" fill="#0b1a33"/>`;
    document.getElementById('lanesSvg').innerHTML = out;
    wireHL(wrap, s);
  };
  requestAnimationFrame(draw);
  window._redraw = draw;
}

/* ── Variation B: Network graph ──────────────────────────────── */
function renderHub(body, f, s){
  const W=1144, R=400, L=linked(f.id);
  const rad = a => a*Math.PI/180;
  // 1) enterprises that share an identifier with each other (not only with the focal one) form a cluster
  const par = Object.fromEntries(L.map(x=>[x,x]));
  const find = x => par[x]===x ? x : (par[x]=find(par[x]));
  const multi = s.filter(i=>i.others.length>1);
  multi.forEach(i=>i.others.slice(1).forEach(x=>{ par[find(x)] = find(i.others[0]); }));
  const comps = Object.values(L.reduce((m,x)=>((m[find(x)]=m[find(x)]||[]).push(x),m),{})).sort((a,b)=>b.length-a.length);
  // 2) each cluster gets its own side of the focal enterprise
  const ep = {};
  comps.forEach((c,k)=>{
    const base = comps.length<=2 ? k*180 : k*360/comps.length;
    const step = c.length>1 ? Math.min(60, 150/(c.length-1)) : 0;
    c.forEach((x,j)=>{ const a=rad(base+(j-(c.length-1)/2)*step); ep[x]={x:Math.cos(a)*R, y:Math.sin(a)*R}; });
  });
  // 3) each identifier sits in the middle of the enterprises that share it
  const cen = o => { const p=[{x:0,y:0},...o.map(x=>ep[x])]; return {x:p.reduce((a,q)=>a+q.x,0)/p.length, y:p.reduce((a,q)=>a+q.y,0)/p.length}; };
  const groups = {};
  s.forEach(i=>{ const k=[...i.others].sort().join('|'); (groups[k]=groups[k]||[]).push(i); });
  const ip = {};
  Object.values(groups).forEach(g=>{
    const o=g[0].others, c=cen(o), m=g.length;
    if(o.length===1){
      const q=ep[o[0]], d=Math.hypot(q.x,q.y), px=-q.y/d, py=q.x/d;
      let ox=0, oy=0;
      const cl = multi.find(i=>i.others.includes(o[0]));   // keep clear of a pool shared by the same pair
      if(cl){ const cc=cen(cl.others), vx=c.x-cc.x, vy=c.y-cc.y, vl=Math.hypot(vx,vy)||1; ox=vx/vl*72; oy=vy/vl*72; }
      g.forEach((i,j)=>{ const t=(j-(m-1)/2)*116; ip[i.id]={x:c.x+px*t+ox, y:c.y+py*t+oy}; });
    } else {
      const a0=Math.atan2(c.y,c.x)+(m===2?Math.PI/2:0), rho = m===1 ? 0 : m===2 ? 64 : 88;
      g.forEach((i,j)=>{ const a=a0+j*2*Math.PI/m; ip[i.id]={x:c.x+Math.cos(a)*rho, y:c.y+Math.sin(a)*rho}; });
    }
  });
  // 4) fit the canvas to the graph
  const pts = [{x:0,y:0}, ...Object.values(ep), ...Object.values(ip)];
  const minX=Math.min(...pts.map(p=>p.x)), maxX=Math.max(...pts.map(p=>p.x)), minY=Math.min(...pts.map(p=>p.y)), maxY=Math.max(...pts.map(p=>p.y));
  const padT=112, padB=118, H=Math.round(maxY-minY+padT+padB);
  const tx=W/2-(minX+maxX)/2, ty=padT-minY;
  const mv = p => { p.x=Math.round(p.x+tx); p.y=Math.round(p.y+ty); };
  Object.values(ep).forEach(mv); Object.values(ip).forEach(mv);
  const cx=Math.round(tx), cy=Math.round(ty), b=band(f.trust);

  let g = '';
  // edges — neutral until hovered, then tinted by identifier type
  s.forEach(i=>{
    const c=TYPES[i.type].c, p=ip[i.id];
    g += `<line class="edge" data-eid="${i.id}" data-eent="" style="--c:${c}" x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}"/>`;
    i.others.forEach(x=>{ const q=ep[x];
      g += `<line class="edge" data-eid="${i.id}" data-eent="${x}" style="--c:${c}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`; });
  });
  // identifiers — compact chips tinted by type, so no link runs through a label
  s.forEach(i=>{
    const t=TYPES[i.type], p=ip[i.id], tag=`${t.label.toUpperCase()} · −${i.pts}`;
    const w=Math.round(Math.max(i.short.length*7.3, tag.length*5.6)+52), h=38, x0=p.x-w/2;
    g += `<g data-node="id:${i.id}">
      <rect class="chip" x="${x0}" y="${p.y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="#fff" stroke="${t.bd}" stroke-width="1.25"/>
      <circle cx="${x0+19}" cy="${p.y}" r="13" fill="${t.bg}"/>
      ${svgIcon(t.icon, x0+12, p.y-7, 14, t.c)}
      <text x="${x0+38}" y="${p.y-1.5}" font-size="11.5" font-weight="600" fill="#0b1a33">${i.short}</text>
      <text x="${x0+38}" y="${p.y+10.5}" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="600" letter-spacing=".8" fill="${t.c}">${t.label.toUpperCase()} · <tspan fill="#b91c1c">−${i.pts}</tspan></text></g>`;
  });
  // enterprises — brand-coloured nodes with a name plate and a trust badge
  const entNode = (e, p, focal) => {
    const eb=band(e.trust), r=focal?44:32, up=!focal && p.y<cy-40;
    const sub = focal ? `−${s.reduce((a,i)=>a+i.pts,0)} from shared identifiers` : e.blacklisted ? 'Blacklisted' : eb.l+' · '+STATUS[e.status];
    const fs=focal?14.5:13, w=Math.round(Math.max(e.name.length*fs*.6, sub.length*5.7)+28), h=42;
    const ly = up ? p.y-r-(e.blacklisted?18:12)-h : p.y+r+(e.blacklisted?18:12);
    const bw=focal?44:36, bh=focal?24:20, bx=p.x+r*.72, by=p.y-r*.72;
    return `<g data-node="${focal?'focal':'ent'}:${e.id}">
      <circle cx="${p.x}" cy="${p.y}" r="${r+11}" fill="${eb.num}" fill-opacity="${focal?.2:.13}"/>
      ${e.blacklisted?`<circle cx="${p.x}" cy="${p.y}" r="${r+8}" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>`:''}
      <circle class="nd" cx="${p.x}" cy="${p.y}" r="${r}" fill="${e.col}"/>
      <text x="${p.x}" y="${p.y+(focal?8:6)}" text-anchor="middle" font-size="${focal?23:17}" font-weight="700" fill="#fff">${e.ini}</text>
      <rect x="${bx-bw/2}" y="${by-bh/2}" width="${bw}" height="${bh}" rx="${bh/2}" fill="${eb.c}" stroke="#fff" stroke-width="2"/>
      <text x="${bx}" y="${by+(focal?4.5:4)}" text-anchor="middle" font-size="${focal?13:11.5}" font-weight="700" fill="#fff">${e.trust}</text>
      <rect class="plate" x="${p.x-w/2}" y="${ly}" width="${w}" height="${h}" rx="10" fill="#fff" stroke="${focal?eb.c:'#d9dfea'}" stroke-width="${focal?1.5:1}"/>
      <text x="${p.x}" y="${ly+18}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#0b1a33">${e.name}</text>
      <text x="${p.x}" y="${ly+33}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${focal||e.blacklisted?'#b91c1c':eb.c}">${sub}</text></g>`;
  };
  L.forEach(x=>{ g += entNode(E[x], ep[x], false); });
  g += entNode(f, {x:cx,y:cy}, true);
  body.innerHTML = `<div class="hub" id="hub">
    <div class="hub-key"><span><i class="k-ent"></i>Enterprise · trust score on the badge</span><span><i class="k-id"></i>Shared identifier · sits between the enterprises that share it</span><span><i class="k-ln"></i>Link colour = identifier type</span></div>
    <svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
  wireHL(document.getElementById('hub'), s);
  window._redraw = null;
}

/* ── Variation C: Matrix ─────────────────────────────────────── */
function renderMatrix(body, f, s){
  const L = linked(f.id);
  const types = Object.keys(TYPES);
  const rows = L.map(x=>({x, ids:s.filter(i=>i.others.includes(x))}))
    .sort((a,b)=>b.ids.length-a.ids.length || E[a.x].trust-E[b.x].trust);
  const typeImp = t => s.filter(i=>i.type===t).reduce((a,i)=>a+i.pts,0);
  body.innerHTML = `<div id="mx"><table class="mx">
    <colgroup><col style="width:24%"><col style="width:11%">${types.map(()=>'<col style="width:14%">').join('')}<col style="width:9%"></colgroup>
    <thead><tr><th>Linked enterprise</th><th>Trust</th>${types.map(t=>{ const T=TYPES[t], imp=typeImp(t); return `<th><span class="hh"><span class="tchip" style="background:${T.bg};color:${T.c};width:18px;height:18px">${icon(T.icon,11)}</span>Same ${T.label}</span><span class="imp">${imp?'−'+imp+' pts':'<span style="color:#c3cad8">—</span>'}</span></th>`; }).join('')}<th>Overlap</th></tr></thead>
    <tbody>${rows.map(({x,ids})=>{
      const e=E[x], b=band(e.trust);
      return `<tr class="mrow" data-node="ent:${x}">
        <td><div class="ent">${avatar(e)}<span class="n">${e.name}</span></div>${e.blacklisted?'<div style="margin:6px 0 0 38px"><span class="bl-badge">BLACKLISTED</span></div>':''}</td>
        <td><span class="tnum" style="color:${b.num}">${e.trust}</span> ${bandPill(e.trust)}</td>
        ${types.map(t=>{ const hit=ids.filter(i=>i.type===t); const T=TYPES[t];
          return `<td>${hit.length? hit.map(i=>`<span class="cellchip" data-node="id:${i.id}" style="background:${T.bg};border-color:${T.bd};color:${T.c}" title="${i.label} · ${i.sub}">${icon(T.icon,12)}${i.short}</span>`).join(' ') : '<span class="none">—</span>'}</td>`; }).join('')}
        <td><div class="ovl"><span class="segs">${types.map((t,k)=>`<i class="${k<ids.length?'f':''}"></i>`).join('')}</span><b style="font-size:12px">${ids.length}/4</b></div></td>
      </tr>`; }).join('')}</tbody></table>
    <p class="mx-note">Each row is an enterprise that shares at least one identifier with ${f.name}. A filled cell names the exact PAN, director, address or template they have in common.</p></div>`;
  // In the matrix, hovering a chip highlights that identifier across every row
  const root = document.getElementById('mx');
  root.querySelectorAll('.cellchip').forEach(ch=>{
    ch.addEventListener('mouseenter', ev=>{
      ev.stopPropagation();
      const id = ch.dataset.node.split(':')[1], i = s.find(z=>z.id===id);
      root.classList.add('hl');
      root.querySelectorAll('[data-node]').forEach(n=>{ const [k,v]=n.dataset.node.split(':'); n.classList.toggle('on', k==='id'? v===id : i.others.includes(v)); });
    });
    ch.addEventListener('mouseleave', ()=>{ root.classList.remove('hl'); root.querySelectorAll('.on').forEach(n=>n.classList.remove('on')); });
  });
  root.querySelectorAll('tr.mrow td:first-child').forEach(td=>td.addEventListener('click', ()=>go(`#/e/${td.parentElement.dataset.node.split(':')[1]}/${VIEW}`)));
  window._redraw = null;
}

/* ════════════════════════════════════════════════════════════════
   ROUTER
   ════════════════════════════════════════════════════════════════ */
function route(){
  const p = (location.hash.slice(1)||'/').split('/').filter(Boolean);
  if(p[0]==='e' && E[p[1]]){ if(VIEWS[p[2]]) VIEW=p[2]; renderDetail(p[1]); }
  else renderDash();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', ()=>window._redraw && window._redraw());
renderSidebar();
route();
document.fonts && document.fonts.ready.then(()=>window._redraw && window._redraw());
</script>
</body>
