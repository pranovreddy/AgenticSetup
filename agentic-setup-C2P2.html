<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiConsent Setup C2P2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{--blue:#2563eb;--blue2:#1d4ed8;--soft:#eef3ff;--ink:#0b1220;--ink2:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e3e9f6;--green:#16a34a;--gsoft:#e8f7ee;--amber:#d97706;--asoft:#fff4de;--bg:#f4f7fd}
html,body{height:100%}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:radial-gradient(60% 50% at 70% 0%,#e6edff,transparent 70%),linear-gradient(180deg,#f8faff,#eef2fb);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:clamp(340px,29vw,440px) 1fr;height:100vh}
/* ---- console ---- */
.con{position:relative;color:#fff;padding:40px 38px 60px;display:flex;flex-direction:column;overflow:auto;background:radial-gradient(80% 50% at 0% 0%,rgba(150,120,255,.45),transparent 70%),linear-gradient(170deg,#2563eb,#1d4ed8 55%,#1a3aa8)}
.chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px 0 5px;border-radius:99px;background:rgba(255,255,255,.14);box-shadow:0 0 0 1px rgba(255,255,255,.28);font:650 11.5px/1 Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#fff;align-self:flex-start}
.chip .lg{width:22px;height:22px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}
.con h1{font-size:clamp(26px,2.2vw,32px);line-height:1.12;letter-spacing:-.03em;font-weight:680;margin-top:30px}
.con .sub{margin-top:12px;color:rgba(255,255,255,.84);font-size:16px}
.tl{margin-top:30px}.tl .r{display:flex;gap:14px;align-items:center;padding:10px 0;font-size:16px;transition:opacity .3s}
.tl .r .d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.2)}
.tl .r.ok .d{background:#34d399;color:#06351f}.tl .r.act{font-weight:650}.tl .r.act .d{background:#fff}.tl .r.act .d:after{content:"";width:12px;height:12px;border-radius:50%;border:2.5px solid var(--blue);border-right-color:transparent;animation:sp .8s linear infinite}
.tl .r.pen{opacity:.55}.tl .d .i{width:14px;height:14px;stroke-width:3}
@keyframes sp{to{transform:rotate(360deg)}}
.need{margin-top:28px;border-left:3px solid #ffd37a;padding:4px 0 4px 16px;font-size:15.5px}.need b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ffd37a;margin-bottom:4px}
.acc{margin-top:26px;font-size:15.5px;font-weight:600;border-top:1px solid rgba(255,255,255,.22)}.acc>div{border-bottom:1px solid rgba(255,255,255,.22)}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600;text-align:left}
.acc .bd{padding:0 0 14px;font-weight:450;font-size:14.5px;color:rgba(255,255,255,.86);display:none}.acc .open .bd{display:block}.acc .open .i{transform:rotate(180deg)}
.acc li{list-style:none;display:flex;gap:9px;padding:3px 0}.acc li .i{width:15px;height:15px;color:#34d399;stroke-width:3;margin-top:3px}
.cfoot{margin-top:auto;padding-top:26px;font-size:13.5px;color:rgba(255,255,255,.8)}
.cfoot .t{display:flex;justify-content:space-between;margin-bottom:8px}.bar{height:6px;border-radius:6px;background:#e7ecf8;overflow:hidden}.cfoot .bar{background:rgba(255,255,255,.22)}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#6f98ff,#2563eb);transition:width .3s}.cfoot .bar i{background:#fff}
.cbtn{margin-top:30px;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 24px;border-radius:14px;background:#fff;color:var(--blue2);font-weight:650;font-size:16px;box-shadow:0 14px 28px -14px rgba(0,20,90,.7)}
/* ---- surface ---- */
.surf{position:relative;overflow:auto;padding:34px clamp(28px,4.4vw,64px) 0;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(14px,1.8vw,26px);border-bottom:1px solid var(--line);flex:none}
.tab{padding:12px 0;text-align:left;position:relative;min-width:0}
.tab .t{font-size:15.5px;font-weight:600;color:#8a96ad;display:flex;align-items:center;gap:8px;white-space:nowrap}.tab .t .i{width:17px;height:17px}
.tab .s{font-size:13px;color:var(--faint);margin:2px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .b{height:3px;border-radius:3px;background:#e6ebf7;overflow:hidden}.tab .b i{display:block;height:100%;background:var(--blue);transition:width .3s}
.tab.on .t{color:var(--ink);font-weight:680}.tab.on .s{color:var(--blue)}
.tab.done .s{color:var(--green)}.tab.done .b i{background:var(--green)}.tab.rdy .s{color:var(--green)}.tab.rdy .b i{background:var(--green)}
.tab.amb .s{color:#a55a05}.tab.amb .b i{background:var(--amber)}
.tab.lock .t{color:#a3aec4}.tab.click{cursor:pointer}.tab.click:hover .t{color:var(--ink)}
.main{flex:1;padding:32px 0 28px;min-height:0}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.hd h2{font-size:26px;letter-spacing:-.025em;font-weight:680;line-height:1.2}.hd p{color:var(--muted);font-size:15.5px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:99px;font:600 12.5px/1 Inter;background:var(--soft);color:#2c47b2;white-space:nowrap}
.pill.am{background:var(--asoft);color:#a55a05}.pill.gr{background:var(--gsoft);color:#157a3c}.pill.gy{background:#eff1f6;color:#7a869c}
.srcl{display:flex;gap:24px;align-items:center;font-size:14.5px;color:var(--ink2);flex-wrap:wrap}
.srcl span{display:inline-flex;align-items:center;gap:7px}.srcl .i{width:18px;height:18px;color:#6b86e8}
.srcl .ck{width:18px;height:18px;border-radius:50%;background:var(--gsoft);display:grid;place-items:center}.srcl .ck .i{width:11px;height:11px;stroke-width:3;color:var(--green)}
.srcl .q{color:#a3aec4}.srcl .q .i{color:#b5bfd3}.hr{height:1px;background:var(--line);margin:24px 0 28px}
/* flat form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:20px 26px}.fd.w2{grid-column:1/-1}
.fd label{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:4px}.fd label b{color:#e0364f}
.fd label em{margin-left:auto;font:600 11px/1 Inter;font-style:normal;color:#2c47b2;background:var(--soft);padding:4px 7px;border-radius:6px;}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.inp,input.inp,select.inp{width:100%;height:46px;border:0;border-bottom:1.5px solid #d6dff2;background:transparent;padding:0 2px;font:500 16px/1 Inter;color:var(--ink);outline:0;border-radius:0;display:flex;align-items:center}
input.inp:focus,select.inp:focus{border-bottom-color:var(--blue)}.inp .sk{height:9px;width:55%;border-radius:6px;background:linear-gradient(90deg,#e8edf9,#dbe4f8,#e8edf9);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.lslot{display:flex;align-items:center;gap:16px;margin-bottom:24px}.lbox{width:76px;height:76px;border-radius:16px;box-shadow:0 0 0 1px var(--line) inset;display:grid;place-items:center;background:#fff}.lbox b{font:800 15px/1 Inter;color:#d1242f;letter-spacing:-.02em}
.lt{font-weight:600;font-size:14.5px}.ls{font-size:13px;color:var(--muted)}
/* footer */
.foot{position:sticky;bottom:0;margin:0 calc(-1 * clamp(28px,4.4vw,64px));padding:18px clamp(28px,4.4vw,64px);display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(180deg,rgba(244,247,253,0),#f4f7fd 28%);border-top:0;flex:none}
.foot:before{content:"";position:absolute;left:clamp(28px,4.4vw,64px);right:clamp(28px,4.4vw,64px);top:0;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:12px;background:var(--blue);color:#fff;font:600 15px/1 Inter;box-shadow:0 12px 24px -12px rgba(37,99,235,.7);white-space:nowrap}
.btn[disabled]{background:#c3d3fb;box-shadow:none;cursor:not-allowed}.btn.ghost{background:transparent;color:var(--ink2);box-shadow:none;padding:0 6px}
.auth{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid #b6c3df;flex:none;margin-top:2px;display:grid;place-items:center;background:#fff}.cb.on{background:var(--blue);border-color:var(--blue);color:#fff}.cb .i{width:13px;height:13px;stroke-width:3.2}
.auth b{font-size:14.5px;display:block}.auth small{font-size:13px;color:var(--muted)}
/* rows */
.row{display:grid;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:#2c47b2;font:650 13px/1 Inter;flex:none}
.rn{font-weight:600;font-size:15.5px}.rm{font:500 12.5px/1 ui-monospace,monospace;color:var(--muted);margin-top:3px}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid #b6c3df;display:grid;place-items:center;background:#fff;cursor:pointer;flex:none}.chk.on{background:var(--blue);border-color:var(--blue);color:#fff}.chk .i{width:14px;height:14px;stroke-width:3.2}
select.inp{height:40px;font-size:14.5px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;width:auto}
.note{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--asoft);color:#8a4b04;font-size:14.5px;font-weight:550;margin-bottom:18px}
.note .i{width:18px;height:18px}
/* tree */
.root{display:flex;align-items:center;gap:14px;padding:6px 0 4px}.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--blue);flex:none}.tile.on{background:linear-gradient(145deg,#6f98ff,#2f55e3);color:#fff}
.tree,.leaves{list-style:none;padding:0}.tree{margin:6px 0 0 20px}.leaves{margin:6px 0 0 24px}
.tree>li,.leaves>li{position:relative;padding-left:26px}.tree>li{padding-bottom:12px}.leaves>li{padding-bottom:6px}
.tree>li:before,.leaves>li:before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid #c9d8f5}.tree>li:last-child:before{bottom:auto;height:24px}.leaves>li:last-child:before{bottom:auto;height:16px}
.tree>li:after,.leaves>li:after{content:"";position:absolute;left:0;top:24px;width:22px;border-top:2px solid #c9d8f5}.leaves>li:after{top:16px;width:20px}
.bn{display:flex;align-items:center;gap:12px;padding:4px 0}.bn b{font-size:16.5px}.bn small{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}.bn .mono{margin-left:auto;font:500 12px/1 ui-monospace,monospace;color:var(--faint)}
.lob{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;padding:3px 4px 3px 0}.lob:before{content:"";width:7px;height:7px;border-radius:50%;background:#8fb0ff}.lob button{color:#a3aec4;display:grid;place-items:center}.lob button .i{width:14px;height:14px}
/* table-ish */
.stat{display:flex;gap:44px;margin-bottom:6px}.stat div b{display:block;font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.stat div span{font-size:13.5px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}.fc{height:32px;padding:0 14px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--ink2);box-shadow:0 0 0 1px var(--line) inset;background:#fff}.fc.on{background:#1d2b64;color:#fff;box-shadow:none}
.cf{font:600 11px/1 Inter;padding:4px 8px;border-radius:6px;background:var(--gsoft);color:#157a3c}.cf.m{background:var(--asoft);color:#a55a05}.cf.u{background:#fde8e8;color:#b42318}
.spl{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:#e7ecf8}.spl i{display:block;height:100%}
/* final */
.big{width:84px;height:84px;border-radius:50%;background:linear-gradient(145deg,#34d399,#0E9F6E);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 7px rgba(22,163,74,.14),0 20px 36px -14px rgba(14,159,110,.6);animation:popb .7s cubic-bezier(.2,1.4,.4,1)}.big .i{width:42px;height:42px;stroke-width:3}
@keyframes popb{from{transform:scale(.3);opacity:0}}
.clock{display:flex;gap:10px;margin:8px 0 6px}.clock div{min-width:78px;padding:12px 8px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);text-align:center}.clock b{display:block;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.clock span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:calc(50% + 200px);bottom:96px;transform:translate(-50%,20px);padding:12px 20px;border-radius:99px;background:#1d2b64;color:#fff;font-weight:600;font-size:14.5px;opacity:0;transition:.35s;z-index:60;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.proto{position:fixed;left:14px;bottom:14px;z-index:70}.proto>button{height:30px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(255,255,255,.4);font-size:12.5px;font-weight:600;color:var(--blue2)}
.pm{position:absolute;left:0;bottom:38px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px #d6def0,0 20px 40px -16px rgba(30,60,160,.4);padding:6px;min-width:190px;display:none}.pm.on{display:block}.pm button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:9px;font-size:14px;font-weight:500}.pm button:hover{background:var(--soft)}
@media (max-width:980px),(max-height:700px){.toast{left:50%;bottom:90px}.proto{left:auto;right:14px;bottom:auto;top:10px}.pm{left:auto;right:0;bottom:auto;top:38px}
  body{overflow:auto}.app{display:block;height:auto;min-height:100vh}
  .con{padding:18px 22px 16px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 16px;overflow:visible}
  .con h1{font-size:19px;margin:0;flex:1;min-width:200px}.con .sub,.con .tl,.con .acc,.con .cfoot{display:none}.con .need{margin:0;flex-basis:100%;font-size:14px;padding:2px 0 2px 12px}.cbtn{margin:0 0 0 auto;height:42px}
  .surf{overflow:visible;padding-top:20px;min-height:calc(100vh - 80px)}.main{padding:22px 0 24px}.foot{position:sticky;bottom:0;background:#f4f7fd}
  .tab .s{display:none}.tab .t{font-size:14px}.hd h2{font-size:22px}
}
@media (max-width:760px){.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}.tab .t span{display:none}.form{grid-template-columns:1fr}.stat{gap:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-id" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h3M6.5 16c.6-1.4 1.6-2 2.5-2s1.9.6 2.5 2"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4" opacity=".7"/><path d="M17 14c2.4 0 4 1.6 4 4.5" opacity=".7"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 17 9 5 9-5" opacity=".6"/></symbol>
<symbol id="i-bars" viewBox="0 0 24 24"><rect x="4" y="13" width="4" height="7" rx="1.5"/><rect x="10" y="8" width="4" height="12" rx="1.5"/><rect x="16" y="4" width="4" height="16" rx="1.5"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/></symbol>
<symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
<symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="i-build" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
</defs></svg>
<div class="app" id="app"><aside class="con" id="con"></aside><main class="surf" id="surf"></main></div>
<div class="toast" id="toast"></div>

  if(a==="start") startProc(0);
  else if(a==="review") startReview(0);
  else if(a==="tab"){S.view=(i===S.active)?null:i;draw()}
  else if(a==="auth"){S.auth=!S.auth;draw()}
  else if(a==="submit"){if(!S.auth)return;S.status[0]="verifying";S.verify=0;draw();var run=S.run;(function nx(){T(function(){if(run!==S.run)return;S.verify++;if(S.verify>=3){advance("Business profile approved. Team is open.")}else{draw();nx()}},1000)})();draw()}
  else if(a==="ptog"){PEOPLE[i].on=!PEOPLE[i].on;draw()}
  else if(a==="later"){advance("Team invites saved for later. Brands and LOBs is open.")}
  else if(a==="invites"){advance("Invites sent. Brands and LOBs is open.")}
  else if(a==="rmlob"){BRANDS[+el.dataset.b].lobs.splice(+el.dataset.l,1);draw()}
  else if(a==="brands"){advance("Brands and LOBs set up. GTM partners is open.")}
  else if(a==="ptn"){var n=PARTNERS.filter(function(x){return x.pick}).length;if(PARTNERS[i].pick||n<2){PARTNERS[i].pick=!PARTNERS[i].pick}else{toast("Untick one partner first")}draw()}
  else if(a==="gtm"){advance("Partners confirmed. Templates is open.")}
  else if(a==="lobf"){S.lobf=el.dataset.v;draw()}
  else if(a==="tpl"){advance()}
  else if(a==="acc"){S.open[el.dataset.k]=!S.open[el.dataset.k];draw()}
  else if(a==="mig"){toast("Opening Consent Migration…")}
});
document.addEventListener("change",function(e){var el=e.target;if(el.dataset&&el.dataset.a==="role"){PEOPLE[+el.dataset.i].role=+el.value}});
(function(){var pm=$("#pm");pm.innerHTML=[["start","Start"],["proc","AI processing"],["ready","Ready for review"],["r0","Review: Business profile"],["r1","Review: Team"],["r2","Review: Brands and LOBs"],["r3","Review: GTM partners"],["r4","Review: Templates"],["final","Finished"]].map(function(x){return '<button data-j="'+x[0]+'">'+x[1]+'</button>'}).join("");
 $("#pmb").onclick=function(e){e.stopPropagation();pm.classList.toggle("on")};pm.onclick=function(e){var b=e.target.closest("[data-j]");if(b){pm.classList.remove("on");jump(b.dataset.j)}}})();
var h=(location.hash||"").replace("#","");if(h) jump(h);else draw();
</script>
</body></html>
